<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EACO 地球村 · 分布式算电协同市场</title>
<style>
/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --r:18px;
  --font-sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-serif:Georgia,"Songti SC","Noto Serif SC","Times New Roman",serif;
}
body{
  margin:0;
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  transition:background .45s ease,color .45s ease;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% -12%, var(--halo1), transparent 62%),
    radial-gradient(820px 620px at 92% -4%, var(--halo2), transparent 58%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  transition:background .45s ease;
}
h1,h2,h3,h4{font-family:var(--heading-font);line-height:1.28;margin:0}
p{margin:0}
a{color:inherit}
.container{width:min(1180px,92vw);margin-inline:auto}

/* ============ 三套主题 ============ */
body[data-theme="cosmic-blue"]{
  --bg:#050b1a; --bg2:#071227;
  --card:rgba(17,30,58,.82); --card-solid:#0e1b35;
  --text:#e9f3ff; --muted:#8ea6cb;
  --accent:#38bdf8; --accent2:#22d3ee; --accent3:#8b5cf6;
  --border:rgba(56,189,248,.22);
  --chip:rgba(56,189,248,.12);
  --nav-bg:rgba(5,11,26,.72);
  --halo1:rgba(56,189,248,.20); --halo2:rgba(139,92,246,.18);
  --heading-font:var(--font-sans);
  --shadow:0 18px 46px rgba(0,0,0,.45);
}
body[data-theme="apple-green"]{
  --bg:#f2fbf4; --bg2:#e6f6ea;
  --card:rgba(255,255,255,.86); --card-solid:#ffffff;
  --text:#0d2b1a; --muted:#5d7d6a;
  --accent:#22a14a; --accent2:#34c759; --accent3:#0ea5e9;
  --border:rgba(34,161,74,.20);
  --chip:rgba(34,161,74,.10);
  --nav-bg:rgba(242,251,244,.80);
  --halo1:rgba(52,199,89,.20); --halo2:rgba(14,165,233,.14);
  --heading-font:var(--font-sans);
  --shadow:0 14px 34px rgba(20,90,50,.10);
}
body[data-theme="classical-cream"]{
  --bg:#f7efdb; --bg2:#efe2c6;
  --card:rgba(255,252,244,.92); --card-solid:#fffdf7;
  --text:#3b2f1e; --muted:#7d6c50;
  --accent:#a3762a; --accent2:#c19a4b; --accent3:#7a5230;
  --border:rgba(163,118,42,.28);
  --chip:rgba(163,118,42,.10);
  --nav-bg:rgba(247,239,219,.82);
  --halo1:rgba(196,160,90,.28); --halo2:rgba(163,118,42,.16);
  --heading-font:var(--font-serif);
  --shadow:0 12px 30px rgba(120,90,40,.12);
}

/* ============ 导航 ============ */
.nav{position:sticky;top:0;z-index:80;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;gap:14px;padding:11px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.logo-mark{color:var(--accent);font-size:1.35rem;line-height:1;filter:drop-shadow(0 0 10px var(--accent))}
.nav-links{display:flex;gap:2px;flex-wrap:wrap;margin-inline-start:auto}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.88rem;padding:6px 13px;border-radius:999px;transition:.25s;white-space:nowrap}
.nav-links a:hover{color:var(--accent);background:var(--chip)}
.nav-tools{display:flex;align-items:center;gap:10px}
.lang-sel{
  background:var(--card-solid);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:6px 9px;font-size:.82rem;cursor:pointer;outline:none;
  font-family:inherit;transition:.25s;
}
.lang-sel:hover{border-color:var(--accent)}
.theme-dots{display:flex;gap:6px}
.theme-dots button{
  width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  transition:.25s;
}
.theme-dots button[data-theme-set="cosmic-blue"]{background:linear-gradient(135deg,#0b1f3a,#38bdf8)}
.theme-dots button[data-theme-set="apple-green"]{background:linear-gradient(135deg,#e8f8ec,#34c759)}
.theme-dots button[data-theme-set="classical-cream"]{background:linear-gradient(135deg,#f7efdb,#b8860b)}
.theme-dots button.active{border-color:var(--accent);transform:scale(1.14);box-shadow:0 0 0 3px var(--chip)}

/* ============ 通用 ============ */
section{padding:84px 0}
.sec-head{max-width:760px;margin-bottom:40px}
.sec-head h2{font-size:clamp(1.5rem,3.1vw,2.15rem);margin-bottom:12px}
.sec-head p{color:var(--muted);font-size:.98rem}
.eyebrow{
  display:inline-block;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);background:var(--chip);border:1px solid var(--border);
  padding:4px 12px;border-radius:999px;margin-bottom:14px;font-weight:700;
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:24px;backdrop-filter:blur(12px);box-shadow:var(--shadow);
  transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 26px;border-radius:999px;font-size:.94rem;font-weight:700;
  text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:inherit;
  transition:.28s;
}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#04121f;box-shadow:0 10px 26px -8px var(--accent)}
body[data-theme="classical-cream"] .btn.primary{color:#fffaf0}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 32px -10px var(--accent)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--chip)}

/* ============ Hero ============ */
.hero{padding:104px 0 72px;text-align:center;position:relative}
.hero h1{font-size:clamp(1.9rem,4.6vw,3.25rem);margin:0 auto 20px;max-width:880px;letter-spacing:-.01em}
.hero h1 span{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{max-width:720px;margin:0 auto 34px;color:var(--muted);font-size:1.02rem}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.hero .note{font-size:.8rem;color:var(--muted);opacity:.85;letter-spacing:.02em}
.orb{
  width:74px;height:74px;margin:0 auto 26px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,var(--accent2),var(--accent) 45%,var(--accent3));
  box-shadow:0 0 60px -6px var(--accent);animation:float 5.5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ============ 数据 ============ */
.stats{padding:0 0 20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.stat{text-align:center;padding:26px 16px}
.stat .num{font-size:clamp(1.5rem,3.3vw,2.15rem);font-weight:800;color:var(--accent);font-family:var(--heading-font);letter-spacing:-.02em}
.stat .lbl{font-size:.83rem;color:var(--muted);margin-top:6px}

/* ============ 趋势 ============ */
.trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:16px}
.trend h3{font-size:1.02rem;margin-bottom:9px;display:flex;gap:9px;align-items:flex-start}
.trend h3 .ico{font-size:1.15rem;line-height:1.4;flex:0 0 auto}
.trend p{font-size:.88rem;color:var(--muted)}

/* ============ EACO ============ */
.eaco-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:stretch}
@media(max-width:860px){.eaco-wrap{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px dashed var(--border);font-size:.9rem;flex-wrap:wrap}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{font-weight:600;text-align:end;word-break:break-all}
.addr{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;
  background:var(--chip);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
  display:inline-flex;align-items:center;gap:8px;max-width:100%;
}
.addr code{overflow-wrap:anywhere}
.copy-btn{
  border:none;background:var(--accent);color:#04121f;border-radius:6px;
  padding:2px 9px;font-size:.72rem;cursor:pointer;font-family:inherit;font-weight:700;flex:0 0 auto;
}
body[data-theme="classical-cream"] .copy-btn{color:#fffaf0}

/* ============ 市场 ============ */
.market-table{width:100%;border-collapse:collapse;font-size:.88rem;overflow:hidden;border-radius:var(--r)}
.market-table th{
  text-align:start;padding:13px 16px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--border);font-weight:700;
}
.market-table td{padding:15px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.market-table tr:last-child td{border-bottom:none}
.market-table tbody tr{transition:background .25s}
.market-table tbody tr:hover{background:var(--chip)}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.tag.sell{background:rgba(239,68,68,.14);color:#ef4444;border:1px solid rgba(239,68,68,.28)}
.tag.buy{background:rgba(34,197,94,.14);color:#22a14a;border:1px solid rgba(34,197,94,.3)}
body[data-theme="cosmic-blue"] .tag.buy{color:#4ade80}
.tag.open{background:var(--chip);color:var(--accent);border:1px solid var(--border)}
.tag.match{background:rgba(245,158,11,.15);color:#d97706;border:1px solid rgba(245,158,11,.3)}
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--shadow)}

/* ============ 计算器 ============ */
.calc-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.calc-wrap{grid-template-columns:1fr}}
.field{margin-bottom:22px}
.field label{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:9px;color:var(--muted);font-weight:600}
.field label b{color:var(--accent);font-family:var(--heading-font)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:99px;background:var(--chip);
  outline:none;border:1px solid var(--border);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 0 4px var(--chip),0 3px 10px rgba(0,0,0,.28);transition:.2s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;cursor:pointer;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.result-grid{grid-template-columns:1fr}}
.result{
  background:var(--chip);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;
}
.result .rv{font-size:1.32rem;font-weight:800;color:var(--accent);font-family:var(--heading-font);word-break:break-all}
.result .rl{font-size:.76rem;color:var(--muted);margin-top:4px}
.calc-note{font-size:.74rem;color:var(--muted);margin-top:18px;line-height:1.7;opacity:.9}

/* ============ 加入 ============ */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:34px}
.step{position:relative;padding-top:30px}
.step .idx{
  position:absolute;top:-14px;inset-inline-start:22px;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121f;
  display:grid;place-items:center;font-weight:800;font-size:.9rem;box-shadow:0 8px 20px -6px var(--accent);
}
body[data-theme="classical-cream"] .step .idx{color:#fffaf0}
.step h4{font-size:.98rem;margin-bottom:7px}
.step p{font-size:.85rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:7px;font-weight:600}
.form-grid input,.form-grid select{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--card-solid);color:var(--text);font-size:.9rem;font-family:inherit;outline:none;
  transition:.25s;
}
.form-grid input:focus,.form-grid select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--chip)}
.form-ok{
  display:none;margin-top:20px;padding:16px 20px;border-radius:14px;
  background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);
  color:var(--text);font-size:.9rem;font-weight:600;
}
.form-ok.show{display:block;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 路线图 ============ */
.timeline{position:relative;padding-inline-start:30px}
.timeline::before{
  content:"";position:absolute;inset-inline-start:8px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent3),transparent);border-radius:2px;
}
.rm{position:relative;margin-bottom:26px}
.rm::before{
  content:"";position:absolute;inset-inline-start:-30px;top:9px;width:14px;height:14px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px var(--chip);border:2px solid var(--bg);
}
.rm h4{font-size:1rem;margin-bottom:6px}
.rm p{font-size:.87rem;color:var(--muted)}

/* ============ 页脚 ============ */
footer{border-top:1px solid var(--border);padding:44px 0 56px;background:var(--nav-bg);backdrop-filter:blur(10px)}
.foot-inner{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.foot-inner .fbrand{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px}
.foot-inner .fdisc{font-size:.76rem;color:var(--muted);max-width:720px;line-height:1.75}

/* ============ 动效 ============ */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media(max-width:720px){
  section{padding:60px 0}
  .hero{padding:70px 0 50px}
  .nav-links{order:3;width:100%;justify-content:flex-start;margin-inline-start:0;padding-top:8px;gap:2px}
  .nav-tools{margin-inline-start:auto}
  .market-table th,.market-table td{padding:11px 12px;font-size:.82rem}
}
</style>
</head>

/* =========================================================
   2. 市场数据
   ========================================================= */
const MARKET_ROWS = [
  {type:'sell', resKey:'m1', regionKey:'r_sea', price:'0.28 ¥/kWh', status:'open'},
  {type:'buy',  resKey:'m2', regionKey:'r_eu',  price:'0.52 ¥/kWh', status:'match'},
  {type:'sell', resKey:'m3', regionKey:'r_na',  price:'0.35 ¥/kWh', status:'open'},
  {type:'buy',  resKey:'m4', regionKey:'r_me',  price:'—',          status:'open'}
];

/* =========================================================
   3. 语言切换
   ========================================================= */
function applyLang(lang){
  const dict = I18N[lang] || I18N.zh;
  document.documentElement.lang = lang;
  document.body.dataset.lang = lang;
  document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(dict[key] !== undefined) el.textContent = dict[key];
  });

  // 表单下拉选项
  document.querySelectorAll('#fRes option').forEach(op=>{
    const key = op.dataset.i18n;
    if(dict[key]) op.textContent = dict[key];
  });

  renderMarket(lang);
  updateCalc();
  try{ localStorage.setItem('eaco_lang', lang); }catch(e){}
}

/* =========================================================
   4. 市场表格渲染
   ========================================================= */
function renderMarket(lang){
  const dict = I18N[lang] || I18N.zh;
  const tbody = document.getElementById('marketBody');
  const typeMap = {sell:dict.m_sell, buy:dict.m_buy};
  const statusMap = {open:dict.m_open, match:dict.m_match};
  tbody.innerHTML = MARKET_ROWS.map(r=>`
    <tr>
      <td><span class="tag ${r.type}">${typeMap[r.type]}</span></td>
      <td>${dict[r.resKey] || ''}</td>
      <td>${dict[r.regionKey] || ''}</td>
      <td><b>${r.price}</b></td>
      <td><span class="tag ${r.status === 'open' ? 'open' : 'match'}">${statusMap[r.status]}</span></td>
    </tr>
  `).join('');
}

/* =========================================================
   5. 主题切换
   ========================================================= */
function setTheme(theme){
  document.body.dataset.theme = theme;
  document.querySelectorAll('.theme-dots button').forEach(b=>{
    b.classList.toggle('active', b.dataset.themeSet === theme);
  });
  try{ localStorage.setItem('eaco_theme', theme); }catch(e){}
}

/* =========================================================
   6. 计算器
   ========================================================= */
const el = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');

function updateCalc(){
  const n     = +el('rNodes').value;
  const p     = +el('rPower').value;
  const price = +el('rPrice').value;
  const green = +el('rGreen').value;

  el('vNodes').textContent = n;
  el('vPower').textContent = p;
  el('vPrice').textContent = price.toFixed(2);
  el('vGreen').textContent = green;

  // 年可调度电量（kWh）
  const kwh = n * p * 4000;
  // 峰谷套利 + 需求响应节省
  const save = kwh * price * 0.35;
  // 边缘推理算力收益
  const earn = kwh * 0.35;
  // EACO 激励
  const eaco = kwh * 0.5;

  el('outKwh').textContent  = fmt(kwh);
  el('outSave').textContent = '¥' + fmt(save);
  el('outEarn').textContent = '¥' + fmt(earn);
  el('outEaco').textContent = fmt(eaco);
}

/* =========================================================
   7. 数字滚动动画
   ========================================================= */
function animateCount(node){
  const target = +node.dataset.count;
  const suffix = node.dataset.suffix || '';
  const dur = 1500;
  const start = performance.now();
  function tick(t){
    const prog = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - prog, 3);
    node.textContent = fmt(target * eased) + suffix;
    if(prog < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* =========================================================
   8. 滚动显现
   ========================================================= */
function initReveal(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        en.target.classList.add('in');
        const counter = en.target.querySelector('[data-count]');
        if(counter && !counter.dataset.done){
          counter.dataset.done = '1';
          animateCount(counter);
        }
        io.unobserve(en.target);
      }
    });
  }, {threshold:0.15});

  document.querySelectorAll('.reveal').forEach((node, i)=>{
    node.style.transitionDelay = (i % 4) * 70 + 'ms';
    io.observe(node);
  });
}

/* =========================================================
   9. 初始化
   ========================================================= */
(function init(){
  // 主题
  let savedTheme = 'cosmic-blue';
  let savedLang = 'zh';
  try{
    savedTheme = localStorage.getItem('eaco_theme') || 'cosmic-blue';
    savedLang  = localStorage.getItem('eaco_lang')  || 'zh';
  }catch(e){}
  setTheme(savedTheme);

  // 语言
  el('langSel').value = savedLang;
  applyLang(savedLang);

  // 主题按钮
  document.querySelectorAll('.theme-dots button').forEach(btn=>{
    btn.addEventListener('click', ()=> setTheme(btn.dataset.themeSet));
  });

  // 语言下拉
  el('langSel').addEventListener('change', e => applyLang(e.target.value));

  // 计算器
  ['rNodes','rPower','rPrice','rGreen'].forEach(id=>{
    el(id).addEventListener('input', updateCalc);
  });
  updateCalc();

  // 复制合约地址
  el('copyBtn').addEventListener('click', async ()=>{
    const text = el('tokenAddr').textContent.trim();
    const dict = I18N[document.body.dataset.lang] || I18N.zh;
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
    }
    const btn = el('copyBtn');
    btn.textContent = dict.copied;
    setTimeout(()=>{ btn.textContent = dict.copy; }, 1600);
  });

  // 表单提交（闭环）
  el('joinForm').addEventListener('submit', e=>{
    e.preventDefault();
    const name  = el('fName').value.trim();
    const email = el('fEmail').value.trim();
    if(!name || !email){
      el('fName').focus();
      return;
    }
    el('formOk').classList.add('show');
    el('joinForm').reset();
    setTimeout(()=> el('formOk').classList.remove('show'), 6000);
  });

  // 滚动显现
  initReveal();
})();
</script>
