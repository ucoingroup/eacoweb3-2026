{icon:"☀️",title:"光帆推进",desc:"利用恒星光的辐射压力推动超轻薄帆面加速。搭配地面或太空激光阵列，可将微型探测器加速到光速的10-20%。突破摄星计划即采用此方案。低成本、可量产，适合星际早期探索。"},
{icon:"🕳️",title:"虫洞旅行",desc:"爱因斯坦-罗森桥理论允许时空捷径存在。若能稳定一个宏观虫洞，可实现瞬时星际旅行。当前面临的挑战：虫洞极度不稳定、需要奇异物质维持、量子效应可能导致信息丢失。"},
{icon:"☢️",title:"核聚变推进",desc:"可控核聚变可提供比化学火箭高数万倍的比冲。聚变火箭理论速度可达光速的5-10%。华商应关注：氘氚聚变、氦-3聚变、磁约束聚变小型化等方向。氦-3可从月球和气态行星开采。"},

{icon:"⚛️",title:"反物质能源",desc:"质能转换率100%，是最理想的星际燃料和能源。未来若能量产反物质，将彻底改变能源格局。华商应关注：反质子 traps、反氢制造、反物质储存容器、太空反物质工厂。"},

antiagingTitle:"逆变年轻医学",
antiagingSub:"逆转生物钟的核心技术——从清除衰老细胞到表观遗传重编程",
antiagingIntro:"逆变年轻(Rejuvenation)不同于单纯抗衰老——目标是逆转生物年龄，让组织功能恢复至年轻状态。以下为当前最前沿的逆变技术：",
antiagingCards:[
{icon:"🧹",title:"衰老细胞清除(Senolytics)",desc:"衰老细胞(Zombie Cells)停止分裂但不清除，分泌SASP因子毒害周围组织。清除药物：达沙替尼+槲皮素(D+Q)、非瑟酮、Navitoclax。临床已证明可改善体能、皮肤、认知功能。这是逆变医学的核心突破口。"},
{icon:"🧬",title:"端粒酶激活疗法",desc:"端粒每次细胞分裂缩短，缩短到临界值细胞即衰老。端粒酶激活剂：TA-65、Astragaloside III(黄芪甲苷)、Cycloastragenol。基因疗法：AAV递送TERT基因。延长端粒可延长细胞寿命，是逆变的基因层面方案。"},
{icon:"⚡",title:"NAD+前体补充",desc:"NAD+是细胞能量代谢和DNA修复的关键辅酶，随年龄骤降。前体补充：NMN(烟酰胺单核苷酸)、NR(烟酰胺核苷)。可恢复线粒体功能、改善胰岛素敏感性、增强DNA修复。动物实验延寿30%+。"},
{icon:"🔄",title:"表观遗传重编程",desc:"山中因子(OSKM: Oct4/Sox2/Klf4/c-Myc)可将成体细胞重置为干细胞状态。部分重编程(Partial Reprogramming)可逆转组织衰老而不致肿瘤。2023年已在小鼠实现寿命延长。表观遗传时钟(DNAm Clock)可精确测量生物年龄。"},
{icon:"💊",title:"mTOR抑制与自噬激活",desc:"雷帕霉素(Rapamycin)抑制mTOR通路，激活细胞自噬(Autophagy)清除受损蛋白和细胞器。是目前最有效的延寿药物之一(小鼠延寿25%+)。自噬激活剂：雷帕霉素、亚精胺(Spermidine)、白藜芦醇。间歇性断食也通过此机制延寿。"},
{icon:"🧪",title:"肽类疗法",desc:"生物活性肽是逆变医学的新兴方向：GHK-Cu(铜肽)促进组织修复和胶原合成；胸腺素alpha-1恢复免疫功能；Epitalon激活端粒酶；BPC-157加速伤口愈合。肽类精准调控信号通路，副作用小，是华商可重点关注的赛道。"}
],

civ:{
id:"civ",icon:"🚀",title:"Interstellar Civilization",sub:"From Dyson Spheres to Galactic Federations — Humanity's Path to Cosmic Civilization",
cards:[
{icon:"🟡",title:"Dyson Sphere & Stellar Engineering",desc:"The hallmark of Type II civilization. Building megastructures around stars to collect their total radiation energy. Theoretically provides billions of times more energy than Earth's current consumption."},
{icon:"📡",title:"Civilizational Transition Paths",desc:"Type 0→I: Control planetary energy, conquer natural disasters, build planetary energy networks. I→II: Build Dyson structures, colonize solar system, enable interstellar travel. II→III: Interstellar voyages, galaxy-scale engineering, harness black hole energy."},
{icon:"🏛️",title:"Galactic Civilization Governance",desc:"Interstellar civilization requires novel governance frameworks: interstellar alliances, civilization-level certification, resource allocation protocols, technology sharing mechanisms. Entrepreneurs should proactively study interstellar governance business models."},
{icon:"📜",title:"Cosmic Ethics Framework",desc:"Combining Chinese 'Ren-He' philosophy with cosmic ethics. 'Ren' sets tech boundaries: no extinction weapons, no habitable planet ecological destruction. 'He' builds pluralistic order: respect different civilization forms, establish symbiotic coexistence."},
{icon:"🔢",title:"Drake Equation & Fermi Paradox",desc:"The Drake Equation estimates possible civilizations in the galaxy; the Fermi Paradox asks: if civilizations exist, why haven't we detected them? Implication: the scarcity of cosmic civilizations means first-mover advantage is enormous."},
{icon:"🧬",title:"Civilization Survival & Evolution",desc:"The Kardashev Scale measures not just energy but civilizational survival probability. Higher energy mastery civilizations have exponentially higher survival rates. Long-term investment should anchor to the ultimate goal of civilizational survival."}
]
},

nav:{
id:"nav",icon:"🛰️",title:"Interstellar Navigation",sub:"From Chemical Rockets to Warp Drive — Technology Paths Across Interstellar Distances",
cards:[
{icon:"🌀",title:"Warp Drive (Alcubierre Drive)",desc:"Proposed by physicist Miguel Alcubierre in 1994. Achieves FTL travel by warping spacetime — compressing space ahead and expanding behind. Requires negative energy/exotic matter. Still theoretical."},
{icon:"🚢",title:"Generation Ships",desc:"Sub-light travel without FTL. Self-sustaining ecosystems inside, passengers reproduce over generations until reaching target star systems. Investment: closed ecological systems, space agriculture, multi-generational psychology."},
{icon:"☀️",title:"Light Sail Propulsion",desc:"Uses stellar radiation pressure on ultralight sails. With ground/space laser arrays, microprobes can reach 10-20% light speed. Breakthrough Starshot adopts this approach. Low cost, mass-producible."},
{icon:"🕳️",title:"Wormhole Travel",desc:"Einstein-Rosen bridges theoretically allow spacetime shortcuts. Stabilizing a macroscopic wormhole could enable instant interstellar travel. Challenges: instability, exotic matter requirements, quantum information loss."},
{icon:"☢️",title:"Fusion Propulsion",desc:"Controlled fusion provides tens of thousands of times higher specific impulse than chemical rockets. Theoretical speeds of 5-10% light speed. Focus: D-T fusion, He-3 fusion, magnetic confinement miniaturization. He-3 mineable from Moon and gas giants."},
{icon:"💥",title:"Antimatter Propulsion",desc:"Matter-antimatter annihilation achieves 100% mass-energy conversion (fusion: ~0.7%). 1 gram of antimatter ≈ Hiroshima bomb energy. Challenge: manufacturing and storage costs are extreme, currently nanograms per year."}
]

energy:{

{icon:"🔥",title:"Fusion (Stellar Scale)",desc:"From Type I deuterium-tritium fusion to Type II stellar engineering fusion. Humanity nears Q>1 ignition. Post-commercialization, energy costs approach zero. He-3 fusion is cleaner and more efficient."},

]

trade:{

cards:[
{icon:"⛏️",title:"Asteroid Mining",desc:"Near-Earth asteroids rich in platinum-group metals, rare earths, water ice. A 500m S-type asteroid may contain more platinum than Earth's annual output. Asteroid 16 Psyche valued at over $10,000 quadrillion. Focus: space mining robots, ISRU, space smelting."},
{icon:"🗺️",title:"Interstellar Trade Routes",desc:"Lagrange points (L1-L5) will become space trade hubs. Earth-Moon stations, Mars transit stations, asteroid belt supply depots form an interstellar Silk Road. Early trade goods: He-3, rare metals, water ice, orbital space, scientific data."},
{icon:"📈",title:"Post-Scarcity Economics",desc:"Infinite cosmic resources disrupt the 'scarcity' assumption of traditional economics. When energy costs approach zero and matter is abundant, value creation shifts from material production to knowledge creation, experience design, and cultural output."},
{icon:"💰",title:"Energy-Backed Currency",desc:"The Kardashev Scale's energy-centric framework suggests future currency may shift from fiat to energy-backed. EACO (Earth's Best Coin) anchors Energy × Attitude × Cooperation × Optimization — providing digital infrastructure for the interstellar energy economy."},
{icon:"🔗",title:"Multi-Planetary Supply Chains",desc:"Earth manufacturing → Moon refining → Asteroid mining → Orbital assembly → Mars delivery. 3D printing and space manufacturing enable 'digital transmission + local manufacturing' to replace physical transport. Study space logistics network design."},
{icon:"🌐",title:"Defining Interstellar Markets",desc:"Type I markets: disaster prevention, planetary energy networks, climate engineering. Type II: Dyson sphere construction, terraforming, space tourism. Type III: galaxy-scale energy trading, black hole energy leasing, civilization-level consulting."}
]

function filterUFO(key,btn){

}).catch(()=>{

/* Fade-in observer */
function observeFade(){
const els=document.querySelectorAll('.section,.card,.kardashev-card,.dim-card,.tl-item,.summary-box,.footer');
els.forEach(el=>el.classList.add('fade-in'));
const obs=new IntersectionObserver((entries)=>{
entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')});
},{threshold:.05});
document.querySelectorAll('.fade-in').forEach(el=>obs.observe(el));
}

/* Star background animation */
(function(){
const canvas=document.getElementById('starCanvas');
const ctx=canvas.getContext('2d');
let stars=[];
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;initStars()}
function initStars(){
stars=[];
const count=Math.floor(canvas.width*canvas.height/8000);
for(let i=0;i<count;i++){
stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.2+.3,o:Math.random(),s:Math.random()*.5+.1,tw:Math.random()*.02+.005});
}
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const s of stars){
s.o+=s.tw;
if(s.o>1||s.o<0)s.tw=-s.tw;
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fillStyle=`rgba(255,255,255,${Math.abs(s.o)*.6})`;
ctx.fill();
if(s.r>1){
ctx.beginPath();ctx.arc(s.x,s.y,s.r*3,0,Math.PI*2);
ctx.fillStyle=`rgba(0,212,255,${Math.abs(s.o)*.05})`;ctx.fill();
}
}
requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);
resize();draw();
})();

render();
</script>
