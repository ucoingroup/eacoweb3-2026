        /* ===== 滚动条美化 ===== */

        }

        /* ===== 小工具 ===== */
        .text-muted {
            color: #7a8fab;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

        // ======================================================================
        //  2. 分类配置
        // ======================================================================
        const CATEGORIES = [
            { key: 'all', label: '🏷️ 全部', icon: 'fa-th' },
            { key: 'anonymous', label: '匿名上传', icon: 'fa-user-secret' },
            { key: 'cloud', label: '云盘服务', icon: 'fa-cloud' },
            { key: 'dev', label: '开发者工具', icon: 'fa-code' },
            { key: 'privacy', label: '隐私保护', icon: 'fa-shield-alt' },
            { key: 'mobile', label: '移动端 APP', icon: 'fa-mobile-alt' },
        ];

        // ======================================================================
        //  3. 状态
        // ======================================================================
        let currentCategory = 'all';
        let searchQuery = '';
        let filteredServices = [...SERVICES];

        // ======================================================================
        //  4. DOM 引用
        // ======================================================================
        const grid = document.getElementById('cardsGrid');
        const filterTabs = document.getElementById('filterTabs');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        const totalCountEl = document.getElementById('totalCount');
        const statCategories = document.getElementById('statCategories');
        const statTotal = document.getElementById('statTotal');
        const statEncrypted = document.getElementById('statEncrypted');
        const statAnonymous = document.getElementById('statAnonymous');

        // ======================================================================
        //  5. 渲染函数
        // ======================================================================

        // 5.1 分类标签
        function renderTabs() {
            filterTabs.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const count = cat.key === 'all' ?
                    SERVICES.length :
                    SERVICES.filter(s => s.category === cat.key).length;

                const btn = document.createElement('button');
                btn.className = `filter-tab ${currentCategory === cat.key ? 'active' : ''}`;
                btn.dataset.key = cat.key;
                btn.innerHTML = `
                            <i class="fas ${cat.icon}"></i>
                            ${cat.label}
                            <span class="count-badge">${count}</span>
                        `;
                btn.addEventListener('click', () => {
                    currentCategory = cat.key;
                    renderTabs();
                    filterAndRender();
                });
                filterTabs.appendChild(btn);
            });
        }

        // 5.2 卡片
        function renderCards(services) {
            if (!services || services.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-search"></i>
                                <h3>没有找到匹配的服务</h3>
                                <p style="color:#8a9bb8; margin-top:6px;">试试调整筛选条件或搜索词</p>
                            </div>
                        `;
                return;
            }

            grid.innerHTML = '';
            services.forEach(service => {
                const card = document.createElement('div');
                card.className = 'service-card';

                // 分类标签
                const catLabel = CATEGORIES.find(c => c.key === service.category)?.label || service.category;

                // 加密标识
                const encryptBadge = service.encrypted ?
                    `<span class="badge-encrypt"><i class="fas fa-lock"></i> 加密</span>` :
                    '';

                card.innerHTML = `
                            <div class="card-top">
                                <div class="card-name">
                                    <i class="fas ${service.icon || 'fa-file-alt'}" style="color:#4a6cf7; font-size:16px;"></i>
                                    ${service.name}
                                    ${encryptBadge}
                                </div>
                                <span class="card-category">${catLabel}</span>
                            </div>
                            <div class="card-desc">${service.description}</div>
                            <div class="card-features">
                                ${service.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                            </div>
                            <div class="card-meta">
                                <span class="meta-item"><i class="fas fa-weight-hanging"></i> <span class="highlight">${service.maxSize}</span></span>
                                <span class="meta-item"><i class="fas fa-clock"></i> ${service.retention}</span>
                                ${service.anonymous ? '<span class="meta-item"><i class="fas fa-user-secret"></i> 匿名</span>' : ''}
                            </div>
                            <div class="card-actions">
                                <button class="btn-detail" data-id="${service.id}"><i class="fas fa-info-circle"></i> 详情</button>
                                ${service.url ? `<a href="${service.url}" target="_blank" rel="noopener" class="btn-visit"><i class="fas fa-external-link-alt"></i> 访问</a>` : ''}
                            </div>
                        `;

                // 详情按钮事件
                card.querySelector('.btn-detail').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(service.id);
                });

                // 卡片点击打开详情
                card.addEventListener('click', () => {
                    openModal(service.id);
                });

                grid.appendChild(card);
            });
        }

        // 5.3 统计
        function updateStats(services) {
            const total = services.length;
            const encrypted = services.filter(s => s.encrypted).length;
            const anonymous = services.filter(s => s.anonymous).length;
            const categories = new Set(services.map(s => s.category)).size;

            totalCountEl.textContent = SERVICES.length;
            statCategories.textContent = categories;
            statTotal.textContent = total;
            statEncrypted.textContent = encrypted;
            statAnonymous.textContent = anonymous;
        }

        // 5.4 主筛选 + 渲染
        function filterAndRender() {
            let filtered = [...SERVICES];

            // 分类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(s => s.category === currentCategory);
            }

            // 搜索筛选
            if (searchQuery.trim() !== '') {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(s =>
                    s.name.toLowerCase().includes(q) ||
                    s.description.toLowerCase().includes(q) ||
                    s.features.some(f => f.toLowerCase().includes(q)) ||
                    s.categoryLabel.includes(q)
                );
            }

            filteredServices = filtered;
            renderCards(filtered);
            updateStats(filtered);
        }

        // ======================================================================
        //  6. 模态框
        // ======================================================================
        function openModal(id) {
            const service = SERVICES.find(s => s.id === id);
            if (!service) return;

            const catLabel = CATEGORIES.find(c => c.key === service.category)?.label || service.category;
            const encryptBadge = service.encrypted ?
                `<span class="badge-encrypt"><i class="fas fa-lock"></i> 端到端加密</span>` :
                '';

            modalContent.innerHTML = `
                        <div class="modal-title">
                            <i class="fas ${service.icon || 'fa-file-alt'}" style="color:#4a6cf7;"></i>
                            ${service.name}
                            ${encryptBadge}
                        </div>
                        <div class="modal-category">${catLabel}</div>
                        <div class="modal-desc">${service.description}</div>

                        <div class="modal-detail-grid">
                            <div class="detail-item">
                                <span class="label"><i class="fas fa-weight-hanging"></i> 大小限制</span>
                                <span class="value">${service.maxSize}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label"><i class="fas fa-clock"></i> 保留期限</span>
                                <span class="value">${service.retention}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label"><i class="fas fa-user-secret"></i> 匿名上传</span>
                                <span class="value">${service.anonymous ? '✅ 支持' : '❌ 需注册'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label"><i class="fas fa-lock"></i> 加密支持</span>
                                <span class="value">${service.encrypted ? '✅ 支持' : '❌ 不支持'}</span>
                            </div>
                        </div>

                        <div style="font-size:13px; font-weight:600; color:#3f5a7c; margin-top:6px;">✨ 特点</div>
                        <div class="modal-features">
                            ${service.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                        </div>

                        <div class="modal-actions">
                            ${service.url ? `<a href="${service.url}" target="_blank" rel="noopener" class="btn-visit"><i class="fas fa-external-link-alt"></i> 访问 ${service.name}</a>` : ''}
                            <button class="btn-close-modal" id="modalCloseInnerBtn">关闭</button>
                        </div>
                    `;

            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';

            // 内层关闭按钮
            const innerClose = document.getElementById('modalCloseInnerBtn');
            if (innerClose) {
                innerClose.addEventListener('click', closeModal);
            }

            // 点击外部关闭
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        // 模态框关闭按钮
        modalCloseBtn.addEventListener('click', closeModal);

        // ESC 键关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ======================================================================
        //  7. 搜索输入
        // ======================================================================
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            filterAndRender();
        });

        // ======================================================================
        //  8. 启动
        // ======================================================================
        renderTabs();
        filterAndRender();

        // 小彩蛋：控制台提示
        console.log('🌍 全球免费上传 · 服务目录已加载');
        console.log(`📦 共 ${SERVICES.length} 个服务，${CATEGORIES.length - 1} 个分类`);
        console.log('🔍 试试搜索或点击分类筛选吧！');
    </script>
</body>
</html>
