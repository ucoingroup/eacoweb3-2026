function esc(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBody(text){
  if(!text) return '';
  let parts = esc(text).split('\n\n');
  return parts.map(p => {
    if(p.startsWith('1.') || p.startsWith('2.') || p.startsWith('3.') || p.startsWith('4.')){
      let lines = p.split('\n');
      let html = '';
      let inList = false;
      for(let line of lines){
        if(/^\d+\./.test(line)){
          if(inList){ html += '</ol>'; inList=false; }
          html += '<p>' + line + '</p>';
        } else {
          if(!inList){ html += '<ol>'; inList=true; }
          html += '<li>' + line + '</li>';
        }
      }
      if(inList) html += '</ol>';
      return html;
    }
    return '<p>' + p.replace(/\n/g,'<br>') + '</p>';
  }).join('');
}

function renderBullets(bullets){
  if(!bullets || !bullets.length) return '';
  return '<ul>' + bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>';
}

function renderTable(headers, rows){
  if(!headers || !rows) return '';
  let html = '<div class="table-wrap"><table>';
  html += '<thead><tr>' + headers.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead>';
  html += '<tbody>';
  rows.forEach(row => {
    html += '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderArchLayers(layers){
  if(!layers || !layers.length) return '';
  let html = '<div class="arch-layers">';
  layers.forEach((layer, i) => {
    if(i > 0) html += '<div class="arch-arrow">&#9660;</div>';
    html += '<div class="arch-layer"><div class="arch-layer-name">' + esc(layer.name) + '</div><div class="arch-layer-desc">' + esc(layer.desc) + '</div></div>';
  });
  html += '</div>';
  return html;
}

      <h3>${esc(d.s2Title)}</h3>
      <p><strong>${esc(d.s2Subtitle)}</strong></p>
      <h4>${esc(d.s2_1Title)}</h4>
      ${renderBody(d.s2_1Body)}
      ${renderBullets(d.s2_1Bullets)}
      <h4>${esc(d.s2_2Title)}</h4>
      ${renderBody(d.s2_2Body)}
    </div>

    <div class="section">
      <h3>${esc(d.s3Title)}</h3>
      <h4>${esc(d.s3_1Title)}</h4>
      ${renderTable(d.s3_1Headers, d.s3_1Rows)}
      <h4>${esc(d.s3_2Title)}</h4>
      ${renderBody(d.s3_2Body)}
      ${renderTable(d.s3_2Headers, d.s3_2Rows)}
      <h4>${esc(d.s3_3Title)}</h4>
      ${renderBody(d.s3_3Body)}
    </div>

    <div class="section">
      <h3>${esc(d.s4Title)}</h3>
      ${renderTable(d.s4Headers, d.s4Rows)}
    </div>

    <div class="section">
      <h3>${esc(d.s5Title)}</h3>
      ${renderTable(d.s5Headers, d.s5Rows)}
    </div>

    <div class="section">
      <h3>${esc(d.s6Title)}</h3>
      ${renderBody(d.s6Body)}
    </div>
  `;
}

function renderV2(d){
  if(!d) return '<p>Loading...</p>';
  return `
    <div class="version-badge v2-badge">${esc(d.badge)}</div>
    <h2>${esc(d.title)}</h2>
    <div class="subtitle">${esc(d.subtitle)}</div>

    <div class="section">
      <h3>${esc(d.s1Title)}</h3>
      ${renderBody(d.s1Body)}
    </div>

    <div class="section">
      <h3>${esc(d.s2Title)}</h3>
      ${renderBody(d.s2Body)}
      ${renderTable(d.s2Headers, d.s2Rows)}
      <h4>${esc(d.s2_1Title)}</h4>
      ${renderBody(d.s2_1Body)}
      ${renderBullets(d.s2_1Bullets)}
      <h4>${esc(d.s2_2Title)}</h4>
      ${renderBody(d.s2_2Body)}
    </div>

    <div class="section">
      <h3>${esc(d.s3Title)}</h3>
      <h4>${esc(d.s3_1Title)}</h4>
      ${renderTable(d.s3_1Headers, d.s3_1Rows)}
      <h4>${esc(d.s3_2Title)}</h4>
      ${renderBody(d.s3_2Body)}
      <h4>${esc(d.s3_3Title)}</h4>
      ${renderArchLayers(d.s3_3Layers)}
    </div>

    <div class="section">
      <h3>${esc(d.s4Title)}</h3>
      <h4>${esc(d.s4_1Title)}</h4>
      ${renderBody(d.s4_1Body)}
      ${renderBullets(d.s4_1Bullets)}
      <h4>${esc(d.s4_2Title)}</h4>
      ${renderBody(d.s4_2Body)}
      <h4>${esc(d.s4_3Title)}</h4>
      ${renderBullets(d.s4_3Bullets)}
    </div>

    <div class="section">
      <h3>${esc(d.s5Title)}</h3>
      ${renderTable(d.s5Headers, d.s5Rows)}
    </div>

    <div class="section">
      <h3>${esc(d.s6Title)}</h3>
      ${renderBody(d.s6Body)}
    </div>
  `;
}

function renderComparison(d){
  if(!d) return '<p>Loading...</p>';
  return `
    <div class="comparison-intro">
      <h2>${esc(d.title)}</h2>
      <p>${esc(d.subtitle)}</p>
    </div>
    <div class="section">
      ${renderTable(d.headers, d.rows)}
    </div>
  `;
}


function renderFuture(d){
  if(!d) return '<p>Loading...</p>';
  let industriesHtml = (d.industries||[]).map((ind, i) => {
    let bulletsHtml = (ind.bullets||[]).map(b => '<li>' + esc(b) + '</li>').join('');
    return `
      <div class="industry-card" style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;border-left:4px solid var(--accent${(i%3)+1})">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <span style="font-size:28px">${ind.icon||'&#128640;'}</span>
          <div>
            <h3 style="color:var(--accent);font-size:18px;margin:0">${esc(ind.title)}</h3>
            <div style="color:var(--text3);font-size:13px">${esc(ind.tagline||'')}</div>
          </div>
        </div>
        <p style="color:var(--text2);margin-bottom:12px">${esc(ind.trend||'')}</p>
        <div style="background:var(--bg2);border-radius:8px;padding:12px 16px;margin-bottom:8px">
          <strong style="color:var(--accent2)">${esc(d.eacoMethodLabel||'EACO Integration')}</strong>
          <p style="color:var(--text2);margin-top:4px">${esc(ind.eacoMethod||'')}</p>
        </div>
        ${bulletsHtml ? '<ul style="margin:8px 0 0 20px;color:var(--text2)">' + bulletsHtml + '</ul>' : ''}
      </div>
    `;
  }).join('');
  let conclusionHtml = '';
  if(d.conclusion){
    conclusionHtml = `
      <div class="section" style="background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:24px">
        <h3 style="color:var(--accent3)">${esc(d.conclusionTitle||'Conclusion')}</h3>
        ${renderBody(d.conclusion)}
      </div>
    `;
  }
  return `
    <div class="version-badge" style="background:var(--gradient3)">${esc(d.badge||'Future')}</div>
    <h2>${esc(d.title)}</h2>
    <div class="subtitle">${esc(d.subtitle||'')}</div>
    <div class="section">
      <h3>${esc(d.overviewTitle||'Overview')}</h3>
      ${renderBody(d.overview||'')}
    </div>
    <div class="section">
      <h3>${esc(d.industriesTitle||'Top 10 Industries')}</h3>
      ${industriesHtml}
    </div>
    ${conclusionHtml}
  `;
}

function renderEaco(d){
  if(!d) return '<p>Loading...</p>';
  let linksHtml = (d.links||[]).map(l =>
    '<a class="eaco-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'
  ).join('');
  return `
    <div class="eaco-footer">
      <div class="container">
        <h2>${esc(d.title)}</h2>
        <div class="eaco-info-grid">
          <div class="eaco-info-card">
            <div class="label">${esc(d.name || '')}</div>
          </div>
          <div class="eaco-info-card">
            <div class="label">${esc(d.chain || '')}</div>
          </div>
          <div class="eaco-info-card">
            <div class="label">${esc(d.contractLabel || '')}</div>
            <div class="value mono" id="contractAddr">${esc(d.contract || '')}</div>
            <button class="copy-btn" onclick="copyContract()">${esc(d.copyBtn || 'Copy')}</button>
          </div>
          <div class="eaco-info-card">
            <div class="label">${esc(d.supplyLabel || '')}</div>
            <div class="value">${esc(d.supply || '')}</div>
          </div>
          <div class="eaco-info-card">
            <div class="label">${esc(d.positioningLabel || '')}</div>
            <div class="value">${esc(d.positioning || '')}</div>
          </div>
        </div>
        <h4 style="text-align:center;margin-bottom:16px;color:var(--text)">${esc(d.linksTitle || '')}</h4>
        <div class="eaco-links">${linksHtml}</div>
      </div>
    </div>
  `;
}

function copyContract(){
  const addr = document.getElementById('contractAddr').textContent;
  navigator.clipboard.writeText(addr).then(() => {
    const btn = event.target;
    const original = btn.textContent;
    const d = LOCALES[currentLang]?.eaco;
    btn.textContent = d?.copiedBtn || 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 2000);
  });
}

function updateTexts(){
  const d = LOCALES[currentLang] || LOCALES['en'];
  const meta = d.meta || {};
  const nav = d.nav || {};

  document.title = meta.siteTitle || 'EACO Token Factory';
  document.getElementById('heroTitle').textContent = meta.siteTitle || '';
  document.getElementById('heroSubtitle').textContent = meta.siteSubtitle || '';
  document.getElementById('heroDesc').textContent = meta.siteDescription || '';

  const tabs = document.querySelectorAll('.nav-tab');
  tabs[0].textContent = nav.mainland || '';
  tabs[1].textContent = nav.overseas || '';
  tabs[2].textContent = nav.comparison || '';
  tabs[3].textContent = nav.eaco || '';
  tabs[4].textContent = nav.future || '';

  document.getElementById('content-v1').innerHTML = renderV1(d.v1);
  document.getElementById('content-v2').innerHTML = renderV2(d.v2);
  document.getElementById('content-comparison').innerHTML = renderComparison(d.comparison);
  document.getElementById('content-eaco').innerHTML = renderEaco(d.eaco);
  document.getElementById('content-future').innerHTML = renderFuture(d.future);

  // RTL
  if(RTL_LANGS.includes(currentLang)){
    document.documentElement.setAttribute('dir','rtl');
  } else {
    document.documentElement.setAttribute('dir','ltr');
  }

  // Update active lang button
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.getElementById('content-' + tab).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchLang(lang){
  currentLang = lang;
  localStorage.setItem('eaco-tf-lang', lang);
  document.documentElement.lang = lang;
  updateTexts();
}

// Init
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => switchLang(btn.dataset.lang));
});

switchLang(currentLang);
</script>

</body>
</html>
