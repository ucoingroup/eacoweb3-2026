    --link:#15803d; --ca:#0d9488; --btntxt:#ffffff;
  }
  body[data-theme="beige"]{
    --bg:#f7efdd; --bg2:#efe0c4; --panel:#fffdf4; --panel2:#f5e8cf;
    --text:#3b2a16; --muted:#7a6848; --accent:#a16207; --accent2:#8b5a2b; --ring:rgba(161,98,7,.42);
    --badge-bg:rgba(161,98,7,.13); --rank:#8b5a2b; --shadow:0 14px 34px rgba(90,60,20,.18);
    --link:#92400e; --ca:#7c2d12; --btntxt:#fffaf0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans Arabic",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2) 60%,var(--bg));
    color:var(--text); min-height:100vh; transition:background .5s,color .3s;
  }
  body[data-theme="beige"]{font-family:Georgia,"Songti SC","SimSun","Noto Serif SC",serif}

  header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:34px}
  .brand{font-weight:800;font-size:15px;letter-spacing:.12em}
  .brand .dot{color:var(--accent2)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px}
  .seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--ring);border-radius:999px;padding:4px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:var(--btntxt);font-weight:700}
  .hero{text-align:center;margin:8px 0 34px}
  h1{font-size:clamp(28px,5vw,46px);line-height:1.2;font-weight:900;letter-spacing:.01em}
  h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  body[data-theme="beige"] h1 .grad{-webkit-text-fill-color:var(--accent2)}
  .sub{margin-top:12px;font-size:clamp(15px,2vw,19px);color:var(--muted);font-weight:500}
  .lead{margin:16px auto 0;max-width:760px;font-size:14px;line-height:1.75;color:var(--muted)}
  h2.sec{display:flex;align-items:center;gap:12px;font-size:clamp(20px,3vw,27px);margin:10px 0 20px;font-weight:800}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(325px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--ring);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);backdrop-filter:blur(6px);transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .card .top{display:flex;align-items:center;gap:12px}
  .rank{font-size:26px;font-weight:900;color:var(--rank);min-width:44px;text-align:center;font-family:inherit}
  .dname{font-size:19px;font-weight:800;letter-spacing:.01em}
  .type{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:700;background:var(--badge-bg);color:var(--accent2);border:1px solid var(--ring);padding:2px 10px;border-radius:999px;margin-left:auto}
  .ddesc{font-size:13.5px;line-height:1.65;color:var(--muted);flex:1}
  .site{align-self:flex-start;font-size:13px;text-decoration:none;color:var(--link);font-weight:700;border-bottom:1px dashed var(--ring);padding-bottom:1px}
  .site:hover{color:var(--accent)}
  .note{background:var(--panel2);border:1px dashed var(--ring);border-radius:14px;padding:14px 16px;font-size:12.5px;line-height:1.7;color:var(--muted);margin-top:22px}
  /* EACO 区块 */
  .eaco{margin-top:46px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--ring);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow)}
  .eaco h2{font-size:clamp(21px,3vw,28px);font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:700;background:var(--badge-bg);color:var(--accent2);border:1px solid var(--ring);padding:3px 10px;border-radius:999px}
  .eaco p.desc{margin-top:12px;font-size:14px;line-height:1.8;color:var(--muted)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:18px}
  .kv .item{background:rgba(255,255,255,.04);border:1px solid var(--ring);border-radius:12px;padding:10px 12px;font-size:13px}
  body[data-theme="apple"] .kv .item,body[data-theme="beige"] .kv .item{background:var(--panel)}
  .kv .k{color:var(--muted);font-size:12px}
  .kv .v{font-weight:700;margin-top:3px;word-break:break-all}
  .kv .v.small{font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ca)}
  .ca-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ca-row button{border:1px solid var(--ring);background:var(--badge-bg);color:var(--accent2);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
  .ca-row button:hover{filter:brightness(1.15)}
  .links{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
  .links a{text-decoration:none;font-size:13px;font-weight:700;border:1px solid var(--ring);background:var(--badge-bg);color:var(--accent2);padding:7px 14px;border-radius:999px;transition:.2s}
  .links a:hover{background:var(--accent);color:var(--btntxt);transform:translateY(-1px)}
  .disc{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--ring);padding-top:14px}
  footer{margin-top:34px;text-align:center;font-size:13px;color:var(--muted);line-height:1.9}
  footer b{color:var(--accent2)}
  [dir="rtl"] .type{margin-left:0;margin-right:auto}
  [dir="rtl"] .kv .v{text-align:right}
  .swapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .swapcard{background:var(--panel);border:1px solid var(--ring);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
  .swapcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .swapcard .dname{font-size:17px;font-weight:800}
  .swapcard .addr{font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ca);background:rgba(255,255,255,.04);border:1px dashed var(--ring);border-radius:10px;padding:10px 12px;line-height:1.55;word-break:break-all}
  body[data-theme="apple"] .swapcard .addr,body[data-theme="beige"] .swapcard .addr{background:var(--panel)}
  .swapcard .go{align-self:flex-start;font-size:12.5px;text-decoration:none;color:var(--btntxt);font-weight:700;background:var(--accent);padding:5px 14px;border-radius:999px;transition:.2s}
  .swapcard .go:hover{background:var(--accent2)}
  .swapcard .ref{font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .swapcard .ref a{color:var(--link);text-decoration:none;border-bottom:1px dashed var(--ring)}
  .swapcard .ref a:hover{color:var(--accent)}
  @media(max-width:640px){.wrap{padding:18px 14px 50px}.toolbar{width:100%;justify-content:center}}
</style>

/* ---- 渲染 ---- */
var state = {lang:"zh", theme:"cosmic"};
(function(){
  var m = location.hash.match(/lang=([a-z]{2})/) || [];
  if(L[m[1]]) state.lang = m[1];
  var t = location.hash.match(/theme=(cosmic|apple|beige)/) || [];
  if(t[1]) state.theme = t[1];
  document.body.setAttribute("data-theme", state.theme);
})();
var $ = function(id){ return document.getElementById(id); };

function applyLang(){
  var t = L[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = (state.lang === "ar") ? "rtl" : "ltr";
  $("hTitle").innerHTML = '<span class="grad">' + t.h1a + '</span> ' + t.h1b;
  $("hSub").textContent = t.sub;
  $("hLead").textContent = t.lead;
  $("secTitle").textContent = t.sec;
  $("note").textContent = t.note;
  $("eacoTitle").innerHTML = t.eacoTitle + ' <span class="tag">$eaco · EACO</span>';
  $("eacoDesc").textContent = t.eacoDesc;
  $("eacoDisc").textContent = t.disc;
  $("footer").innerHTML = t.footer + '<br><b>eaco for earth</b> · <a class="site" href="https://linktr.ee/eacoearth" target="_blank" rel="noopener">linktr.ee/eacoearth</a>';

  /* KV */
  var kvHtml = "";
  t.kv.forEach(function(r){
    var v = r[1];
    if(r[0].indexOf("合约地址") > -1 || r[0].indexOf("Contract address") > -1 || r[0].indexOf("Adresse du contrat") > -1 || r[0].indexOf("Dirección del contrato") > -1 || r[0].indexOf("Адрес контракта") > -1 || r[0].indexOf("عنوان العقد") > -1){
      v = '<div class="ca-row"><span class="v small">' + CA + '</span><button id="copyBtn" type="button">' + t.copy + '</button></div>';
    }
    kvHtml += '<div class="item"><div class="k">' + r[0] + '</div><div class="v">' + v + '</div></div>';
  });
  $("eacoKv").innerHTML = kvHtml;
  var cb = $("copyBtn");
  if(cb){
    cb.onclick = function(){
      var ta = document.createElement("textarea");
      ta.value = CA; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      cb.textContent = t.copied;
      setTimeout(function(){ cb.textContent = t.copy; }, 1600);
    };
  }

  /* 官方链接 */
  var linkHtml = "";
  LINKS.forEach(function(l){
    linkHtml += '<a href="' + l.url + '" target="_blank" rel="noopener">' + l.label[state.lang] + '</a>';
  });
  $("eacoLinks").innerHTML = '<div class="links"></div>';
  var box = $("eacoLinks").querySelector(".links");
  /* 官方渠道标题 */
  var h = document.createElement("div");
  h.style.cssText = "font-size:13px;color:var(--muted);font-weight:700;margin-top:2px";
  h.textContent = t.official;
  box.parentNode.insertBefore(h, box);
  LINKS.forEach(function(l){
    var a = document.createElement("a");
    a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = l.label[state.lang];
    box.appendChild(a);
  });

  /* DEX 卡片 */
  var gridHtml = "";
  DEXS.forEach(function(d, i){
    gridHtml += '<div class="card"><div class="top"><span class="rank">' + (i+1) + '</span><span class="dname">' + d.name + '</span><span class="type">' + d.t[state.lang] + '</span></div><div class="ddesc">' + d.d[state.lang] + '</div><a class="site" href="' + d.site + '" target="_blank" rel="noopener">' + d.site.replace(/^https?:\/\/(www\.)?/, "") + '</a></div>';
  });
  $("dexGrid").innerHTML = gridHtml;

  /* Swap 直达区块 */
  var sT = SWAP_TEXT[state.lang];
  $("swapTitle").innerHTML = sT.swapTitle;
  $("swapDesc").textContent = sT.swapDesc;
  var swapHtml = "";
  SWAPS.forEach(function(d){
    swapHtml += '<div class="swapcard"><div class="dname">' + d.name + '</div><div class="addr">' + d.swap + '</div><a class="go" href="' + d.swap + '" target="_blank" rel="noopener">Go to Swap</a><div class="ref"><a href="' + d.orb + '" target="_blank" rel="noopener">' + sT.swapOrb + '</a><a href="' + d.scan + '" target="_blank" rel="noopener">' + sT.swapScan + '</a></div></div>';
  });
  $("swapGrid").innerHTML = swapHtml;
  $("swapDisc").textContent = sT.swapDisc;

  /* 语言按钮 */
  var langHtml = "";
  Object.keys(L).forEach(function(k){
    langHtml += '<button type="button" data-lang="' + k + '" class="' + (k === state.lang ? "on" : "") + '">' + L[k].lang + '</button>';
  });
  $("langBar").innerHTML = langHtml;

  /* 主题按钮 */
  var thHtml = "";
  THEMES.forEach(function(th){
    thHtml += '<button type="button" data-theme-btn="' + th.id + '" class="' + (th.id === state.theme ? "on" : "") + '">' + th.label[state.lang] + '</button>';
  });
  $("themeBar").innerHTML = thHtml;
  document.title = t.h1a + " " + t.h1b + " · EACO";
}

$("langBar").addEventListener("click", function(e){
  var b = e.target.closest("button[data-lang]");
  if(!b) return;
  state.lang = b.getAttribute("data-lang");
  applyLang();
});
$("themeBar").addEventListener("click", function(e){
  var b = e.target.closest("button[data-theme-btn]");
  if(!b) return;
  state.theme = b.getAttribute("data-theme-btn");
  document.body.setAttribute("data-theme", state.theme);
  applyLang();
});
window.addEventListener("hashchange", function(){
  var m = location.hash.match(/lang=([a-z]{2})/) || [];
  if(L[m[1]]) state.lang = m[1];
  var t = location.hash.match(/theme=(cosmic|apple|beige)/) || [];
  if(t[1]) state.theme = t[1];
  document.body.setAttribute("data-theme", state.theme);
  applyLang();
});
applyLang();
})();
</script>
