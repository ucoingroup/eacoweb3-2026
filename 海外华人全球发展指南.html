<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外华人全球发展指南 | Global Chinese Development Guide</title>
<style>
  :root{
    --paper:#FAF8F5;
    --paper2:#F2EEE6;
    --ink:#233B4D;
    --slate:#4A6B7A;
    --cinnabar:#B35340;
    --sage:#7A9B7E;
    --line:#E3DCD0;
    --muted:#7C8689;
    --serif:Georgia,"Times New Roman","Songti SC","SimSun","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(rgba(35,59,77,.028) 1px,transparent 1px);
    background-size:22px 22px;
    line-height:1.75;
    font-size:16px;
  }
  a{color:var(--slate);text-decoration:none}
  a:hover{color:var(--cinnabar)}
  .wrap{max-width:1060px;margin:0 auto;padding:0 28px}

  /* 语言切换 */
  .langbar{
    position:fixed;top:16px;right:20px;z-index:50;
    display:flex;gap:4px;background:rgba(250,248,245,.92);
    border:1px solid var(--line);border-radius:999px;padding:3px;
    box-shadow:0 2px 10px rgba(35,59,77,.08);
    backdrop-filter:blur(4px);
  }
  .langbar button{
    font-family:var(--sans);font-size:13px;letter-spacing:.5px;
    border:0;background:transparent;color:var(--slate);
    padding:5px 14px;border-radius:999px;cursor:pointer;transition:all .18s;
  }
  .langbar button.active{background:var(--ink);color:#fff}

  /* 报头 */
  .masthead{padding:84px 0 44px;text-align:center;position:relative}
  .kicker{
    font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--cinnabar);
    margin-bottom:18px;font-weight:600;
  }
  .masthead h1{
    font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,52px);
    color:var(--ink);line-height:1.18;letter-spacing:.02em;
  }
  .masthead .sub{
    font-family:var(--serif);font-style:italic;color:var(--slate);
    font-size:clamp(15px,2vw,19px);margin-top:14px;
  }
  .masthead .intro{
    max-width:720px;margin:26px auto 0;color:#465A68;font-size:15px;
  }
  .rule{
    width:86px;height:3px;background:var(--cinnabar);margin:30px auto 0;
    border-radius:2px;position:relative;
  }
  .rule::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);top:8px;
    width:160px;height:1px;background:var(--line);
  }

  /* 导航 */
  .toc{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin:34px 0 0;padding:18px 0;
  }
  .toc ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px}
  .toc a{
    display:inline-block;font-size:13.5px;color:var(--slate);
    border:1px solid var(--line);background:var(--paper2);
    padding:4px 14px;border-radius:999px;transition:all .15s;
  }
  .toc a:hover{border-color:var(--sage);color:var(--ink);background:#fff}

  /* 章节 */
  section.block{padding:58px 0 8px;border-top:1px solid var(--line);margin-top:6px}
  .sec-head{display:flex;align-items:baseline;gap:18px;margin-bottom:8px}
  .secnum{
    font-family:var(--serif);font-size:52px;line-height:1;color:var(--cinnabar);
    min-width:64px;text-align:right;user-select:none;
  }
  .sec-title{font-family:var(--serif);font-size:clamp(22px,3vw,30px);color:var(--ink);font-weight:700}
  .sec-ensub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14.5px;margin-bottom:22px;margin-left:82px}
  .lead{
    font-size:15.5px;color:#40525F;max-width:820px;margin:0 0 24px 82px;
  }
  h3{
    font-family:var(--serif);font-size:19px;color:var(--slate);
    margin:34px 0 12px;display:flex;align-items:center;gap:10px;
  }
  h3::before{content:"";width:22px;height:3px;background:var(--sage);border-radius:2px;flex:none}

  blockquote{
    margin:20px 0 24px 82px;padding:16px 20px 14px;background:var(--paper2);
    border-left:4px solid var(--cinnabar);border-radius:0 6px 6px 0;
    font-size:14.5px;color:#4A5B66;
  }
  blockquote p{margin:4px 0}
  blockquote strong{color:var(--ink)}
  .note-flag{color:var(--cinnabar);font-weight:600}

  /* 表格 */
  .tblwrap{overflow-x:auto;margin:6px 0 8px;border-radius:8px;box-shadow:0 1px 0 rgba(35,59,77,.04)}
  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
  thead th{
    background:var(--ink);color:#F6F1E8;text-align:left;
    padding:11px 13px;font-weight:600;letter-spacing:.02em;font-size:13.5px;white-space:nowrap;
  }
  tbody td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;color:#3A4B58}
  tbody tr:nth-child(even){background:var(--paper)}
  tbody tr:hover{background:#F7F1E6}
  td .tick{color:var(--sage);font-weight:700}
  td .warn{color:var(--cinnabar);font-weight:700}
  td code, code.addr{
    font-family:Consolas,Menlo,monospace;font-size:12.5px;background:var(--paper2);
    padding:2px 6px;border-radius:4px;border:1px solid var(--line);word-break:break-all;color:var(--ink);
  }
  .tbl-cap{font-size:13px;color:var(--muted);margin:2px 0 18px;font-style:italic}

  /* 列表与卡片 */
  ul.lst{margin:8px 0 18px 82px;list-style:none}
  ul.lst li{position:relative;padding-left:22px;margin:9px 0;font-size:15px;color:#3A4B58}
  ul.lst li::before{content:"";position:absolute;left:4px;top:10px;width:7px;height:7px;background:var(--sage);border-radius:2px;transform:rotate(45deg)}
  ol.lst{margin:8px 0 18px 96px}
  ol.lst li{margin:7px 0;font-size:15px;color:#3A4B58}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:14px 0 22px 82px}
  .card{
    background:#fff;border:1px solid var(--line);border-top:3px solid var(--sage);
    padding:16px 18px;border-radius:8px;
  }
  .card .ct{font-weight:700;color:var(--ink);margin-bottom:6px;font-size:15px}
  .card .cd{font-size:13.5px;color:#4A5B66}
  .card.ci{border-top-color:var(--cinnabar)}
  .card.cs{border-top-color:var(--slate)}

  .pill{
    display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;
    padding:2px 10px;border-radius:999px;margin:0 4px 4px 0;
  }
  .pill.sg{background:#EAF0E6;color:#4F6B4F}
  .pill.sl{background:#E7EDF0;color:var(--slate)}
  .pill.ci{background:#F5E6E0;color:var(--cinnabar)}

  .notice{
    margin:26px 0 6px 82px;padding:15px 18px;background:#FBF3EC;border:1px solid #EACFBE;
    border-radius:8px;font-size:14px;color:#6B4A36;
  }

  /* 合同地址 */
  .addr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:14px 0 10px 82px}
  .addr-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .addr-card .an{font-weight:700;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .addr-card .an .tickd{width:9px;height:9px;border-radius:50%;background:var(--sage);display:inline-block}
  .addr-card .full{font-family:Consolas,Menlo,monospace;font-size:12.5px;margin-top:8px;color:var(--slate);word-break:break-all;line-height:1.6}

  footer{
    margin-top:70px;border-top:2px solid var(--ink);
    background:var(--ink);color:#D8D2C6;padding:34px 0 44px;font-size:13.5px;
  }
  footer .wrap{display:flex;flex-direction:column;gap:8px}
  footer .frow{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
  footer strong{color:#fff}
  footer .disc{color:#AEB3AF;font-size:12.5px;line-height:1.7}
  .totop{position:fixed;bottom:24px;right:24px;z-index:40}
  .totop a{
    display:block;width:42px;height:42px;line-height:40px;text-align:center;
    background:var(--cinnabar);color:#fff;border-radius:50%;font-size:20px;
    box-shadow:0 4px 14px rgba(179,83,64,.35);font-family:var(--serif);
  }

  @media (max-width:720px){
    .masthead{padding:72px 0 30px}
    .secnum{font-size:40px;min-width:44px}
    .sec-ensub,.lead,blockquote,ul.lst,.grid3,.notice,.addr-grid{margin-left:0}
    ol.lst{margin-left:28px}
    .langbar{top:12px;right:12px}
    body{font-size:15px}
  }
  @media print{
    .langbar,.totop{display:none}
    body{background:#fff}
  }
</style>
</head>

          ["\u751f\u6d3b\u6c34\u5e73\u5206\u5c42","Livelihood / Living Standard Tiers"],
          ["\u65b9\u821f\u57ce\u5e02\u7f51","Multi-City Ark Network (MCAN)"],
          ["\u591a\u951a\u5206\u5c42\u7a33\u5b9a","Multi-Anchored Layered Stability (MALS)"],

        top:"Back to top"
      }
    }
  };

  var S = { lang:"zh" };

  /* ========== small helpers ========== */
  function esc(s){return String(s);}
  function secHead(d){
    return '<div class="sec-head"><span class="secnum">'+d.num+'</span><div><h2 class="sec-title">'+esc(d.title)+'</h2></div></div>'+
           '<p class="sec-ensub">'+esc(d.ensub)+'</p>';
  }
  function lead(d, hasLead){
    return hasLead ? '<p class="lead">'+esc(d.lead)+'</p>' : '';
  }
  function table(heads, rows){
    var h = '<thead><tr>'+rows.length?'' :'';
    h = '<thead><tr>';
    for(var i=0;i<heads.length;i++){ h += '<th>'+esc(heads[i])+'</th>'; }
    h += '</tr></thead><tbody>';
    for(var r=0;r<rows.length;r++){
      h += '<tr>';
      for(var c=0;c<rows[r].length;c++){ h += '<td>'+rows[r][c]+'</td>'; }
      h += '</tr>';
    }
    h += '</tbody>';
    return '<div class="tblwrap"><table>'+h+'</table></div>';
  }
  function ul(items){ var s='<ul class="lst">'; for(var i=0;i<items.length;i++){s+='<li>'+esc(items[i])+'</li>';} return s+'</ul>'; }
  function ol(items){ var s='<ol class="lst">'; for(var i=0;i<items.length;i++){s+='<li>'+esc(items[i])+'</li>';} return s+'</ol>'; }

  /* ========== section renderers ========== */
  function renderS1(d){
    var s = d.s1;
    var html = '<section class="block" id="sec1">';
    html += secHead(s) + lead(s, true);
    html += '<h3>'+esc(s.rTitle)+'</h3>';
    html += table(["政权 / 政体（Polity）","时间（Period）","地点（Location）","建立者（Founder）","性质与说明（Nature & Notes）"], s.regimes);
    html += '<blockquote><p class="note-flag">'+s.rNote+'</p></blockquote>';
    html += '<h3>'+esc(s.cTitle)+'</h3>';
    html += table(["城市 / 地区（City / Area）","历史与地位（History & Status）"], s.chinatowns);
    html += '<h3>'+esc(s.lTitle)+'</h3>';
    html += ul(s.lessons);
    html += '</section>';
    return html;
  }

  function renderS2(d){
    var s = d.s2;
    var html = '<section class="block" id="sec2">';
    html += secHead(s) + lead(s, true);
    html += '<blockquote><p>'+esc(s.dims)+'</p></blockquote>';
    for(var i=0;i<s.tiers.length;i++){
      html += '<h3>'+esc(s.tiers[i].t)+'</h3>';
      html += table(s.tiers[i].head, s.tiers[i].rows);
    }
    html += '<h3>'+esc(s.aTitle)+'</h3>';
    html += table(["人群（Profile）","推荐（Recommended）"], s.advice);
    html += '</section>';
    return html;
  }

  function renderS3(d){
    var s = d.s3;
    var html = '<section class="block" id="sec3">';
    html += secHead(s) + lead(s, true);
    html += '<h3>'+esc(s.method ? '3.1 Methodology \u00b7 \u5148\u6821\u51c6\u518d\u5bf9\u53f7' : '')+'</h3>';
    if(s.method) html += ol(s.method);
    html += '<h3>'+esc(s.threeTitle)+'</h3>';
    html += '<div class="tblwrap"><table><thead><tr><th>\u5c42\u7ea7</th><th>\u753b\u50cf</th><th>\u5e94\u5bf9\u7b56\u7565</th></tr></thead><tbody>';
    for(var i=0;i<s.three.length;i++){
      html += '<tr>';
      html += '<td><span class="pill '+(i===0?'ci':(i===1?'sl':'sg'))+'">'+esc(s.three[i][0])+'</span></td>';
      html += '<td>'+esc(s.three[i][1])+'</td><td>'+esc(s.three[i][2])+'</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    html += '<h3>'+esc(s.fiveTitle)+'</h3>';
    html += table(["\u5c42\u7ea7","\u5bb6\u5ead\u5e74\u53ef\u652f\u914d\u6536\u5165\uff08\u7b49\u503cUSD\uff09","\u753b\u50cf","\u5e94\u5bf9"], s.five);
    html += '<h3>'+esc(s.tenTitle)+'</h3>';
    html += table(["\u6321\u4f4d","\u5e74\u6536\u5165\uff08USD\uff09","\u51c0\u8d44\u4ea7\u53c2\u8003","\u5b9a\u4e49","\u5e94\u5bf9\u91cd\u70b9"], s.ten);
    html += '<blockquote><p>'+esc(s.tenNote)+'</p></blockquote>';
    html += '<h3>'+esc(s.fourTitle)+'</h3>';
    html += ol(s.principles);
    html += '</section>';
    return html;
  }

  function renderS4(d){
    var s = d.s4;
    var html = '<section class="block" id="sec4">';
    html += secHead(s) + lead(s, true);
    html += '<h3>'+esc(s.threatsTitle)+'</h3>';
    html += ul(s.threats);
    html += '<h3>'+esc(s.pillarsTitle)+'</h3>';
    html += table(["\u652f\u67f1","\u5185\u5bb9","\u843d\u5730\u65b9\u5f0f"], s.pillars);
    html += '<h3>'+esc(s.mcanTitle)+'</h3>';
    html += ul(s.mcan);
    html += '<blockquote><p><strong>'+esc(s.mcanPrinciple)+'</strong></p></blockquote>';
    html += '<h3>'+esc(s.spaceTitle)+'</h3>';
    html += ul(s.space);
    html += '</section>';
    return html;
  }

  function renderS5(d){
    var s = d.s5;
    var html = '<section class="block" id="sec5">';
    html += secHead(s) + lead(s, false);
    html += '<div class="notice">'+esc(s.note)+'</div>';
    html += '<h3>'+esc(s.assetsTitle)+'</h3>';
    html += '<div class="tblwrap"><table><thead><tr><th>\u8d44\u4ea7</th><th>\u5728\u5168\u7403\u7f51\u7edc\u7ecf\u6d4e\u7a33\u5b9a\u4e2d\u7684\u89d2\u8272</th></tr></thead><tbody>';
    for(var i=0;i<s.assets.length;i++){
      html += '<tr><td><strong>'+esc(s.assets[i][0])+'</strong></td><td>'+esc(s.assets[i][1])+'</td></tr>';
    }
    html += '</tbody></table></div>';
    html += '<h3>'+esc(s.malsTitle)+'</h3>';
    html += '<blockquote><p>'+esc(s.malsGoal)+'</p></blockquote>';
    html += '<div class="tblwrap"><table><thead><tr><th>\u5c42\uff08Layer\uff09</th><th>\u6838\u5fc3\u80fd\u529b</th><th>\u673a\u5236</th></tr></thead><tbody>';
    for(var j=0;j<s.mals.length;j++){
      html += '<tr><td><strong>'+esc(s.mals[j][0])+'</strong></td><td>'+esc(s.mals[j][1])+'</td><td>'+esc(s.mals[j][2])+'</td></tr>';
    }
    html += '</tbody></table></div>';
    html += '<h3>'+esc(s.pathsTitle)+'</h3>';
    html += ol(s.paths);
    html += '<h3>'+esc(s.risksTitle)+'</h3>';
    html += ul(s.risks);
    html += '</section>';
    return html;
  }

  function renderS6(d){
    var s = d.s6;
    var html = '<section class="block" id="sec6">';
    html += secHead(s) + lead(s, true);
    html += '<h3>'+esc(s.whyTitle)+'</h3>';
    html += ul(s.why);
    html += '<h3>'+esc(s.citiesTitle)+'</h3>';
    html += table(["\u6392\u540d","\u57ce\u5e02 / \u5730\u533a","\u6240\u5728\u6d32","\u6838\u5fc3\u4fe1\u53f7\uff08\u89c2\u6d4b\u4f9d\u636e\uff09"], s.cities);
    html += '<blockquote><p><span class="pill sg">Watchlist / \u5907\u9009</span> '+esc(s.altList)+'</p></blockquote>';
    html += '<h3>'+esc(s.diffTitle)+'</h3>';
    var cards = '<div class="grid3">';
    for(var i=0;i<s.diff.length;i++){
      cards += '<div class="card '+(i===0?'ci':(i===1?'cs':'sg'))+'"><div class="ct">'+esc(s.diff[i][0])+'</div><div class="cd">'+esc(s.diff[i][1])+'<br><br><strong>'+esc(s.diff[i][2])+'</strong></div></div>';
    }
    cards += '</div>';
    html += cards;
    html += '<h3>'+esc(s.echoTitle)+'</h3>';
    html += ul(s.echo);
    html += '</section>';
    return html;
  }

  function renderS7(d){
    var s = d.s7;
    var html = '<section class="block" id="sec7">';
    html += secHead(s) + lead(s, true);
    html += '<h3>'+esc(s.timelineTitle)+'</h3>';
    html += table(["\u65f6\u95f4","\u4e8b\u4ef6"], s.timeline);
    html += '<h3>'+esc(s.devalTitle)+'</h3>';
    html += ul(s.deval);
    html += '<h3>'+esc(s.rootsTitle)+'</h3>';
    html += ol(s.roots);
    html += '<blockquote><p><strong>'+esc(s.cmpTitle)+'</strong></p></blockquote>';
    html += table(s.cmp, s.cmpRows);
    html += '<h3>'+esc(s.transTitle)+'</h3>';
    html += ol(s.trans);
    html += '<h3>'+esc(s.assetsTitle)+'</h3>';
    html += '<div class="tblwrap"><table><thead><tr><th>\u8d44\u4ea7</th><th>\u5371\u673a\u671f\u804c\u80fd</th></tr></thead><tbody>';
    for(var a=0;a<s.assets.length;a++){
      html += '<tr><td><strong>'+esc(s.assets[a][0])+'</strong></td><td>'+esc(s.assets[a][1])+'</td></tr>';
    }
    html += '</tbody></table></div>';
    html += '<h3>'+esc(s.anchorTitle)+'</h3>';
    html += ul(s.anchor);
    html += '<h3>'+esc(s.ladderTitle)+'</h3>';
    html += '<blockquote><p>'+esc(s.ladderNote)+'</p></blockquote>';
    for(var L=0;L<s.ladder.length;L++){
      html += '<h4 style="font-family:var(--serif);font-size:16px;color:var(--ink);margin:16px 0 4px;">'+esc(s.ladder[L][0])+'</h4>';
      html += '<p style="font-size:14.5px;color:#3A4B58;margin:0 0 14px;">'+esc(s.ladder[L][1])+'</p>';
    }
    html += '<h3>'+esc(s.drillTitle)+'</h3>';
    for(var D=0;D<s.drill.length;D++){
      html += '<h4 style="font-family:var(--serif);font-size:16px;color:var(--slate);margin:18px 0 4px;">'+esc(s.drill[D][0])+'</h4>';
      html += ul(s.drill[D][1]);
    }
    html += '<h3>'+esc(s.risksTitle)+'</h3>';
    html += ol(s.risks);
    html += '</section>';
    return html;
  }

  function renderS8(d){
    var s = d.s8;
    var html = '<section class="block" id="sec8">';
    html += secHead(s) + lead(s, false);
    html += '<h3>'+esc(s.caTitle)+'</h3>';
    html += '<div class="addr-grid">';
    for(var i=0;i<s.contracts.length;i++){
      html += '<div class="addr-card">';
      html += '<div class="an"><span class="tickd"></span>'+esc(s.contracts[i][0])+' <span style="font-size:12px;color:var(--muted)">'+esc(s.contracts[i][1])+'</span></div>';
      html += '<div class="full" style="margin-top:10px;font-weight:700;color:var(--ink)">'+esc(s.contracts[i][2])+'</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<blockquote><p>'+esc(s.caNote)+'</p></blockquote>';
    html += '<h3>'+esc(s.glTitle)+'</h3>';
    html += '<div class="tblwrap"><table><thead><tr><th>\u534e\u8bed</th><th>English</th></tr></thead><tbody>';
    for(var g=0;g<s.glossary.length;g++){ html += '<tr><td>'+s.glossary[g][0]+'</td><td>'+s.glossary[g][1]+'</td></tr>'; }
    html += '</tbody></table></div>';
    html += '<h3>'+esc(s.refTitle)+'</h3>';
    html += ol(s.refs);
    html += '</section>';
    return html;
  }

  /* ========== master render ========== */
  function render(){
    var d = DATA[S.lang];
    document.documentElement.lang = (S.lang==='zh') ? 'zh-CN' : 'en';
    document.title = d.docTitle;

    var mh = document.getElementById("masthead");
    mh.innerHTML = '<div class="kicker">'+esc(d.kicker)+'</div>'+
      '<h1>'+esc(d.h1)+'</h1>'+
      '<p class="sub">'+esc(d.sub)+'</p>'+
      '<p class="intro">'+esc(d.intro)+'</p>'+
      '<div class="rule"></div>';

    var nav = document.getElementById("toc");
    var ul = '<ul>';
    for(var i=0;i<d.nav.length;i++){ ul += '<li><a href="'+d.nav[i][0]+'">'+esc(d.nav[i][1])+'</a></li>'; }
    nav.innerHTML = ul + '</ul>';

    var c = document.getElementById("content");
    c.innerHTML = renderS1(d) + renderS2(d) + renderS3(d) + renderS4(d) + renderS5(d) + renderS6(d) + renderS7(d) + renderS8(d);

    var f = document.getElementById("foot");
    f.innerHTML = '<div class="wrap">'+
      '<div class="frow"><strong>'+esc(d.h1)+'</strong><span>'+esc(d.foot.ver)+'</span></div>'+
      '<div class="frow"><span>'+esc(d.foot.made)+'</span></div>'+
      '<p class="disc">'+esc(d.foot.disc)+'</p>'+
      '</div>';

    var btns = document.querySelectorAll("#langbar button");
    for(var b=0;b<btns.length;b++){
      btns[b].className = (btns[b].getAttribute("data-lang")===S.lang) ? "active" : "";
    }
  }

  /* ========== language switch (in-memory state) ========== */
  var bar = document.getElementById("langbar");
  bar.addEventListener("click", function(ev){
    var btn = ev.target;
    if(!btn || btn.tagName !== "BUTTON") return;
    var l = btn.getAttribute("data-lang");
    if(l && l !== S.lang){ S.lang = l; render(); }
  });

  S.lang = "zh";
  render();
})();
</script>
</body>
