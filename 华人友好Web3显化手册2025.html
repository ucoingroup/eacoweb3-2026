<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球友好城市 × 两亿美元显化 | Global Cities & Manifestation</title>
<style>
  :root{
    --font-main: "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --font-serif: "Songti SC","SimSun","Noto Serif SC",Georgia,serif;
    --radius:14px;
    --shadow:0 6px 24px rgba(0,0,0,.08);
    --maxw:1080px;
  }
  /* ========== 三套主题 ========== */
  body.theme-apple{ /* 苹果绿 */
    --bg:#f2f9f1; --panel:#ffffff; --panel2:#e8f5e4;
    --text:#1d3a1a; --muted:#5c7a58; --accent:#3d9a3d; --accent2:#7cc47c;
    --star:#e8a33d; --border:#cfe8cc;
    --grad:linear-gradient(135deg,#3d9a3d,#7cc47c);
  }
  body.theme-tech{ /* 科技蓝 */
    --bg:#0d1526; --panel:#141f38; --panel2:#1a2a4a;
    --text:#e6efff; --muted:#8aa4cf; --accent:#3d8bff; --accent2:#00e5ff;
    --star:#ffc94d; --border:#24365e;
    --grad:linear-gradient(135deg,#3d8bff,#00e5ff);
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  body.theme-beige{ /* 米黄古典 */
    --bg:#f5efe0; --panel:#fdf9ef; --panel2:#f0e6cf;
    --text:#4a3b23; --muted:#8a7a5c; --accent:#a67c2e; --accent2:#c9a45c;
    --star:#b05a2a; --border:#e2d5b8;
    --font-main:var(--font-serif);
    --grad:linear-gradient(135deg,#a67c2e,#c9a45c);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font-main); background:var(--bg); color:var(--text);
    line-height:1.7; transition:background .4s,color .4s; min-height:100vh;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:24px 20px 80px;}

  /* 顶部控制栏 */
  .topbar{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
    background:var(--bg);
    background:color-mix(in srgb,var(--bg) 85%,transparent);
    border-bottom:1px solid var(--border);margin:-24px -20px 24px;padding:12px 20px;
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  }
  .brand{font-weight:700;font-size:15px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;}
  .seg button{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    padding:6px 14px;font-size:13px;font-family:inherit;transition:.25s;
  }
  .seg button.active{background:var(--grad);color:#fff;}
  .swatch{display:flex;gap:8px;}
  .dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s;}
  .dot.active{border-color:var(--text);transform:scale(1.15);}
  .dot.apple{background:linear-gradient(135deg,#3d9a3d,#7cc47c);}
  .dot.tech{background:linear-gradient(135deg,#3d8bff,#00e5ff);}
  .dot.beige{background:linear-gradient(135deg,#a67c2e,#f0e6cf);}

  /* Hero */
  .hero{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:44px 36px;text-align:center;margin-bottom:36px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;background:var(--grad);opacity:.07;pointer-events:none;
  }
  .hero h1{font-size:clamp(24px,4vw,38px);line-height:1.3;margin-bottom:12px;position:relative;}
  .hero .sub{color:var(--muted);font-size:15px;max-width:640px;margin:0 auto 20px;position:relative;}
  .money{
    display:inline-flex;flex-direction:column;gap:4px;margin:10px auto;position:relative;
  }
  .money .big{
    font-size:clamp(30px,5vw,46px);font-weight:800;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .money .note{color:var(--muted);font-size:13px;}
  .pillrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative;}
  .pill{
    border:1px solid var(--border);background:var(--panel2);border-radius:999px;
    padding:5px 16px;font-size:13px;color:var(--muted);
  }

  /* 区块 */
  h2.sec{
    font-size:22px;margin:44px 0 6px;display:flex;align-items:center;gap:10px;
  }
  h2.sec::after{content:"";flex:1;height:1px;background:var(--border);}
  .secdesc{color:var(--muted);font-size:14px;margin-bottom:18px;}

  /* 表格 */
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;}
  thead th{
    background:var(--panel2);text-align:left;padding:12px 14px;color:var(--muted);
    font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;
  }
  thead th:hover{color:var(--accent);}
  tbody td{padding:12px 14px;border-top:1px solid var(--border);}
  tbody tr:hover{background:var(--panel2);}
  .rank{
    display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff;background:var(--grad);
  }
  .stars{color:var(--star);letter-spacing:2px;white-space:nowrap;}
  .stars .off{opacity:.22;}

  /* 过滤 chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;
    padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.25s;
  }
  .chip.active{background:var(--grad);color:#fff;border-color:transparent;}

  /* 卡片（策略） */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);
  }
  .card h3{font-size:16px;margin-bottom:8px;display:flex;gap:8px;align-items:center;}
  .card p{font-size:14px;color:var(--muted);}
  .card .tag{font-size:12px;color:var(--accent);}

  /* 暗示语 */
  .affgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .aff{
    background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;gap:12px;
    box-shadow:var(--shadow);transition:transform .2s;cursor:pointer;
  }
  .aff:hover{transform:translateY(-3px);}
  .aff .num{
    font-weight:800;font-size:18px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex-shrink:0;
  }
  .aff.copied{border-left-color:var(--accent2);}

  /* ===== EACO 模块 ===== */
  .eacocard{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:26px;display:grid;gap:16px;
  }
  .formula{
    font-size:clamp(14px,2.1vw,19px);font-weight:700;text-align:center;line-height:1.6;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .badge{
    border:1px solid var(--border);background:var(--panel2);border-radius:999px;
    padding:6px 14px;font-size:12.5px;color:var(--muted);
  }
  .badge strong{color:var(--accent);}
  .ca{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:12px 16px;
  }
  .ca .lbl{font-size:12px;color:var(--muted);}
  .ca code{
    font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12.5px;
    word-break:break-all;color:var(--text);flex:1;min-width:200px;
  }
  .ca button{
    border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:999px;padding:5px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  .ca button:hover{background:var(--accent);color:#fff;}

  .allocbar{
    display:flex;height:28px;border-radius:8px;overflow:hidden;margin:16px 0 8px;border:1px solid var(--border);
  }
  .allocbar span{
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;
  }
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;}
  .sumrow td{background:var(--panel2);font-weight:700;}
  .tier{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);white-space:nowrap;}

  .duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
  .panel-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow);border-top:4px solid var(--accent);
  }
  .panel-card h3{font-size:18px;margin-bottom:4px;}
  .panel-card .kw{font-size:12.5px;color:var(--accent);margin-bottom:12px;letter-spacing:.5px;}
  .panel-card ul{list-style:none;display:grid;gap:7px;}
  .panel-card li{font-size:14px;color:var(--muted);}
  .panel-card .core{
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);
    font-size:14px;font-style:italic;color:var(--text);
  }
  .path{
    text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px;
    background:var(--panel2);border:1px dashed var(--border);border-radius:999px;padding:10px 16px;
  }
  .linkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .linkgroup{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .linkgroup h4{font-size:14px;margin-bottom:10px;color:var(--accent);letter-spacing:.5px;}
  .linkgroup a{
    display:block;font-size:13px;color:var(--text);text-decoration:none;
    padding:6px 0;border-bottom:1px dashed var(--border);word-break:break-all;transition:.2s;
  }
  .linkgroup a:hover{color:var(--accent);padding-left:4px;}
  .linkgroup a span{display:block;font-size:11px;color:var(--muted);}

  /* 朗读控制 */
  .playbar{
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0;
    background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:14px 18px;
  }
  .btn{
    border:none;background:var(--grad);color:#fff;border-radius:999px;padding:9px 22px;
    font-size:14px;cursor:pointer;font-family:inherit;transition:.25s;
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .playbar .hint{color:var(--muted);font-size:13px;}

  /* 模式切换（正文/冥想） */
  .mode-note{color:var(--muted);font-size:13px;margin-bottom:10px;}

  footer{
    margin-top:60px;padding-top:24px;border-top:1px solid var(--border);
    color:var(--muted);font-size:13px;text-align:center;
  }
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--text);color:var(--bg);padding:10px 24px;border-radius:999px;font-size:14px;
    opacity:0;transition:.35s;z-index:99;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:600px){ .hero{padding:30px 20px;} }
</style>
</head>

/* ================== 状态 ================== */
let lang = "zh";
let filter = "all";
let sortKey = null, sortAsc = true;

const $ = id => document.getElementById(id);
const stars = n => "★".repeat(n) + `<span class="off">${"★".repeat(5-n)}</span>`;

/* ================== 渲染 ================== */
function renderStatic(){
  const T = DATA[lang];
  document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  $("brandTitle").textContent = T.brand;
  $("heroTitle").innerHTML = T.heroTitle.replace(/\n/g,"<br>");
  $("heroSub").textContent = T.heroSub;
  $("moneyNote").textContent = T.moneyNote;
  $("pill1").textContent = T.pill1;
  $("pill2").textContent = T.pill2;
  $("pill3").textContent = T.pill3;
  $("sec1").textContent = T.sec1;
  $("sec1desc").textContent = T.sec1desc;
  $("thRank").textContent = T.thRank;
  $("thName").textContent = T.thName;
  $("thS1").textContent = T.thS1;
  $("thS2").textContent = T.thS2;
  $("thS3").textContent = T.thS3;
  $("thNote").textContent = T.thNote;
  $("sec2").textContent = T.sec2;
  $("sec2desc").textContent = T.sec2desc;
  $("sec3").textContent = T.sec3;
  $("sec3desc").textContent = T.sec3desc;
  $("btnPlayLabel").textContent = T.btnPlay;
  $("btnStopLabel").textContent = T.btnStop;
  $("playHint").textContent = T.playHint;
  $("footer").innerHTML = T.footer;
  // 策略卡片
  $("strategyCards").innerHTML = T.strategy.map(s=>
    `<div class="card"><h3>${s.t}</h3><p>${s.d}</p></div>`).join("");
  // 筛选芯片
  $("chips").innerHTML =
    `<span style="align-self:center;font-size:13px;color:var(--muted)">${T.chipsLabel}</span>` +
    [["all",T.chipAll],["s1",T.chipS1],["s2",T.chipS2],["s3",T.chipS3]]
    .map(([k,l])=>`<button class="chip ${filter===k?"active":""}" data-filter="${k}">${l}</button>`).join("");

  /* ===== EACO 模块文案 ===== */
  $("secEaco").textContent = T.secEaco;
  $("secEacoDesc").textContent = T.secEacoDesc;
  $("eacoFormula").textContent = T.eacoFormula;
  $("eacoBadges").innerHTML = T.eacoBadges.map(b=>`<span class="badge">${b}</span>`).join("");
  $("caLabel").textContent = T.caLabel;
  $("btnCopyCA").textContent = T.copyCA;

  $("secAlloc").textContent = T.secAlloc;
  $("secAllocDesc").textContent = T.secAllocDesc;
  $("thARank").textContent = T.thARank;
  $("thACity").textContent = T.thACity;
  $("thATier").textContent = T.thATier;
  $("thAAmount").textContent = T.thAAmount;
  $("thAShare").textContent = T.thAShare;
  $("allocNote").textContent = T.allocNote;
  $("secEarth").textContent = T.secEarth;
  $("secEarthDesc").textContent = T.secEarthDesc;
  $("earthPath").textContent = T.earthPath;
  $("secLinks").textContent = T.secLinks;
  $("secLinksDesc").textContent = T.secLinksDesc;

  renderCities();
  renderAffirmations();
  renderAlloc();
  renderEarth();
  renderLinks();
}

/* ===== 20 城配额 ===== */
const SUPPLY = 1350000000;
const TIERS = [
  {size:50000000, key:0}, {size:50000000, key:0}, {size:50000000, key:0}, {size:50000000, key:0}, {size:50000000, key:0},
  {size:40000000, key:1}, {size:40000000, key:1}, {size:40000000, key:1}, {size:40000000, key:1}, {size:40000000, key:1},
  {size:30000000, key:2}, {size:30000000, key:2}, {size:30000000, key:2}, {size:30000000, key:2}, {size:30000000, key:2},
  {size:20000000, key:3}, {size:20000000, key:3}, {size:20000000, key:3}, {size:20000000, key:3}, {size:20000000, key:3}
];
const RESERVE = [
  {v:200000000, color:"#7cc47c"},
  {v:250000000, color:"#3d8bff"},
  {v:200000000, color:"#c9a45c"}
];
const ALLOC_COLORS = ["#3d9a3d","#4aa84a","#5fb85f","#7cc47c"];

function fmt(n){ return n.toLocaleString(lang==="zh"?"en-US":"en-US"); }

function renderAlloc(){
  const T = DATA[lang];
  const allocated = TIERS.reduce((s,t)=>s+t.size,0);
  const body = $("allocBody");
  body.innerHTML = T.cities.map((c,i)=>{
    const t = TIERS[i];
    const pct = (t.size/SUPPLY*100).toFixed(2);
    return `<tr>
      <td><span class="rank" style="background:${ALLOC_COLORS[t.key]}">${i+1}</span></td>
      <td><strong>${c[0]}</strong></td>
      <td><span class="tier">${T.tiers[t.key]}</span></td>
      <td style="font-variant-numeric:tabular-nums">${fmt(t.size)}</td>
      <td style="color:var(--muted)">${pct}%</td>
    </tr>`;
  }).join("");
  const remain = SUPPLY - allocated;
  $("allocFoot").innerHTML = `<tr class="sumrow">
      <td colspan="3">${T.totalRow}</td>
      <td>${fmt(allocated)}</td>
      <td>${(allocated/SUPPLY*100).toFixed(2)}%</td>
    </tr>
    <tr class="sumrow">
      <td colspan="3">${T.remainRow}</td>
      <td>${fmt(remain)}</td>
      <td>${(remain/SUPPLY*100).toFixed(2)}%</td>
    </tr>`;

  // 堆叠条形图
  const segs = [
    {v:allocated, color:"#3d9a3d", label:(allocated/SUPPLY*100).toFixed(1)+"%"},
    ...RESERVE.map(r=>({v:r.v, color:r.color, label:(r.v/SUPPLY*100).toFixed(1)+"%"}))
  ];
  $("allocBar").innerHTML = segs.map(s=>
    `<span style="background:${s.color};width:${s.v/SUPPLY*100}%">${s.v/SUPPLY>0.12?s.label:""}</span>`).join("");
  $("allocLegend").innerHTML = T.legend.map((l,i)=>
    `<span><i style="background:${segs[i].color}"></i>${l}</span>`).join("");
}

/* ===== 虚拟地球 / 模拟地球 ===== */
function renderEarth(){
  const T = DATA[lang];
  $("earthDuo").innerHTML = T.earthPanels.map(p=>`
    <div class="panel-card">
      <h3>${p.t}</h3>
      <div class="kw">${p.kw}</div>
      <ul>${p.items.map(i=>`<li>${i}</li>`).join("")}</ul>
      <div class="core">${p.core}</div>
    </div>`).join("");
}

/* ===== 资料链接 ===== */
function renderLinks(){
  const T = DATA[lang];
  $("linkGrid").innerHTML = T.linkGroups.map(g=>`
    <div class="linkgroup">
      <h4>${g.h}</h4>
      ${g.links.map(l=>`<a href="${l[2]}" target="_blank" rel="noopener">${l[0]}<span>${l[1]}</span></a>`).join("")}
    </div>`).join("");
}

function renderCities(){
  const T = DATA[lang];
  const idxMap = {s1:2, s2:3, s3:4};
  let rows = T.cities.map((c,i)=>({i, c}));
  if(filter!=="all") rows = rows.filter(r=>r.c[idxMap[filter]]>=4);
  if(sortKey!==null){
    const col = sortKey===0 ? null : sortKey; // 0=rank列按原顺序
    rows.sort((a,b)=>{
      let va,vb;
      if(col===null){ va=a.i; vb=b.i; }
      else if(col===1){ va=a.c[0]; vb=b.c[0]; }
      else { va=a.c[col]; vb=b.c[col]; }
      return (va<vb?-1:va>vb?1:0)*(sortAsc?1:-1);
    });
  }
  const body = $("cityBody");
  if(!rows.length){
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">${T.filterEmpty}</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(({i,c})=>{
    const rank = i+1;
    const badge = rank<=5 ? `<span class="rank">${rank}</span>` : `<span class="rank" style="opacity:.55">${rank}</span>`;
    return `<tr>
      <td>${badge}</td>
      <td><strong>${c[0]}</strong></td>
      <td><span class="stars">${stars(c[2])}</span></td>
      <td><span class="stars">${stars(c[3])}</span></td>
      <td><span class="stars">${stars(c[4])}</span></td>
      <td style="color:var(--muted);font-size:13px">${c[5]}</td>
    </tr>`;
  }).join("");
}

function renderAffirmations(){
  const T = DATA[lang];
  $("affGrid").innerHTML = T.affirmations.map((a,i)=>
    `<div class="aff" data-i="${i}" title="${lang==="zh"?"点击复制":"Click to copy"}">
      <span class="num">${String(i+1).padStart(2,"0")}</span><span>${a}</span>
    </div>`).join("");
}

/* ================== 交互 ================== */
// 语言切换
$("langSeg").addEventListener("click", e=>{
  const btn = e.target.closest("button"); if(!btn) return;
  lang = btn.dataset.lang;
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("active", b===btn));
  renderStatic();
});
// 主题切换
$("themeSwatch").addEventListener("click", e=>{
  const dot = e.target.closest(".dot"); if(!dot) return;
  document.body.className = dot.dataset.theme;
  document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("active", d===dot));
});
// 筛选
$("chips").addEventListener("click", e=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  filter = chip.dataset.filter;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active", c===chip));
  renderCities();
});
// 排序
document.querySelectorAll("thead th").forEach((th,i)=>{
  th.addEventListener("click", ()=>{
    if(sortKey===i) sortAsc=!sortAsc; else { sortKey=i; sortAsc=true; }
    renderCities();
  });
});
// 复制暗示语
$("affGrid").addEventListener("click", e=>{
  const aff = e.target.closest(".aff"); if(!aff) return;
  const text = DATA[lang].affirmations[+aff.dataset.i];
  navigator.clipboard?.writeText(text).then(()=>{
    aff.classList.add("copied");
    const t=$("toast"); t.textContent=DATA[lang].copied; t.classList.add("show");
    setTimeout(()=>{t.classList.remove("show"); aff.classList.remove("copied");},1600);
  });
});
// 复制合约地址
$("btnCopyCA").addEventListener("click", ()=>{
  const ca = $("caValue").textContent.trim();
  const done = ()=>{
    const b = $("btnCopyCA");
    b.textContent = DATA[lang].copiedCA;
    const t=$("toast"); t.textContent=DATA[lang].copied; t.classList.add("show");
    setTimeout(()=>{ b.textContent = DATA[lang].copyCA; t.classList.remove("show"); }, 1700);
  };
  if(navigator.clipboard) navigator.clipboard.writeText(ca).then(done).catch(done);
  else done();
});

// TTS 朗读
let playing=false, queue=[], uIdx=0;
function playAll(){
  if(playing) return;
  playing=true; uIdx=0; queue=[...DATA[lang].affirmations];
  speakNext();
}
function speakNext(){
  if(uIdx>=queue.length || !window.speechSynthesis){ playing=false; return; }
  const u = new SpeechSynthesisUtterance(queue[uIdx]);
  u.lang = lang==="zh" ? "zh-CN" : "en-US";
  u.rate = 0.85;
  u.onend = ()=>{ uIdx++; speakNext(); };
  u.onerror = ()=>{ playing=false; };
  speechSynthesis.speak(u);
}
$("btnPlay").addEventListener("click", playAll);
$("btnStop").addEventListener("click", ()=>{
  speechSynthesis.cancel(); playing=false;
});

/* 初始化 */
renderStatic();
</script>
</body>
