ión tecnológica es el único camino de supervivencia.","ar":"ساعدت النار على البقاء في العصور الجليدية، والزراعة في المجاعات، والمضادات الحيوية في الأوبئة. أمام التهديدات الكونية المستقبلية، الابتكار التكنولوجي هو الطريق الوحيد للبقاء."}}],"warnings":[{"title":{"zh":"大灭绝的周期性规律","en":"Periodicity of Mass Extinctions","fr":"Périodicité des extinctions de masse","ru":"Периодичность массовых вымираний","es":"Periodicidad de las extinciones masivas","ar":"دورية الانقراضات الجماعية"},"desc":{"zh":"地球历史上约每2600-3000万年发生一次大灭绝，可能由小行星撞击或超级火山引发。星际文明必须建立行星防御系统。","en":"Earth experiences mass extinctions roughly every 26-30 million years, possibly from asteroid impacts or supervolcanoes. Interstellar civilization must build planetary defense systems.","fr":"La Terre connaît des extinctions de masse environ tous les 26-30 millions d'années, possiblement par impacts d'astéroïdes ou supervolcans. La civilisation interstellaire doit construire des systèmes de défense planétaire.","ru":"Земля переживает массовые вымирания примерно каждые 26-30 млн лет, возможно от астероидов или супервулканов. Межзвёздная цивилизация должна строить планетарную оборону.","es":"La Tierra experimenta extinciones masivas aproximadamente cada 26-30 millones de años, posiblemente por impactos de asteroides o supervolcanes. La civilización interestelar debe construir sistemas de defensa planetaria.","ar":"تشهد الأرض انقراضات جماعية تقريباً كل 26-30 مليون سنة، ربما باصطدامات الكويكبات أو البراكين العظمى. يجب أن تبني الحضارة بين النجوم أنظمة دفاع كوكبي."}},{"title":{"zh":"资源过度消耗的陷阱","en":"The Trap of Resource Overconsumption","fr":"Le piège de la surconsommation des ressources","ru":"Ловушка чрезмерного потребления ресурсов","es":"La trampa del sobreconsumo de recursos","ar":"فخ الإفراط في استهلاك الموارد"},"desc":{"zh":"复活节岛文明因砍光树木而崩溃，工业文明正消耗化石燃料数百万年的积累。任何文明若超出行星承载力都将自我毁灭。","en":"Easter Island civilization collapsed after cutting all trees; industrial civilization burns millions of years of fossil fuel accumulation. Any civilization exceeding planetary carrying capacity self-destructs.","fr":"La civilisation de l'île de Pâques s'est effondrée après avoir abattu tous les arbres; la civilisation industrielle brûle des millions d'années d'accumulation de combustibles fossiles. Toute civilisation dépassant la capacité de charge planétaire se détruit.","ru":"Цивилизация острова Пасхи рухнула, вырубив все деревья; индустриальная цивилизация сжигает миллионы лет накопления ископаемого. Превышение несущей способности планеты — самоуничтожение.","es":"La civilización de la Isla de Pascua colapsó tras talar todos los árboles; la civilización industrial quema millones de años de acumulación de combustibles fósiles. Cualquier civilización que exceda la capacidad de carga planetaria se autodestruye.","ar":"انهارت حضارة جزيرة الفصح بعد قطع جميع الأشجار؛ الحضارة الصناعية تحرق ملايين السنين من تراكم الوقود الأحفوري. أي حضارة تتجاوز القدرة الاستيعابية للكوكب تدمر نفسها."}},{"title":{"zh":"技术双刃剑效应","en":"Technology's Double-Edge Effect","fr":"L'effet double tranchant de la technologie","ru":"Эффект двойного лезвия технологий","es":"El efecto de doble filo de la tecnología","ar":"تأثير السيف ذو الحدين للتكنولوجيا"},"desc":{"zh":"核能可发电也可制造炸弹，AI可造福也可监控。技术力量越大，对使用者的道德和治理能力要求越高，否则将成为毁灭工具。","en":"Nuclear energy powers cities and builds bombs; AI benefits and surveils. Greater technological power demands higher moral and governance capacity from users, or it becomes a tool of destruction.","fr":"L'énergie nucléaire alimente les villes et construit des bombes; l'IA bénéficie et surveille. Plus la puissance technologique est grande, plus elle exige une capacité morale et de gouvernance élevée, sinon elle devient un outil de destruction.","ru":"Ядерная энергия питает города и строит бомбы; ИИ благотворит и следит. Чем больше мощность технологий, тем выше требования к морали и управлению.","es":"La energía nuclear alimenta ciudades y construye bombas; la IA beneficia y vigila. Cuanto mayor es el poder tecnológico, mayor capacidad moral y de gobernanza exige, de lo contrario se convierte en herramienta de destrucción.","ar":"الطاقة النووية تشغل المدن وتصنع القنابل؛ الذكاء الاصطناعي ينفع ويراقب. كلما زادت القوة التكنولوجية، ارتفعت متطلبات الأخلاق والحوكمة، وإلا أصبحت أداة للدمار."}},{"title":{"zh":"单行星文明的脆弱性","en":"Single-Planet Civilization Fragility","fr":"Fragilité de la civilisation à une seule planète","ru":"Хрупкость однопланетной цивилизации","es":"Fragilidad de la civilización de un solo planeta","ar":"هشاشة الحضارة أحادية الكوكب"},"desc":{"zh":"所有鸡蛋放在一个篮子里——小行星撞击、超级火山或核战争可以一次消灭地球文明。成为多行星物种是文明存续的必要保险。","en":"All eggs in one basket — an asteroid, supervolcano, or nuclear war could wipe out Earth civilization in one blow. Becoming a multi-planetary species is necessary insurance for civilizational survival.","fr":"Tous les œufs dans le même panier — un astéroïde, un supervolcan ou une guerre nucléaire pourrait anéantir la civilisation terrestre d'un seul coup. Devenir une espèce multi-planétaire est une assurance nécessaire pour la survie.","ru":"Все яйца в одной корзине — астероид, супервулкан или ядерная война могут уничтожить земную цивилизацию за один удар. Мультипланетарность — необходимая страховка.","es":"Todos los huevos en una sola canasta — un asteroide, un supervolcán o una guerra nuclear podrían aniquilar la civilización terrestre de un solo golpe. Convertirse en una especie multiplanetaria es un seguro necesario para la supervivencia.","ar":"كل البيض في سلة واحدة — كويكب أو بركان عظيم أو حرب نووية قد يبيد الحضارة الأرضية بضربة واحدة. أن نصبح نوعاً متعدد الكواكب هو تأمين ضروري للبقاء."}},{"title":{"zh":"文明崩溃的历史教训","en":"Historical Lessons of Civilizational Collapse","fr":"Leçons historiques de l'effondrement civilisationnel","ru":"Исторические уроки краха цивилизаций","es":"Lecciones históricas del colapso civilizatorio","ar":"دروس تاريخية لانهيار الحضارات"},"desc":{"zh":"玛雅、罗马、吴哥等文明都曾在鼎盛时期突然崩溃，原因惊人相似：环境退化、社会不平等和政治僵化。先进不等于永恒。","en":"Maya, Rome, and Angkor all collapsed at their peaks for strikingly similar reasons: environmental degradation, social inequality, and political rigidity. Advancement does not equal eternity.","fr":"Maya, Rome et Angkor se sont toutes effondrées à leur apogée pour des raisons similairement frappantes: dégradation environnementale, inégalité sociale et rigidité politique. L'avancement n'égale pas l'éternité.","ru":"Майя, Рим и Ангкор рухнули на пике по сходным причинам: деградация среды, социальное неравенство и политическая ригидность. Развитие ≠ вечность.","es":"Maya, Roma y Angkor colapsaron en su apogeo por razones sorprendentemente similares: degradación ambiental, desigualdad social y rigidez política. El avance no equivale a la eternidad.","ar":"المايا وروما وأنغكور انهارت كلها في ذروتها لأسباب متشابهة بشكل لافت: التدهور البيئي والتفاوت الاجتماعي والجمود السياسي. التقدم لا يساوي الخلود."}}]}};
const UI = {"zh":{"siteTitle":"地球文明编年史","siteSubtitle":"Earth Chronicle","heroTitle":"地球文明编年史：从诞生到星际","heroDesc":"46亿年地球史10个阶段，每阶段10件大事，以及对地球文明与星际宇宙文明的正面启示与警示","statStages":"阶段","statEvents":"大事","statInsights":"启示","statLangs":"语言","insightPositive":"正面启示","insightWarning":"警示","cosmicTitle":"对地球文明与星际宇宙文明的启示","searchPlaceholder":"搜索阶段、事件、启示...","footer":"地球文明编年史 | 46亿年10阶段"},"en":{"siteTitle":"Chronicle of Earth Civilization","siteSubtitle":"Earth Chronicle","heroTitle":"Chronicle of Earth Civilization: From Birth to Stars","heroDesc":"10 stages of 4.6 billion years, 10 pivotal events each, with positive insights and warnings for Earth and interstellar civilization","statStages":"Stages","statEvents":"Events","statInsights":"Insights","statLangs":"Languages","insightPositive":"Positive Insight","insightWarning":"Warning","cosmicTitle":"Insights for Earth & Interstellar Civilization","searchPlaceholder":"Search stages, events, insights...","footer":"Earth Chronicle | 4.6 billion years in 10 stages"},"fr":{"siteTitle":"Chronique de la civilisation terrestre","siteSubtitle":"Earth Chronicle","heroTitle":"Chronique de la civilisation terrestre: de la naissance aux étoiles","heroDesc":"10 étapes de 4,6 milliards d'années, 10 événements marquants par étape, avec des leçons positives et des avertissements pour la civilisation terrestre et interstellaire","statStages":"Étapes","statEvents":"Événements","statInsights":"Leçons","statLangs":"Langues","insightPositive":"Leçon positive","insightWarning":"Avertissement","cosmicTitle":"Leçons pour la civilisation terrestre et interstellaire","searchPlaceholder":"Rechercher étapes, événements, leçons...","footer":"Chronique de la civilisation terrestre | 4,6 milliards d'années en 10 étapes"},"ru":{"siteTitle":"Хроника земной цивилизации","siteSubtitle":"Earth Chronicle","heroTitle":"Хроника земной цивилизации: от рождения до звёзд","heroDesc":"10 этапов 4,6 млрд лет, по 10 ключевых событий, с позитивными уроками и предупреждениями для земной и межзвёздной цивилизации","statStages":"Этапы","statEvents":"События","statInsights":"Уроки","statLangs":"Языки","insightPositive":"Позитивный урок","insightWarning":"Предупреждение","cosmicTitle":"Уроки для земной и межзвёздной цивилизации","searchPlaceholder":"Поиск этапов, событий, уроков...","footer":"Хроника Земли | 4,6 млрд лет в 10 этапах"},"es":{"siteTitle":"Crónica de la civilización terrestre","siteSubtitle":"Earth Chronicle","heroTitle":"Crónica de la civilización terrestre: del nacimiento a las estrellas","heroDesc":"10 etapas de 4.600 millones de años, 10 eventos impactantes por etapa, con lecciones positivas y advertencias para la civilización terrestre e interestelar","statStages":"Etapas","statEvents":"Eventos","statInsights":"Lecciones","statLangs":"Idiomas","insightPositive":"Lección positiva","insightWarning":"Advertencia","cosmicTitle":"Lecciones para la civilización terrestre e interestelar","searchPlaceholder":"Buscar etapas, eventos, lecciones...","footer":"Crónica de la civilización terrestre | 4.600 millones de años en 10 etapas"},"ar":{"siteTitle":"سجل الحضارة الأرضية","siteSubtitle":"Earth Chronicle","heroTitle":"سجل الحضارة الأرضية: من الميلاد إلى النجوم","heroDesc":"10 مراحل من 4,6 مليار سنة، 10 أحداث مؤثرة لكل مرحلة، مع دروس إيجابية وتحذيرات للحضارة الأرضية وبين النجوم","statStages":"مراحل","statEvents":"أحداث","statInsights":"دروس","statLangs":"لغات","insightPositive":"درس إيجابي","insightWarning":"تحذير","cosmicTitle":"دروس للحضارة الأرضية وبين النجوم","searchPlaceholder":"ابحث عن المراحل والأحداث والدروس...","footer":"سجل الحضارة الأرضية | 4,6 مليار سنة في 10 مراحل"}};
const LANGS = ["zh","en","fr","ru","es","ar"];
const LANG_NAMES = {"zh":"中文","en":"EN","fr":"FR","ru":"RU","es":"ES","ar":"ع"};

let currentLang = 'zh';
let searchQuery = '';

function tl(obj) { return (obj && obj[currentLang]) || (obj && obj.en) || ''; }

function renderNav() {
  const ui = UI[currentLang];
  document.getElementById('nav-title').textContent = ui.siteTitle;
  document.getElementById('nav-subtitle').textContent = ui.siteSubtitle;
  document.getElementById('hero-title').textContent = ui.heroTitle;
  document.getElementById('hero-desc').textContent = ui.heroDesc;
  document.getElementById('stat-stages').textContent = ui.statStages;
  document.getElementById('stat-events').textContent = ui.statEvents;
  document.getElementById('stat-insights').textContent = ui.statInsights;
  document.getElementById('stat-langs').textContent = ui.statLangs;
  document.getElementById('cosmic-title').textContent = ui.cosmicTitle;
  document.getElementById('search-input').placeholder = ui.searchPlaceholder;
  document.getElementById('footer').textContent = ui.footer;
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
}

function renderLangSwitcher() {
  const c = document.getElementById('lang-switcher');
  c.innerHTML = LANGS.map(l =>
    '<button class="lang-btn ' + (l === currentLang ? 'active' : '') + '" onclick="switchLang(\'' + l + '\')">' + LANG_NAMES[l] + '</button>'
  ).join('');
}

function renderStages() {
  const container = document.getElementById('earth-content');
  const ui = UI[currentLang];
  let html = '<div class="earth-timeline">';
  let hasResults = false;

  DATA.stages.forEach((stage, si) => {
    const sTitle = tl(stage.title);
    const sEra = tl(stage.era);
    const matches = !searchQuery ||
      sTitle.toLowerCase().includes(searchQuery) ||
      sEra.toLowerCase().includes(searchQuery) ||
      stage.events.some(e => tl(e.title).toLowerCase().includes(searchQuery) || tl(e.desc).toLowerCase().includes(searchQuery));

    if (!matches) return;
    hasResults = true;

    html += '<div class="earth-stage fade-in">';
    html += '<div class="earth-stage-header">';
    html += '<div class="earth-stage-num">' + String(si+1).padStart(2,'0') + '</div>';
    html += '<div><div class="earth-stage-era">' + sEra + '</div>';
    html += '<div class="earth-stage-title">' + sTitle + '</div></div>';
    html += '</div><div class="earth-events">';

    stage.events.forEach((event, ei) => {
      const eTitle = tl(event.title);
      const eDesc = tl(event.desc);
      const eMatch = !searchQuery || eTitle.toLowerCase().includes(searchQuery) || eDesc.toLowerCase().includes(searchQuery);
      if (eMatch) {
        html += '<div class="earth-event">';
        html += '<div class="earth-event-num">' + (ei+1) + '</div>';
        html += '<div class="earth-event-body">';
        html += '<div class="earth-event-title">' + eTitle + '</div>';
        html += '<div class="earth-event-desc">' + eDesc + '</div>';
        html += '</div></div>';
      }
    });

    html += '</div><div class="earth-insights">';
    html += '<div class="earth-insight positive"><div class="earth-insight-label">' + ui.insightPositive + '</div>';
    html += '<div class="earth-insight-text">' + tl(stage.insight.positive) + '</div></div>';
    html += '<div class="earth-insight warning"><div class="earth-insight-label">' + ui.insightWarning + '</div>';
    html += '<div class="earth-insight-text">' + tl(stage.insight.warning) + '</div></div>';
    html += '</div></div>';
  });

  html += '</div>';

  if (!hasResults) {
    container.innerHTML = '<div class="no-results">No results found</div>';
  } else {
    container.innerHTML = html;
  }
}

function renderCosmic() {
  const container = document.getElementById('cosmic-grid');
  let html = '';

  DATA.cosmicInsights.positive.forEach(item => {
    const t = tl(item.title), d = tl(item.desc);
    const m = !searchQuery || t.toLowerCase().includes(searchQuery) || d.toLowerCase().includes(searchQuery);
    if (m) {
      html += '<div class="cosmic-card positive"><div class="cosmic-card-icon">\u2726</div>';
      html += '<div class="cosmic-card-title">' + t + '</div>';
      html += '<div class="cosmic-card-desc">' + d + '</div></div>';
    }
  });

  DATA.cosmicInsights.warnings.forEach(item => {
    const t = tl(item.title), d = tl(item.desc);
    const m = !searchQuery || t.toLowerCase().includes(searchQuery) || d.toLowerCase().includes(searchQuery);
    if (m) {
      html += '<div class="cosmic-card warning"><div class="cosmic-card-icon">\u26a0</div>';
      html += '<div class="cosmic-card-title">' + t + '</div>';
      html += '<div class="cosmic-card-desc">' + d + '</div></div>';
    }
  });

  container.innerHTML = html;
}

function switchLang(lang) {
  currentLang = lang;
  renderNav();
  renderLangSwitcher();
  renderStages();
  renderCosmic();
}

function handleSearch(value) {
  searchQuery = value.toLowerCase().trim();
  renderStages();
  renderCosmic();
}

document.getElementById('search-input').addEventListener('input', function(e) {
  handleSearch(e.target.value);
});

// Init
switchLang('zh');
</script>
</body>
</html>
