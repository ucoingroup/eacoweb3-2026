<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球文明编年史 | Chronicle of Earth Civilization</title>
<meta name="description" content="46亿年地球史10个阶段，每阶段10件大事，对地球文明与星际宇宙文明的正面启示与警示。6语言：中文/English/Français/Русский/Español/العربية">
<style>
:root{--bg-dark:#0a0e1a;--bg-card:#131829;--bg-card-hover:#1a2138;--text-primary:#e8ecf4;--text-secondary:#8b95b0;--text-muted:#5a6378;--accent-blue:#4a9eff;--accent-purple:#a855f7;--accent-green:#10b981;--accent-orange:#f59e0b;--accent-red:#ef4444;--accent-cyan:#06b6d4;--border:rgba(255,255,255,0.08);--border-hover:rgba(255,255,255,0.15);--radius:12px;--radius-sm:8px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);--shadow:0 4px 24px rgba(0,0,0,0.3);--shadow-hover:0 8px 32px rgba(0,0,0,0.4);--max-width:1280px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Arabic',sans-serif;background:var(--bg-dark);color:var(--text-primary);line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg-dark)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.navbar-left{display:flex;align-items:center;gap:12px;cursor:pointer}
.navbar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent-green),var(--accent-cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:white}
.navbar-title{font-size:16px;font-weight:700;white-space:nowrap}
.navbar-subtitle{font-size:11px;color:var(--text-muted);white-space:nowrap}
.navbar-right{display:flex;align-items:center;gap:8px}
.lang-switcher{display:flex;gap:4px}
.lang-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition)}
.lang-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}
.lang-btn.active{background:var(--accent-green);color:white;border-color:var(--accent-green)}
.hero{text-align:center;padding:120px 24px 60px;max-width:var(--max-width);margin:0 auto}
.hero-badge{display:inline-block;padding:4px 14px;border-radius:20px;background:rgba(16,185,129,0.15);color:var(--accent-green);font-size:12px;font-weight:600;margin-bottom:16px}
.hero-title{font-size:42px;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,var(--accent-green),var(--accent-cyan),var(--accent-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.hero-desc{font-size:16px;color:var(--text-secondary);max-width:720px;margin:0 auto 40px}
.hero-stats{display:flex;justify-content:center;gap:48px;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat-num{font-size:36px;font-weight:800;color:var(--accent-green)}
.hero-stat-label{font-size:13px;color:var(--text-muted);margin-top:4px}
.search-bar{max-width:600px;margin:0 auto 60px;padding:0 24px}
.search-input{width:100%;padding:14px 20px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:15px;outline:none;transition:var(--transition)}
.search-input:focus{border-color:var(--accent-green)}
.section{max-width:var(--max-width);margin:0 auto;padding:0 24px 80px}
.section-title{font-size:28px;font-weight:700;margin-bottom:8px}
.section-desc{font-size:14px;color:var(--text-secondary);margin-bottom:40px}
.earth-timeline{display:flex;flex-direction:column;gap:40px}
.earth-stage{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:var(--transition)}
.earth-stage:hover{border-color:var(--border-hover);box-shadow:var(--shadow-hover)}
.earth-stage-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--border)}
.earth-stage-num{font-size:28px;font-weight:800;min-width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent-green),var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.earth-stage-era{font-size:12px;color:var(--accent-cyan);font-weight:600;margin-bottom:2px}
.earth-stage-title{font-size:20px;font-weight:700}
.earth-events{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.earth-event{display:flex;gap:14px;padding:14px 16px;background:rgba(255,255,255,0.02);border-radius:var(--radius-sm);transition:var(--transition)}
.earth-event:hover{background:rgba(255,255,255,0.05)}
.earth-event-num{font-size:14px;font-weight:700;color:var(--accent-green);min-width:24px;padding-top:1px}
.earth-event-body{flex:1}
.earth-event-title{font-size:15px;font-weight:600;margin-bottom:4px}
.earth-event-desc{font-size:13px;color:var(--text-secondary);line-height:1.6}
.earth-insights{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.earth-insight{padding:16px 20px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.earth-insight.positive{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.2)}
.earth-insight.warning{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.2)}
.earth-insight-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.earth-insight.positive .earth-insight-label{color:var(--accent-green)}
.earth-insight.warning .earth-insight-label{color:var(--accent-orange)}
.earth-insight-text{font-size:13px;line-height:1.6;color:var(--text-primary)}
.cosmic-insights{margin-top:60px}
.cosmic-insights-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:32px;background:linear-gradient(135deg,var(--accent-green),var(--accent-cyan),var(--accent-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cosmic-insights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.cosmic-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:var(--transition)}
.cosmic-card:hover{border-color:var(--border-hover);transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.cosmic-card.positive{border-left:3px solid var(--accent-green)}
.cosmic-card.warning{border-left:3px solid var(--accent-orange)}
.cosmic-card-icon{font-size:28px;margin-bottom:12px}
.cosmic-card.positive .cosmic-card-icon{color:var(--accent-green)}
.cosmic-card.warning .cosmic-card-icon{color:var(--accent-orange)}
.cosmic-card-title{font-size:16px;font-weight:700;margin-bottom:8px}
.cosmic-card-desc{font-size:13px;color:var(--text-secondary);line-height:1.6}
.no-results{text-align:center;padding:60px;color:var(--text-muted);font-size:16px}
.footer{text-align:center;padding:40px 24px;border-top:1px solid var(--border);color:var(--text-muted);font-size:13px}
.fade-in{animation:fadeIn 0.6s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
html[dir="rtl"]{direction:rtl}
html[dir="rtl"] .earth-event{flex-direction:row-reverse}
html[dir="rtl"] .earth-stage-header{flex-direction:row-reverse}
@media(max-width:768px){
.hero-title{font-size:28px}
.hero-stats{gap:24px}
.earth-insights{grid-template-columns:1fr}
.cosmic-insights-grid{grid-template-columns:1fr}
.navbar-title{font-size:14px}
.navbar-subtitle{display:none}
.lang-btn{padding:4px 8px;font-size:12px}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-left">
    <div class="navbar-logo">EC</div>
    <div>
      <div class="navbar-title" id="nav-title"></div>
      <div class="navbar-subtitle" id="nav-subtitle"></div>
    </div>
  </div>
  <div class="navbar-right">
    <div class="lang-switcher" id="lang-switcher"></div>
  </div>
</nav>

<section class="hero">
  <div class="hero-badge" id="hero-badge">4.6B years</div>
  <h1 class="hero-title" id="hero-title"></h1>
  <p class="hero-desc" id="hero-desc"></p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="hero-stat-num">10</div><div class="hero-stat-label" id="stat-stages"></div></div>
    <div class="hero-stat"><div class="hero-stat-num">100</div><div class="hero-stat-label" id="stat-events"></div></div>
    <div class="hero-stat"><div class="hero-stat-num">20</div><div class="hero-stat-label" id="stat-insights"></div></div>
    <div class="hero-stat"><div class="hero-stat-num">6</div><div class="hero-stat-label" id="stat-langs"></div></div>
  </div>
</section>

<div class="search-bar">
  <input type="text" class="search-input" id="search-input" placeholder="">
</div>

<section class="section">
  <div id="earth-content"></div>
  <div class="cosmic-insights">
    <div class="cosmic-insights-title" id="cosmic-title"></div>
    <div class="cosmic-insights-grid" id="cosmic-grid"></div>
  </div>
</section>

<div class="footer" id="footer"></div>

<script>
const DATA = {"stages":[{"id":"eh1","era":{"zh":"约46-40亿年前","en":"~4.6-4.0 billion years ago","fr":"~4,6-4,0 milliards d'années","ru":"~4,6-4,0 млрд лет назад","es":"~4,6-4,0 mil millones de años","ar":"~4,6-4,0 مليار سنة"},"title":{"zh":"冥古宙：地球诞生","en":"Hadean: Birth of Earth","fr":"Hadéen: Naissance de la Terre","ru":"Гадей: Рождение Земли","es":"Hadeico: Nacimiento de la Tierra","ar":"الهادي: ميلاد الأرض"},"events":[{"title":{"zh":"太阳星云凝聚","en":"Solar Nebula Condensation","fr":"Condensation de la nébuleuse solaire","ru":"Конденсация солнечной туманности","es":"Condensación de la nebulosa solar","ar":"تكثف السديم الشمسي"},"desc":{"zh":"分子云在引力作用下坍缩，中心形成原太阳，周围形成原行星盘，为太阳系所有天体的诞生奠定基础。","en":"A molecular cloud collapsed under gravity, forming the protosun at its center and a protoplanetary disk around it, laying the foundation for all solar system bodies.","fr":"Un nuage moléculaire s'est effondré sous la gravité, formant le protosoleil en son centre et un disque protoplanétaire autour, fondant la base de tous les corps du système solaire.","ru":"Молекулярное облако гравитационно сжалось, образовав протосолнце в центре и протопланетный диск вокруг, заложив основу всех тел Солнечной системы.","es":"Una nube molecular colapsó por gravedad, formando el protosol en su centro y un disco protoplanetario alrededor, sentando las bases de todos los cuerpos del sistema solar.","ar":"انهارت سحابة جزيئية بفعل الجاذبية، مكوّنة الشمس الأولية في مركزها وقرص كوكبي أولي حولها، واضعةً أساس جميع أجرام النظام الشمسي."}},{"title":{"zh":"地球吸积成型","en":"Earth Accretion","fr":"Accrétion de la Terre","ru":"Аккреция Земли","es":"Acreción de la Tierra","ar":"تراكم الأرض"},"desc":{"zh":"尘埃和岩石碎片在原行星盘中不断碰撞聚合，经过约1亿年逐渐形成原始地球。","en":"Dust and rock fragments in the protoplanetary disk collided and merged over ~100 million years, gradually forming the primitive Earth.","fr":"La poussière et les fragments rocheux du disque protoplanétaire sont entrés en collision et ont fusionné pendant environ 100 millions d'années, formant progressivement la Terre primitive.","ru":"Пыль и каменные обломки в протопланетном диске сталкивались и сливались около 100 млн лет, постепенно формируя первичную Землю.","es":"El polvo y los fragmentos rocosos del disco protoplanetario colisionaron y se fusionaron durante ~100 millones de años, formando gradualmente la Tierra primitiva.","ar":"تصادمت الغبار والشظايا الصخرية في القرص الكوكبي الأولي واتحدت خلال نحو 100 مليون سنة، مكوّنة تدريجياً الأرض البدائية."}},{"title":{"zh":"忒伊亚撞击与月球形成","en":"Theia Impact & Moon Formation","fr":"Impact de Théia et formation de la Lune","ru":"Столкновение с Тейей и образование Луны","es":"Impacto de Theia y formación de la Luna","ar":"اصطدام ثيا وتكوين القمر"},"desc":{"zh":"火星大小的天体忒伊亚撞击地球，飞溅物质在轨道上聚合形成月球，稳定了地球自转轴。","en":"A Mars-sized body named Theia collided with Earth; ejected debris coalesced in orbit to form the Moon, stabilizing Earth's axial tilt.","fr":"Un corps de la taille de Mars nommé Théia a percuté la Terre; les débris éjectés se sont coalescés en orbite pour former la Lune, stabilisant l'inclinaison axiale de la Terre.","ru":"Тело размером с Марс, Тейя, столкнулось с Землёй; выброшенный материал объединился на орбите, образовав Луну и стабилизировав наклон оси Земли.","es":"Un cuerpo del tamaño de Marte llamado Theia colisionó con la Tierra; los escombros eyectados se coalescieron en órbita formando la Luna, estabilizando la inclinación axial terrestre.","ar":"اصطدم جرم بحجم المريخ يسمى ثيا بالأرض؛ تجمعت الحطام المقذوف في المدار مكوّناً القمر، مثبّتاً ميل محور الأرض."}},{"title":{"zh":"岩浆海时代","en":"Magma Ocean Phase","fr":"Phase d'océan de magma","ru":"Эпоха океана магмы","es":"Fase de océano de magma","ar":"مرحلة محيط الصهير"},"desc":{"zh":"地球表面完全被熔融岩浆覆盖，深达数百公里，重元素沉入地核，轻元素上浮形成原始地壳。","en":"Earth's surface was entirely covered by molten magma hundreds of kilometers deep; heavy elements sank to form the core, lighter elements rose to form the primitive crust.","fr":"La surface de la Terre était entièrement recouverte de magma fondu sur des centaines de kilomètres; les éléments lourds ont sombré pour former le noyau, les éléments légers ont formé la croûte primitive.","ru":"Поверхность Земли была полностью покрыта расплавленной магмой на сотни километров; тяжёлые элементы опускались, образуя ядро, лёгкие поднимались, формируя кору.","es":"La superficie terrestre estaba cubierta de magma fundido a cientos de kilómetros de profundidad; los elementos pesados se hundieron formando el núcleo, los ligeros formaron la corteza primitiva.","ar":"كان سطح الأرض مغطىً بالكامل بصهارة منصهرة بعمق مئات الكيلومترات؛ غرقت العناصر الثقيلة مكوّنة النواة، وصعدت الخفيفة مكوّنة القشرة البدائية."}},{"title":{"zh":"地核分化","en":"Core Differentiation","fr":"Différenciation du noyau","ru":"Дифференциация ядра","es":"Diferenciación del núcleo","ar":"تمايز النواة"},"desc":{"zh":"铁镍等重元素在岩浆海中沉降形成金属地核，硅酸盐上浮形成地幔，建立了地球的层圈结构。","en":"Heavy elements like iron and nickel sank through the magma ocean to form the metallic core, while silicates rose to form the mantle, establishing Earth's layered structure.","fr":"Les éléments lourds comme le fer et le nickel ont sombré dans l'océan de magma pour former le noyau métallique, tandis que les silicates sont remontés former le manteau, établissant la structure en couches de la Terre.","ru":"Тяжёлые элементы, такие как железо и никель, опустились сквозь океан магмы, образовав металлическое ядро, а силикаты поднялись, образовав мантию.","es":"Los elementos pesados como hierro y níquel se hundieron en el océano de magma formando el núcleo metálico, mientras los silicatos subieron formando el manto, estableciendo la estructura en capas de la Tierra.","ar":"غرقت العناصر الثقيلة كالحديد والنيكل عبر محيط الصهير مكوّنة النواة المعدنية، بينما صعدت السيليكات مكوّنة الوشاح، مؤسسةً البنية الطبقية للأرض."}},{"title":{"zh":"磁场形成","en":"Magnetic Field Formation","fr":"Formation du champ magnétique","ru":"Формирование магнитного поля","es":"Formación del campo magnético","ar":"تكوين المجال المغناطيسي"},"desc":{"zh":"地核中外核液态铁的对流运动产生了地磁场，为后来抵御太阳风、保留大气和孕育生命提供了关键保护。","en":"Convection of liquid iron in the outer core generated Earth's magnetic field, providing crucial protection against solar wind and enabling atmosphere retention and life.","fr":"La convection du fer liquide dans le noyau externe a généré le champ magnétique terrestre, fournissant une protection cruciale contre le vent solaire pour retenir l'atmosphère et permettre la vie.","ru":"Конвекция жидкого железа во внешнем ядре создала магнитное поле Земли, обеспечив ключевую защиту от солнечного ветра для удержания атмосферы и зарождения жизни.","es":"La convección del hierro líquido en el núcleo externo generó el campo magnético terrestre, proporcionando protección crucial contra el viento solar para retener la atmósfera y permitir la vida.","ar":"أنتج تيار الحمل للحديد السائل في النواة الخارجية المجال المغناطيسي للأرض، مقدماً حماية حاسمة من الرياح الشمسية للاحتفاظ بالغلاف الجوي وتهيئة الحياة."}},{"title":{"zh":"原始地壳固化","en":"Primitive Crust Solidification","fr":"Solidification de la croûte primitive","ru":"Затвердевание первичной коры","es":"Solidificación de la corteza primitiva","ar":"تصلب القشرة البدائية"},"desc":{"zh":"地球表面逐渐冷却，形成最早的固体地壳。已知最古老的矿物锆石可追溯至44亿年前。","en":"Earth's surface gradually cooled, forming the earliest solid crust. The oldest known mineral, zircon, dates back to 4.4 billion years ago.","fr":"La surface de la Terre s'est progressivement refroidie, formant la première croûte solide. Le plus ancien minéral connu, le zircon, remonte à 4,4 milliards d'années.","ru":"Поверхность Земли постепенно остывала, формируя первую твёрдую кору. Древнейший известный минерал — циркон — датируется 4,4 млрд лет назад.","es":"La superficie terrestre se enfrió gradualmente, formando la primera corteza sólida. El mineral más antiguo conocido, el circón, data de 4.400 millones de años.","ar":"برد سطح الأرض تدريجياً، مكوّناً أول قشرة صلبة. أقدم معدن معروف، الزركون، يعود إلى 4,4 مليار سنة."}},{"title":{"zh":"水的来源","en":"Origin of Water","fr":"Origine de l'eau","ru":"Происхождение воды","es":"Origen del agua","ar":"أصل الماء"},"desc":{"zh":"地球水可能来自彗星和小行星的持续轰击，也可能来自地幔脱气。液态水的出现为生命诞生创造了条件。","en":"Earth's water likely came from sustained comet and asteroid bombardment, or from mantle degassing. The appearance of liquid water created conditions for life.","fr":"L'eau terrestre provient probablement du bombardement soutenu de comètes et d'astéroïdes, ou du dégazage du manteau. L'apparition d'eau liquide a créé les conditions de la vie.","ru":"Вода на Земле, вероятно, поступила от комет и астероидов или из дегазации мантии. Появление жидкой воды создало условия для жизни.","es":"El agua terrestre probablemente provino del bombardeo sostenido de cometas y asteroides, o del desgasificamiento del manto. La aparición de agua líquida creó las condiciones para la vida.","ar":"ربما جاءت مياه الأرض من قصف مستمر بالمذنبات والكويكبات، أو من تحلل الغازات من الوشاح. ظهور الماء السائل خلق ظروف الحياة."}},{"title":{"zh":"后期重轰炸","en":"Late Heavy Bombardment","fr":"Grand bombardement tardif","ru":"Поздняя тяжёлая бомбардировка","es":"Gran bombardeo tardío","ar":"القصف الثقيل المتأخر"},"desc":{"zh":"约39亿年前，大量小行星和彗星集中撞击内太阳系，重塑了地球表面，同时可能带来了更多水和有机物。","en":"Around 3.9 billion years ago, a concentration of asteroids and comets struck the inner solar system, reshaping Earth's surface and potentially delivering more water and organics.","fr":"Il y a environ 3,9 milliards d'années, une concentration d'astéroïdes et de comètes a frappé le système solaire interne, remodelant la surface terrestre et apportant potentiellement plus d'eau et de matières organiques.","ru":"Около 3,9 млрд лет назад массивные астероиды и кометы обрушились на внутреннюю Солнечную систему, изменив поверхность Земли и, возможно, доставив больше воды и органики.","es":"Hace unos 3.900 millones de años, una concentración de asteroides y cometas golpeó el sistema solar interior, remodelando la superficie terrestre y potencialmente aportando más agua y materia orgánica.","ar":"قبل نحو 3,9 مليار سنة، اصطدم تركيز من الكويكبات والمذنبات بالنظام الشمسي الداخلي، معيداً تشكيل سطح الأرض وربما جالباً مزيداً من الماء والمواد العضوية."}},{"title":{"zh":"原始大气演化","en":"Primary Atmosphere Evolution","fr":"Évolution de l'atmosphère primaire","ru":"Эволюция первичной атмосферы","es":"Evolución de la atmósfera primaria","ar":"تطور الغلاف الجوي الأولي"},"desc":{"zh":"地球最初的氢氦大气被太阳风吹散，随后由火山排气形成富含二氧化碳、水蒸气和氮气的次生大气。","en":"Earth's initial hydrogen-helium atmosphere was stripped by solar wind; volcanic outgassing then created a secondary atmosphere rich in CO2, water vapor, and nitrogen.","fr":"L'atmosphère initiale d'hydrogène et d'hélium a été balayée par le vent solaire; les gaz volcaniques ont ensuite créé une atmosphère secondaire riche en CO2, vapeur d'eau et azote.","ru":"Первоначальная атмосфера из водорода и гелия была сдута солнечным ветром; вулканические газы создали вторичную атмосферу, богатую CO2, водяным паром и азотом.","es":"La atmósfera inicial de hidrógeno y helio fue arrastrada por el viento solar; los gases volcánicos crearon luego una atmósfera secundaria rica en CO2, vapor de agua y nitrógeno.","ar":"اكتسح الرياح الشمسي الغلاف الجوي الأولي من الهيدروجين والهيليوم؛ ثم خلقت الغازات البركانية غلافاً جوياً ثانوياً غنياً بثاني أكسيد الكربون وبخار الماء والنيتروجين."}}],"insight":{"positive":{"zh":"从混沌中诞生秩序——地球的层圈分化展示了物质自组织的基本规律：在能量驱动下，系统自发趋向有序结构。","en":"Order from chaos — Earth's layered differentiation demonstrates the fundamental principle of self-organization: systems spontaneously develop ordered structures under energy drive.","fr":"L'ordre naît du chaos — la différenciation en couches de la Terre démontre le principe fondamental d'auto-organisation: les systèmes développent spontanément des structures ordonnées sous l'effet de l'énergie.","ru":"Порядок из хаоса — слоистая дифференциация Земли демонстрирует фундаментальный принцип самоорганизации: системы спонтанно формируют упорядоченные структуры под действием энергии.","es":"El orden surge del caos — la diferenciación en capas de la Tierra demuestra el principio fundamental de autoorganización: los sistemas desarrollan espontáneamente estructuras ordenadas bajo el impulso de la energía.","ar":"النظام يولد من الفوضى — تمايز طبقات الأرض يُظهر المبدأ الأساسي للتنظيم الذاتي: الأنظمة تطوّر تلقائياً بنى منظمة تحت تأثير الطاقة."},"warning":{"zh":"形成过程的脆弱性——如果忒伊亚撞击角度稍有不同，月球不会形成，地球自转轴将不稳定，气候剧变可能阻止生命诞生。","en":"Fragility of formation — if Theia's impact angle had differed slightly, the Moon would not have formed, Earth's axis would be unstable, and climate chaos might have prevented life.","fr":"Fragilité de la formation — si l'angle d'impact de Théia avait légèrement différé, la Lune ne se serait pas formée, l'axe terrestre aurait été instable, et le chaos climatique aurait pu empêcher la vie.","ru":"Хрупкость формирования — если бы угол удара Тейи немного отличался, Луна бы не образовалась, ось Земли была бы нестабильной, и климатический хаос мог предотвратить зарождение жизни.","es":"Fragilidad de la formación — si el ángulo de impacto de Theia hubiera diferido ligeramente, la Luna no se habría formado, el eje terrestre sería inestable, y el caos climático podría haber impedido la vida.","ar":"هشاشة التكوين — لو اختلف زاوية اصطدام ثيا قليلاً، لما تكوّن القمر، ولصار محور الأرض غير مستقر، وقد يمنع الفوضى المناخية نشوء الحياة."}}},{"id":"eh2","era":{"zh":"约40-25亿年前","en":"~4.0-2.5 billion years ago","fr":"~4,0-2,5 milliards d'années","ru":"~4,0-2,5 млрд лет назад","es":"~4,0-2,5 mil millones de años","ar":"~4,0-2,5 مليار سنة"},"title":{"zh":"太古宙：生命起源","en":"Archean: Origin of Life","fr":"Archéen: Origine de la vie","ru":"Архей: Происхождение жизни","es":"Arqueano: Origen de la vida","ar":"الأركي: أصل الحياة"},"events":[{"title":{"zh":"生命诞生","en":"Emergence of Life","fr":"Émergence de la vie","ru":"Возникновение жизни","es":"Surgimiento de la vida","ar":"ظهور الحياة"},"desc":{"zh":"约38亿年前，在深海热液喷口或浅水池中，有机分子通过化学演化形成最简单的自复制系统，生命由此诞生。","en":"Around 3.8 billion years ago, organic molecules underwent chemical evolution in deep-sea hydrothermal vents or shallow pools, forming the simplest self-replicating systems.","fr":"Il y a environ 3,8 milliards d'années, des molécules organiques ont subi une évolution chimique dans les sources hydrothermales ou des bassins peu profonds, formant les plus simples systèmes auto-réplicateurs.","ru":"Около 3,8 млрд лет назад органические молекулы в глубоководных гидротермальных источниках или мелких бассейнах химически эволюционировали, образовав простейшие самовоспроизводящиеся системы.","es":"Hace unos 3.800 millones de años, las moléculas orgánicas experimentaron evolución química en fuentes hidrotermales o estanques someros, formando los sistemas autorreplicantes más simples.","ar":"قبل نحو 3,8 مليار سنة، خضعت الجزيئات العضوية لتطور كيميائي في النساخ الحرارية المائية أو الأحواض الضحلة، مكوّنةً أبسط الأنظمة ذاتية التكاثر."}},{"title":{"zh":"RNA世界假说","en":"RNA World Hypothesis","fr":"Hypothèse du monde de l'ARN","ru":"Гипотеза мира РНК","es":"Hipótesis del mundo de ARN","ar":"فرضية عالم الحمض النووي الريبي"},"desc":{"zh":"RNA既能存储遗传信息又能催化化学反应，可能是最早的生命分子，后来DNA和蛋白质分工才取代了RNA的双重角色。","en":"RNA can both store genetic information and catalyze chemical reactions, possibly being the first life molecule; DNA and proteins later replaced RNA's dual role through division of labor.","fr":"L'ARN peut stocker des informations génétiques et catalyser des réactions chimiques, étant possiblement la première molécule de vie; l'ADN et les protéines ont ensuite remplacé le double rôle de l'ARN.","ru":"РНК может хранить генетическую информацию и катализировать реакции, возможно, будучи первой молекулой жизни; позже ДНК и белки заменили двойную роль РНК.","es":"El ARN puede almacenar información genética y catalizar reacciones químicas, siendo posiblemente la primera molécula de vida; el ADN y las proteínas luego reemplazaron el doble rol del ARN.","ar":"يستطيع الحمض النووي الريبي تخزين المعلومات الوراثية وتحفيز التفاعلات الكيميائية، وربما كان أول جزيء حياة؛ ثم حل الحمض النووي الريبي منقوص الأكسجين والبروتينات محل دور الحمض النووي الريبي المزدوج."}},{"title":{"zh":"最早化石：叠层石","en":"Earliest Fossils: Stromatolites","fr":"Premiers fossiles: stromatolites","ru":"Ископаемые: строматолиты","es":"Primeros fósiles: estromatolitos","ar":"أقدم الأحافير: الستروماتوليت"},"desc":{"zh":"约35亿年前的叠层石是已知最早的宏观化石证据，由蓝细菌等微生物群落层层堆积形成。","en":"Stromatolites from ~3.5 billion years ago are the earliest known macroscopic fossil evidence, formed by layered communities of cyanobacteria and other microorganisms.","fr":"Les stromatolites d'il y a ~3,5 milliards d'années sont les plus anciennes preuves fossiles macroscopiques, formés par des communautés stratifiées de cyanobactéries et autres microorganismes.","ru":"Строматолиты возрастом ~3,5 млрд лет — древнейшие известные макроскопические ископаемые, образованные слоистыми сообществами цианобактерий.","es":"Los estromatolitos de hace ~3.500 millones de años son la evidencia fósil macroscópica más antigua, formados por comunidades estratificadas de cianobacterias y otros microorganismos.","ar":"الستروماتوليت من قبل ~3,5 مليار سنة هي أقدم دليل أحفوري مجهري، تكوّن من مجتمعات طبقية من البكتيريا الزرقاء وغيرها من الكائنات الدقيقة."}},{"title":{"zh":"化学自养代谢","en":"Chemolithoautotrophy","fr":"Chimiolithoautotrophie","ru":"Хемолитоавтотрофия","es":"Quimiolitoautotrofia","ar":"التغذية الكيميائية الذاتية"},"desc":{"zh":"最早的生命依靠氧化无机物（如硫化氢、氢气）获取能量，不依赖阳光，开创了化学自养的代谢模式。","en":"Earliest life obtained energy by oxidizing inorganic compounds (e.g., hydrogen sulfide, hydrogen), independent of sunlight, pioneering chemolithoautotrophic metabolism.","fr":"Les premières formes de vie obtenaient de l'énergie en oxydant des composés inorganiques (sulfure d'hydrogène, hydrogène), indépendamment de la lumière solaire, pioneering la chimiolithoautotrophie.","ru":"Древнейшая жизнь получала энергию окислением неорганических соединений (сероводород, водород), независимо от солнца, положив начало хемолитоавтотрофии.","es":"Las primeras formas de vida obtenían energía oxidando compuestos inorgánicos (sulfuro de hidrógeno, hidrógeno), independientes de la luz solar, iniciando la quimiolitoautotrofía.","ar":"حصلت أوائل أشكال الحياة على الطاقة بأكسدة المركبات غير العضوية (كبريتيد الهيدروجين، الهيدروجين)، مستقلةً عن ضوء الشمس، رائدةً التغذية الكيميائية الذاتية."}},{"title":{"zh":"光合作用起源","en":"Origin of Photosynthesis","fr":"Origine de la photosynthèse","ru":"Возникновение фотосинтеза","es":"Origen de la fotosíntesis","ar":"أصل التمثيل الضوئي"},"desc":{"zh":"蓝细菌演化出利用阳光分解水分子释放氧气的光合作用，这一创新彻底改变了地球的化学环境。","en":"Cyanobacteria evolved photosynthesis that used sunlight to split water molecules and release oxygen, an innovation that would transform Earth's chemistry.","fr":"Les cyanobactéries ont développé la photosynthèse utilisant la lumière solaire pour scinder les molécules d'eau et libérer de l'oxygène, une innovation qui transformerait la chimie terrestre.","ru":"Цианобактерии развили фотосинтез, использующий солнечный свет для расщепления воды с выделением кислорода, что изменило химию Земли.","es":"Las cianobacterias desarrollaron la fotosíntesis usando la luz solar para dividir moléculas de agua y liberar oxígeno, una innovación que transformaría la química terrestre.","ar":"طوّرت البكتيريا الزرقاء التمثيل الضوئي باستخدام ضوء الشمس لتفتيت جزيئات الماء وإطلاق الأكسجين، ابتكارٌ سيحوّل كيمياء الأرض."}},{"title":{"zh":"板块构造启动","en":"Plate Tectonics Begins","fr":"Début de la tectonique des plaques","ru":"Начало тектоники плит","es":"Inicio de la tectónica de placas","ar":"بداية تكتونية الصفائح"},"desc":{"zh":"地壳冷却到足够刚性后，板块构造开始运作。俯冲、碰撞和裂谷循环持续重塑地表，驱动长期碳循环。","en":"After the crust cooled sufficiently, plate tectonics began operating. Subduction, collision, and rifting cycles continuously reshaped the surface and drove long-term carbon cycling.","fr":"Après le refroidissement suffisant de la croûte, la tectonique des plaques a commencé. Les cycles de subduction, collision et rift ont continuellement remodelé la surface et entraîné le cycle du carbone à long terme.","ru":"После достаточного остывания коры начала работать тектоника плит. Циклы субдукции, столкновений и рифтинга непрерывно меняли поверхность и управляли углеродным циклом.","es":"Tras el enfriamiento suficiente de la corteza, la tectónica de placas comenzó. Los ciclos de subducción, colisión y rift remodelaron continuamente la superficie e impulsaron el ciclo del carbono a largo plazo.","ar":"بعد برودة القشرة الكافية، بدأت تكتونية الصفائح. أدارت دورات الغطس والتصادم والتصدع بإعادة تشكيل السطح باستمرار ودفعت دورة الكربون طويلة الأمد."}},{"title":{"zh":"最早大陆形成","en":"First Continents Form","fr":"Formation des premiers continents","ru":"Формирование первых континентов","es":"Formación de los primeros continentes","ar":"تكوين أول القارات"},"desc":{"zh":"花岗岩质地壳在反复熔融和固化中增厚，形成了最早的稳定大陆核（克拉通），成为未来大陆生长的种子。","en":"Granitic crust thickened through repeated melting and solidification, forming the earliest stable continental cores (cratons) that served as seeds for future continental growth.","fr":"La croûte granitique s'est épaissie par des fusions et solidifications répétées, formant les premiers noyaux continentaux stables (cratons) qui servirent de graines à la croissance continentale future.","ru":"Гранитная кора утолщалась при повторном плавлении и затвердевании, образуя первые стабильные ядра континентов (кратоны) — основу будущего роста материков.","es":"La corteza granítica se engrosó mediante fusiones y solidificaciones repetidas, formando los primeros núcleos continentales estables (cratones) que sirvieron de semillas para el crecimiento continental futuro.","ar":"تثخّنت القشرة الجرانيتية عبر عمليات انصهار وتصلب متكررة، مكوّنةً أول النوى القارية المستقرة (الكراتونات) التي أصبحت بذور نمو القارات المستقبلي."}},{"title":{"zh":"海洋化学演化","en":"Ocean Chemistry Evolution","fr":"Évolution de la chimie océanique","ru":"Эволюция химии океана","es":"Evolución de la química oceánica","ar":"تطور كيمياء المحيط"},"desc":{"zh":"早期海洋富含铁和硅酸盐，呈还原性。海底热液喷口提供矿物质和热能，成为生命化学反应的天然反应器。","en":"Early oceans were rich in iron and silicates, with reducing chemistry. Hydrothermal vents provided minerals and thermal energy, serving as natural reactors for life's chemistry.","fr":"Les océans primitifs étaient riches en fer et silicates, avec une chimie réductrice. Les sources hydrothermales fournissaient minéraux et énergie thermique, servant de réacteurs naturels pour la chimie de la vie.","ru":"Ранние океаны были богаты железом и силикатами, с восстановительной химией. Гидротермальные источники давали минералы и тепло, служа природными реакторами для химии жизни.","es":"Los océanos primitivos eran ricos en hierro y silicatos, con química reductora. Las fuentes hidrotermales proporcionaban minerales y energía térmica, sirviendo de reactores naturales para la química de la vida.","ar":"كانت المحيطات المبكرة غنية بالحديد والسيليكات، بكيمياء مختزلة. وفرت النساخ الحرارية المعادن والطاقة الحرارية، عاملةً كمفاعلات طبيعية لكيمياء الحياة."}},{"title":{"zh":"原核生物多样化","en":"Prokaryote Diversification","fr":"Diversification des procaryotes","ru":"Диверсификация прокариот","es":"Diversificación de procariotas","ar":"تنوع بدائيات النوى"},"desc":{"zh":"细菌和古菌迅速分化，占据了从热泉到寒冷海洋的各种生态位，建立了覆盖全球的微生物生态系统。","en":"Bacteria and archaea rapidly diversified, occupying ecological niches from hot springs to cold oceans, establishing a global microbial ecosystem.","fr":"Les bactéries et archées se sont rapidement diversifiées, occupant des niches écologiques des sources chaudes aux océans froids, établissant un écosystème microbien global.","ru":"Бактерии и археи быстро диверсифицировались, заняв ниши от горячих источников до холодных океанов, создав глобальную микробную экосистему.","es":"Las bacterias y arqueas se diversificaron rápidamente, ocupando nichos ecológicos desde fuentes termales hasta océanos fríos, estableciendo un ecosistema microbiano global.","ar":"تنوعت البكتيريا والبكتيريا القديمة بسرعة، محتلةً موائل بيئية من الينابيع الحارة إلى المحيطات الباردة، مؤسسةً نظاماً بيئياً ميكروبياً عالمياً."}},{"title":{"zh":"基因水平转移","en":"Horizontal Gene Transfer","fr":"Transfert horizontal de gènes","ru":"Горизонтальный перенос генов","es":"Transferencia horizontal de genes","ar":"النقل الأفقي للجينات"},"desc":{"zh":"微生物之间通过水平基因转移共享有益基因，加速了适应性进化，使早期生命网络更像一个共享基因池而非孤立物种。","en":"Microbes shared beneficial genes through horizontal gene transfer, accelerating adaptive evolution, making early life networks more like a shared gene pool than isolated species.","fr":"Les microbes partageaient des gènes bénéfiques par transfert horizontal, accélérant l'évolution adaptative, faisant des réseaux de vie primitifs plus un pool de gènes partagé que des espèces isolées.","ru":"Микробы обменивались полезными генами горизонтально, ускоряя адаптивную эволюцию, превращая ранние сети жизни в общий генный пул, а не изолированные виды.","es":"Los microbios compartían genes beneficiosos mediante transferencia horizontal, acelerando la evolución adaptativa, haciendo las redes de vida primitivas más un pool de genes compartido que especies aisladas.","ar":"تشاركت الميكروبات الجينات النافعة عبر النقل الأفقي، معجّلةً التطور التكيفي، جاعلةً شبكات الحياة المبكرة更像 مجموعة جينات مشتركة من أنواع معزولة."}}],"insight":{"positive":{"zh":"生命在最极端条件下也能诞生——深海热液、无光、高温高压环境中，化学演化自发产生了自复制系统，说明生命可能是物质演化的必然产物。","en":"Life emerges under the most extreme conditions — chemical evolution spontaneously produced self-replicating systems in dark, high-pressure hydrothermal vents, suggesting life may be an inevitable product of material evolution.","fr":"La vie émerge dans les conditions les plus extrêmes — l'évolution chimique a produit spontanément des systèmes auto-réplicateurs dans des sources hydrothermales sombres et sous haute pression, suggérant que la vie pourrait être un produit inévitable de l'évolution de la matière.","ru":"Жизнь возникает в самых экстремальных условиях — химическая эволюция спонтанно создала самовоспроизводящиеся системы в тёмных гидротермальных источниках, предполагая, что жизнь может быть неизбежным продуктом эволюции материи.","es":"La vida surge en las condiciones más extremas — la evolución química produjo espontáneamente sistemas autorreplicantes en fuentes hidrotermales oscuras y de alta presión, sugiriendo que la vida puede ser un producto inevitable de la evolución material.","ar":"تنشأ الحياة في أقصى الظروف — التطور الكيميائي أنتج تلقائياً أنظمة ذاتية التكاثر في نساخ حرارية مظلمة وعالية الضغط، مما يوحي بأن الحياة قد تكون نتيجة حتمية لتطور المادة."},"warning":{"zh":"生命诞生的窗口极窄——需要液态水、适宜温度、能量来源和保护性磁场同时存在，任何条件缺失都可能让行星永远荒芜。","en":"The window for life's origin is extremely narrow — liquid water, suitable temperature, energy source, and protective magnetic field must all coexist; any missing condition could leave a planet barren forever.","fr":"La fenêtre d'origine de la vie est extrêmement étroite — eau liquide, température adéquate, source d'énergie et champ magnétique protecteur doivent coexister; toute condition manquante pourrait laisser une planète stérile à jamais.","ru":"Окно для зарождения жизни крайне узко — жидкая вода, подходящая температура, источник энергии и защитное магнитное поле должны сосуществовать; отсутствие любого условия может оставить планету бесплодной навсегда.","es":"La ventana para el origen de la vida es extremadamente estrecha — agua líquida, temperatura adecuada, fuente de energía y campo magnético protector deben coexistir; cualquier condición faltante podría dejar un planeta estéril para siempre.","ar":"نافذة نشوء الحياة ضيقة للغاية — الماء السائل والحرارة المناسبة ومصدر الطاقة والمجال المغناطيسي الواقي يجب أن تتواجد معاً؛ غياب أي شرط قد يترك الكوكب قاحلاً للأبد."}}},{"id":"eh3","era":{"zh":"约25亿-5.41亿年前","en":"~2.5 billion - 541 million years ago","fr":"~2,5 milliards - 541 millions d'années","ru":"~2,5 млрд - 541 млн лет назад","es":"~2,5 mil millones - 541 millones de años","ar":"~2,5 مليار - 541 مليون سنة"},"title":{"zh":"元古宙：大氧化与复杂化","en":"Proterozoic: Great Oxidation & Complexity","fr":"Protérozoïque: Grande oxydation et complexité","ru":"Протерозой: Великое окисление","es":"Proterozoico: Gran Oxidación y Complejidad","ar":"البروتيروزوي: الأكسدة الكبرى والتعقيد"},"events":[{"title":{"zh":"大氧化事件","en":"Great Oxidation Event","fr":"Grand événement d'oxydation","ru":"Великое окисление","es":"Gran Evento de Oxidación","ar":"حدث الأكسدة العظيم"},"desc":{"zh":"约24亿年前，蓝细菌产生的氧气开始在大气中积累，消灭了大多数厌氧生物，这是地球历史上第一次大灭绝。","en":"Around 2.4 billion years ago, oxygen from cyanobacteria accumulated in the atmosphere, wiping out most anaerobic organisms — Earth's first mass extinction.","fr":"Il y a environ 2,4 milliards d'années, l'oxygène des cyanobactéries s'est accumulé dans l'atmosphère, anéantissant la plupart des organismes anaérobies — la première extinction de masse de l'histoire terrestre.","ru":"Около 2,4 млрд лет назад кислород от цианобактерий накопился в атмосфере, уничтожив большинство анаэробов — первое массовое вымирание в истории Земли.","es":"Hace unos 2.400 millones de años, el oxígeno de las cianobacterias se acumuló en la atmósfera, aniquilando a la mayoría de los organismos anaerobios — la primera extinción masiva de la historia terrestre.","ar":"قبل نحو 2,4 مليار سنة، تراكم الأكسجين من البكتيريا الزرقاء في الغلاف الجوي، مبيداً معظم الكائنات اللاهوائية — أول انقراض جماعي في تاريخ الأرض."}},{"title":{"zh":"休伦冰期（雪球地球）","en":"Huronian Glaciation (Snowball Earth)","fr":"Glaciation huronienne (Terre boule de neige)","ru":"Гуронское оледенение (Снежок Земли)","es":"Glaciación Huroniana (Tierra Bola de Nieve)","ar":"التجلد الهوروني (أرض كرة الثلج)"},"desc":{"zh":"大气氧增多导致甲烷被氧化，温室效应减弱，地球陷入首次全球性冰期，赤道也可能被冰雪覆盖。","en":"Rising atmospheric oxygen oxidized methane, weakening the greenhouse effect and plunging Earth into its first global glaciation, possibly freezing even the equator.","fr":"L'augmentation de l'oxygène atmosphérique a oxydé le méthane, affaiblissant l'effet de serre et plongeant la Terre dans sa première glaciation globale, gelant possiblement même l'équateur.","ru":"Рост кислорода окислил метан, ослабив парниковый эффект и погрузив Землю в первое глобальное оледенение, возможно заморозив даже экватор.","es":"El aumento del oxígeno atmosférico oxidó el metano, debilitando el efecto invernadero y sumiendo a la Tierra en su primera glaciación global, posiblemente congelando incluso el ecuador.","ar":"أكسد ارتفاع الأكسجين في الغلاف الجوي الميثان، ضعفاً تأثير الاحتباس الحراري وأغرق الأرض في أول تجلد عالمي، ربما جمّد حتى خط الاستواء."}},{"title":{"zh":"真核生物出现","en":"Eukaryotes Appear","fr":"Apparition des eucaryotes","ru":"Появление эукариот","es":"Aparición de los eucariotas","ar":"ظهور حقيقيات النوى"},"desc":{"zh":"约21亿年前，细胞演化出细胞核和膜系统，基因组规模大幅扩展，为多细胞生物和复杂生命奠定了基础。","en":"Around 2.1 billion years ago, cells evolved nuclei and membrane systems, greatly expanding genome size and laying the groundwork for multicellularity and complex life.","fr":"Il y a environ 2,1 milliards d'années, des cellules ont évolué des noyaux et des systèmes membranaires, élargissant considérablement la taille du génome et posant les bases de la multicellularité et de la vie complexe.","ru":"Около 2,1 млрд лет назад клетки обзавелись ядром и мембранными системами, расширив геном и подготовив основу для многоклеточности и сложной жизни.","es":"Hace unos 2.100 millones de años, las células evolucionaron núcleos y sistemas de membranas, expandiendo enormemente el tamaño del genoma y sentando las bases de la multicelularidad y la vida compleja.","ar":"قبل نحو 2,1 مليار سنة، طوّرت الخلايا نوى وأنظمة غشائية، موسّعةً حجم الجينوم بشكل كبير وواضعةً أساس التعدد الخلوي والحياة المعقدة."}},{"title":{"zh":"内共生事件","en":"Endosymbiosis","fr":"Endosymbiose","ru":"Эндосимбиоз","es":"Endosimbiosis","ar":"التعايش الداخلي"},"desc":{"zh":"原始真核细胞吞噬了能进行光合作用和有氧呼吸的细菌，后者演变为叶绿体和线粒体，这是生命史上最重要的合作。","en":"Primitive eukaryotic cells engulfed photosynthetic and aerobic bacteria, which became chloroplasts and mitochondria — life's most important partnership.","fr":"Des cellules eucaryotes primitives ont englobé des bactéries photosynthétiques et aérobies, devenues chloroplastes et mitochondries — le partenariat le plus important de l'histoire de la vie.","ru":"Примитивные эукариоты поглотили фотосинтезирующие и аэробные бактерии, ставшие хлоропластами и митохондриями — важнейшее партнёрство в истории жизни.","es":"Células eucariotas primitivas englobaron bacterias fotosintéticas y aerobias, que se convirtieron en cloroplastos y mitocondrias — la asociación más importante en la historia de la vida.","ar":"ابتلعت خلايا حقيقية النوى بدائية بكتيريا ملائمة للتمثيل الضوئي وهوائية، أصبحت البلاستيدات الخضراء والميتوكوندريا — أهم شراكة في تاريخ الحياة."}},{"title":{"zh":"有性生殖演化","en":"Sexual Reproduction Evolves","fr":"Évolution de la reproduction sexuée","ru":"Эволюция полового размножения","es":"Evolución de la reproducción sexual","ar":"تطور التكاثر الجنسي"},"desc":{"zh":"减数分裂和受精的出现使后代获得更大的基因多样性，极大加速了进化速度，使自然选择有更多素材可用。","en":"The emergence of meiosis and fertilization gave offspring greater genetic diversity, greatly accelerating evolution by providing natural selection with more material.","fr":"L'émergence de la méiose et de la fécondation a donné à la descendance une plus grande diversité génétique, accélérant considérablement l'évolution en fournissant à la sélection naturelle davantage de matériel.","ru":"Появление мейоза и оплодотворения дало потомству большую генетическую изменчивость, резко ускорив эволюцию, дав естественному отбору больше материала.","es":"La emergencia de la meiosis y la fertilización dio a la descendencia mayor diversidad genética, acelerando enormemente la evolución al proporcionar a la selección natural más material.","ar":"أعطى ظهور الانقسام المنصف والإخصاب للنسل تنوعاً جينياً أكبر، معجّلاً التطور بشكل كبير بتوفير مادة أكثر للانتخاب الطبيعي."}},{"title":{"zh":"多细胞生物出现","en":"Multicellular Life Emerges","fr":"Émergence de la vie multicellulaire","ru":"Появление многоклеточных","es":"Surgimiento de la vida multicelular","ar":"ظهور الحياة متعددة الخلايا"},"desc":{"zh":"约15亿年前，细胞开始协作形成多细胞体，细胞分化和特化使生物体复杂度跃升至全新层次。","en":"Around 1.5 billion years ago, cells began cooperating to form multicellular bodies; cell differentiation and specialization elevated biological complexity to a new level.","fr":"Il y a environ 1,5 milliard d'années, les cellules ont commencé à coopérer pour former des corps multicellulaires; la différenciation et la spécialisation cellulaires ont élevé la complexité biologique à un nouveau niveau.","ru":"Около 1,5 млрд лет назад клетки начали сотрудничать, образуя многоклеточные тела; дифференциация клеток подняла сложность организмов на новый уровень.","es":"Hace unos 1.500 millones de años, las células comenzaron a cooperar para formar cuerpos multicelulares; la diferenciación y especialización celular elevaron la complejidad biológica a un nuevo nivel.","ar":"قبل نحو 1,5 مليار سنة، بدأت الخلايا تتعاون لتكوين أجسام متعددة الخلايا؛ رفع التمايز والتخصص الخلوي التعقيد البيولوجي إلى مستوى جديد."}},{"title":{"zh":"罗迪尼亚超大陆","en":"Supercontinent Rodinia","fr":"Supercontinent Rodinia","ru":"Суперконтинент Родиния","es":"Supercontinente Rodinia","ar":"القارة العظمى رودينيا"},"desc":{"zh":"约11亿年前，各大陆聚合形成罗迪尼亚超大陆。超大陆的聚合与裂解循环深刻影响了海洋环流、气候和生物演化。","en":"Around 1.1 billion years ago, continents merged to form the supercontinent Rodinia. The supercontinent cycle profoundly influenced ocean circulation, climate, and evolution.","fr":"Il y a environ 1,1 milliard d'années, les continents ont fusionné pour former le supercontinent Rodinia. Le cycle des supercontinents a profondément influencé la circulation océanique, le climat et l'évolution.","ru":"Около 1,1 млрд лет назад материки объединились в суперконтинент Родиния. Цикл суперконтинентов глубоко влиял на циркуляцию океана, климат и эволюцию.","es":"Hace unos 1.100 millones de años, los continentes se fusionaron formando el supercontinente Rodinia. El ciclo de supercontinentes influyó profundamente en la circulación oceánica, el clima y la evolución.","ar":"قبل نحو 1,1 مليار سنة، اتحدت القارات مكوّنةً القارة العظمى رودينيا. أثرت دورة القارات العظمى بعمق على دوران المحيطات والمناخ والتطور."}},{"title":{"zh":"克里奥根冰期","en":"Cryogenian Glaciation","fr":"Glaciation cryogénienne","ru":"Криогенное оледенение","es":"Glaciación Criogénica","ar":"تجلد الكريوجيني"},"desc":{"zh":"约7.2-6.35亿年前，地球再次经历极端冰期，可能整个星球被冰覆盖。冰融后的营养物质输入促进了生物大爆发。","en":"About 720-635 million years ago, Earth experienced extreme glaciation, possibly ice-covered entirely. Nutrient input after melting may have triggered the biological explosion.","fr":"Il y a environ 720-635 millions d'années, la Terre a connu une glaciation extrême, possiblement entièrement recouverte de glace. L'apport de nutriments après la fonte a pu déclencher l'explosion biologique.","ru":"Около 720-635 млн лет назад Земля пережила экстремальное оледенение, возможно полностью покрытая льдом. Постпостепенный приток питательных веществ мог вызвать биологический взрыв.","es":"Hace unos 720-635 millones de años, la Tierra experimentó una glaciación extrema, posiblemente cubierta de hielo por completo. El aporte de nutrientes tras el deshielo pudo desencadenar la explosión biológica.","ar":"قبل نحو 720-635 مليون سنة، شهدت الأرض تجلداً متطرفاً، ربما غطاها الجليد بالكامل. تدفق المغذيات بعد الذوبان ربما أطلق الانفجار البيولوجي."}},{"title":{"zh":"臭氧层形成","en":"Ozone Layer Formation","fr":"Formation de la couche d'ozone","ru":"Формирование озонового слоя","es":"Formación de la capa de ozono","ar":"تكوين طبقة الأوزون"},"desc":{"zh":"大气氧积累到一定程度后，高层大气中的臭氧层形成，阻挡了致命紫外线，为生物登陆创造了前提条件。","en":"After atmospheric oxygen accumulated sufficiently, the ozone layer formed in the upper atmosphere, blocking lethal UV radiation and enabling life to colonize land.","fr":"Après l'accumulation suffisante d'oxygène atmosphérique, la couche d'ozone s'est formée dans la haute atmosphère, bloquant les UV mortels et permettant à la vie de coloniser les terres.","ru":"После достаточного накопления кислорода в верхней атмосфере образовался озоновый слой, блокировавший смертельное УФ-излучение и позволивший жизни выйти на сушу.","es":"Tras la acumulación suficiente de oxígeno atmosférico, la capa de ozono se formó en la alta atmósfera, bloqueando los UV letales y permitiendo a la vida colonizar la tierra.","ar":"بعد تراكم كافٍ من الأكسجين الجوي، تكوّنت طبقة الأوزون في الغلاف الجوي العلوي، حاجبةً الأشعة فوق البنفسجية المميتة وممكّنة الحياة من غزو اليابسة."}},{"title":{"zh":"埃迪卡拉生物群","en":"Ediacaran Biota","fr":"Biote édiacarien","ru":"Эдиакарская биота","es":"Biota ediacárica","ar":"حيويات الإدياكاران"},"desc":{"zh":"约6.35-5.41亿年前，出现了一批形态奇特的软体生物，它们是已知最早的复杂多细胞动物群落，但大多没有后代延续。","en":"About 635-541 million years ago, a group of bizarre soft-bodied organisms appeared — the earliest known complex multicellular animal communities, though most left no descendants.","fr":"Il y a environ 635-541 millions d'années, un groupe d'organismes mous aux formes étranges est apparu — les plus anciennes communautés animales multicellulaires complexes connues, bien que la plupart n'aient pas laissé de descendants.","ru":"Около 635-541 млн лет назад появились странные мягкотелые организмы — древнейшие известные сообщества сложных многоклеточных животных, хотя большинство не оставило потомков.","es":"Hace unos 635-541 millones de años, apareció un grupo de organismos de cuerpo blando y formas extrañas — las comunidades animales multicelulares complejas más antiguas conocidas, aunque la mayoría no dejó descendientes.","ar":"قبل نحو 635-541 مليون سنة، ظهرت مجموعة كائنات ذات أجسام رخوة وأشكال غريبة — أقدم مجتمعات حيوانية متعددة الخلايا معقدة معروفة، وإن لم تترك معظمها نسلاً."}}],"insight":{"positive":{"zh":"合作创造飞跃——内共生使细胞获得了高效的能量工厂（线粒体）和光合机器（叶绿体），单次合作事件带来的能量跃迁使复杂生命成为可能。","en":"Cooperation creates leaps — endosymbiosis gave cells efficient energy factories (mitochondria) and photosynthetic engines (chloroplasts); a single cooperative event's energy leap made complex life possible.","fr":"La coopération crée des bonds — l'endosymbiose a donné aux cellules des usines d'énergie efficaces (mitochondries) et des moteurs photosynthétiques (chloroplastes); le bond énergétique d'un seul acte coopératif a rendu la vie complexe possible.","ru":"Сотрудничество создаёт скачки — эндосимбиоз дал клеткам эффективные энергетические станции (митохондрии) и фотосинтетические двигатели (хлоропласты); единственный акт сотрудничества сделал возможной сложную жизнь.","es":"La cooperación crea saltos — la endosimbiosis dotó a las células de fábricas de energía eficientes (mitocondrias) y motores fotosintéticos (cloroplastos); el salto energético de un único acto cooperativo hizo posible la vida compleja.","ar":"التعاون يصنع القفزات — منح التعايش الداخلي الخلايا مصانع طاقة فعالة (الميتوكوندريا) ومحركات تمثيل ضوئي (البلاستيدات الخضراء)؛ قفزة الطاقة من فعل تعاوني واحد جعلت الحياة المعقدة ممكنة."},"warning":{"zh":"自身创新可能毁灭自身——蓝细菌产氧本是进化优势，却导致全球厌氧生物大灭绝。技术创新同样可能反噬创造者。","en":"One's own innovation can destroy oneself — cyanobacteria's oxygen production was an evolutionary advantage, yet caused the global annihilation of anaerobes. Technological innovation can similarly backfire on its creators.","fr":"Sa propre innovation peut se détruire — la production d'oxygène des cyanobactéries était un avantage évolutif, mais a causé l'annihilation globale des anaérobies. L'innovation technologique peut similairement se retourner contre ses créateurs.","ru":"Собственная инновация может уничтожить себя — выделение кислорода цианобактериями было эволюционным преимуществом, но вызвало глобальное вымирание анаэробов. Технологические инновации могут аналогично навредить создателям.","es":"La propia innovación puede destruir — la producción de oxígeno de las cianobacterias fue una ventaja evolutiva, pero causó la aniquilación global de los anaerobios. La innovación tecnológica puede similarmente volverse contra sus creadores.","ar":"الابتكار الذاتي قد يدمر الذات — إنتاج البكتيريا الزرقاء للأكسجين كان ميزة تطورية، لكنه تسبب في إبادة عالمية للهوائيات اللاهوائية. الابتكار التكنولوجي قد يرتد بنفس الطريقة على مبتكريه."}}},{"id":"eh4","era":{"zh":"约5.41亿-2.52亿年前","en":"~541-252 million years ago","fr":"~541-252 millions d'années","ru":"~541-252 млн лет назад","es":"~541-252 millones de años","ar":"~541-252 مليون سنة"},"title":{"zh":"古生代：生命大爆发","en":"Paleozoic: Explosion of Life","fr":"Paléozoïque: Explosion de la vie","ru":"Палеозой: Взрыв жизни","es":"Paleozoico: Explosión de la vida","ar":"الباليوزوي: انفجار الحياة"},"events":[{"title":{"zh":"寒武纪大爆发","en":"Cambrian Explosion","fr":"Explosion cambrienne","ru":"Кембрийский взрыв","es":"Explosión Cámbrica","ar":"الانفجار الكمبري"},"desc":{"zh":"约5.41亿年前，几乎所有现代动物门类在短短2000万年内突然出现，生物多样性呈指数级增长，是演化史上最戏剧性的事件。","en":"About 541 million years ago, nearly all modern animal phyla appeared within ~20 million years, with exponential biodiversity increase — the most dramatic event in evolutionary history.","fr":"Il y a environ 541 millions d'années, presque tous les embranchements animaux modernes sont apparus en ~20 millions d'années, avec une croissance exponentielle de la biodiversité — l'événement le plus dramatique de l'histoire évolutive.","ru":"Около 541 млн лет назад почти все современные типы животных появились за ~20 млн лет с экспоненциальным ростом биоразнообразия — самое драматичное событие в истории эволюции.","es":"Hace unos 541 millones de años, casi todos los filos animales modernos aparecieron en ~20 millones de años, con crecimiento exponencial de la biodiversidad — el evento más dramático de la historia evolutiva.","ar":"قبل نحو 541 مليون سنة، ظهرت كل شعب الحيوانات الحديثة تقريباً خلال ~20 مليون سنة، بنمو أسي للتنوع البيولوجي — أكثر الأحداث إثارة في تاريخ التطور."}},{"title":{"zh":"脊椎动物出现","en":"Vertebrates Appear","fr":"Apparition des vertébrés","ru":"Появление позвоночных","es":"Aparición de los vertebrados","ar":"ظهور الفقاريات"},"desc":{"zh":"最早的脊椎动物——无颌鱼类出现，脊椎骨的创新使神经系统得到保护，为后来脊椎动物的统治地位奠定基础。","en":"The earliest vertebrates — jawless fish — appeared; the innovation of the vertebral column protected the nervous system, laying the foundation for vertebrate dominance.","fr":"Les premiers vertébrés — poissons sans mâchoire — sont apparus; l'innovation de la colonne vertébrale a protégé le système nerveux, posant les fondations de la dominance des vertébrés.","ru":"Первые позвоночные — бесчелюстные рыбы — появились; инновация позвоночника защитила нервную систему, заложив основу господства позвоночных.","es":"Los primeros vertebrados — peces sin mandíbula — aparecieron; la innovación de la columna vertebral protegió el sistema nervioso, sentando las bases del dominio de los vertebrados.","ar":"ظهرت أول الفقاريات — أسماك بلا فكين — ابتكار العمود الفقري حمى الجهاز العصبي، واضعاً أساس هيمنة الفقاريات."}},{"title":{"zh":"生物登陆：植物","en":"Plants Colonize Land","fr":"Plantes colonisent la terre","ru":"Растения выходят на сушу","es":"Las plantas colonizan la tierra","ar":"النباتات تغزو اليابسة"},"desc":{"zh":"约4.7亿年前，苔藓植物率先登陆，随后维管植物演化出根茎叶系统，彻底改变了地表面貌和土壤形成。","en":"About 470 million years ago, mosses pioneered land; vascular plants then evolved root-stem-leaf systems, transforming the land surface and soil formation.","fr":"Il y a environ 470 millions d'années, les mousses ont été pionnières sur terre; les plantes vasculaires ont ensuite évolué des systèmes racines-tiges-feuilles, transformant la surface terrestre et la formation des sols.","ru":"Около 470 млн лет назад мхи первыми вышли на сушу; сосудистые растения развили корни, стебли и листья, преобразив поверхность суши и почвообразование.","es":"Hace unos 470 millones de años, los musgos fueron pioneros en tierra; las plantas vasculares luego evolucionaron sistemas de raíz-tallo-hoja, transformando la superficie terrestre y la formación de suelos.","ar":"قبل نحو 470 مليون سنة، كانت الأشنات رواد اليابسة؛ ثم طوّرت النباتات الوعائية أنظمة جذور-سيقان-أوراق، محوّلةً سطح اليابسة وتكوين التربة."}},{"title":{"zh":"节肢动物登陆","en":"Arthropods on Land","fr":"Arthropodes sur terre","ru":"Членистоногие на суше","es":"Artrópodos en tierra","ar":"المفصليات على اليابسة"},"desc":{"zh":"节肢动物凭借外骨骼保水和支撑身体的优势成为最早登陆的动物，迅速占据各类陆地生态位，昆虫后来成为物种最丰富的类群。","en":"Arthropods, with exoskeletons for water retention and body support, became the first land animals, rapidly occupying terrestrial niches; insects later became the most species-rich group.","fr":"Les arthropodes, avec des exosquelettes pour la rétention d'eau et le soutien, sont devenus les premiers animaux terrestres, occupant rapidement des niches; les insectes sont ensuite devenus le groupe le plus riche en espèces.","ru":"Членистоногие с экзоскелетом для удержания воды и опоры стали первыми сухопутными животными; насекомые позже стали самой богатой видами группой.","es":"Los artrópodos, con exoesqueletos para retención de agua y soporte, se convirtieron en los primeros animales terrestres, ocupando rápidamente nichos; los insectos luego se volvieron el grupo más rico en especies.","ar":"بأصدافها الخارجية للاحتفاظ بالماء والدعم، أصبحت المفصليات أول الحيوانات البرية، محتلةً الموائل بسرعة؛ ثم أصبحت الحشرات المجموعة الأكثر ثراءً بالأنواع."}},{"title":{"zh":"鱼类时代","en":"Age of Fishes","fr":"Âge des poissons","ru":"Эпоха рыб","es":"Era de los peces","ar":"عصر الأسماك"},"desc":{"zh":"泥盆纪海洋中鱼类空前繁盛，盾皮鱼、棘鱼、肉鳍鱼等各类群多样化发展，肉鳍鱼最终演化出四足动物。","en":"Devonian oceans saw unprecedented fish prosperity: placoderms, acanthodians, and lobe-finned fishes diversified, with lobe-finned fishes eventually evolving into tetrapods.","fr":"Les océans dévoniens ont connu une prospérité piscicole sans précédent: placodermes, acanthodiens et poissons à nageoires lobées se sont diversifiés, ces derniers donnant finalement les tétrapodes.","ru":"В девонских океанах рыбы невероятно процветали: плакодермы, акантоды и кистепёрые рыбы диверсифицировались, последние дали начало тетраподам.","es":"Los océanos devónicos vieron una prosperidad piscícola sin precedentes: placodermos, acantodios y peces de aletas lobuladas se diversificaron, estos últimos dando origen a los tetrápodos.","ar":"شهدت محيطات الديفوني ازدهاراً سمكياً غير مسبوق: تنوعت الأسماك المدرعة والشوكية والزعنفية الفصية، والأخيرة أعطت في النهاية رباعيات الأطراف."}},{"title":{"zh":"四足动物登陆","en":"Tetrapods Move to Land","fr":"Tétrapodes sur terre","ru":"Тетраподы выходят на сушу","es":"Tetrápodos en tierra","ar":"رباعيات الأطراف على اليابسة"},"desc":{"zh":"约3.9亿年前，肉鳍鱼演化出四肢和肺，逐渐从水生向陆生过渡，提塔利克鱼等过渡化石记录了这一伟大转变。","en":"About 390 million years ago, lobe-finned fishes evolved limbs and lungs, gradually transitioning from aquatic to terrestrial; transitional fossils like Tiktaalik document this great transformation.","fr":"Il y a environ 390 millions d'années, les poissons à nageoires lobées ont évolué des membres et des poumons, passant progressivement de l'eau à la terre; des fossiles de transition comme Tiktaalik documentent cette grande transformation.","ru":"Около 390 млн лет назад кистепёрые рыбы развили конечности и лёгкие, постепенно переходя от воды к суше; переходные ископаемые вроде Tiktaalik фиксируют это великое превращение.","es":"Hace unos 390 millones de años, los peces de aletas lobuladas evolucionaron extremidades y pulmones, transitando gradualmente del agua a tierra; fósiles transicionales como Tiktaalik documentan esta gran transformación.","ar":"قبل نحو 390 مليون سنة، طوّرت أسماك الزعانف الفصية أطرافاً ورئتين، تنتقل تدريجياً من الماء إلى اليابسة؛ أحافير انتقالية كتيكتاليك توثق هذا التحويل العظيم."}},{"title":{"zh":"石炭纪森林","en":"Carboniferous Forests","fr":"Forêts carbonifères","ru":"Каменноугольные леса","es":"Bosques carboníferos","ar":"غابات الكربون"},"desc":{"zh":"约3.59-2.99亿年前，茂密的蕨类森林覆盖大陆，大量有机碳被埋藏形成煤炭，大气含氧量飙升至35%。","en":"About 359-299 million years ago, dense fern forests covered continents; massive organic carbon burial formed coal deposits, and atmospheric oxygen soared to 35%.","fr":"Il y a environ 359-299 millions d'années, de denses forêts de fougères couvraient les continents; l'enfouissement massif de carbone organique a formé des gisements de charbon, et l'oxygène atmosphérique a grimpé à 35%.","ru":"Около 359-299 млн лет назад плотные папоротниковые леса покрывали материки; массовое захоронение органического углерода образовало уголь, а кислород поднялся до 35%.","es":"Hace unos 359-299 millones de años, densos bosques de helechos cubrieron los continentes; el enterramiento masivo de carbono orgánico formó depósitos de carbón, y el oxígeno atmosférico subió a 35%.","ar":"قبل نحو 359-299 مليون سنة، غطت غابات سراخس كثيفة القارات؛ دفن الكربون العضوي بكميات هائلة شكّل رواسب الفحم، وصعد الأكسجين الجوي إلى 35%."}},{"title":{"zh":"羊膜动物出现","en":"Amniotes Evolve","fr":"Évolution des amniotes","ru":"Эволюция амниот","es":"Evolución de los amniotas","ar":"تطور السلويات"},"desc":{"zh":"羊膜卵的发明使动物完全摆脱对水的繁殖依赖，爬行动物迅速扩散到干旱内陆，开启了陆生脊椎动物的全新时代。","en":"The invention of the amniotic egg freed animals from reproductive dependence on water; reptiles rapidly spread into arid interiors, opening a new era for terrestrial vertebrates.","fr":"L'invention de l'œuf amniotique a libéré les animaux de la dépendance reproductive à l'eau; les reptiles se sont rapidement répandus dans les intérieurs arides, ouvrant une nouvelle ère pour les vertébrés terrestres.","ru":"Изобретение амниотического яйца освободило животных от размножения в воде; рептилии быстро расселились по засушливым внутренним районам, открыв новую эру для наземных позвоночных.","es":"La invención del huevo amniótico liberó a los animales de la dependencia reproductiva del agua; los reptiles se dispersaron rápidamente por los interiores áridos, abriendo una nueva era para los vertebrados terrestres.","ar":"حرّف ابتكار البيضة السلوية الحيوانات من الاعتماد التكاثري على الماء؛ انتشرت الزواحف بسرعة في المناطق الداخلية القاحلة، فاتحةً عهداً جديداً للفقاريات البرية."}},{"title":{"zh":"盘古大陆形成","en":"Pangaea Forms","fr":"Formation de la Pangée","ru":"Формирование Пангеи","es":"Formación de Pangea","ar":"تكوين بانجيا"},"desc":{"zh":"约3.35亿年前，各大陆聚合形成盘古超大陆，统一陆地和海洋格局深刻改变了全球气候环流和生物分布。","en":"About 335 million years ago, continents merged to form the supercontinent Pangaea, whose unified land-ocean configuration profoundly altered global climate circulation and species distribution.","fr":"Il y a environ 335 millions d'années, les continents ont fusionné pour former le supercontinent Pangée, dont la configuration terre-océan unifiée a profondément modifié la circulation climatique globale et la distribution des espèces.","ru":"Около 335 млн лет назад материки объединились в суперконтинент Пангея, чья конфигурация суши и океана глубоко изменила климатическую циркуляцию и распределение видов.","es":"Hace unos 335 millones de años, los continentes se fusionaron formando el supercontinente Pangea, cuya configuración unificada tierra-océano alteró profundamente la circulación climática global y la distribución de especies.","ar":"قبل نحو 335 مليون سنة، اتحدت القارات مكوّنةً قارة بانجيا العظمى، التي غيّر تكوينها الموحد للأرض والمحيط دوران المناخ العالمي وتوزيع الأنواع بعمق."}},{"title":{"zh":"二叠纪大灭绝","en":"Permian Mass Extinction","fr":"Extinction de masse permienne","ru":"Пермское вымирание","es":"Extinción masiva del Pérmico","ar":"الانقراض الجماعي البرمي"},"desc":{"zh":"约2.52亿年前，西伯利亚超级火山喷发导致96%海洋物种灭绝，是地球史上最严重的生物危机，但也为恐龙崛起腾出生态空间。","en":"About 252 million years ago, Siberian supervolcano eruptions caused 96% of marine species to go extinct — Earth's worst biological crisis, which also freed ecological space for dinosaur rise.","fr":"Il y a environ 252 millions d'années, des éruptions supervolcaniques sibériennes ont causé l'extinction de 96% des espèces marines — la pire crise biologique terrestre, qui libéra aussi l'espace écologique pour l'essor des dinosaures.","ru":"Около 252 млн лет назад извержения сибирских супервулканов уничтожили 96% морских видов — худший биологический кризис, но освободивший ниши для динозавров.","es":"Hace unos 252 millones de años, erupciones supervolcánicas siberianas causaron la extinción del 96% de las especies marinas — la peor crisis biológica terrestre, que también liberó espacio ecológico para el auge de los dinosaurios.","ar":"قبل نحو 252 مليون سنة، تسببت ثورات بركانية عملاقة في سيبيريا في انقراض 96% من الأنواع البحرية — أسوأ أزمة بيولوجية، التي حررت أيضاً المجال البيئي لصعود الديناصورات."}}],"insight":{"positive":{"zh":"多样性是抗风险策略——寒武纪大爆发产生了海量身体构型，即使大灭绝消灭了95%物种，剩余5%仍足以重建整个生态系统。","en":"Diversity is risk management — the Cambrian Explosion produced vast body plans; even when mass extinctions eliminated 95% of species, the remaining 5% sufficed to rebuild entire ecosystems.","fr":"La diversité est la gestion des risques — l'explosion cambrienne a produit de vastes plans d'organisation; même quand les extinctions éliminaient 95% des espèces, les 5% restants suffisaient à reconstruire des écosystèmes entiers.","ru":"Разнообразие — управление рисками: Кембрийский взрыв создал множество планов строения; даже при уничтожении 95% видов оставшихся 5% хватило для восстановления экосистем.","es":"La diversidad es gestión de riesgos — la Explosión Cámbrica produjo vastos planes corporales; incluso cuando las extinciones eliminaron 95% de las especies, el 5% restante bastó para reconstruir ecosistemas enteros.","ar":"التنوع هو إدارة المخاطر — أنتج الانفجار الكمبري خططاً جسدية هائلة؛ حتى عندما أزالت الانقراضات 95% من الأنواع، كفى 5% المتبقية لإعادة بناء النظم البيئية بأكملها."},"warning":{"zh":"超级灾害不可预测——二叠纪大灭绝由火山超级喷发引发，远超任何生物适应能力。文明需为低概率高破坏事件做准备。","en":"Super-disasters are unpredictable — the Permian extinction was triggered by supervolcano eruptions far beyond any organism's adaptive capacity. Civilization must prepare for low-probability, high-impact events.","fr":"Les super-catastrophes sont imprévisibles — l'extinction permienne a été déclenchée par des éruptions supervolcaniques dépassant la capacité d'adaptation de tout organisme. La civilisation doit se préparer aux événements à faible probabilité et fort impact.","ru":"Сверхкатастрофы непредсказуемы — пермское вымирание вызвано супервулканизмом, превосходящим адаптацию любого организма. Цивилизация должна готовиться к редким, разрушительным событиям.","es":"Las supercatástrofes son impredecibles — la extinción permica fue desencadenada por erupciones supervolcánicas más allá de la capacidad adaptativa de cualquier organismo. La civilización debe prepararse para eventos de baja probabilidad y alto impacto.","ar":"ال.superكوارث لا يمكن التنبؤ بها — أطلق الانقراض البرمي ثورات بركانية هائلة تتجاوز قدرة أي كائن على التكيف. يجب أن تستعد الحضارة لأحداث احتمالها منخفض وتأثيرها عالٍ."}}},{"id":"eh5","era":{"zh":"约2.52亿-6600万年前","en":"~252-66 million years ago","fr":"~252-66 millions d'années","ru":"~252-66 млн лет назад","es":"~252-66 millones de años","ar":"~252-66 مليون سنة"},"title":{"zh":"中生代：巨兽帝国","en":"Mesozoic: Age of Giants","fr":"Mésozoïque: Ère des géants","ru":"Мезозой: Эра гигантов","es":"Mesozoico: Era de los gigantes","ar":"الميزوزوي: عصر العمالقة"},"events":[{"title":{"zh":"恐龙崛起","en":"Rise of Dinosaurs","fr":"Essor des dinosaures","ru":"Восхождение динозавров","es":"Auge de los dinosaurios","ar":"صعود الديناصورات"},"desc":{"zh":"二叠纪大灭绝后生态空位被迅速填补，恐龙凭借直立姿态和高效呼吸系统在三叠纪晚期崛起，随后统治地球1.6亿年。","en":"After the Permian extinction emptied ecological niches, dinosaurs rose in the late Triassic with erect posture and efficient respiration, then dominated Earth for 160 million years.","fr":"Après l'extinction permienne, les dinosaures sont apparus au Trias tardif avec une posture dressée et une respiration efficace, dominant ensuite la Terre pendant 160 millions d'années.","ru":"После пермского вымирания динозавры заняли пустые ниши в позднем триасе с прямой походкой и эффективным дыханием, затем доминировали 160 млн лет.","es":"Tras la extinción permica, los dinosaurios surgieron en el Triásico tardío con postura erecta y respiración eficiente, dominando luego la Tierra durante 160 millones de años.","ar":"بعد الانقراض البرمي، ظهرت الديناصورات في الترياسي المتأخر بوضوع منتصب وتنفس فعال، ثم هيمنت على الأرض لمدة 160 مليون سنة."}},{"title":{"zh":"哺乳动物出现","en":"First Mammals","fr":"Premiers mammifères","ru":"Первые млекопитающие","es":"Primeros mamíferos","ar":"أول الثدييات"},"desc":{"zh":"约2.25亿年前，小型哺乳动物与恐龙同时出现，但被恐龙压制在夜行和穴居生态位中，以温血和听觉优势蛰伏等待。","en":"About 225 million years ago, small mammals appeared alongside dinosaurs but were suppressed into nocturnal and burrowing niches, biding their time with warm-bloodedness and superior hearing.","fr":"Il y a environ 225 millions d'années, de petits mammifères sont apparus aux côtés des dinosaures mais furent relégués aux niches nocturnes et fouisseuses, attendant leur heure avec leur sang chaud et leur ouïe supérieure.","ru":"Около 225 млн лет назад мелкие млекопитающие появились вместе с динозаврами, но были оттеснены в ночные и норные ниши, выжидая с теплокровностью и лучшим слухом.","es":"Hace unos 225 millones de años, pequeños mamíferos aparecieron junto a los dinosaurios pero fueron relegados a nichos nocturnos y cavícolas, aguardando su momento con sangre caliente y superior audición.","ar":"قبل نحو 225 مليون سنة، ظهرت ثدييات صغيرة إلى جانب الديناصورات لكنها حُصرت في مواحل ليلية وحفارة، منتظرةً وقتها بدمها الحار وسمعها المتفوق."}},{"title":{"zh":"三叠纪-侏罗纪灭绝","en":"Triassic-Jurassic Extinction","fr":"Extinction Trias-Jurassique","ru":"Триасово-юрское вымирание","es":"Extinción Triásico-Jurásica","ar":"انقراض الترياسي-الجوراسي"},"desc":{"zh":"约2.01亿年前，大规模火山活动导致又一次生物危机，消灭了恐龙的许多竞争者，为侏罗纪恐龙大辐射扫清了道路。","en":"About 201 million years ago, massive volcanism caused another biological crisis, eliminating many dinosaur competitors and clearing the path for Jurassic dinosaur radiation.","fr":"Il y a environ 201 millions d'années, un volcanisme massif a causé une autre crise biologique, éliminant de nombreux concurrents des dinosaures et ouvrant la voie à la radiation jurassique.","ru":"Около 201 млн лет назад масштабный вулканизм вызвал новый кризис, уничтожив многих конкурентов динозавров и расчистив путь для их юрской радиации.","es":"Hace unos 201 millones de años, un volcanismo masivo causó otra crisis biológica, eliminando a muchos competidores de los dinosaurios y despejando el camino para la radiación jurásica.","ar":"قبل نحو 201 مليون سنة، تسبب نشاط بركاني هائل في أزمة بيولوجية أخرى، مزيلياً العديد من منافسي الديناصورات وممهد الطريق للإشعاع الجوراسي."}},{"title":{"zh":"侏罗纪恐龙多样化","en":"Jurassic Dinosaur Diversity","fr":"Diversité des dinosaures jurassiques","ru":"Разнообразие юрских динозавров","es":"Diversidad de dinosaurios jurásicos","ar":"تنوع ديناصورات الجوراسي"},"desc":{"zh":"侏罗纪温暖湿润的气候使恐龙空前繁盛，蜥脚类长到30米以上，兽脚类成为顶级掠食者，翼龙征服了天空。","en":"Jurassic's warm, humid climate enabled unprecedented dinosaur prosperity: sauropods grew over 30 meters, theropods became apex predators, and pterosaurs conquered the skies.","fr":"Le climat chaud et humide du Jurassique a permis une prospérité inédite: les sauropodes dépassèrent 30 mètres, les théropodes devinrent super-prédateurs, et les ptérosaures conquirent le ciel.","ru":"Тёплый влажный юрский климат обеспечил небывалый расцвет динозавров: зауроподы вырастали свыше 30 м, тераподы стали топ-хищниками, птерозавры покорили небо.","es":"El clima cálido y húmedo del Jurásico permitió una prosperidad sin precedentes: los sauropodos superaron 30 metros, los terópodos se volvieron superpredadores, y los pterosaurios conquistaron el cielo.","ar":"مناخ الجوراسي الدافئ الرطب مكّن ازدهاراً غير مسبوق: تجاوزت الصوروبودات 30 متراً، أصبحت الثيروبودات مفترسات عليا، وغزا التيروصورات السماء."}},{"title":{"zh":"鸟类起源","en":"Origin of Birds","fr":"Origine des oiseaux","ru":"Происхождение птиц","es":"Origen de las aves","ar":"أصل الطيور"},"desc":{"zh":"约1.5亿年前，小型兽脚类恐龙演化出羽毛和飞行能力，始祖鸟记录了恐龙向鸟类的过渡，恐龙并未灭绝而是变成了鸟。","en":"About 150 million years ago, small theropod dinosaurs evolved feathers and flight; Archaeopteryx records the dinosaur-to-bird transition — dinosaurs didn't go extinct, they became birds.","fr":"Il y a environ 150 millions d'années, de petits dinosaures théropodes ont évolué plumes et vol; Archaeopteryx enregistre la transition dinosaure-oiseau — les dinosaures ne se sont pas éteints, ils sont devenus des oiseaux.","ru":"Около 150 млн лет назад мелкие тераподы развили перья и полёт; Archaeopteryx фиксирует переход динозавров в птиц — динозавры не вымерли, а стали птицами.","es":"Hace unos 150 millones de años, pequeños dinosaurios terópodos evolucionaron plumas y vuelo; Archaeopteryx registra la transición dinosaurio-ave — los dinosaurios no se extinguieron, se convirtieron en aves.","ar":"قبل نحو 150 مليون سنة، طوّرت ديناصورات ثيروبودية صغيرة ريشاً وطيراناً؛ يوثق أحفورة الأركيوبتركس الانتقال من الديناصور إلى الطائر — الديناصورات لم تنقرض، بل صارت طيوراً."}},{"title":{"zh":"被子植物出现","en":"Angiosperms Appear","fr":"Apparition des angiospermes","ru":"Появление покрытосеменных","es":"Aparición de las angiospermas","ar":"ظهور كاسيات البذور"},"desc":{"zh":"约1.3亿年前，开花植物出现，花和果实的高效繁殖策略使它们迅速取代裸子植物，重塑了陆地生态系统和食物链。","en":"About 130 million years ago, flowering plants appeared; the efficient reproductive strategy of flowers and fruits enabled them to rapidly replace gymnosperms, reshaping terrestrial ecosystems.","fr":"Il y a environ 130 millions d'années, les plantes à fleurs sont apparues; la stratégie reproductive efficace des fleurs et fruits leur a permis de remplacer rapidement les gymnospermes, remodelant les écosystèmes terrestres.","ru":"Около 130 млн лет назад появились цветковые растения; эффективная стратегия цветков и плодов позволила им быстро вытеснить голосеменные, перестроив наземные экосистемы.","es":"Hace unos 130 millones de años, aparecieron las plantas con flor; la eficiente estrategia reproductiva de flores y frutos les permitió reemplazar rápidamente a las gimnospermas, reestructurando los ecosistemas terrestres.","ar":"قبل نحو 130 مليون سنة، ظهرت النباتات المزهرة؛ استراتيجيتها التكاثرية الفعالة من الأزهار والثمار مكنتها من استبدال عاريات البذور بسرعة، معيداً هيكلة النظم البيئية البرية."}},{"title":{"zh":"大陆漂移分裂","en":"Continental Drift & Separation","fr":"Dérive et séparation des continents","ru":"Дрейф и раскол континентов","es":"Deriva y separación de continentes","ar":"انجراف وانفصال القارات"},"desc":{"zh":"盘古大陆逐步分裂为劳亚大陆和冈瓦纳大陆，继而进一步碎裂，大陆隔离促进了生物地域性分化和物种多样性。","en":"Pangaea gradually split into Laurasia and Gondwana, then further fragmented; continental isolation promoted biogeographic differentiation and species diversity.","fr":"La Pangée s'est progressivement scindée en Laurasie et Gondwana, puis fragmentée davantage; l'isolation continentale a favorisé la différenciation biogéographique et la diversité des espèces.","ru":"Пангея постепенно раскололась на Лавразию и Гондвану, затем распалась дальше; изоляция материков способствовала биогеографической дифференциации и разнообразию видов.","es":"Pangea se dividió gradualmente en Laurasia y Gondwana, luego se fragmentó más; el aislamiento continental favoreció la diferenciación biogeográfica y la diversidad de especies.","ar":"انقسمت بانجيا تدريجياً إلى لوراسيا وغندوانا، ثم تفتتت أكثر؛ عزلة القارات عززت التمايز الجغرافي الحيوي وتنوع الأنواع."}},{"title":{"zh":"昆虫与花协同进化","en":"Insect-Flower Coevolution","fr":"Coévolution insectes-fleurs","ru":"Коэволюция насекомых и цветков","es":"Coevolución insectos-flores","ar":"التطور المشترك للحشرات والأزهار"},"desc":{"zh":"开花植物与传粉昆虫之间形成了精密的互利共生关系，这种协同进化推动了双方物种数量的爆炸式增长。","en":"Flowering plants and pollinating insects developed precise mutualistic relationships; this coevolution drove explosive species diversification in both groups.","fr":"Les plantes à fleurs et les insectes pollinisateurs ont développé des relations mutualistes précises; cette coévolution a entraîné une diversification explosive des espèces dans les deux groupes.","ru":"Цветковые растения и насекомые-опылители развили точные мутуалистические отношения; эта коэволюция вызвала взрывной рост видового разнообразия обеих групп.","es":"Las plantas con flor y los insectos polinizadores desarrollaron relaciones mutualistas precisas; esta coevolución condujo a una diversificación explosiva de especies en ambos grupos.","ar":"طوّرت النباتات المزهرة والحشرات الملقحة علاقات تكافلية دقيقة؛ قاد هذا التطور المشترك تنوّعاً انفجارياً للأنواع في كلتا المجموعتين."}},{"title":{"zh":"白垩纪内陆海道","en":"Cretaceous Interior Seaways","fr":"Voies marines intérieures crétacées","ru":"Меловые внутренние моря","es":"Vías marinas interiores del Cretácico","ar":"الممرات البحرية الداخلية في الطباشيري"},"desc":{"zh":"白垩纪高海平面淹没了大陆内部，形成浅海道，海洋生物空前繁盛，大量钙质生物沉降形成白垩层。","en":"Cretaceous high sea levels flooded continental interiors forming shallow seaways; marine life flourished unprecedentedly, and massive calcareous organisms settled to form chalk layers.","fr":"Le haut niveau marin crétacé a inondé les intérieurs continentaux formant des voies marines peu profondes; la vie marine a prospéré sans précédent, et d'immenses organismes calcaires se sont déposés formant des couches de craie.","ru":"Высокий меловой уровень моря затопил внутренние части континентов; морская жизнь процветала, а масса известковых организмов оседала, образуя меловые слои.","es":"El alto nivel del mar cretácico inundó los interiores continentales formando vías marinas someras; la vida marina floreció sin precedentes, y masivos organismos calcáreos se depositaron formando capas de creta.","ar":"غمر ارتفاع مستوى البحر في الطباشيري الأجزاء الداخلية للقارات مكوناً ممرات بحرية ضحلة؛ ازدهرت الحياة البحرية بشكل غير مسبوق، وترسبت كائنات كلسية هائلة مكوّنة طبقات الطباشير."}},{"title":{"zh":"K-Pg大灭绝","en":"K-Pg Mass Extinction","fr":"Extinction de masse K-Pg","ru":"Мел-палеогеновое вымирание","es":"Extinción masiva K-Pg","ar":"الانقراض الجماعي K-Pg"},"desc":{"zh":"6600万年前，一颗10公里小行星撞击墨西哥尤卡坦半岛，全球火灾、海啸和尘埃遮日导致非鸟恐龙和75%物种灭绝。","en":"66 million years ago, a 10-km asteroid struck Mexico's Yucatan; global fires, tsunamis, and sunlight-blocking dust caused non-avian dinosaur and 75% species extinction.","fr":"Il y a 66 millions d'années, un astéroïde de 10 km a frappé la péninsule du Yucatan; incendies globaux, tsunamis et poussière bloquant le soleil ont causé l'extinction des dinosaures non-aviens et de 75% des espèces.","ru":"66 млн лет назад 10-км астероид ударил по полуострову Юкатан; глобальные пожары, цунами и блокирующая солнце пыль вызвали вымирание динозавров и 75% видов.","es":"Hace 66 millones de años, un asteroide de 10 km golpeó la península de Yucatán; incendios globales, tsunamis y polvo bloqueando el sol causaron la extinción de los dinosaurios no avianos y del 75% de las especies.","ar":"قبل 66 مليون سنة، اصطدم كويكب بقطر 10 كم بشبه جزيرة يوكاتان؛ الحرائق العالمية والتسونامي والغبار الحاجب للشمس تسبب في انقراض الديناصورات غير الطائرة و75% من الأنواع."}}],"insight":{"positive":{"zh":"弱者生存——哺乳动物在恐龙阴影下蛰伏1.6亿年，却因体型小、适应力强而在灾难中幸存。小而韧比大而强更具长期生存优势。","en":"The meek shall inherit — mammals lurked in dinosaurs' shadow for 160 million years, yet survived the catastrophe due to small size and adaptability. Small and resilient beats large and powerful for long-term survival.","fr":"Les humbles hériteront — les mammifères se cachèrent 160 millions d'années dans l'ombre des dinosaures, mais survécurent à la catastrophe grâce à leur petite taille et leur adaptabilité. Petit et résilient bat grand et puissant pour la survie à long terme.","ru":"Кроткие унаследуют — млекопитающие прятались в тени динозавров 160 млн лет, но пережили катастрофу благодаря малому размеру и адаптивности. Малый и стойкий побеждает большого и сильного.","es":"Los mansos heredarán — los mamíferos se ocultaron 160 millones de años en la sombra de los dinosaurios, pero sobrevivieron la catástrofe gracias a su pequeño tamaño y adaptabilidad. Pequeño y resiliente vence a grande y poderoso para la supervivencia a l
