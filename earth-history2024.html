argo plazo.","ar":"يَرِثُ الودعاء — اختبأت الثدييات 160 مليون سنة في ظل الديناصورات، لكنها نجت من الكارثة بصغر حجمها وتكيفها. الصغير المرن يتفوق على الكبير القوي للبقاء على المدى الطويل."},"warning":{"zh":"统治地位不等于永久安全——恐龙占据顶级生态位1.6亿年，却在一天之内被天体撞击消灭。技术文明同样面对宇宙级威胁。","en":"Dominance ≠ permanent safety — dinosaurs held top niches for 160 million years, yet were wiped out in a single day by an impact. Technological civilization faces similar cosmic-scale threats.","fr":"Domination ≠ sécurité permanente — les dinosaures ont occupé les plus hautes niches pendant 160 millions d'années, mais furent anéantis en un jour par un impact. La civilisation technologique fait face à des menaces à échelle cosmique similaires.","ru":"Доминирование ≠ вечная безопасность — динозавры держали верхние ниши 160 млн лет, но были уничтожены за один день ударом. Технологическая цивилизация сталкивается с аналогичными космическими угрозами.","es":"Dominación ≠ seguridad permanente — los dinosaurios ocuparon las nichos más altos durante 160 millones de años, pero fueron aniquilados en un día por un impacto. La civilización tecnológica enfrenta amenazas a escala cósmica similares.","ar":"الهيمنة ≠ أمان دائم — احتلت الديناصورات أعلى الموائل لمدة 160 مليون سنة، لكنها أُبيدت في يوم واحد باصطدام. الحضارة التكنولوجية تواجه تهديدات مماثلة على النطاق الكوني."}}},{"id":"eh6","era":{"zh":"约6600万-1万年前","en":"~66 million - 10,000 years ago","fr":"~66 millions - 10 000 ans","ru":"~66 млн - 10 тыс. лет назад","es":"~66 millones - 10.000 años","ar":"~66 مليون - 10 ألف سنة"},"title":{"zh":"新生代：哺乳动物与人类曙光","en":"Cenozoic: Mammals & Human Dawn","fr":"Cénozoïque: Mammifères et aube humaine","ru":"Кайнозой: Млекопитающие и заря человечества","es":"Cenozoico: Mamíferos y albor humano","ar":"السينوزوي: الثدييات وفجر البشرية"},"events":[{"title":{"zh":"哺乳动物大辐射","en":"Mammalian Radiation","fr":"Radiation des mammifères","ru":"Радиация млекопитающих","es":"Radiación de mamíferos","ar":"إشعاع الثدييات"},"desc":{"zh":"恐龙灭绝后，哺乳动物在不到2000万年内占据了从食草到食肉、从陆地到海洋的几乎所有大型动物生态位。","en":"After dinosaurs' extinction, mammals occupied nearly all large-animal niches — from herbivores to carnivores, land to ocean — in less than 20 million years.","fr":"Après l'extinction des dinosaures, les mammifères ont occupé presque toutes les niches de grands animaux — herbivores, carnivores, terrestres et marins — en moins de 20 millions d'années.","ru":"После вымирания динозавров млекопитающие заняли почти все ниши крупных животных — от травоядных до хищников, от суши до океана — менее чем за 20 млн лет.","es":"Tras la extinción de los dinosaurios, los mamíferos ocuparon casi todos los nichos de grandes animales — herbívoros, carnívoros, terrestres y marinos — en menos de 20 millones de años.","ar":"بعد انقراض الديناصورات، احتلت الثدييات كل موائل الحيوانات الكبيرة تقريباً — عواشب ولواحم وبرية وبحرية — في أقل من 20 مليون سنة."}},{"title":{"zh":"灵长类出现","en":"Primates Appear","fr":"Apparition des primates","ru":"Появление приматов","es":"Aparición de los primates","ar":"ظهور الرئيسيات"},"desc":{"zh":"约5500万年前，最早的灵长类演化出抓握的双手、前视的双眼和较大的脑容量，为未来智慧生命的出现埋下种子。","en":"About 55 million years ago, the earliest primates evolved grasping hands, forward-facing eyes, and larger brains — planting the seeds for future intelligent life.","fr":"Il y a environ 55 millions d'années, les premiers primates ont évolué des mains préhensiles, des yeux orientés vers l'avant et un cerveau plus grand — semant les graines de la vie intelligente future.","ru":"Около 55 млн лет назад первые приматы развили цепкие руки, направленные вперёд глаза и больший мозг — посеяв семена будущей разумной жизни.","es":"Hace unos 55 millones de años, los primeros primates evolucionaron manos prensiles, ojos orientados al frente y un cerebro más grande — sembrando las semillas de la vida inteligente futura.","ar":"قبل نحو 55 مليون سنة، طوّرت أول الرئيسيات أيدياً قابضة للإمساك وعيوناً أمامية ودماغاً أكبر — باذرةً بذور الحياة الذكية المستقبلية."}},{"title":{"zh":"始新世-渐新世气候变冷","en":"Eocene-Oligocene Cooling","fr":"Refroidissement Éocène-Oligocène","ru":"Олигоценовое похолодание","es":"Enfriamiento Eoceno-Oligoceno","ar":"برود الإيوسين-الأوليغوسين"},"desc":{"zh":"约3400万年前，南极冰盖形成，全球气温骤降，热带物种大量灭绝，温带生态系统扩展，改变了生物分布格局。","en":"About 34 million years ago, Antarctic ice sheets formed and global temperatures dropped sharply; tropical species died out massively, temperate ecosystems expanded, reshaping species distribution.","fr":"Il y a environ 34 millions d'années, les calottes glaciaires antarctiques se sont formées et la température globale a chuté; les espèces tropicales ont massivement disparu, les écosystèmes tempérés se sont étendus.","ru":"Около 34 млн лет назад образовался антарктический ледник, глобальная температура упала; тропические виды массово вымерли, умеренные экосистемы расширились.","es":"Hace unos 34 millones de años, se formaron los casquetes polares antárticos y la temperatura global cayó; las especies tropicales murieron masivamente, los ecosistemas templados se expandieron.","ar":"قبل نحو 34 مليون سنة، تكونت الكرات الجليدية القطبية الجنوبية وانخفضت الحرارة العالمية؛ انقرضت الأنواع الاستوائية بكميات هائلة، واتسعت النظم البيئية المعتدلة."}},{"title":{"zh":"草原扩张与食草动物进化","en":"Grassland Expansion","fr":"Expansion des prairies","ru":"Расширение степей","es":"Expansión de las praderas","ar":"اتساع المراعي"},"desc":{"zh":"约2500万年前，C4草本植物大范围扩张，草原生态系统出现，推动了马、牛等善跑食草动物的快速进化。","en":"About 25 million years ago, C4 grasses expanded widely, grassland ecosystems emerged, driving rapid evolution of running herbivores like horses and cattle.","fr":"Il y a environ 25 millions d'années, les graminées C4 se sont étendues, les écosystèmes de prairies sont apparus, stimulant l'évolution rapide d'herbivores coureurs comme les chevaux et les bovins.","ru":"Около 25 млн лет назад C4-злаки широко распространились, появились степные экосистемы, стимулировав быструю эволюцию бегающих травоядных — лошадей, быков.","es":"Hace unos 25 millones de años, las gramíneas C4 se expandieron, los ecosistemas de pradera surgieron, impulsando la rápida evolución de herbívoros corredores como caballos y bovinos.","ar":"قبل نحو 25 مليون سنة، اتسعت أعشاب C4، ظهرت النظم البيئية للمراعي، دافعةً التطور السريع للعواشب العداءة كالخيل والبقر."}},{"title":{"zh":"人科分化","en":"Hominid Divergence","fr":"Divergence des hominidés","ru":"Дивергенция гоминид","es":"Divergencia de los homínidos","ar":"تباعد الهومينيدات"},"desc":{"zh":"约700万年前，人类祖先与黑猩猩祖先分化，开始直立行走。双足解放了双手，为工具使用和大脑发展创造了条件。","en":"About 7 million years ago, human ancestors diverged from chimpanzee ancestors and began bipedalism. Walking upright freed the hands, enabling tool use and brain development.","fr":"Il y a environ 7 millions d'années, les ancêtres humains se sont séparés des ancêtres des chimpanzés et ont commencé la bipédie. La marche debout a libéré les mains, enabling l'usage d'outils et le développement cérébral.","ru":"Около 7 млн лет назад предки человека отделились от предков шимпанзе и начали прямоходить. Освобождение рук позволило использовать орудия и развить мозг.","es":"Hace unos 7 millones de años, los ancestros humanos se separaron de los ancestros de los chimpancés y comenzaron el bipedismo. Caminar erguido liberó las manos, enablendo el uso de herramientas y el desarrollo cerebral.","ar":"قبل نحو 7 مليون سنة، انفصل أسلاف البشر عن أسلاف الشمبانزي وبدأوا المشي على قدمين. تحرر اليدين مكّن استخدام الأدوات وتطور الدماغ."}},{"title":{"zh":"直立人出现","en":"Homo Erectus","fr":"Homo erectus","ru":"Homo erectus","es":"Homo erectus","ar":"الإنسان المنتصب"},"desc":{"zh":"约190万年前，直立人出现，脑容量翻倍，制造标准化石器，并首次走出非洲，到达欧亚大陆各地。","en":"About 1.9 million years ago, Homo erectus appeared with doubled brain capacity, made standardized stone tools, and first migrated out of Africa across Eurasia.","fr":"Il y a environ 1,9 million d'années, Homo erectus est apparu avec une capacité cérébrale doublée, fabriquant des outils de pierre standardisés et migrant pour la première fois hors d'Afrique vers l'Eurasie.","ru":"Около 1,9 млн лет назад появился Homo erectus с удвоенным объёмом мозга, изготавливавший стандартизированные орудия и первым вышедший из Африки в Евразию.","es":"Hace unos 1,9 millones de años, Homo erectus apareció con capacidad cerebral duplicada, fabricando herramientas de piedra estandarizadas y migrando por primera vez fuera de África hacia Eurasia.","ar":"قبل نحو 1,9 مليون سنة، ظهر الإنسان المنتصب بقدرة دماغية مضاعفة، صناعة أدوات حجرية معيارية، وكان أول من هاجر من أفريقيا إلى أوراسيا."}},{"title":{"zh":"控制火","en":"Mastery of Fire","fr":"Maîtrise du feu","ru":"Овладение огнём","es":"Dominio del fuego","ar":"إتقان النار"},"desc":{"zh":"约100万年前，人类学会控制火。火提供温暖、保护、熟食，大幅提高营养吸收效率，是技术史上的第一次重大革命。","en":"About 1 million years ago, humans mastered fire. Fire provided warmth, protection, and cooked food, greatly improving nutrient absorption — the first major revolution in technology.","fr":"Il y a environ 1 million d'années, les humains ont maîtrisé le feu. Le feu a fourni chaleur, protection et nourriture cuite, améliorant grandement l'absorption des nutriments — la première révolution technologique.","ru":"Около 1 млн лет назад люди овладели огнём. Огонь дал тепло, защиту и приготовленную пищу, резко повысив усвоение питательных веществ — первая технологическая революция.","es":"Hace unos 1 millón de años, los humanos dominaron el fuego. El fuego proporcionó calor, protección y comida cocida, mejorando enormemente la absorción de nutrientes — la primera revolución tecnológica.","ar":"قبل نحو مليون سنة، أتقن البشر النار. وفرت النار الدفء والحماية والطعام المطبوخ، محسّنةً امتصاص المغذيات بشكل كبير — أول ثورة تكنولوجية."}},{"title":{"zh":"智人出现","en":"Homo Sapiens Emerges","fr":"Émergence d'Homo sapiens","ru":"Появление Homo sapiens","es":"Surgimiento del Homo sapiens","ar":"ظهور الإنسان العاقل"},"desc":{"zh":"约30万年前，智人在非洲出现，脑容量达1400毫升，具备抽象思维和复杂语言能力，成为地球上唯一幸存的人类物种。","en":"About 300,000 years ago, Homo sapiens emerged in Africa with 1400cc brain capacity, capable of abstract thought and complex language, becoming Earth's only surviving human species.","fr":"Il y a environ 300 000 ans, Homo sapiens est apparu en Afrique avec un cerveau de 1400 cc, capable de pensée abstraite et de langage complexe, devenant la seule espèce humaine survivante sur Terre.","ru":"Около 300 тыс. лет назад Homo sapiens появился в Африке с мозгом 1400 мл, способен к абстрактному мышлению и сложной речи — единственный выживший вид человека.","es":"Hace unos 300.000 años, Homo sapiens surgió en África con un cerebro de 1400 cc, capaz de pensamiento abstracto y lenguaje complejo, convirtiéndose en la única especie humana sobreviviente en la Tierra.","ar":"قبل نحو 300 ألف سنة، ظهر الإنسان العاقل في أفريقيا بدماغ 1400 سم³، قادراً على التفكير المجرد واللغة المعقدة، أصبح النوع البشري الوحيد الباقي على الأرض."}},{"title":{"zh":"认知革命","en":"Cognitive Revolution","fr":"Révolution cognitive","ru":"Когнитивная революция","es":"Revolución cognitiva","ar":"الثورة المعرفية"},"desc":{"zh":"约7万年前，智人经历了认知能力的飞跃，发展出虚构叙事、宗教信仰和大规模合作能力，使人类从普通灵长类跃升为顶级物种。","en":"About 70,000 years ago, Homo sapiens experienced a cognitive leap, developing fictional narratives, religious beliefs, and large-scale cooperation, propelling humans from ordinary primates to apex species.","fr":"Il y a environ 70 000 ans, Homo sapiens a connu un bond cognitif, développant des récits fictionnels, des croyances religieuses et une coopération à grande échelle, propulsant les humains d'un primate ordinaire à une espèce apex.","ru":"Около 70 тыс. лет назад Homo sapiens испытал когнитивный скачок, развив вымышленные нарративы, религию и масштабное сотрудничество, превратившись из обычного примата в топ-вид.","es":"Hace unos 70.000 años, Homo sapiens experimentó un salto cognitivo, desarrollando narrativas ficticias, creencias religiosas y cooperación a gran escala, impulsando a los humanos de un primate ordinario a especie ápice.","ar":"قبل نحو 70 ألف سنة، شهد الإنسان العاقل قفزة معرفية، طوّر سرداً خيالياً ومعتقدات دينية وتعاوناً واسع النطاق، دافعاً البشر من رئيسيات عادية إلى نوع مهيمن."}},{"title":{"zh":"走出非洲与全球扩散","en":"Out of Africa & Global Dispersal","fr":"Sortie d'Afrique et dispersion globale","ru":"Выход из Африки и расселение","es":"Salida de África y dispersión global","ar":"الخروج من أفريقيا والانتشار العالمي"},"desc":{"zh":"约6万年前，智人走出非洲，在数万年内扩散到欧亚、澳大利亚和美洲，沿途取代了其他古人类，成为全球性物种。","en":"About 60,000 years ago, Homo sapiens left Africa, spreading across Eurasia, Australia, and the Americas within tens of thousands of years, replacing other hominins en route.","fr":"Il y a environ 60 000 ans, Homo sapiens a quitté l'Afrique, se dispersant en Eurasie, Australie et Amériques en quelques dizaines de milliers d'années, remplaçant les autres hominines en route.","ru":"Около 60 тыс. лет назад Homo sapiens покинул Африку, за десятки тысяч лет расселившись по Евразии, Австралии и Америке, вытесняя других гомининов.","es":"Hace unos 60.000 años, Homo sapiens dejó África, dispersándose por Eurasia, Australia y las Américas en unas pocas decenas de miles de años, reemplazando a otros homininos en el camino.","ar":"قبل نحو 60 ألف سنة، غادر الإنسان العاقل أفريقيا، منتشراً في أوراسيا وأستراليا والأمريكتين خلال عشرات الألوف من السنين، مستبدلاً الهومينينات الأخرى في الطريق."}}],"insight":{"positive":{"zh":"智力是最强的生存工具——没有尖牙利爪的人类靠认知能力和大规模合作成为顶级物种，证明智慧是宇宙中最具杠杆效应的进化策略。","en":"Intelligence is the ultimate survival tool — humans without fangs or claws became the apex species through cognition and large-scale cooperation, proving intelligence is the most leveraged evolutionary strategy in the universe.","fr":"L'intelligence est l'outil de survie ultime — les humains sans crocs ni griffes sont devenus l'espèce apex grâce à la cognition et la coopération à grande échelle, prouvant que l'intelligence est la stratégie évolutive la plus efficiente dans l'univers.","ru":"Интеллект — сильнейший инструмент выживания — люди без клыков и когтей стали топ-видом через познание и масштабное сотрудничество, доказывая, что разум — самая рычажная эволюционная стратегия во вселенной.","es":"La inteligencia es la herramienta de supervivencia definitiva — los humanos sin colmillos ni garras se convirtieron en la especie ápice mediante la cognición y la cooperación a gran escala, demostrando que la inteligencia es la estrategia evolutiva más apalancada del universo.","ar":"الذكاء هو أداة البقاء القصوى — أصبح البشر بلا أنياب ولا مخالب النوع المهيمن عبر الإدراك والتعاون واسع النطاق، مثبتين أن الذكاء هو الاستراتيجية التطورية الأكثر رافعية في الكون."},"warning":{"zh":"单一物种独占地球是脆弱的——智人消灭了所有其他人类物种，如果智人自身灭绝，地球上将没有第二个智慧物种接替。","en":"Single-species dominance is fragile — Homo sapiens eliminated all other human species; if sapiens itself goes extinct, no second intelligent species exists to continue.","fr":"La domination d'une seule espèce est fragile — Homo sapiens a éliminé toutes les autres espèces humaines; si les sapiens eux-mêmes s'éteignent, aucune seconde espèce intelligente n'existe pour continuer.","ru":"Доминирование одного вида хрупко — Homo sapiens уничтожил все другие виды людей; если сами сапиенсы вымрут, второго разумного вида для продолжения не останется.","es":"El dominio de una sola especie es frágil — Homo sapiens eliminó a todas las demás especies humanas; si los propios sapiens se extinguen, no existe una segunda especie inteligente para continuar.","ar":"هيمنة نوع واحد هشة — أباد الإنسان العاقل جميع الأنواع البشرية الأخرى؛ إذا انقرض السايينز أنفسهم، لا يوجد نوع ذكي ثانٍ للمواصلة."}}},{"id":"eh7","era":{"zh":"约1万-3000年前","en":"~10,000 - 3,000 BCE","fr":"~10 000 - 3 000 av. J.-C.","ru":"~10 000 - 3000 г. до н.э.","es":"~10.000 - 3.000 a.C.","ar":"~10.000 - 3.000 ق.م"},"title":{"zh":"农业革命：文明奠基","en":"Agricultural Revolution: Foundation of Civilization","fr":"Révolution agricole: Fondation de la civilisation","ru":"Неолитическая революция: основа цивилизации","es":"Revolución agrícola: Fundación de la civilización","ar":"الثورة الزراعية: تأسيس الحضارة"},"events":[{"title":{"zh":"新月沃地农业起源","en":"Fertile Crescent Agriculture","fr":"Agriculture du Croissant fertile","ru":"Земледелие Плодородного полумесяца","es":"Agricultura del Creciente Fértil","ar":"زراعة الهلال الخصيب"},"desc":{"zh":"约1.2万年前，末次冰期结束后，西亚新月沃地的人们开始系统性地种植野生谷物，标志着人类从食物采集者转变为食物生产者。","en":"About 12,000 years ago, after the last Ice Age, people in West Asia's Fertile Crescent began systematically cultivating wild grains, marking humanity's shift from foragers to food producers.","fr":"Il y a environ 12 000 ans, après la dernière ère glaciaire, les habitants du Croissant fertile en Asie occidentale ont commencé à cultiver systématiquement des céréales sauvages, marquant le passage de cueilleurs à producteurs.","ru":"Около 12 тыс. лет назад после последнего ледникового периода люди Плодородного полумесяца начали систематически выращивать дикие злаки — переход от собирателей к производителям пищи.","es":"Hace unos 12.000 años, tras la última Edad de Hielo, los habitantes del Creciente Fértil en Asia occidental comenzaron a cultivar sistemáticamente cereales silvestres, marcando el paso de recolectores a productores.","ar":"قبل نحو 12 ألف سنة، بعد العصر الجليدي الأخير، بدأ سكان الهلال الخصيب في غرب آسيا بزراعة الحبوب البرية بشكل منهجي، معلنين التحول من جامعين إلى منتجين."}},{"title":{"zh":"小麦与大麦驯化","en":"Wheat & Barley Domestication","fr":"Domestication du blé et de l'orge","ru":"Одомашнение пшеницы и ячменя","es":"Domesticación del trigo y la cebada","ar":"تدجين القمح والشعير"},"desc":{"zh":"人类通过数千年选择育种，将野生小麦改造为产量高、易收割的栽培种，这一过程奠定了欧亚大陆农业文明的基础。","en":"Through thousands of years of selective breeding, humans transformed wild wheat into high-yield, easy-to-harvest cultivars, laying the foundation of Eurasian agricultural civilization.","fr":"Par des millénaires de sélection, les humains ont transformé le blé sauvage en variétés à haut rendement et faciles à récolter, fondant la base de la civilisation agricole eurasienne.","ru":"За тысячи лет селекции люди превратили дикую пшеницу в высокоурожайные сорта, заложив основу евразийской земледельческой цивилизации.","es":"A través de milenios de selección, los humanos transformaron el trigo silvestre en variedades de alto rendimiento y fácil cosecha, sentando la base de la civilización agrícola euroasiática.","ar":"عبر آلاف السنين من الانتقاء، حوّل البشر القمح البري إلى أصناف عالية الإنتاج سهلة الحصاد، واضعين أساس الحضارة الزراعية الأوراسية."}},{"title":{"zh":"动物驯化","en":"Animal Domestication","fr":"Domestication animale","ru":"Одомашнение животных","es":"Domesticación animal","ar":"تدجين الحيوانات"},"desc":{"zh":"人类驯化了羊、牛、猪、马等动物，获得了稳定的肉、奶、毛、力来源，动物运输改变了贸易和战争的规模。","en":"Humans domesticated sheep, cattle, pigs, and horses, gaining stable sources of meat, milk, wool, and labor; animal transport transformed the scale of trade and warfare.","fr":"Les humains ont domestiqué moutons, bovins, porcs et chevaux, obtenant des sources stables de viande, lait, laine et force de travail; le transport animal a transformé l'échelle du commerce et de la guerre.","ru":"Люди одомашнили овец, коров, свиней, лошадей, получив стабильное мясо, молоко, шерсть и тягловую силу; животный транспорт изменил масштаб торговли и войны.","es":"Los humanos domesticaron ovejas, bovinos, cerdos y caballos, obteniendo fuentes estables de carne, leche, lana y fuerza laboral; el transporte animal transformó la escala del comercio y la guerra.","ar":"دجّن البشر الأغنام والبقر والخنازير والخيل، فحصلوا على مصادر مستقرة للحوم والحليب والصوف والقوة العاملة؛ نقل الحيوانات غيّر حجم التجارة والحرب."}},{"title":{"zh":"中国水稻栽培","en":"Rice Cultivation in China","fr":"Culture du riz en Chine","ru":"Выращивание риса в Китае","es":"Cultivo del arroz en China","ar":"زراعة الأرز في الصين"},"desc":{"zh":"约9000年前，长江流域开始栽培水稻。水稻高产特性支撑了东亚人口密度，塑造了中国文明的农业基础。","en":"About 9,000 years ago, rice cultivation began in the Yangtze basin. Rice's high yields supported East Asia's population density, shaping the agricultural foundation of Chinese civilization.","fr":"Il y a environ 9 000 ans, la culture du riz a commencé dans le bassin du Yangtsé. Les hauts rendements du riz ont soutenu la densité de population asiatique, façonnant la base agricole de la civilisation chinoise.","ru":"Около 9 тыс. лет назад в бассейне Янцзы начали выращивать рис. Высокая урожайность риса поддержала плотность населения Восточной Азии, сформировав основу китайской цивилизации.","es":"Hace unos 9.000 años, el cultivo del arroz comenzó en la cuenca del Yangtsé. Los altos rendimientos del arroz sostuvieron la densidad poblacional asiática, moldeando la base agrícola de la civilización china.","ar":"قبل نحو 9 آلاف سنة، بدأت زراعة الأرز في حوض نهر يانغتسي. إنتاجية الأرز العالية دعمت كثافة سكان آسيا، مشكّلةً الأساس الزراعي للحضارة الصينية."}},{"title":{"zh":"美洲玉米驯化","en":"Maize Domestication in Americas","fr":"Domestication du maïs en Amérique","ru":"Одомашнение кукурузы в Америке","es":"Domesticación del maíz en América","ar":"تدجين الذرة في الأمريكتين"},"desc":{"zh":"约9000年前，墨西哥先民将杂草大刍草改造为玉米，这一驯化成果支撑了玛雅、阿兹特克等美洲文明的发展。","en":"About 9,000 years ago, Mexican peoples transformed teosinte grass into maize; this domestication supported the development of Maya, Aztec, and other American civilizations.","fr":"Il y a environ 9 000 ans, les peuples mexicains ont transformé la téosinte en maïs; cette domestication a soutenu le développement des civilisations maya, aztèque et autres civilisations américaines.","ru":"Около 9 тыс. лет назад мексиканцы превратили траву теосинте в кукурузу; это одомашнение поддержало развитие майя, ацтеков и других американских цивилизаций.","es":"Hace unos 9.000 años, los pueblos mexicanos transformaron el teocintle en maíz; esta domesticación sostuvo el desarrollo de las civilizaciones maya, azteca y otras civilizaciones americanas.","ar":"قبل نحو 9 آلاف سنة، حوّل شعوب المكسيك التوسنته إلى ذرة؛ هذا التدجين دعم تطور حضارات المايا والأزتك وغيرها من الحضارات الأمريكية."}},{"title":{"zh":"陶器发明","en":"Invention of Pottery","fr":"Invention de la poterie","ru":"Изобретение керамики","es":"Invención de la cerámica","ar":"اختراع الفخار"},"desc":{"zh":"陶器使人类能够储存和烹煮食物，大幅改善了食物保存和营养摄取，促进了定居生活的稳定化。","en":"Pottery enabled humans to store and cook food, greatly improving food preservation and nutrition, promoting the stabilization of settled life.","fr":"La poterie a permis aux humains de stocker et cuire les aliments, améliorant grandement la conservation et la nutrition, favorisant la stabilisation de la vie sédentaire.","ru":"Керамика позволила хранить и готовить пищу, резко улучшив сохранение продуктов и питание, стабилизируя оседлую жизнь.","es":"La cerámica permitió a los humanos almacenar y cocinar alimentos, mejorando enormemente la conservación y nutrición, favoreciendo la estabilización de la vida sedentaria.","ar":"مكّن الفخار البشر من تخزين وطهي الطعام، محسّناً بشكل كبير الحفظ والتغذية، معززاً استقرار الحياة المستقرة."}},{"title":{"zh":"定居村落出现","en":"Settled Villages Emerge","fr":"Apparition des villages sédentaires","ru":"Появление оседлых поселений","es":"Surgimiento de aldeas sedentarias","ar":"ظهور القرى المستقرة"},"desc":{"zh":"农业使人类从游猎转向定居，出现了最早的永久性村落如耶利哥和加泰土丘，人口密度和社区规模急剧增长。","en":"Agriculture shifted humans from nomadic to settled life; the earliest permanent villages like Jericho and Catalhoyuk appeared, with population density and community scale surging.","fr":"L'agriculture a fait passer les humains du nomadisme à la sédentarité; les premiers villages permanents comme Jéricho et Çatalhöyük sont apparus, avec une forte croissance de la densité de population.","ru":"Земледелие перевело людей от кочевания к оседлости; появились первые постоянные поселения — Иерихон, Чатал-Хююк — с резким ростом плотности населения и масштаба общин.","es":"La agricultura trasladó a los humanos del nomadismo al sedentarismo; surgieron las primeras aldeas permanentes como Jericó y Çatalhöyük, con un fuerte crecimiento de la densidad poblacional.","ar":"نقلت الزراعة البشر من البداوة إلى الاستقرار؛ ظهرت أول القرى الدائمة كأريحا وتشاتالهويوك، مع نمو كبير في كثافة السكان."}},{"title":{"zh":"人口爆炸式增长","en":"Population Explosion","fr":"Explosion démographique","ru":"Демографический взрыв","es":"Explosión demográfica","ar":"الانفجار السكاني"},"desc":{"zh":"农业使食物供给大幅增加，全球人口在几千年内从数百万增长到数千万，但也导致了营养不良和疾病增加。","en":"Agriculture greatly increased food supply; global population grew from millions to tens of millions over millennia, but also caused increased malnutrition and disease.","fr":"L'agriculture a grandement augmenté l'offre alimentaire; la population mondiale est passée de millions à dizaines de millions en quelques millénaires, mais a aussi causé plus de malnutrition et de maladies.","ru":"Земледелие резко увеличило пищу; население мира выросло с миллионов до десятков миллионов за тысячелетия, но вызвало рост недоедания и болезней.","es":"La agricultura aumentó enormemente la oferta alimentaria; la población mundial pasó de millones a decenas de millones en unos milenios, pero también causó más desnutrición y enfermedades.","ar":"زدادت الزراعة المعروض الغذائي بشكل كبير؛ انتقل عدد سكان العالم من ملايين إلى عشرات الملايين خلال آلاف السنين، لكنها أيضاً سببت سوء تغذية وأمراضاً أكثر."}},{"title":{"zh":"社会阶层分化","en":"Social Stratification","fr":"Stratification sociale","ru":"Социальное расслоение","es":"Estratificación social","ar":"التمايز الطبقي"},"desc":{"zh":"粮食剩余产生了财富积累，社会开始出现首领、祭司、工匠和农民的阶层分化，不平等由此成为文明的伴生物。","en":"Food surplus created wealth accumulation; society began differentiating into chiefs, priests, artisans, and farmers, making inequality a built-in companion of civilization.","fr":"L'excédent alimentaire a créé l'accumulation de richesses; la société s'est différenciée en chefs, prêtres, artisans et agriculteurs, faisant de l'inégalité une compagne inhérente de la civilisation.","ru":"Излишки пищи создали накопление богатства; общество разделилось на вождей, жрецов, ремесленников и земледельцев — неравенство стало спутником цивилизации.","es":"El excedente alimentario creó acumulación de riqueza; la sociedad se diferenció en jefes, sacerdotes, artesanos y agricultores, haciendo de la desigualdad un compañero inherente de la civilización.","ar":"خلق فائض الغذاء تراكماً للثروة؛ تمايز المجتمع إلى رؤساء وكهنة وحرفيين وفلاحين، جاعلاً التفاوت رفيقاً متأصلاً للحضارة."}},{"title":{"zh":"原始宗教与祭祀","en":"Proto-Religion & Ritual","fr":"Religion primitive et rituels","ru":"Первобытная религия и ритуалы","es":"Religión primitiva y rituales","ar":"الدين البدائي والطقوس"},"desc":{"zh":"定居生活催生了祖先崇拜和自然神信仰，巨型石阵和祭祀遗址的出现表明人类开始构建超越个体的集体意义系统。","en":"Settled life gave rise to ancestor worship and nature deity beliefs; megalithic structures and ritual sites indicate humans began building collective meaning systems beyond individuals.","fr":"La vie sédentaire a donné naissance au culte des ancêtres et aux croyances en des divinités naturelles; les mégalithes et sites rituels montrent que les humains ont commencé à construire des systèmes de sens collectifs.","ru":"Оседлость породила культ предков и веру в природных духов; мегалитические сооружения и ритуальные памятники показывают, что люди начали строить коллективные системы смыслов.","es":"La vida sedentaria dio origen al culto a los ancestros y creencias en deidades naturales; los megalitos y sitios rituales muestran que los humanos comenzaron a construir sistemas de significado colectivo.","ar":"ولّدت الحياة المستقرة عبادة الأسلاف والإيمان بآلهة الطبيعة؛ تُظهر المغاليث والمواقع الطقوسية أن البشر بدأوا بناء أنظمة معنى جماعية."}}],"insight":{"positive":{"zh":"粮食剩余是文明起飞的前提——只有当部分人可以脱离直接食物生产，专门从事管理、技术和文化创造时，文明才能加速发展。","en":"Food surplus is the prerequisite for civilizational takeoff — civilization can accelerate only when some people can leave direct food production for specialized management, technology, and culture.","fr":"L'excédent alimentaire est le prérequis du décollage civilisationnel — la civilisation ne peut accélérer que lorsque certains peuvent quitter la production directe pour la gestion, la technologie et la culture spécialisées.","ru":"Излишки пищи — предпосылка взлёта цивилизации — цивилизация может ускоряться лишь когда часть людей оставляет прямое производство ради управления, технологий и культуры.","es":"El excedente alimentario es el prerequisito del despegue civilizatorio — la civilización solo puede acelerarse cuando algunos pueden dejar la producción directa para gestión, tecnología y cultura especializadas.","ar":"فائض الغذاء شرط مسبق لانطلاق الحضارة — لا تتسارع الحضارة إلا عندما يستطيع بعض الناس مغادرة الإنتاج المباشر للتخصص في الإدارة والتكنولوجيا والثقافة."},"warning":{"zh":"农业使人类被困在更辛苦的生活中——狩猎采集者工作时间更短、营养更均衡，农民却因依赖单一作物而面临饥荒和疾病风险。","en":"Agriculture trapped humans in harder lives — hunter-gatherers worked less and ate more balanced diets, while farmers faced famine and disease risks from single-crop dependence.","fr":"L'agriculture a piégé les humains dans des vies plus dures — les chasseurs-cueilleurs travaillaient moins et mangeaient plus équilibré, tandis que les paysans risquaient famine et maladies par dépendance d'une seule culture.","ru":"Земледелие заманило людей в более тяжёлую жизнь — охотники-собиратели работали меньше и питались сбалансированнее, а земледельцы рисковали голодом и болезнями от зависимости от одной культуры.","es":"La agricultura atrapó a los humanos en vidas más duras — los cazadores-recolectores trabajaban menos y comían más equilibrado, mientras los agricultores arriesgaban hambruna y enfermedades por dependencia de un solo cultivo.","ar":"أوقعت الزراعة البشر في حياة أشقّ — كان الصيادون الجامعون يعملون أقل ويتغذون بتوازن أكثر، بينما خاطر المزارعون بالمجاعة والمرض لاعتمادهم على محصول واحد."}}},{"id":"eh8","era":{"zh":"约3000年前-500年","en":"~3,000 BCE - 500 CE","fr":"~3 000 av. J.-C. - 500 ap. J.-C.","ru":"~3000 г. до н.э. - 500 г. н.э.","es":"~3.000 a.C. - 500 d.C.","ar":"~3.000 ق.م - 500 م"},"title":{"zh":"古典文明：帝国与思想","en":"Classical Civilizations: Empires & Ideas","fr":"Civilisations classiques: Empires et idées","ru":"Античные цивилизации: Империи и идеи","es":"Civilizaciones clásicas: Imperios e ideas","ar":"الحضارات الكلاسيكية: الإمبراطوريات والأفكار"},"events":[{"title":{"zh":"楔形文字发明","en":"Cuneiform Writing","fr":"Écriture cunéiforme","ru":"Клинопись","es":"Escritura cuneiforme","ar":"الكتابة المسمارية"},"desc":{"zh":"约3200年前，苏美尔人发明了楔形文字，使信息跨越时空传递成为可能，知识积累和行政管理由此质的飞跃。","en":"Around 3200 BCE, Sumerians invented cuneiform writing, enabling information transfer across time and space — a qualitative leap in knowledge accumulation and administration.","fr":"Vers 3200 av. J.-C., les Sumériens ont inventé l'écriture cunéiforme, permettant le transfert d'informations à travers le temps et l'espace — un bond qualitatif dans l'accumulation des connaissances.","ru":"Около 3200 г. до н.э. шумеры изобрели клинопись, позволив передавать информацию через время и пространство — качественный скачок в накоплении знаний и управлении.","es":"Hacia 3.200 a.C., los sumerios inventaron la escritura cuneiforme, permitiendo la transferencia de información a través del tiempo y el espacio — un salto cualitativo en la acumulación de conocimiento.","ar":"حوالي 3200 ق.م، اخترع السومريون الكتابة المسمارية، ممكّنة نقل المعلومات عبر الزمان والمكان — قفزة نوعية في تراكم المعرفة."}},{"title":{"zh":"埃及金字塔","en":"Egyptian Pyramids","fr":"Pyramides d'Égypte","ru":"Египетские пирамиды","es":"Pirámides de Egipto","ar":"أهرامات مصر"},"desc":{"zh":"约2700年前，埃及建造了金字塔，展示了早期国家动员大规模劳动力的组织能力，也体现了王权与宗教的结合。","en":"Around 2700 BCE, Egypt built the pyramids, demonstrating early states' capacity to mobilize massive labor and embodying the union of kingship and religion.","fr":"Vers 2700 av. J.-C., l'Égypte a construit les pyramides, démontrant la capacité des premiers États à mobiliser une main-d'œuvre massive et incarnant l'union de la royauté et de la religion.","ru":"Около 2700 г. до н.э. Египет построил пирамиды, демонстрируя способность ранних государств мобилизовать массовый труд и воплощая союз власти и религии.","es":"Hacia 2.700 a.C., Egipto construyó las pirámides, demostrando la capacidad de los primeros estados para movilizar trabajo masivo y encarnando la unión de realeza y religión.","ar":"حوالي 2700 ق.م، بنى مصر الأهرامات، مظهراً قدرة الدول المبكرة على حشد عمالة هائلة ومجسّداً اتحاد الملك والدين."}},{"title":{"zh":"青铜器时代","en":"Bronze Age","fr":"Âge du bronze","ru":"Бронзовый век","es":"Edad del Bronce","ar":"العصر البرونزي"},"desc":{"zh":"青铜冶炼技术的传播使武器和工具性能大幅提升，促进了贸易网络扩展和国家权力集中，但也加剧了战争的残酷性。","en":"Bronze metallurgy spread, greatly improving weapons and tools, expanding trade networks and concentrating state power, but also intensifying warfare's brutality.","fr":"La métallurgie du bronze s'est propagée, améliorant grandement armes et outils, élargissant les réseaux commerciaux et concentrant le pouvoir étatique, mais intensifiant aussi la brutalité guerrière.","ru":"Распространение бронзовой металлургии улучшило оружие и орудия, расширило торговые сети и концентрировало власть, но усилило жестокость войн.","es":"La metalurgia del bronce se difundió, mejorando enormemente armas y herramientas, expandiendo redes comerciales y concentrando el poder estatal, pero también intensificando la brutalidad bélica.","ar":"انتشرت ميتالورجيا البرونز، محسّنةً بشكل كبير الأسلحة والأدوات، موسّعةً شبكات التجارة ومركّزةً سلطة الدولة، لكنها أيضاً كثفت وحشية الحرب."}},{"title":{"zh":"中华文明起源","en":"Chinese Civilization Origins","fr":"Origines de la civilisation chinoise","ru":"Зарождение китайской цивилизации","es":"Orígenes de la civilización china","ar":"أصول الحضارة الصينية"},"desc":{"zh":"约2000年前，夏商周三代建立了以黄河流域为核心的文明体系，汉字、礼制和天命观成为中华文明延续数千年的根基。","en":"Around 2000 BCE, the Xia-Shang-Zhou dynasties established a civilization centered on the Yellow River; Chinese characters, ritual systems, and the Mandate of Heaven became foundations lasting millennia.","fr":"Vers 2000 av. J.-C., les dynasties Xia-Shang-Zhou ont établi une civilisation centrée sur le fleuve Jaune; les caractères chinois, les rites et le Mandat du Ciel sont devenus des fondations millénaires.","ru":"Около 2000 г. до н.э. династии Ся-Шан-Чжоу создали цивилизацию в бассейне Хуанхэ; иероглифы, ритуалы и Мандат Неба стали основой на тысячелетия.","es":"Hacia 2.000 a.C., las dinastías Xia-Shang-Zhou establecieron una civilización centrada en el río Amarillo; los caracteres chinos, los rituales y el Mandato del Cielo se volvieron fundamentos milenarios.","ar":"حوالي 2000 ق.م، أرست سلالات شيا-شANG-تشو حضارة تتمركز حول النهر الأصفر؛ أصبحت الحروف الصينية والطقوس وتفويض السماء أسساً ممتدة لآلاف السنين."}},{"title":{"zh":"印度河谷文明","en":"Indus Valley Civilization","fr":"Civilisation de la vallée de l'Indus","ru":"Цивилизация долины Инда","es":"Civilización del Valle del Indo","ar":"حضارة وادي السند"},"desc":{"zh":"约2600年前，印度河谷出现了规划严整的城市文明，拥有排水系统和标准化度量衡，但文字至今未被破译。","en":"Around 2600 BCE, the Indus Valley saw planned urban civilization with drainage systems and standardized weights, though its script remains undeciphered.","fr":"Vers 2600 av. J.-C., la vallée de l'Indus a vu une civilisation urbaine planifiée avec systèmes de drainage et poids standardisés, bien que son écriture reste indéchiffrée.","ru":"Около 2600 г. до н.э. в долине Инда возникла спланированная городская цивилизация с дренажем и стандартными мерами, но её письменность не расшифрована.","es":"Hacia 2.600 a.C., el valle del Indo vio una civilización urbana planificada con sistemas de drenaje y pesos estandarizados, aunque su escritura permanece sin descifrar.","ar":"حوالي 2600 ق.م، شهد وادي السند حضارة حضرية مخططة بأنظمة تصريف وأوزان معيارية، رغم أن كتابتها لا تزال غير مفكوكة."}},{"title":{"zh":"轴心时代","en":"Axial Age","fr":"Âge axial","ru":"Осевое время","es":"Era Axial","ar":"العصر المحوري"},"desc":{"zh":"约800-200年前，孔子、佛陀、苏格拉底、犹太先知几乎同时出现，奠定了世界主要文明的思想范式，影响延续至今。","en":"Around 800-200 BCE, Confucius, Buddha, Socrates, and Hebrew prophets appeared nearly simultaneously, establishing the intellectual paradigms of major world civilizations, influential to this day.","fr":"Vers 800-200 av. J.-C., Confucius, Bouddha, Socrate et prophètes hébreux sont apparus presque simultanément, établissant les paradigmes intellectuels des grandes civilisations, influents jusqu'à aujourd'hui.","ru":"Около 800-200 гг. до н.э. Конфуций, Будда, Сократ и еврейские пророки появились почти одновременно, заложив парадигмы главных мировых цивилизаций, влиятельные по сей день.","es":"Hacia 800-200 a.C., Confucio, Buda, Sócrates y profetas hebreos aparecieron casi simultáneamente, estableciendo los paradigmas intelectuales de las grandes civilizaciones, influyentes hasta hoy.","ar":"حوالي 800-200 ق.م، ظهر كونفوشيوس وبوذا وسقراط وأنبياء العبريين في وقت واحد تقريباً، مؤسسين النماذج الفكرية للحضارات الكبرى، مؤثرين حتى اليوم."}},{"title":{"zh":"罗马帝国","en":"Roman Empire","fr":"Empire romain","ru":"Римская империя","es":"Imperio Romano","ar":"الإمبراطورية الرومانية"},"desc":{"zh":"罗马帝国建立的法律体系、道路网络和行政制度成为西方文明的政治基石，拉丁语演化的罗曼语系影响半个世界。","en":"The Roman Empire's legal systems, road networks, and administrative institutions became Western civilization's political cornerstone; Latin-derived Romance languages influenced half the world.","fr":"Les systèmes juridiques, réseaux routiers et institutions administratives de l'Empire romain sont devenus la pierre angulaire politique de la civilisation occidentale; les langues romanes issues du latin ont influencé la moitié du monde.","ru":"Правовая система, дорожная сеть и администрация Римской империи стали политическим фундаментом западной цивилизации; латинские романские языки влили на полмира.","es":"Los sistemas jurídicos, redes de carreteras e instituciones administrativas del Imperio Romano se convirtieron en la piedra angular política de la civilización occidental; las lenguas romances derivadas del latín influyeron en medio mundo.","ar":"أصبحت النظم القانونية وشبكات الطرق والمؤسسات الإدارية للإمبراطورية الرومانية الحجر الزاوي السياسي للحضارة الغربية؛ أثرت اللغات الرومانسية المشتقة من اللاتينية على نصف العالم."}},{"title":{"zh":"丝绸之路开通","en":"Silk Road Opens","fr":"Ouverture de la Route de la Soie","ru":"Открытие Шёлкового пути","es":"Apertura de la Ruta de la Seda","ar":"افتتاح طريق الحرير"},"desc":{"zh":"横跨欧亚的丝绸之路连接了中国、印度、波斯和罗马，促进了商品、技术、宗教和思想的跨文明交流。","en":"The trans-Eurasian Silk Road connected China, India, Persia, and Rome, facilitating cross-civilizational exchange of goods, technology, religion, and ideas.","fr":"La Route de la Soie trans-eurasienne a connecté la Chine, l'Inde, la Perse et Rome, facilitant les échanges inter-civilisationnels de biens, technologies, religions et idées.","ru":"Шёлковый путь через Евразию соединил Китай, Индию, Персию и Рим, обеспечивая обмен товарами, технологиями, религией и идеями между цивилизациями.","es":"La Ruta de la Seda trans-euroasiática conectó China, India, Persia y Roma, facilitando el intercambio intercivilizacional de bienes, tecnologías, religiones e ideas.","ar":"ربط طريق الحرير العابر لأوراسيا الصين والهند وبلاد فارس وروما، مما سهل التبادل بين الحضارات في السلع والتكنولوجيا والأديان والأفكار."}},{"title":{"zh":"铁器普及","en":"Iron Age Spread","fr":"Diffusion de l'âge du fer","ru":"Распространение железа","es":"Difusión de la Edad del Hierro","ar":"انتشار العصر الحديدي"},"desc":{"zh":"铁器冶炼技术比青铜更便宜更坚硬，铁制农具和武器的大规模普及提高了农业产量和战争规模，改变了社会结构。","en":"Iron metallurgy was cheaper and harder than bronze; mass adoption of iron tools and weapons increased agricultural output and warfare scale, transforming social structures.","fr":"La métallurgie du fer était moins chère et plus dure que le bronze; l'adoption massive d'outils et d'armes en fer a augmenté la production agricole et l'échelle guerrière, transformant les structures sociales.","ru":"Металлургия железа была дешевле и твёрже бронзы; массовое распространение железных орудий и оружия увеличило урожай и масштаб войн, изменив структуру общества.","es":"La metalurgia del hierro era más barata y dura que el bronce; la adopción masiva de herramientas y armas de hierro aumentó la producción agrícola y la escala bélica, transformando las estructuras sociales.","ar":"كانت ميتالورجيا الحديد أرخص وأصلب من البرونز؛ أدى التبني الواسع للأدوات والأسلحة الحديدية إلى زيادة الإنتاج الزراعي وحجم الحرب، محوّلةً البنى الاجتماعية."}},{"title":{"zh":"罗马帝国衰亡","en":"Fall of Rome","fr":"Chute de Rome","ru":"Падение Рима","es":"Caída de Roma","ar":"سقوط روما"},"desc":{"zh":"476年西罗马帝国灭亡，暴露了过度扩张、腐败、经济衰退和外部入侵如何共同摧毁一个超级帝国，是文明崩溃的经典案例。","en":"In 476 CE, the Western Roman Empire fell, revealing how overextension, corruption, economic decline, and external invasion can jointly destroy a superpower — a classic case of civilizational collapse.","fr":"En 476 ap. J.-C., l'Empire romain d'Occident est tombé, révélant comment l'expansion excessive, la corruption, le déclin économique et les invasions externes peuvent conjointement détruire une superpuissance.","ru":"В 476 г. пала Западная Римская империя, показав, как чрезмерное расширение, коррупция, упадок экономики и внешние вторжения совместно разрушают сверхдержаву — классический случай краха цивилизации.","es":"En 476 d.C., el Imperio Romano de Occidente cayó, revelando cómo la sobreexpansión, la corrupción, el declive económico y las invasiones externas pueden conjuntamente destruir una superpotencia.","ar":"في 476 م، سقطت الإمبراطورية الرومانية الغربية، كاشفةً كيف يمكن للتوسع المفرط والفساد والتراجع الاقتصادي والغزوات الخارجية أن تدمر معاً قوة عظمى."}}],"insight":{"positive":{"zh":"文字是文明的操作系统——楔形文字和汉字使知识可以跨代积累，文明从此不再因个体死亡而归零，实现了信息的指数级增长。","en":"Writing is civilization's operating system — cuneiform and Chinese characters enabled cross-generational knowledge accumulation, so civilization no longer reset to zero with individual deaths, achieving exponential information growth.","fr":"L'écriture est le système d'exploitation de la civilisation — le cunéiforme et les caractères chinois ont permis l'accumulation intergénérationnelle des connaissances, la civilisation ne s'est plus remise à zéro, atteignant une croissance exponentielle.","ru":"Письменность — операционная система цивилизации — клинопись и иероглифы позволили накапливать знания跨поколения, цивилизация больше не обнулялась со смертью индивида, достигнув экспоненциального роста информации.","es":"La escritura es el sistema operativo de la civilización — el cuneiforme y los caracteres chinos permitieron la acumulación intergeneracional del conocimiento, la civilización ya no se reiniciaba a cero, alcanzando crecimiento exponencial.","ar":"الكتابة هي نظام تشغيل الحضارة — مكّنت المسمارية والحروف الصينية من تراكم المعرفة بين الأجيال، فلم تعد الحضارة تعود إلى الصفر، محققةً نمواً أسياً."},"warning":{"zh":"帝国衰亡是系统性崩溃——罗马并非被单一敌人击败，而是内部腐败、经济空心化和外部压力的共振结果。超级文明同样可能内部空心化。","en":"Imperial collapse is systemic — Rome wasn't defeated by a single enemy but by the resonance of internal corruption, economic hollowing, and external pressure. Super-civilizations can similarly hollow from within.","fr":"L'effondrement impérial est systémique — Rome n'a pas été vaincue par un seul ennemi mais par la résonance de la corruption interne, de l'évidement économique et de la pression externe. Les super-civilisations peuvent similairement se creuser de l'intérieur.","ru":"Крах империи системен — Рим пал не от одного врага, а от резонанса коррупции, экономического истощения и внешнего давления. Сверхцивилизации могут аналогично разрушаться изнутри.","es":"El colapso imperial es sistémico — Roma no fue derrotada por un solo enemigo sino por la resonancia de corrupción interna, vaciamiento económico y presión externa. Las supercivilizaciones pueden similarmente huequearse desde dentro.","ar":"انهيار الإمبراطورية منهجي — لم تُهزم روما بعدو واحد بل بصدى الفساد الداخلي والتفريغ الاقتصادي والضغط الخارجي. الحضارات العظمى قد تتجوّف من الداخل بنفس الطريقة."}}},{"id":"eh9","era":{"zh":"约1500-1950年","en":"~1500-1950 CE","fr":"~1500-1950 ap. J.-C.","ru":"~1500-1950 гг.","es":"~1500-1950 d.C.","ar":"~1500-1950 م"},"title":{"zh":"科学革命与工业时代","en":"Scientific Revolution & Industrial Age","fr":"Révolution scientifique et ère industrielle","ru":"Научная революция и индустриальная эра","es":"Revolución científica y era industrial","ar":"الثورة العلمية والعصر الصناعي"},"events":[{"title":{"zh":"哥白尼日心说","en":"Copernican Heliocentrism","fr":"Héliocentrisme copernicien","ru":"Гелиоцентризм Коперника","es":"Heliocentrismo copernicano","ar":"مركزية الشمس لكوبرنيكوس"},"desc":{"zh":"1543年哥白尼发表日心说，将地球从宇宙中心移除，引发了人类对自身位置的根本性认知革命。","en":"In 1543, Copernicus published heliocentrism, removing Earth from the center of the universe and triggering a fundamental cognitive revolution about humanity's place.","fr":"En 1543, Copernic a publié l'héliocentrisme, retirant la Terre du centre de l'univers et déclenchant une révolution cognitive fondamentale sur la place de l'humanité.","ru":"В 1543 г. Коперник опубликовал гелиоцентризм, убрав Землю из центра вселенной и вызвав коренную когнитивную революцию о месте человечества.","es":"En 1543, Copérnico publicó el heliocentrismo, retirando a la Tierra del centro del universo y desencadenando una revolución cognitiva fundamental sobre el lugar de la humanidad.","ar":"في 1543، نشر كوبرنيكوس مركزية الشمس، مبعداً الأرض عن مركز الكون ومطلقاً ثورة معرفية جوهرية عن مكان البشرية."}},{"title":{"zh":"大航海时代","en":"Age of Discovery","fr":"Ère des découvertes","ru":"Эпоха Великих географических открытий","es":"Era de los descubrimientos","ar":"عصر الاكتشافات"},"desc":{"zh":"15-17世纪欧洲航海家开辟了全球航路，连接了此前孤立的大陆，引发了哥伦布大交换、殖民主义和全球化贸易。","en":"In the 15th-17th centuries, European navigators opened global sea routes, connecting previously isolated continents, triggering the Columbian Exchange, colonialism, and globalized trade.","fr":"Aux XVe-XVIIe siècles, les navigateurs européens ont ouvert des routes maritimes mondiales, connectant des continents auparavant isolés, déclenchant l'échange colombien, le colonialisme et le commerce mondialisé.","ru":"В XV-XVII вв. европейские мореплаватели открыли мировые маршруты, соединив изолированные континенты, вызвав Колумбов обмен, колониализм и глобальную торговлю.","es":"En los siglos XV-XVII, los navegantes europeos abrieron rutas marítimas globales, conectando continentes antes aislados, desencadenando el Intercambio Colombino, el colonialismo y el comercio globalizado.","ar":"في القرنين 15-17، فتح الملاحون الأوروبيون طرق تجارية بحرية عالمية، رابطين قارات كانت معزولة، مطلقين التبادل الكولومبي والاستعمار والتجارة العالمية."}},{"title":{"zh":"牛顿力学","en":"Newtonian Mechanics","fr":"Mécanique newtonienne","ru":"Ньютоновская механика","es":"Mecánica newtoniana","ar":"ميكانيكا نيوتن"},"desc":{"zh":"1687年牛顿发表《自然哲学的数学原理》，用简洁的数学公式统一了天上和地上的运动规律，开创了现代科学范式。","en":"In 1687, Newton published Principia Mathematica, unifying celestial and terrestrial motion with concise mathematical formulas, founding the paradigm of modern science.","fr":"En 1687, Newton a publié les Principia, unifiant les mouvements célestes et terrestres avec des formules mathématiques concises, fondant le paradigme de la science moderne.","ru":"В 1687 г. Ньютон опубликовал «Начала», объединив небесную и земную механику лаконичными формулами, заложив парадигму современной науки.","es":"En 1687, Newton publicó los Principia, unificando los movimientos celestes y terrestres con fórmulas matemáticas concisas, fundando el paradigma de la ciencia moderna.","ar":"في 1687، نشر نيوتن الأصول، موحداً الحركة السماوية والأرضية بصيغ رياضية موجزة، مؤسساً نموذج العلم الحديث."}},{"title":{"zh":"蒸汽机与工业革命","en":"Steam Engine & Industrial Revolution","fr":"Machine à vapeur et révolution industrielle","ru":"Паровая машина и промышленная революция","es":"Máquina de vapor y Revolución Industrial","ar":"الآلة البخارية والثورة الصناعية"},"desc":{"zh":"1769年瓦特改良蒸汽机，人类首次将热能转化为可控机械动力，工厂取代手工作坊，生产效率呈指数级增长。","en":"In 1769, Watt improved the steam engine; humans first converted heat into controllable mechanical power, factories replaced workshops, and production efficiency grew exponentially.","fr":"En 1769, Watt a amélioré la machine à vapeur; les humains ont converti pour la première fois la chaleur en puissance mécanique contrôlable, les usines ont remplacé les ateliers, la productivité a cru exponentiellement.","ru":"В 1769 г. Уатт усовершенствовал паровую машину; люди впервые превратили тепло в управляемую механическую мощность, фабрики заменили мастерские.","es":"En 1769, Watt mejoró la máquina de vapor; los humanos convirtieron por primera vez calor en potencia mecánica controlable, las fábricas reemplazaron a los talleres, la productividad creció exponencialmente.","ar":"في 1769، حسّن واط الآلة البخارية؛ حوّل البشر الحرارة لقوة ميكانيكية محكومة لأول مرة، حلت المصانع محل الورش، ونما الإنتاج بشكل أسي."}},{"title":{"zh":"达尔文进化论","en":"Darwin's Evolution","fr":"Évolution de Darwin","ru":"Эволюционная теория Дарвина","es":"Evolución de Darwin","ar":"تطور داروين"},"desc":{"zh":"1859年达尔文发表《物种起源》，证明人类是自然演化的产物而非神创，引发了生物学革命和深刻的思想震荡。","en":"In 1859, Darwin published On the Origin of Species, proving humans are products of natural evolution rather than divine creation, triggering a biological revolution and profound intellectual shock.","fr":"En 1859, Darwin a publié L'Origine des espèces, prouvant que les humains sont le produit de l'évolution naturelle et non de la création divine, déclenchant une révolution biologique et un choc intellectuel profond.","ru":"В 1859 г. Дарвин опубликовал «Происхождение видов», доказав, что человек — продукт естественной эволюции, а не творения, вызвав биологическую революцию.","es":"En 1859, Darwin publicó El Origen de las Especies, demostrando que los humanos son producto de la evolución natural y no de la creación divina, desencadenando una revolución biológica y un shock intelectual profundo.","ar":"في 1859، نشر داروين أصل الأنواع، مثبتاً أن البشر نتاج التطور الطبيعي لا الخلق الإلهي، مطلقاً ثورة بيولوجية وصدمة فكرية عميقة."}},{"title":{"zh":"电磁学统一","en":"Electromagnetic Unification","fr":"Unification de l'électromagnétisme","ru":"Объединение электромагнетизма","es":"Unificación del electromagnetismo","ar":"توحيد الكهرومغناطيسية"},"desc":{"zh":"麦克斯韦方程组统一了电、磁和光，揭示了电磁波的本质，为无线电、电力和现代通信技术奠定了理论基础。","en":"Maxwell's equations unified electricity, magnetism, and light, revealing the nature of electromagnetic waves and laying the theoretical foundation for radio, electricity, and modern communications.","fr":"Les équations de Maxwell ont unifié électricité, magnétisme et lumière, révélant la nature des ondes électromagnétiques et fondant la radio, l'électricité et les communications modernes.","ru":"Уравнения Максвелла объединили электричество, магнетизм и свет, раскрыв природу электромагнитных волн — теоретическую базу радио, электричества и связи.","es":"Las ecuaciones de Maxwell unificaron electricidad, magnetismo y luz, revelando la naturaleza de las ondas electromagnéticas y fundando la radio, la electricidad y las comunicaciones modernas.","ar":"وحّدت معادلات ماكسويل الكهرباء والمغناطيسية والضوء، كاشفةً طبيعة الموجات الكهرومغناطيسية ومؤسسةً الراديو والكهرباء والاتصالات الحديثة."}},{"title":{"zh":"内燃机与汽车","en":"Internal Combustion Engine","fr":"Moteur à combustion interne","ru":"Двигатель внутреннего сгорания","es":"Motor de combustión interna","ar":"محرك الاحتراق الداخلي"},"desc":{"zh":"内燃机使个人交通成为可能，石油成为战略资源，汽车重塑了城市形态和生活方式，但也埋下了气候变化的隐患。","en":"The internal combustion engine enabled personal transport; oil became a strategic resource, automobiles reshaped cities and lifestyles, but also planted the seeds of climate change.","fr":"Le moteur à combustion interne a rendu le transport personnel possible; le pétrole est devenu ressource stratégique, les automobiles ont remodelé villes et modes de vie, mais ont aussi semé le changement climatique.","ru":"ДВС сделал возможным личный транспорт; нефть стала стратегическим ресурсом, автомобили перестроили города, но заложили основу изменения климата.","es":"El motor de combustión interna hizo posible el transporte personal; el petróleo se volvió recurso estratégico, los automóviles remodelaron ciudades y estilos de vida, pero también sembraron el cambio climático.","ar":"جعل محرك الاحتراق الداخلي النقل الشخصي ممكناً؛ أصبح النفط موارد استراتيجية، أعادت السيارات تشكيل المدن وأنماط الحياة، لكنها أيضاً بذرت تغير المناخ."}},{"title":{"zh":"量子力学","en":"Quantum Mechanics","fr":"Mécanique quantique","ru":"Квантовая механика","es":"Mecánica cuántica","ar":"ميكانيكا الكم"},"desc":{"zh":"20世纪初量子力学颠覆了经典物理的确定性世界观，揭示了微观世界的概率本质，为半导体、激光和量子计算奠定了基础。","en":"In the early 20th century, quantum mechanics overturned classical physics' deterministic worldview, revealing the probabilistic nature of the microscopic world, laying foundations for semiconductors, lasers, and quantum computing.","fr":"Au début du XXe siècle, la mécanique quantique a renversé la vision déterministe de la physique classique, révélant la nature probabiliste du monde microscopique, fondant semi-conducteurs, lasers et calcul quantique.","ru":"В начале XX в. квантовая механика опрокинула детерминизм классической физики, раскрыв вероятностную природу микромира — основу полупроводников, лазеров и квантовых вычислений.","es":"A principios del siglo XX, la mecánica cuántica revirtió la visión determinista de la física clásica, revelando la naturaleza probabilística del mundo microscópico, fundando semiconductores, láseres y computación cuántica.","ar":"في أوائل القرن العشرين، قلبت ميكانيكا الكم الرؤية الحتمية للفيزياء الكلاسيكية، كاشفةً الطبيعة الاحتمالية للعالم المجهري، مؤسسةً أشباه الموصلات والليزر والحوسبة الكمومية."}},{"title":{"zh":"两次世界大战","en":"World Wars","fr":"Guerres mondiales","ru":"Мировые войны","es":"Guerras mundiales","ar":"الحروب العالمية"},"desc":{"zh":"两次世界大战造成上亿人伤亡，展示了工业文明自我毁灭的极限，但也催生了联合国、人权宣言和国际秩序的重建。","en":"The World Wars caused hundreds of millions of casualties, demonstrating the self-destruction limit of industrial civilization, but also birthed the UN, the Universal Declaration of Human Rights, and international order.","fr":"Les guerres mondiales ont causé des centaines de millions de victimes, démontrant la limite d'auto-destruction de la civilisation industrielle, mais ont aussi engendré l'ONU, la Déclaration des droits de l'homme et l'ordre international.","ru":"Мировые войны унесли сотни миллионов жизней, показав предел самоуничтожения индустриальной цивилизации, но породили ООН, Декларацию прав человека и международный порядок.","es":"Las guerras mundiales causaron cientos de millones de víctimas, demostrando el límite de autodestrucción de la civilización industrial, pero también engendraron la ONU, la Declaración de Derechos Humanos y el orden internacional.","ar":"تسببت الحروب العالمية في مئات الملايين من الضحايا، مظهرةً حد التدمير الذاتي للحضارة الصناعية، لكنها أيضاً أنجبت الأمم المتحدة وإعلان حقوق الإنسان والنظام الدولي."}},{"title":{"zh":"青霉素与抗生素","en":"Penicillin & Antibiotics","fr":"Pénicilline et antibiotiques","ru":"Пенициллин и антибиотики","es":"Penicilina y antibióticos","ar":"البنسلين والمضادات الحيوية"},"desc":{"zh":"1928年弗莱明发现青霉素，抗生素的量产拯救了数亿生命，人类平均寿命大幅延长，但也引发了抗生素耐药性危机。","en":"In 1928, Fleming discovered penicillin; mass-produced antibiotics saved hundreds of millions of lives and greatly extended human lifespan, but also triggered antibiotic resistance.","fr":"En 1928, Fleming a découvert la pénicilline; les antibiotiques produits en masse ont sauvé des centaines de millions de vies et prolongé l'espérance de vie, mais ont aussi déclenché la résistance aux antibiotiques.","ru":"В 1928 г. Флеминг открыл пенициллин; массовое производство антибиотиков спасло сотни миллионов жизней и продлило жизнь, но вызвало резистентность.","es":"En 1928, Fleming descubrió la penicilina; los antibióticos producidos en masa salvaron cientos de millones de vidas y prolongaron la esperanza de vida, pero también desencadenaron la resistencia a los antibióticos.","ar":"في 1928، اكتشف فليمنج البنسلين؛ أنقذت المضادات الحيوية المنتجة بكميات كبيرة مئات الملايين من الأرواح وأطالت العمر، لكنها أيضاً أطلقت مقاومة المضادات الحيوية."}}],"insight":{"positive":{"zh":"科学方法是人类最伟大的发明——可证伪、可重复的实验方法使知识不再依赖权威，实现了人类认知能力的指数级提升。","en":"The scientific method is humanity's greatest invention — falsifiable, reproducible experimentation freed knowledge from authority, achieving exponential growth in human cognition.","fr":"La méthode scientifique est la plus grande invention de l'humanité — l'expérimentation falsifiable et reproductible a libéré le savoir de l'autorité, atteignant une croissance exponentielle de la cognition humaine.","ru":"Научный метод — величайшее изобретение человечества — опровергаемое, воспроизводимое экспериментирование освободило знание от авторитета, достигнув экспоненциального роста познания.","es":"El método científico es el mayor invento de la humanidad — la experimentación falsable y reproducible liberó el conocimiento de la autoridad, alcanzando un crecimiento exponencial de la cognición humana.","ar":"المنهج العلمي هو أعظم اختراع للبشرية — التexperimentation القابلة للتفنيد والتكرار حرّر المعرفة من السلطة، محققاً نمواً أسيّاً في الإدراك البشري."},"warning":{"zh":"技术能力超越道德水平——工业革命制造了机枪和毒气室，科学技术如果不被伦理约束，将变成高效的毁灭工具。","en":"Technological capability outpaces moral development — the Industrial Revolution produced machine guns and gas chambers; without ethical constraints, science becomes an efficient tool of destruction.","fr":"La capacité technologique dépasse le développement moral — la révolution industrielle a produit des mitrailleuses et des chambres à gaz; sans contraintes éthiques, la science devient un outil efficace de destruction.","ru":"Технологии обгоняют мораль — промышленная революция создала пулемёты и газовые камеры; без этических ограничений наука становится эффективным орудием уничтожения.","es":"La capacidad tecnológica supera al desarrollo moral — la Revolución Industrial produjo ametralladoras y cámaras de gas; sin restricciones éticas, la ciencia se convierte en una herramienta eficiente de destrucción.","ar":"القدرة التكنولوجية تتجاوز التطور الأخلاقي — أنتجت الثورة الصناعية رشاشات وغرف غاز؛ بلا قيود أخلاقية، يصبح العلم أداة فعالة للدمار."}}},{"id":"eh10","era":{"zh":"约1950年至今","en":"~1950 CE - present","fr":"~1950 - présent","ru":"~1950 гг. - настоящее","es":"~1950 - presente","ar":"~1950 - الحاضر"},"title":{"zh":"信息时代：全球互联","en":"Information Age: Global Interconnection","fr":"Ère de l'information: Interconnexion mondiale","ru":"Информационная эра: Глобальная связанность","es":"Era de la información: Interconexión global","ar":"عصر المعلومات: الترابط العالمي"},"events":[{"title":{"zh":"DNA双螺旋发现","en":"DNA Double Helix","fr":"Double hélice de l'ADN","ru":"Двойная спираль ДНК","es":"Doble hélice del ADN","ar":"اللولب المزدوج للحمض النووي"},"desc":{"zh":"1953年沃森和克里克发现DNA双螺旋结构，揭示了遗传信息的分子基础，开启了分子生物学和基因工程时代。","en":"In 1953, Watson and Crick discovered the DNA double helix, revealing the molecular basis of genetic information and opening the era of molecular biology and genetic engineering.","fr":"En 1953, Watson et Crick ont découvert la structure en double hélice de l'ADN, révélant la base moléculaire de l'information génétique et ouvrant l'ère de la biologie moléculaire et du génie génétique.","ru":"В 1953 г. Уотсон и Крик открыли двойную спираль ДНК, раскрыв молекулярную основу генетической информации и открыв эру молекулярной биологии.","es":"En 1953, Watson y Crick descubrieron la estructura de doble hélice del ADN, revelando la base molecular de la información genética y abriendo la era de la biología molecular y la ingeniería genética.","ar":"في 1953، اكتشف واتسون وكريك بنية اللولب المزدوج للحمض النووي، كاشفين الأساس الجزيئي للمعلومات الوراثية وفاتحين عصر البيولوجيا الجزيئية والهندسة الوراثية."}},{"title":{"zh":"晶体管发明","en":"Transistor Invented","fr":"Invention du transistor","ru":"Изобретение транзистора","es":"Invención del transistor","ar":"اختراع الترانزستور"},"desc":{"zh":"1947年贝尔实验室发明晶体管，取代了真空管，开启了微电子革命。摩尔定律驱动计算能力每18个月翻倍。","en":"In 1947, Bell Labs invented the transistor, replacing vacuum tubes and launching the microelectronics revolution. Moore's Law drove computing power to double every 18 months.","fr":"En 1947, Bell Labs a inventé le transistor, remplaçant les tubes à vide et lançant la révolution microélectronique. La loi de Moore a doublé la puissance de calcul tous les 18 mois.","ru":"В 1947 г. Bell Labs изобрела транзистор, заменивший лампы и запустивший микрореволюцию. Закон Мура удваивал вычислительную мощность каждые 18 месяцев.","es":"En 1947, Bell Labs inventó el transistor, reemplazando los tubos de vacío y lanzando la revolución microelectrónica. La Ley de Moore duplicó la potencia de cálculo cada 18 meses.","ar":"في 1947، اخترع مختبرات بل الترانزستور، مستبدلاً أنابيب الفراغ ومطلقاً ثورة الإلكترونيات الدقيقة. ضاعف قانون مور قدرة الحوسبة كل 18 شهراً."}},{"title":{"zh":"阿波罗登月","en":"Apollo Moon Landing","fr":"Alunissage Apollo","ru":"Высадка Аполлона на Луну","es":"Aterrizaje Apollo en la Luna","ar":"هبوط أبولو على القمر"},"desc":{"zh":"1969年阿波罗11号实现人类首次登月，标志着人类首次离开地球表面到达另一个天体，是星际文明的第一步。","en":"In 1969, Apollo 11 achieved humanity's first moon landing, marking the first time humans left Earth's surface to reach another celestial body — the first step toward interstellar civilization.","fr":"En 1969, Apollo 11 a réalisé le premier alunissage habité, marquant la première fois que les humains quittaient la surface terrestre pour atteindre un autre corps céleste — le premier pas vers la civilisation interstellaire.","ru":"В 1969 г. Аполлон-11 осуществил первую высадку на Луну, впервые выведя людей на другое небесное тело — первый шаг к межзвёздной цивилизации.","es":"En 1969, Apollo 11 logró el primer alunizaje tripulado, marcando la primera vez que los humanos abandonaban la superficie terrestre para alcanzar otro cuerpo celeste — el primer paso hacia la civilización interestelar.","ar":"في 1969، حقق أبولو 11 أول هبوط مأهول على القمر، معلناً أول مرة يغادر فيها البشر سطح الأرض للوصول إلى جرم سماوي آخر — الخطوة الأولى نحو الحضارة بين النجوم."}},{"title":{"zh":"互联网诞生","en":"Birth of the Internet","fr":"Naissance d'Internet","ru":"Рождение интернета","es":"Nacimiento de Internet","ar":"ولادة الإنترنت"},"desc":{"zh":"1969年ARPANET启动，1990年代万维网普及，互联网将全球信息连接成网络，彻底改变了通信、商业和知识传播方式。","en":"ARPANET launched in 1969; the World Wide Web spread in the 1990s. The Internet connected global information into a network, revolutionizing communication, commerce, and knowledge dissemination.","fr":"ARPANET a démarré en 1969; le World Wide Web s'est diffusé dans les années 1990. Internet a connecté l'information mondiale en réseau, révolutionnant communication, commerce et diffusion du savoir.","ru":"ARPANET запущен в 1969 г.; в 1990-х распространилась WWW. Интернет соединил мировую информацию в сеть, революционизировав связь, коммерцию и распространение знаний.","es":"ARPANET inició en 1969; la World Wide Web se difundió en los años 1990. Internet conectó la información global en red, revolucionando comunicación, comercio y difusión del conocimiento.","ar":"بدأ ARPANET في 1969؛ انتشرت الشبكة العنكبوتية العالمية في التسعينيات. ربط الإنترنت المعلومات العالمية في شبكة، ثائراً الاتصال والتجارة ونشر المعرفة."}},{"title":{"zh":"人类基因组计划","en":"Human Genome Project","fr":"Projet Génome humain","ru":"Проект Геном человека","es":"Proyecto del Genoma Humano","ar":"مشروع الجينوم البشري"},"desc":{"zh":"2003年人类基因组计划完成，破译了30亿个碱基对，使精准医疗和基因编辑成为可能，人类获得了改写自身蓝图的能力。","en":"In 2003, the Human Genome Project completed, decoding 3 billion base pairs, enabling precision medicine and gene editing — humanity gained the ability to rewrite its own blueprint.","fr":"En 2003, le Projet Génome humain a été achevé, décodant 3 milliards de paires de bases, permettant la médecine de précision et l'édition génique — l'humanité a gagné la capacité de réécrire son propre plan.","ru":"В 2003 г. завершён Проект «Геном человека», расшифровавший 3 млрд пар оснований, открыв точную медицину и редактирование генов — человек получил возможность переписать свой чертёж.","es":"En 2003, el Proyecto del Genoma Humano se completó, decodificando 3 mil millones de pares de bases, enabling la medicina de precisión y la edición génica — la humanidad ganó la capacidad de reescribir su propio plano.","ar":"في 2003، اكتمل مشروع الجينوم البشري، فاكاً 3 مليار زوج قاعدي، ممكناً الطب الدقيق وتحرير الجينات — حصلت البشرية على قدرة إعادة كتابة مخططها الخاص."}},{"title":{"zh":"智能手机时代","en":"Smartphone Era","fr":"Ère du smartphone","ru":"Эра смартфонов","es":"Era del smartphone","ar":"عصر الهاتف الذكي"},"desc":{"zh":"2007年iPhone发布，智能手机将计算、通信、定位和支付整合到口袋设备中，50亿人随时在线，重塑了社交和工作方式。","en":"In 2007, the iPhone launched; smartphones integrated computing, communication, positioning, and payment into pocket devices, with 5 billion people always online, reshaping social and work life.","fr":"En 2007, l'iPhone a été lancé; les smartphones ont intégré calcul, communication, localisation et paiement dans des appareils de poche, avec 5 milliards de personnes toujours en ligne, remodelant la vie sociale et professionnelle.","ru":"В 2007 г. вышел iPhone; смартфоны объединили вычисления, связь, навигацию и платежи в карманном устройстве, 5 млрд человек всегда онлайн.","es":"En 2007, el iPhone se lanzó; los smartphones integraron computación, comunicación, localización y pago en dispositivos de bolsillo, con 5 mil millones de personas siempre en línea, remodelando la vida social y laboral.","ar":"في 2007، أطلق الآيفون؛ دمجت الهواتف الذكية الحوسبة والاتصال والتحديد والدفع في أجهزة محمولة، مع 5 مليارات شخص متصلين دائماً، معيداً تشكيل الحياة الاجتماعية والمهنية."}},{"title":{"zh":"人工智能爆发","en":"AI Revolution","fr":"Révolution de l'IA","ru":"Революция ИИ","es":"Revolución de la IA","ar":"ثورة الذكاء الاصطناعي"},"desc":{"zh":"2010年代深度学习突破，2020年代大语言模型涌现，AI在图像、语言和决策领域接近或超越人类，引发生产力革命。","en":"Deep learning broke through in the 2010s; large language models emerged in the 2020s. AI approaches or surpasses humans in vision, language, and decision-making, triggering a productivity revolution.","fr":"L'apprentissage profond a percé dans les années 2010; les grands modèles de langage ont émergé dans les années 2020. L'IA approche ou dépasse les humains en vision, langage et décision, déclenchant une révolution de productivité.","ru":"В 2010-х прорыв глубокого обучения; в 2020-х — большие языковые модели. ИИ приближается или превосходит человека в зрении, языке и решениях.","es":"El aprendizaje profundo irrumpió en los años 2010; los grandes modelos de lenguaje emergieron en los años 2020. La IA se acerca o supera a los humanos en visión, lenguaje y toma de decisiones, desencadenando una revolución de productividad.","ar":"اخترق التعلم العميق في عقد 2010؛ برزت نماذج اللغة الكبيرة في عقد 2020. يقترب الذكاء الاصطناعي من البشر أو يتجاوزهم في الرؤية واللغة واتخاذ القرار، مطلقاً ثورة إنتاجية."}},{"title":{"zh":"全球化与供应链","en":"Globalization & Supply Chains","fr":"Mondialisation et chaînes d'approvisionnement","ru":"Глобализация и цепочки поставок","es":"Globalización y cadenas de suministro","ar":"العولمة وسلاسل التوريد"},"desc":{"zh":"冷战后全球化加速，全球供应链使一个产品跨越数十国制造，数十亿人脱贫，但也制造了系统性脆弱和不平等。","en":"Post-Cold War globalization accelerated; global supply chains manufactured products across dozens of countries, lifting billions from poverty, but also creating systemic fragility and inequality.","fr":"La mondialisation post-Guerre froide a accéléré; les chaînes d'approvisionnement mondiales ont fabriqué des produits dans des dizaines de pays, sortant des milliards de la pauvreté, mais créant fragilité systémique et inégalité.","ru":"После холодной войны глобализация ускорилась; цепочки поставок произвели товары в десятках стран, выведя миллиарды из бедности, но создав системную хрупкость и неравенство.","es":"La globalización post-Guerra Fría se aceleró; las cadenas de suministro globales fabricaron productos en decenas de países, sacando a miles de millones de la pobreza, pero creando fragilidad sistémica e desigualdad.","ar":"تسارعت العولمة بعد الحرب الباردة؛ صنعت سلاسل التوريد العالمية منتجات في عشرات البلدان، منتشلةً مليارات من الفقر، لكنها خلقت هشاشة منظومية وعدم مساواة."}},{"title":{"zh":"气候变化共识","en":"Climate Change Consensus","fr":"Consensus sur le changement climatique","ru":"Консенсус об изменении климата","es":"Consenso sobre el cambio climático","ar":"إجماع تغير المناخ"},"desc":{"zh":"科学界确认人类活动导致全球变暖，海平面上升、极端天气加剧。巴黎协定设定碳减排目标，但执行力度不足。","en":"Science confirmed human-caused global warming, with rising sea levels and extreme weather. The Paris Agreement set carbon reduction targets, but implementation remains insufficient.","fr":"La science a confirmé le réchauffement climatique d'origine humaine, avec élévation du niveau de la mer et météo extrême. L'Accord de Paris a fixé des objectifs de réduction du carbone, mais leur mise en œuvre reste insuffisante.","ru":"Наука подтвердила антропогенное глобальное потепление с ростом уровня моря и экстремальной погодой. Парижское соглашение установило цели, но выполнение недостаточно.","es":"La ciencia confirmó el calentamiento global antropogénico, con elevación del nivel del mar y clima extremo. El Acuerdo de París fijó objetivos de reducción de carbono, pero su implementación sigue siendo insuficiente.","ar":"أكد العلم الاحترار العالمي بفعل الإنسان، مع ارتفاع مستوى البحر وطقس متطرف. حدد اتفاق باريس أهداف خفض الكربون، لكن التنفيذ لا يزال غير كافٍ."}},{"title":{"zh":"可再生能源革命","en":"Renewable Energy Revolution","fr":"Révolution des énergies renouvelables","ru":"Революция возобновляемой энергии","es":"Revolución de las energías renovables","ar":"ثورة الطاقة المتجددة"},"desc":{"zh":"太阳能和风能成本在十年内下降90%，电动汽车快速普及，能源转型正在重塑地缘政治和经济格局。","en":"Solar and wind energy costs dropped 90% in a decade; electric vehicles spread rapidly; the energy transition is reshaping geopolitics and economic landscapes.","fr":"Les coûts de l'énergie solaire et éolienne ont chuté de 90% en une décennie; les véhicules électriques se sont rapidement répandus; la transition énergétique redessine la géopolitique et l'économie.","ru":"Стоимость солнечной и ветровой энергии упала на 90% за десятилетие; электромобили быстро распространяются; энергетический переход меняет геополитику и экономику.","es":"Los costos de la energía solar y eólica cayeron 90% en una década; los vehículos eléctricos se difundieron rápidamente; la transición energética está reconfigurando la geopolítica y la economía.","ar":"انخفضت تكاليف الطاقة الشمسية وطاقة الرياح 90% في عقد؛ انتشرت المركبات الكهربائية بسرعة؛ إعادة تشكيل انتقال الطاقة للجيوسياسة والاقتصاد."}}],"insight":{"positive":{"zh":"信息网络加速文明进化——互联网使知识在全球即时共享，AI使知识生产自动化，人类正从信息时代迈向智能时代，进化速度前所未有。","en":"Information networks accelerate civilizational evolution — the Internet enables instant global knowledge sharing, AI automates knowledge production; humanity is moving from the information age to the intelligence age at unprecedented speed.","fr":"Les réseaux d'information accélèrent l'évolution civilisationnelle — Internet permet le partage instantané mondial des connaissances, l'IA automatise la production du savoir; l'humanité passe de l'ère de l'information à l'ère de l'intelligence à une vitesse sans précédent.","ru":"Информационные сети ускоряют эволюцию цивилизации — интернет обеспечивает мгновенный обмен знаниями, ИИ автоматизирует производство знаний; человечество переходит от информационной эры к эре интеллекта.","es":"Las redes de información aceleran la evolución civilizatoria — Internet permite el intercambio instantáneo global de conocimiento, la IA automatiza la producción de conocimiento; la humanidad pasa de la era de la información a la era de la inteligencia a velocidad sin precedentes.","ar":"تسرّع شبكات المعلومات التطور الحضاري — يمكّن الإنترنت المشاركة الفورية للمعرفة عالمياً، يؤتمت الذكاء الاصطناعي إنتاج المعرفة؛ ينتقل البشر من عصر المعلومات إلى عصر الذكاء بسرعة غير مسبوقة."},"warning":{"zh":"技术依赖使文明更脆弱——全球供应链、电力网络和卫星系统高度互联，一个节点故障可能引发连锁崩溃。文明复杂度越高，系统性风险越大。","en":"Technology dependence makes civilization fragile — global supply chains, power grids, and satellite systems are highly interconnected; a single node failure can trigger cascading collapse. Higher complexity means greater systemic risk.","fr":"La dépendance technologique rend la civilisation fragile — les chaînes d'approvisionnement mondiales, les réseaux électriques et les systèmes satellitaires sont hautement interconnectés; la défaillance d'un seul nœud peut déclencher un effondrement en cascade. Plus de complexité signifie plus de risque systémique.","ru":"Зависимость от технологий делает цивилизацию хрупкой — глобальные цепочки, энергосети и спутники тесно связаны; отказ одного узла может вызвать каскадный коллапс. Чем сложнее цивилизация, тем выше системный риск.","es":"La dependencia tecnológica hace frágil a la civilización — las cadenas de suministro globales, las redes eléctricas y los sistemas satelitales están altamente interconectados; la falla de un solo nodo puede desencadenar un colapso en cascada. Mayor complejidad significa mayor riesgo sistémico.","ar":"تجعل التبعية التكنولوجية الحضارة هشّة — سلاسل التوريد العالمية وشبكات الكهرباء وأنظمة الأقمار الصناعية مترابطة للغاية؛ عطل عقدة واحدة قد يطلق انهياراً متسلسلاً. كلما زاد التعقيد زاد الخطر المنهجي."}}}],"cosmicInsights":{"positive":[{"title":{"zh":"生命的韧性超乎想象","en":"Life's Resilience Beyond Imagination","fr":"La résilience de la vie dépasse l'imagination","ru":"Жизнестойкость превосходит воображение","es":"La resiliencia de la vida supera la imaginación","ar":"مرونة الحياة تتجاوز الخيال"},"desc":{"zh":"生命从深海热液到极地冰层无处不在，经历了5次大灭绝仍生生不息。这表明只要有能量和液态溶剂，生命就能在宇宙各处萌发。","en":"Life thrives everywhere from hydrothermal vents to polar ice, surviving 5 mass extinctions. This suggests that wherever energy and liquid solvents exist, life can emerge across the universe.","fr":"La vie prospère partout des sources hydrothermales aux glaces polaires, survivant à 5 extinctions de masse. Cela suggère que partout où existent énergie et solvant liquide, la vie peut émerger dans l'univers.","ru":"Жизнь процветает от гидротермальных источников до полярных льдов, пережив 5 массовых вымираний. Это означает: где есть энергия и жидкий растворитель, жизнь возможна.","es":"La vida prospera en todas partes, desde fuentes hidrotermales hasta hielos polares, sobreviviendo a 5 extinciones masivas. Esto sugiere que donde haya energía y solvente líquido, la vida puede surgir en el universo.","ar":"تزدهر الحياة في كل مكان من النساخ الحرارية إلى الجليد القطبي، ناجيةً من 5 انقراضات جماعية. يوحي هذا بأنه أينما وُجدت طاقة ومذيب سائل، يمكن أن تنشأ الحياة في الكون."}},{"title":{"zh":"合作是进化的超级加速器","en":"Cooperation is Evolution's Super-Accelerator","fr":"La coopération est le super-acélérateur de l'évolution","ru":"Сотрудничество — суперакселератор эволюции","es":"La cooperación es el superacelerador de la evolución","ar":"التعاون هو المسرّع الفائق للتطور"},"desc":{"zh":"从内共生到人类社会，每一次合作跃迁都带来了复杂性爆炸。星际文明的形成可能也需要跨物种、跨行星的合作机制。","en":"From endosymbiosis to human society, each cooperative leap triggered a complexity explosion. Forming interstellar civilization may likewise require cross-species, cross-planetary cooperation.","fr":"De l'endosymbiose à la société humaine, chaque bond coopératif a déclenché une explosion de complexité. La formation d'une civilisation interstellaire pourrait nécessiter des mécanismes de coopération inter-espèces et interplanétaires.","ru":"От эндосимбиоза до человеческого общества каждый скачок сотрудничества вызывал взрыв сложности. Межзвёздная цивилизация потребует межвидового и межпланетного сотрудничества.","es":"De la endosimbiosis a la sociedad humana, cada salto cooperativo desencadenó una explosión de complejidad. La formación de una civilización interestelar podría requerir mecanismos de cooperación inter-especies e interplanetaria.","ar":"من التعايش الداخلي إلى المجتمع البشري، كل قفزة تعاونية أطلقت انفجاراً في التعقيد. قد يتطلب تكوين حضارة بين النجوم آليات تعاون بين الأنواع وبين الكواكب."}},{"title":{"zh":"知识积累突破物理极限","en":"Knowledge Accumulation Breaks Physical Limits","fr":"L'accumulation des connaissances dépasse les limites physiques","ru":"Накопление знаний пробивает физические пределы","es":"La acumulación de conocimiento supera los límites físicos","ar":"تراكم المعرفة يتجاوز الحدود الفيزيائية"},"desc":{"zh":"文字、印刷术、互联网使知识跨代指数增长。一个文明只要不自我毁灭，其知识终将突破行星级物理限制，走向星际。","en":"Writing, printing, and the Internet enabled exponential cross-generational knowledge growth. A civilization that avoids self-destruction will eventually break planetary physical limits and reach for the stars.","fr":"L'écriture, l'imprimerie et Internet ont permis une croissance exponentielle des connaissances. Une civilisation qui évite l'auto-destruction finira par dépasser les limites physiques planétaires et atteindre les étoiles.","ru":"Письменность, книгопечатание и интернет дали экспоненциальный рост знаний. Цивилизация, избежавшая самоуничтожения, в итоге преодолеет планетарные пределы и выйдет к звёздам.","es":"La escritura, la imprenta e Internet permitieron un crecimiento exponencial del conocimiento. Una civilización que evite la autodestrucción eventualmente superará los límites físicos planetarios y alcanzará las estrellas.","ar":"مكّنت الكتابة والطباعة والإنترنت نمواً أسيّاً للمعرفة. الحضارة التي تتجنب التدمير الذاتي س تتجاوز في النهاية الحدود الفيزيائية الكوكبية وتبلغ النجوم."}},{"title":{"zh":"多样性是终极保险策略","en":"Diversity is the Ultimate Insurance Strategy","fr":"La diversité est la stratégie d'assurance ultime","ru":"Разнообразие — высшая стратегия страхования","es":"La diversidad es la estrategia de seguro definitiva","ar":"التنوع هو استراتيجية التأمين القصوى"},"desc":{"zh":"每次大灭绝后，正是幸存的边缘物种重建了生态系统。星际文明应保持文化和生物多样性，以防单一文明路径失败时无替代方案。","en":"After each mass extinction, surviving marginal species rebuilt ecosystems. Interstellar civilization should maintain cultural and biological diversity, lest a single civilizational path fail with no backup.","fr":"Après chaque extinction de masse, ce sont les espèces marginales survivantes qui ont reconstruit les écosystèmes. La civilisation interstellaire devrait maintenir la diversité culturelle et biologique, de peur qu'une seule voie échoue sans alternative.","ru":"После каждого вымирания выжившие маргинальные виды восстанавливали экосистемы. Межзвёздная цивилизация должна сохранять культурное и биологическое разнообразие.","es":"Tras cada extinción masiva, fueron las especies marginales sobrevivientes las que reconstruyeron los ecosistemas. La civilización interestelar debería mantener la diversidad cultural y biológica, no sea que un solo camino civilizatorio fracase sin alternativa.","ar":"بعد كل انقراض جماعي، كانت الأنواع الهامشية الناجية هي التي أعادت بناء النظم البيئية. يجب أن تحافظ الحضارة بين النجوم على التنوع الثقافي والبيولوجي، خشية أن يفشل مسار حضاري واحد بلا بديل."}},{"title":{"zh":"技术创新是跨越灾难的桥梁","en":"Technological Innovation Bridges Catastrophes","fr":"L'innovation technologique est le pont entre les catastrophes","ru":"Технологические инновации — мост через катастрофы","es":"La innovación tecnológica es el puente entre catástrofes","ar":"الابتكار التكنولوجي هو الجسر بين الكوارث"},"desc":{"zh":"火帮助人类度过冰期，农业度过饥荒，抗生素战胜瘟疫。面对未来宇宙级威胁，技术创新是文明存续的唯一出路。","en":"Fire helped humans survive ice ages, agriculture survived famine, antibiotics conquered plague. Facing future cosmic-scale threats, technological innovation is civilization's only path to survival.","fr":"Le feu a aidé à survivre aux ères glaciaires, l'agriculture aux famines, les antibiotiques aux épidémies. Face aux futures menaces à échelle cosmique, l'innovation technologique est la seule voie de survie.","ru":"Огонь помог пережить ледники, земледелие — голод, антибиотики — чуму. Перед будущими космическими угрозами инновации — единственный путь выживания цивилизации.","es":"El fuego ayudó a sobrevivir glaciaciones, la agricultura a hambrunas, los antibióticos a plagas. Frente a futuras amenazas a escala cósmica, la innovac
