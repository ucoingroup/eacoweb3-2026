/* ===== Reset ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{

}
.header-title{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:700;color:#fff;margin-bottom:.3rem;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-subtitle{font-size:clamp(.85rem,2vw,1.1rem);color:rgba(255,255,255,.85);margin-bottom:1rem}
.header-subtitle span{display:inline}

/* ===== Controls ===== */
.controls{display:flex;justify-content:center;align-items:center;gap:.8rem;flex-wrap:wrap}
.ctrl-btn{
  padding:.4rem 1rem;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);
  color:#fff;border-radius:4px;cursor:pointer;font-size:.85rem;transition:all .2s;

}
.ctrl-btn:hover{background:rgba(255,255,255,.25)}
.theme-switcher{display:flex;gap:.3rem}
.theme-btn{

}
.theme-btn.active{background:rgba(255,255,255,.3);color:#fff;border-color:rgba(255,255,255,.6)}

nav{
  background:var(--bg-secondary);padding:.8rem 1.5rem;
  display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
}
.cat-btn{
  padding:.5rem 1.5rem;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);border-radius:6px;cursor:pointer;font-size:.95rem;
  transition:all .2s;font-family:inherit;font-weight:500;
}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== Search ===== */
.search-bar{

}
.search-bar input{

  color:var(--text-primary);border-radius:6px;font-size:.95rem;font-family:inherit;
  transition:border-color .2s;
}
.search-bar input:focus{outline:none;border-color:var(--accent)}
.result-count{font-size:.8rem;color:var(--text-muted);white-space:nowrap}

/* ===== Book Grid ===== */
.book-grid{
  max-width:1400px;margin:0 auto;padding:1rem 1.5rem 3rem;

}

/* ===== Book Card ===== */

}
.book-card:hover{border-color:var(--accent);box-shadow:0 4px 20px var(--shadow)}
.book-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:var(--accent);opacity:0;transition:opacity .3s;
}
.book-card:hover::before{opacity:1}
.book-num{

  background:var(--bg-secondary);padding:.1rem .5rem;border-radius:3px;margin-bottom:.5rem;
}
.book-title{font-size:1.25rem;font-weight:700;color:var(--text-primary);margin-bottom:.3rem}
.book-author{font-size:.85rem;color:var(--text-secondary);margin-bottom:.8rem}
.book-author span{color:var(--text-muted)}
.eaco-quote{
  background:var(--quote-bg);border-left:3px solid var(--highlight);
  padding:.6rem .8rem;border-radius:0 4px 4px 0;margin-bottom:.6rem;
  font-size:.88rem;color:var(--text-primary);font-style:italic;line-height:1.5;
}
.eaco-quote::before{content:'EACO ';font-weight:700;color:var(--highlight);font-style:normal;font-size:.8rem}
.expand-btn{
  background:none;border:1px solid var(--border);color:var(--text-secondary);
  padding:.3rem .8rem;border-radius:4px;cursor:pointer;font-size:.8rem;
  transition:all .2s;font-family:inherit;display:block;margin:0 auto;
}
.expand-btn:hover{border-color:var(--accent);color:var(--accent)}
.book-summary{
  max-height:0;overflow:hidden;transition:max-height .4s ease;margin-top:0;
}
.book-summary.expanded{max-height:800px;margin-top:.8rem}
.summary-list{list-style:none;padding-left:0}
.summary-list li{
  padding:.35rem 0;font-size:.85rem;color:var(--text-secondary);
  border-bottom:1px dashed var(--border);line-height:1.5;
}
.summary-list li:last-child{border-bottom:none}
.summary-list li::before{
  content:counter(item);counter-increment:item;
  display:inline-block;width:1.5rem;height:1.5rem;line-height:1.5rem;text-align:center;
  background:var(--accent);color:#fff;border-radius:50%;font-size:.7rem;margin-right:.5rem;

}
.summary-list{counter-reset:item}

footer{

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--accent);color:#fff;padding:.6rem 1.5rem;border-radius:6px;
  font-size:.85rem;opacity:0;transition:all .3s;z-index:1000;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== Scroll to Top ===== */
.scroll-top{
  position:fixed;bottom:2rem;right:2rem;width:40px;height:40px;
  background:var(--accent);color:#fff;border:none;border-radius:50%;
  cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;
  z-index:999;transition:all .3s;box-shadow:0 2px 10px var(--shadow);
}
.scroll-top.show{display:flex}
.scroll-top:hover{transform:translateY(-3px)}

/* ===== Loading ===== */
.loading{text-align:center;padding:3rem;color:var(--text-muted);font-size:1rem}
.no-results{text-align:center;padding:3rem;color:var(--text-muted)}

/* ===== Language Display ===== */
html[data-lang="zh"] [data-lang="en"]{display:none!important}
html[data-lang="en"] [data-lang="zh"]{display:none!important}

/* ===== Responsive ===== */
@media(max-width:768px){
  .book-grid{grid-template-columns:1fr;padding:1rem}

  nav{padding:.6rem .8rem}
  .cat-btn{padding:.4rem 1rem;font-size:.85rem}

@media(max-width:480px){
  .footer-links-grid{grid-template-columns:1fr}
  .controls{flex-direction:column;gap:.5rem}
}
</style>

<!-- App Logic -->
<script>
// ===== Combine Data =====
const ALL_BOOKS = {
  economics: [
    ...(typeof ECON_BOOKS_1 !== 'undefined' ? ECON_BOOKS_1 : []),
    ...(typeof ECON_BOOKS_2 !== 'undefined' ? ECON_BOOKS_2 : [])
  ],
  technology: [
    ...(typeof TECH_BOOKS_1 !== 'undefined' ? TECH_BOOKS_1 : []),
    ...(typeof TECH_BOOKS_2 !== 'undefined' ? TECH_BOOKS_2 : [])
  ]
};

// ===== State =====
let state = {
  lang: localStorage.getItem('eaco-lang') || 'zh',
  theme: localStorage.getItem('eaco-theme') || 'classical',
  category: 'economics',
  search: ''
};

// ===== Footer Links Data =====
const FOOTER_LINKS = [
  {url:'https://ucoingroup.github.io/earths-best-coin/',zh:'地球最佳代币',en:"Earth's Best Coin"},
  {url:'https://ucoingroup.github.io/eaco50rate/',zh:'EACO汇率',en:'EACO 50 Rate'},
  {url:'https://ucoingroup.github.io/100WaysToWealth/',zh:'百富之道',en:'100 Ways to Wealth'},
  {url:'https://ucoingroup.github.io/earth-100-friends/',zh:'地球百友',en:"Earth's 100 Friends"},
  {url:'https://ucoingroup.github.io/eacoSWAP/',zh:'EACO兑换',en:'EACO SWAP'},
  {url:'https://ucoingroup.github.io/good-books/',zh:'善书馆',en:'Good Books'},
  {url:'https://ucoingroup.github.io/eur-eaco/',zh:'EUR-EACO',en:'EUR-EACO'},
  {url:'https://ucoingroup.github.io/au-trade/',zh:'澳亚贸易',en:'AU Trade'},
  {url:'https://ucoingroup.github.io/Mohist-Tech/',zh:'墨家科技',en:'Mohist Tech'},
  {url:'https://eaco-build-world.base44.app/',zh:'EACO建世',en:'EACO Build World'},
  {url:'https://eaco-web3.base44.app',zh:'EACO Web3',en:'EACO Web3'},
  {url:'https://ucoingroup.github.io/Footsteps-of-Civilization/',zh:'文明足迹',en:'Footsteps of Civilization'},
  {url:'https://ucoingroup.github.io/eacoweb3-2026/',zh:'EACO Web3 2026',en:'EACO Web3 2026'},
  {url:'https://discord.gg/bWCDME9Pkc',zh:'Discord社区',en:'Discord Community'}
];

// ===== Render Footer Links =====
function renderFooterLinks(){
  const grid = document.getElementById('footerLinks');
  grid.innerHTML = FOOTER_LINKS.map(l =>
    `<a class="footer-link" href="${l.url}" target="_blank" rel="noopener">
      <span class="link-zh">${l.zh}</span>
      <span class="link-en">${l.en}</span>
    </a>`
  ).join('');
}

// ===== Render Books =====
function renderBooks(){
  const grid = document.getElementById('bookGrid');
  let books = ALL_BOOKS[state.category] || [];

  // Filter by search
  if(state.search){
    const q = state.search.toLowerCase();
    books = books.filter(b =>
      (b.title_zh||'').toLowerCase().includes(q) ||
      (b.title_en||'').toLowerCase().includes(q) ||
      (b.author_zh||'').toLowerCase().includes(q) ||
      (b.author_en||'').toLowerCase().includes(q) ||
      (b.era_zh||'').toLowerCase().includes(q) ||
      (b.era_en||'').toLowerCase().includes(q)
    );
  }

  // Update result count
  const countEl = document.getElementById('resultCount');
  const total = (ALL_BOOKS[state.category]||[]).length;
  if(state.search){
    countEl.textContent = state.lang === 'zh' ? `${books.length}/${total} 部` : `${books.length}/${total} books`;
  } else {
    countEl.textContent = state.lang === 'zh' ? `共 ${total} 部` : `${total} books total`;
  }

  // No results
  if(books.length === 0){
    grid.innerHTML = `<div class="no-results">
      <span data-lang="zh">未找到相关书籍</span>
      <span data-lang="en">No books found</span>
    </div>`;
    updateLangDisplay();
    return;
  }

  // Render cards
  grid.innerHTML = books.map(book => {
    const summaryZh = (book.summary_zh||[]).map((s,i) => `<li>${escapeHtml(s)}</li>`).join('');
    const summaryEn = (book.summary_en||[]).map((s,i) => `<li>${escapeHtml(s)}</li>`).join('');
    return `
    <div class="book-card" id="book-${book.id}">
      <span class="book-num">#${String(book.id).padStart(3,'0')}</span>
      <div class="book-title" data-lang="zh">${escapeHtml(book.title_zh||'')}</div>
      <div class="book-title" data-lang="en">${escapeHtml(book.title_en||'')}</div>
      <div class="book-author">
        <span data-lang="zh">${escapeHtml(book.author_zh||'')} · ${escapeHtml(book.era_zh||'')}</span>
        <span data-lang="en">${escapeHtml(book.author_en||'')} · ${escapeHtml(book.era_en||'')}</span>
      </div>
      <div class="eaco-quote">
        <div data-lang="zh">${escapeHtml(book.eaco_zh||'')}</div>
        <div data-lang="en">${escapeHtml(book.eaco_en||'')}</div>
      </div>
      <button class="expand-btn" onclick="toggleSummary(${book.id})">
        <span data-lang="zh">展开十句摘要 ▼</span>
        <span data-lang="en">Show Summary ▼</span>
      </button>
      <div class="book-summary" id="summary-${book.id}">
        <ol class="summary-list" data-lang="zh">${summaryZh}</ol>
        <ol class="summary-list" data-lang="en">${summaryEn}</ol>
      </div>
    </div>`;
  }).join('');

  updateLangDisplay();
}

// ===== Toggle Summary =====
function toggleSummary(id){
  const el = document.getElementById('summary-'+id);
  const btn = el.previousElementSibling;
  if(el.classList.contains('expanded')){
    el.classList.remove('expanded');
    btn.querySelector('[data-lang="zh"]').textContent = '展开十句摘要 ▼';
    btn.querySelector('[data-lang="en"]').textContent = 'Show Summary ▼';
  } else {
    el.classList.add('expanded');
    btn.querySelector('[data-lang="zh"]').textContent = '收起摘要 ▲';
    btn.querySelector('[data-lang="en"]').textContent = 'Hide Summary ▲';
  }
}

// ===== Toggle Language =====
function toggleLang(){
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('eaco-lang', state.lang);
  updateLangDisplay();
  // Update search placeholder
  document.getElementById('searchInput').placeholder =
    state.lang === 'zh' ? '搜索书名、作者、时代...' : 'Search title, author, era...';
  renderBooks();
}

// ===== Update Language Display =====
function updateLangDisplay(){
  document.documentElement.setAttribute('data-lang', state.lang);
  document.getElementById('searchInput').placeholder =
    state.lang === 'zh' ? '搜索书名、作者、时代...' : 'Search title, author, era...';
}

// ===== Switch Theme =====
function switchTheme(theme){
  state.theme = theme;
  localStorage.setItem('eaco-theme', theme);
  document.body.className = 'theme-' + theme;
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
}

// ===== Switch Category =====
function switchCategory(cat){
  state.category = cat;
  state.search = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  renderBooks();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== Search =====
let searchTimer;
function onSearch(val){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = val.trim();
    renderBooks();
  }, 250);
}

// ===== Copy CA =====
function copyCA(){
  const ca = 'DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH';
  if(navigator.clipboard){
    navigator.clipboard.writeText(ca).then(() => showToast(state.lang==='zh'?'已复制到剪贴板':'Copied!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = ca; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast(state.lang==='zh'?'已复制到剪贴板':'Copied!');
  }
}

// ===== Toast =====
function showToast(msg){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const toast = document.createElement('div');
  toast.className = 'toast'; toast.textContent = msg;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 2000);
}

// ===== Scroll to Top =====
function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('show', window.scrollY > 600);
});

// ===== Escape HTML =====
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== Init =====
function init(){
  // Apply saved theme
  document.body.className = 'theme-' + state.theme;
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === state.theme);
  });
  // Apply saved language
  updateLangDisplay();
  // Render
  renderFooterLinks();
  renderBooks();
}

// Wait for DOM
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
