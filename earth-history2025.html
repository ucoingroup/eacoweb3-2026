    "en": "Outposts must live off the land: maximize in-situ resources and minimize dependence on resupply from home."
  },
  "books.28.n": {
    "zh": "超限战",
    "en": "Unrestricted Warfare"
  },
  "books.28.a": {
    "zh": "乔良、王湘穗 · 1999年",
    "en": "Qiao Liang & Wang Xiangsui · 1999"
  },
  "books.28.c": {
    "zh": "冲突边界扩展到金融、法律、信息、生态等非军事领域。",
    "en": "Conflict expands beyond the military into finance, law, information and ecology."
  },
  "books.28.s": {
    "zh": "星际竞争更可能发生在标准、账本、专利与叙事层，而非舰队交火。",
    "en": "Interstellar competition will more likely occur in standards, ledgers, patents and narratives than in fleet engagements."
  },
  "books.29.n": {
    "zh": "战略：一部历史",
    "en": "Strategy: A History"
  },
  "books.29.a": {
    "zh": "劳伦斯·弗里德曼 · 2013年",
    "en": "Lawrence Freedman · 2013"
  },
  "books.29.c": {
    "zh": "从军事到商业到政治，论证战略本质是\"改变故事\"而非执行完美计划。",
    "en": "From war to business to politics: strategy is about changing the story, not executing a perfect plan."
  },
  "books.29.s": {
    "zh": "星际叙事本身就是战略资源——\"返乡\"这一叙事能动员的资源超过任何补贴。",
    "en": "The interstellar narrative is itself a strategic resource: \"going home\" mobilizes more than any subsidy."
  },
  "tech_domains.0.d": {
    "zh": "推进系统",
    "en": "Propulsion"
  },
  "tech_domains.0.items.0.n": {
    "zh": "化学火箭",
    "en": "Chemical rockets"
  },
  "tech_domains.0.items.0.d": {
    "zh": "液氧/煤油、液氢等成熟推进，仍是当前入轨主力。",
    "en": "LOX/kerosene, LH2 and other mature propulsion remain the workhorse of launch today."
  },
  "tech_domains.0.items.1.n": {
    "zh": "可复用一级火箭",
    "en": "Reusable first stages"
  },
  "tech_domains.0.items.1.d": {
    "zh": "垂直回收使入轨成本下降约一个数量级，开启可持续航天工业。",
    "en": "Vertical landing cut launch cost by roughly an order of magnitude, enabling a sustainable launch industry."
  },
  "tech_domains.0.items.2.n": {
    "zh": "离子电推进",
    "en": "Ion / electric propulsion"
  },
  "tech_domains.0.items.2.d": {
    "zh": "深空探测器已广泛采用，比冲是化学推进的10倍级，适合长航时迁移。",
    "en": "Widely used on deep-space probes; specific impulse is an order of magnitude above chemical, ideal for long transfers."
  },
  "tech_domains.0.items.3.n": {
    "zh": "霍尔/等离子体推力器",
    "en": "Hall / plasma thrusters"
  },
  "tech_domains.0.items.3.d": {
    "zh": "已在地球同步轨道与深空任务飞行，寿命与推力持续提升。",
    "en": "Flown on GEO and deep-space missions with steadily improving thrust and lifetime."
  },
  "tech_domains.0.items.4.n": {
    "zh": "核热推进 (NTP)",
    "en": "Nuclear thermal propulsion"
  },
  "tech_domains.0.items.4.d": {
    "zh": "用反应堆加热工质，比冲约为化学推进的2倍，美中俄均有在研计划。",
    "en": "A reactor heats propellant, roughly doubling specific impulse; the U.S., China and Russia have active programs."
  },
  "tech_domains.0.items.5.n": {
    "zh": "核电推进 (NEP)",
    "en": "Nuclear electric propulsion"
  },
  "tech_domains.0.items.5.d": {
    "zh": "反应堆发电驱动电推，适合大型长航时任务，是火星及以远的关键候选。",
    "en": "Reactor-powered electric propulsion suits large, long-duration missions; a key candidate for Mars and beyond."
  },
  "tech_domains.0.items.6.n": {
    "zh": "太阳帆",
    "en": "Solar sails"
  },
  "tech_domains.0.items.6.d": {
    "zh": "利用光压推进，无需工质，适合长期加速与太阳极区任务。",
    "en": "Propulsion by radiation pressure needs no propellant; fits long-term acceleration and solar-polar missions."
  },
  "tech_domains.0.items.7.n": {
    "zh": "核脉冲推进 (猎户座/代达罗斯)",
    "en": "Nuclear pulse propulsion"
  },
  "tech_domains.0.items.7.d": {
    "zh": "以外部核爆序列推进，理论推力巨大，受条约与辐射约束未实飞。",
    "en": "Sequential external nuclear detonations give huge thrust; constrained by treaties and radiation, never flown."
  },
  "tech_domains.0.items.8.n": {
    "zh": "反物质推进",
    "en": "Antimatter propulsion"
  },
  "tech_domains.0.items.8.d": {
    "zh": "湮灭能将质能转换效率推到极限，但制备/储存成本仍高到不现实。",
    "en": "Annihilation approaches the theoretical limit of mass-energy use, but production and storage costs remain impractical."
  },
  "tech_domains.0.items.9.n": {
    "zh": "曲速/阿尔库比耶雷度规",
    "en": "Warp / Alcubierre metric"
  },
  "tech_domains.0.items.9.d": {
    "zh": "借助负能量密度弯曲时空，数学上可行、工程上未解，需先解决能量条件。",
    "en": "Bends spacetime via negative energy density; mathematically possible, engineering-unsolved, pending the energy-condition problem."
  },
  "tech_domains.1.d": {
    "zh": "能源与电源",
    "en": "Power"
  },
  "tech_domains.1.items.0.n": {
    "zh": "硅/砷化镓太阳能电池阵",
    "en": "Silicon / GaAs solar arrays"
  },
  "tech_domains.1.items.0.d": {
    "zh": "已飞行数十年，是近地航天器主电源，效率与比功率持续提升。",
    "en": "Flown for decades as the primary near-Earth power source, with rising efficiency and specific power."
  },
  "tech_domains.1.items.1.n": {
    "zh": "放射性同位素电源 (RTG)",
    "en": "Radioisotope power (RTG)"
  },
  "tech_domains.1.items.1.d": {
    "zh": "为旅行者号等深空任务供电数十年，不依赖阳光，是外行星任务基石。",
    "en": "Powered Voyager and other deep-space craft for decades; sunlight-independent and vital beyond the inner system."
  },
  "tech_domains.1.items.2.n": {
    "zh": "空间核裂变反应堆",
    "en": "Space fission reactors"
  },
  "tech_domains.1.items.2.d": {
    "zh": "为月球/火星基地与高功率电推供能，多国处于工程验证阶段。",
    "en": "Would power lunar/Martian bases and high-power electric propulsion; several nations are at engineering validation."
  },
  "tech_domains.1.items.3.n": {
    "zh": "高效轻型光伏与聚光",
    "en": "High-efficiency lightweight PV"
  },
  "tech_domains.1.items.3.d": {
    "zh": "钙钛矿/多结叠层与柔性阵提高深空比功率，降低发射质量。",
    "en": "Perovskite, multi-junction and flexible arrays raise specific power for deep space while cutting mass."
  },
  "tech_domains.1.items.4.n": {
    "zh": "无线能量传输",
    "en": "Wireless power transfer"
  },
  "tech_domains.1.items.4.d": {
    "zh": "微波/激光束为漫游车或轨道平台远程供能，验证中。",
    "en": "Microwave or laser beams deliver power to rovers or platforms remotely; under validation."
  },
  "tech_domains.1.items.5.n": {
    "zh": "超导储能与磁能",
    "en": "Superconducting storage"
  },
  "tech_domains.1.items.5.d": {
    "zh": "低温超导线圈储能、磁约束相关，利于脉冲负载与磁帆。",
    "en": "Cryogenic superconducting coils store energy and aid magnetic sails and pulsed loads."
  },
  "tech_domains.1.items.6.n": {
    "zh": "燃料电池与再生氢氧",
    "en": "Fuel cells and regenerative H₂/O₂"
  },
  "tech_domains.1.items.6.d": {
    "zh": "为基地提供可往返储能，与电解水制氧互补。",
    "en": "Reversible energy storage for bases, complementary to electrolytic oxygen generation."
  },
  "tech_domains.1.items.7.n": {
    "zh": "在轨核燃料循环",
    "en": "In-orbit fuel cycles"
  },
  "tech_domains.1.items.7.d": {
    "zh": "就地生产/后处理使长期任务摆脱地面补给，尚处概念。",
    "en": "Local production and reprocessing free long missions from Earth resupply; still conceptual."
  },
  "tech_domains.1.items.8.n": {
    "zh": "空间核聚变电源",
    "en": "Space fusion power"
  },
  "tech_domains.1.items.8.d": {
    "zh": "紧凑托卡马克/场反位形若成功，将提供近乎无限的比功率。",
    "en": "Compact tokamak or FRC fusion would deliver near-limitless specific power if realized."
  },
  "tech_domains.1.items.9.n": {
    "zh": "真空零点能收集",
    "en": "Vacuum / zero-point energy"
  },
  "tech_domains.1.items.9.d": {
    "zh": "卡西米尔效应是间接证据，规模远不足工程需要，属长期探索。",
    "en": "The Casimir effect is indirect evidence, far below engineering needs; a long-horizon research direction."
  },
  "tech_domains.2.d": {
    "zh": "生命支持与防护",
    "en": "Life support & shielding"
  },
  "tech_domains.2.items.0.n": {
    "zh": "再生式环控生保 (ECLSS)",
    "en": "Regenerative ECLSS"
  },
  "tech_domains.2.items.0.d": {
    "zh": "国际空间站已实现水氧回收，长期闭环是深空前提。",
    "en": "The ISS already recycles water and oxygen; long closed loops are a prerequisite for deep space."
  },
  "tech_domains.2.items.1.n": {
    "zh": "水/尿回收系统",
    "en": "Water/urine recovery"
  },
  "tech_domains.2.items.1.d": {
    "zh": "回收率超过90%，是舱内最成熟的资源循环环节。",
    "en": "Recovery above 90% — the most mature resource loop on board."
  },
  "tech_domains.2.items.2.n": {
    "zh": "聚乙烯/水基辐射屏蔽",
    "en": "Polyethylene / water shielding"
  },
  "tech_domains.2.items.2.d": {
    "zh": "以富氢材料削减银河宇宙射线与太阳粒子事件，已用于舱内。",
    "en": "Hydrogen-rich materials cut galactic cosmic rays and solar particle events; used inside modules."
  },
  "tech_domains.2.items.3.n": {
    "zh": "主动磁/等离子屏蔽",
    "en": "Active magnetic/plasma shielding"
  },
  "tech_domains.2.items.3.d": {
    "zh": "用磁场偏转带电粒子，减轻质量负担，处于地面验证。",
    "en": "Magnetic fields deflect charged particles, cutting mass; at ground validation."
  },
  "tech_domains.2.items.4.n": {
    "zh": "人工重力 (旋转结构)",
    "en": "Artificial gravity (rotation)"
  },
  "tech_domains.2.items.4.d": {
    "zh": "通过旋转产生离心重力，对抗骨肌与体液流失，工程可行性已论证。",
    "en": "Rotation yields centrifugal gravity against bone/muscle loss; engineering feasibility is established."
  },
  "tech_domains.2.items.5.n": {
    "zh": "低温休眠舱",
    "en": "Hibernation / cryo-sleep"
  },
  "tech_domains.2.items.5.d": {
    "zh": "降低代谢减缓寿命损耗，医学界在探索其可行性。",
    "en": "Lowering metabolism slows life-support load; medicine is exploring feasibility."
  },
  "tech_domains.2.items.6.n": {
    "zh": "闭环生态 (受控生态)",
    "en": "Closed ecological systems"
  },
  "tech_domains.2.items.6.d": {
    "zh": "藻类、植物与微生物构成部分食物与气体循环，俄BIOS系列已试验。",
    "en": "Algae, plants and microbes supply part of food and gas cycling; Russia's BIOS series tested it."
  },
  "tech_domains.2.items.7.n": {
    "zh": "辐射药物与抗辐照基因",
    "en": "Radioprotective drugs and genes"
  },
  "tech_domains.2.items.7.d": {
    "zh": "药理与基因干预提高耐受，是低成本减害路径。",
    "en": "Pharma and genetic interventions raise tolerance — a low-mass mitigation path."
  },
  "tech_domains.2.items.8.n": {
    "zh": "生物打印器官",
    "en": "Bioprinted organs"
  },
  "tech_domains.2.items.8.d": {
    "zh": "按需再生受损组织，远期可消去药箱与备件需求。",
    "en": "On-demand tissue regeneration could remove the need for drug kits and spare parts long term."
  },
  "tech_domains.2.items.9.n": {
    "zh": "全人工合成生态",
    "en": "Fully synthetic ecosystem"
  },
  "tech_domains.2.items.9.d": {
    "zh": "完全工程化的微生物食物网，摆脱地球生物质依赖。",
    "en": "A fully engineered microbial food web free of Earth biomass dependence."
  },
  "tech_domains.3.d": {
    "zh": "通信导航",
    "en": "Comms & navigation"
  },
  "tech_domains.3.items.0.n": {
    "zh": "深空网络 (DSN)",
    "en": "Deep Space Network"
  },
  "tech_domains.3.items.0.d": {
    "zh": "全球巨型天线为数十亿公里外探测器提供测控与数据中继。",
    "en": "Giant global antennas track and relay probes billions of kilometres away."
  },
  "tech_domains.3.items.1.n": {
    "zh": "X/Ka波段高速链路",
    "en": "X/Ka-band high-rate links"
  },
  "tech_domains.3.items.1.d": {
    "zh": "为遥感与科学数据提供Mbps级回传，是信息流主干。",
    "en": "Delivers Mbps-class downlinks for science data; the information backbone."
  },
  "tech_domains.3.items.2.n": {
    "zh": "深空激光通信",
    "en": "Deep-space optical comms"
  },
  "tech_domains.3.items.2.d": {
    "zh": "光通信带宽比射频高数量级，已在近地验证并向深空扩展。",
    "en": "Optical links offer orders-of-magnitude more bandwidth; proven near Earth and extending deep."
  },
  "tech_domains.3.items.3.n": {
    "zh": "延迟容忍网络 (DTN)",
    "en": "Delay-tolerant networking"
  },
  "tech_domains.3.items.3.d": {
    "zh": "应对分钟到小时级延迟与断链，是星际互联网的基础协议。",
    "en": "Copes with minutes-to-hours latency and disconnection; the base protocol of an interstellar internet."
  },
  "tech_domains.3.items.4.n": {
    "zh": "脉冲星自主导航 (XNAV)",
    "en": "Pulsar-based navigation"
  },
  "tech_domains.3.items.4.d": {
    "zh": "以毫秒脉冲星为宇宙灯塔自主定位，降低对地面测控依赖。",
    "en": "Millisecond pulsars act as cosmic lighthouses for autonomous fixes, reducing dependence on Earth."
  },
  "tech_domains.3.items.5.n": {
    "zh": "星载原子钟",
    "en": "Spacecraft atomic clocks"
  },
  "tech_domains.3.items.5.d": {
    "zh": "提供高稳定时间基准，支撑自主测距与相对导航。",
    "en": "High-stability timing enables autonomous ranging and relative navigation."
  },
  "tech_domains.3.items.6.n": {
    "zh": "量子密钥分发",
    "en": "Quantum key distribution"
  },
  "tech_domains.3.items.6.d": {
    "zh": "为深空链路提供理论上不可窃听的安全层，地面已商用。",
    "en": "Theoretically uninterceptable security for links; already commercial on the ground."
  },
  "tech_domains.3.items.7.n": {
    "zh": "相控阵与波束捷变",
    "en": "Phased arrays and beam agility"
  },
  "tech_domains.3.items.7.d": {
    "zh": "软件定义波束可在无机械转动下同时服务多目标。",
    "en": "Software-defined beams serve multiple targets with no mechanical motion."
  },
  "tech_domains.3.items.8.n": {
    "zh": "星敏感器/视觉导航",
    "en": "Star trackers / visual navigation"
  },
  "tech_domains.3.items.8.d": {
    "zh": "以星图或地形图像实时定姿定位，是自主着陆的核心。",
    "en": "Star maps or terrain images give real-time attitude and position — core to autonomous landing."
  },
  "tech_domains.3.items.9.n": {
    "zh": "中微子/跨介质通信",
    "en": "Neutrino / cross-medium comms"
  },
  "tech_domains.3.items.9.d": {
    "zh": "可穿透行星与尘埃，适合极端环境，原理已演示、工程遥远。",
    "en": "Can penetrate planets and dust, suited to extreme environments; demonstrated in principle, far from engineering."
  },
  "tech_domains.4.d": {
    "zh": "航天器与机器人",
    "en": "Spacecraft & robotics"
  },
  "tech_domains.4.items.0.n": {
    "zh": "自主交会对接",
    "en": "Autonomous rendezvous & docking"
  },
  "tech_domains.4.items.0.d": {
    "zh": "货运飞船已可无人自动对接，是轨道建造的日常能力。",
    "en": "Cargo craft dock autonomously — a routine capability for orbital construction."
  },
  "tech_domains.4.items.1.n": {
    "zh": "在轨加注/服务",
    "en": "On-orbit refuelling & servicing"
  },
  "tech_domains.4.items.1.d": {
    "zh": "为卫星延寿与加油，验证中，是可持续太空经济关键。",
    "en": "Refuels and services satellites; under validation and key to a sustainable space economy."
  },
  "tech_domains.4.items.2.n": {
    "zh": "太空拖船/轨道转移器",
    "en": "Space tugs / transfer vehicles"
  },
  "tech_domains.4.items.2.d": {
    "zh": "在轨搬运载荷与废弃物，降低任务耦合度。",
    "en": "Moves payloads and debris in orbit, lowering mission coupling."
  },
  "tech_domains.4.items.3.n": {
    "zh": "机械臂与遥操作",
    "en": "Robotic arms & teleoperation"
  },
  "tech_domains.4.items.3.d": {
    "zh": "空间站机械臂与火星车遥操作已是成熟能力。",
    "en": "Station arms and Mars-rover teleoperation are mature capabilities."
  },
  "tech_domains.4.items.4.n": {
    "zh": "集群/编队飞行",
    "en": "Swarms / formation flying"
  },
  "tech_domains.4.items.4.d": {
    "zh": "多单元自组织协同，提升冗余与任务弹性。",
    "en": "Multiple units self-organize, raising redundancy and mission elasticity."
  },
  "tech_domains.4.items.5.n": {
    "zh": "自修复材料与结构",
    "en": "Self-healing materials"
  },
  "tech_domains.4.items.5.d": {
    "zh": "微裂纹自主愈合，延长在轨寿命、降低维护需求。",
    "en": "Micro-cracks heal autonomously, extending life and cutting maintenance."
  },
  "tech_domains.4.items.6.n": {
    "zh": "AI飞控自治",
    "en": "AI autonomous flight control"
  },
  "tech_domains.4.items.6.d": {
    "zh": "在通信延迟下自主规划与避障，减少对地面干预。",
    "en": "Plans and avoids hazards under latency, reducing ground dependence."
  },
  "tech_domains.4.items.7.n": {
    "zh": "数字孪生与遥操作镜像",
    "en": "Digital twins & tele-op mirror"
  },
  "tech_domains.4.items.7.d": {
    "zh": "以地面镜像仿真指导在轨操作，提高复杂任务成功率。",
    "en": "Ground-side simulation mirrors the spacecraft to raise success on complex tasks."
  },
  "tech_domains.4.items.8.n": {
    "zh": "着陆缓冲与气囊",
    "en": "Landing legs / airbags"
  },
  "tech_domains.4.items.8.d": {
    "zh": "火星与月面软着陆已验证多种缓冲构型。",
    "en": "Multiple cushioning configurations proven on Mars and the Moon."
  },
  "tech_domains.4.items.9.n": {
    "zh": "气动减速与可膨胀防热罩",
    "en": "Aerocapture & inflatable shields"
  },
  "tech_domains.4.items.9.d": {
    "zh": "以大气减速进入，降低入轨/着陆燃料需求，已试验。",
    "en": "Uses atmosphere to decelerate, cutting propellant needs for entry/landing; tested."
  },
  "tech_domains.5.d": {
    "zh": "轨道与天体操控",
    "en": "Orbital & celestial engineering"
  },
  "tech_domains.5.items.0.n": {
    "zh": "引力弹弓 (借力飞行)",
    "en": "Gravity assist"
  },
  "tech_domains.5.items.0.d": {
    "zh": "旅行者、卡西尼等借行星引力提速改向，是深空标配。",
    "en": "Voyager and Cassini used planetary gravity to gain speed and redirect; standard for deep space."
  },
  "tech_domains.5.items.1.n": {
    "zh": "霍曼/比奥重复转移",
    "en": "Hohmann / bi-elliptic transfer"
  },
  "tech_domains.5.items.1.d": {
    "zh": "两脉冲最小能耗轨道转移的经典解，仍是任务设计基础。",
    "en": "The classic two-impulse minimum-energy transfer remains the basis of mission design."
  },
  "tech_domains.5.items.2.n": {
    "zh": "低能转移/星际高速公路",
    "en": "Low-energy / interplanetary superhighway"
  },
  "tech_domains.5.items.2.d": {
    "zh": "利用拉格朗日点与混沌走廊，用极省燃料完成大位移。",
    "en": "Uses Lagrange points and chaotic corridors for huge displacements at tiny fuel cost."
  },
  "tech_domains.5.items.3.n": {
    "zh": "拉格朗日点驻留",
    "en": "Lagrange-point station-keeping"
  },
  "tech_domains.5.items.3.d": {
    "zh": "韦伯望远镜在L2长期驻留，是深空前哨的天然位置。",
    "en": "Webb parks at L2; a natural spot for deep-space outposts."
  },
  "tech_domains.5.items.4.n": {
    "zh": "太空电梯/天梯",
    "en": "Space elevator / tether"
  },
  "tech_domains.5.items.4.d": {
    "zh": "以系绳把地面与轨道直连，理论上把发射成本压到极低，材料是瓶颈。",
    "en": "A tether links ground to orbit, theoretically collapsing launch cost; materials are the bottleneck."
  },
  "tech_domains.5.items.5.n": {
    "zh": "轨道环与旋转系绳",
    "en": "Orbital rings & rotating tethers"
  },
  "tech_domains.5.items.5.d": {
    "zh": "替代电梯的渐进方案，以在轨结构实现低成本投放。",
    "en": "An incremental alternative to elevators, using in-orbit structures for low-cost deployment."
  },
  "tech_domains.5.items.6.n": {
    "zh": "电磁推进/弹射轨道",
    "en": "Electromagnetic launch tracks"
  },
  "tech_domains.5.items.6.d": {
    "zh": "以轨上加速替代一级火箭，适合质量常态化上行。",
    "en": "Rail acceleration replaces first-stage rockets for routine mass to orbit."
  },
  "tech_domains.5.items.7.n": {
    "zh": "行星防御动能撞击",
    "en": "Kinetic impactor defence"
  },
  "tech_domains.5.items.7.d": {
    "zh": "DART已成功改变小行星轨道，证明防御可行。",
    "en": "DART successfully shifted an asteroid's orbit, proving defence is feasible."
  },
  "tech_domains.5.items.8.n": {
    "zh": "小行星采矿/原位资源",
    "en": "Asteroid mining / ISRU"
  },
  "tech_domains.5.items.8.d": {
    "zh": "就地取氧、水、金属，是摆脱地球补给的根本路径。",
    "en": "Extracting oxygen, water and metals on site is the root path off Earth resupply."
  },
  "tech_domains.5.items.9.n": {
    "zh": "轨道镜/遮阳工程",
    "en": "Orbital mirrors / sunshades"
  },
  "tech_domains.5.items.9.d": {
    "zh": "以巨型结构调节行星辐射平衡，属行星工程范畴。",
    "en": "Giant structures adjust a planet's radiative balance; a planetary-engineering concept."
  },
  "tech_domains.6.d": {
    "zh": "观测与科学仪器",
    "en": "Observation & instruments"
  },
  "tech_domains.6.items.0.n": {
    "zh": "詹姆斯·韦伯空间望远镜",
    "en": "James Webb Space Telescope"
  },
  "tech_domains.6.items.0.d": {
    "zh": "红外观测直抵宇宙黎明，分析系外行星大气成分。",
    "en": "Infrared observations reach cosmic dawn and analyse exoplanet atmospheres."
  },
  "tech_domains.6.items.1.n": {
    "zh": "系外行星凌星普查 (开普勒/苔丝)",
    "en": "Transit surveys (Kepler/TESS)"
  },
  "tech_domains.6.items.1.d": {
    "zh": "已确认数千颗系外行星，建立\"目的地清单\"。",
    "en": "Confirmed thousands of exoplanets and built the destination list."
  },
  "tech_domains.6.items.2.n": {
    "zh": "日冕仪/恒星遮蔽",
    "en": "Coronagraph / starshade"
  },
  "tech_domains.6.items.2.d": {
    "zh": "遮挡恒星强光以直接成像类地行星。",
    "en": "Blocks starlight to image Earth-like planets directly."
  },
  "tech_domains.6.items.3.n": {
    "zh": "空间干涉阵",
    "en": "Space interferometer arrays"
  },
  "tech_domains.6.items.3.d": {
    "zh": "多镜编队达到极高分辨率，相当于超巨型单镜。",
    "en": "Formation flying yields resolution of a giant single aperture."
  },
  "tech_domains.6.items.4.n": {
    "zh": "引力波探测器 (LISA前序)",
    "en": "Gravitational-wave detectors"
  },
  "tech_domains.6.items.4.d": {
    "zh": "地面已探测黑洞合并，空间版将打开低频窗口。",
    "en": "Ground detectors hear black-hole mergers; a space version opens the low-frequency window."
  },
  "tech_domains.6.items.5.n": {
    "zh": "中微子/暗物质探测",
    "en": "Neutrino / dark-matter probes"
  },
  "tech_domains.6.items.5.d": {
    "zh": "在轨背景更干净，利于捕捉弱信号。",
    "en": "Cleaner orbital background helps catch weak signals."
  },

const LANGS=[{k:'zh',n:'中文'},{k:'en',n:'English'}];
const RTL=new Set();
const LANGOBJ=(typeof LANG!=='undefined')?LANG:{};
function pathGet(obj,p){return p.split('.').reduce((o,k)=>(o==null?undefined:o[k]),obj);}
function tr(key){
  const l=currentLang;
  if(LANGOBJ[key]&&LANGOBJ[key][l]) return LANGOBJ[key][l];
  if(l!=='en'&&LANGOBJ[key]&&LANGOBJ[key].en) return LANGOBJ[key].en;
  if(l!=='zh'&&LANGOBJ[key]&&LANGOBJ[key].zh) return LANGOBJ[key].zh;
  return null;
}
function D(obj){ if(!obj) return ''; return tr(obj._k)||obj.en||obj.zh||''; }
function setText(el,key){const v=tr(key); if(v!=null) el.textContent=v;}
function applyStaticText(){
  document.querySelectorAll('[data-i18n]').forEach(el=>setText(el,el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const v=tr(el.getAttribute('data-i18n-ph')); if(v!=null) el.placeholder=v;});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{const v=tr(el.getAttribute('data-i18n-title')); if(v!=null) el.title=v;});
  document.documentElement.lang=currentLang;
  document.documentElement.dir=RTL.has(currentLang)?'rtl':'ltr';
}
let currentLang='en';

  ['starflight','ui.navStarflight'],['rules','ui.navRules'],['books','ui.navBooks'],
  ['tech','ui.navTech'],['questions','ui.navQuestions'],['eaco','ui.navEaco']];
function TXT(k){return tr(k)||k;}
function buildNav(){
  const html=NAV_LINKS.map(([h,k])=>`<a href="#${h}" data-nav="${h}">${TXT(k)}</a>`).join('');
  document.getElementById('navLinks').innerHTML=html;
  document.getElementById('sideNav').innerHTML=html;
}
function buildStats(){
  const s=[
    ['4.6B','ui.statAge'],['11','ui.statStages'],['110','ui.statEvents'],
    ['30','ui.statBooks'],['100','ui.statTech'],['2','ui.statLangs']

  document.getElementById('stats').innerHTML=s.map(([n,k])=>`<div class="stat"><div class="num">${n}</div><div class="lab">${TXT(k)}</div></div>`).join('');
  POEM.forEach((p,i)=>{ p._k=`poem.${i}`; });
  if(META.poemSource) META.poemSource._k='meta.poemSource';
  const poem=document.getElementById('poem');
  poem.innerHTML=POEM.map((p,i)=>`<span ${i===0?'style="color:var(--gold);font-weight:700"':''}>${D(p)}</span>`).join('')+
    `<div class="src">— ${D(META.poemSource)}</div>`;
}

  wrap.innerHTML=STAGES.map((st,i)=>{
    st.title._k=`stages.${i}.title`; st.intro._k=`stages.${i}.intro`; st.era._k=`stages.${i}.era`;

    st.events.forEach((e,j)=>{e.t._k=`stages.${i}.events.${j}.t`; e.d._k=`stages.${i}.events.${j}.d`;});

  EACO_DEFS.forEach((d,i)=>{d.t._k=`eaco.${i}.t`;d.d._k=`eaco.${i}.d`;});
  if(EACO_TEXT.group) EACO_TEXT.group._k='eacoText.group';
  if(EACO_TEXT.slogan) EACO_TEXT.slogan._k='eacoText.slogan';
  if(EACO_TEXT.caNote) EACO_TEXT.caNote._k='eacoText.caNote';
  box.innerHTML=`<div class="group">${D(EACO_TEXT.group)}</div>
    <div class="slogan">${D(EACO_TEXT.slogan)}</div>
    <div style="font-size:12px;color:var(--accent2);font-weight:700;margin-bottom:8px">${D(UI.eacoDefs)}</div>
    <div class="defgrid">${EACO_DEFS.map(d=>`<div class="def"><div class="t">${D(d.t)}</div><div class="e">${d.e||''}</div><div class="d">${D(d.d)}</div></div>`).join('')}</div>
    <div class="ca">
      <div class="lab">${D(UI.eacoCa)}</div>
      <div class="val">${EACO_TEXT.ca}</div>
      <button class="copybtn" id="copyCa">${D(UI.copyCa)}</button>
      <div class="note">${D(EACO_TEXT.caNote)}</div>
    </div>`;
  document.getElementById('copyCa').onclick=()=>{
    navigator.clipboard.writeText(EACO_TEXT.ca).then(()=>{const b=document.getElementById('copyCa');const o=b.textContent;b.textContent=TXT('ui.copyOk');setTimeout(()=>b.textContent=o,1200);});
  };
}
function buildRef(){
  document.getElementById('refBody').innerHTML=
    `<div style="margin:8px 0;color:var(--muted)" data-i18n="ui.refLegacy"></div>`+
    `<div style="margin:8px 0;color:var(--muted)" data-i18n="ui.refNote"></div>`;
  document.getElementById('builtWith').textContent=TXT('ui.builtWith');
}
function buildAll(){
  buildNav();buildStats();buildStages();buildLessons();buildWarnings();buildStar();
  buildRules();buildBooks('cn');buildTech();buildQuestions();buildEaco();buildRef();
}
// ===== language switch =====
function setLang(l){
  currentLang=l;
  localStorage.setItem('eh_lang',l);
  applyStaticText();
  buildNav();
  buildStats();buildStages();buildLessons();buildWarnings();buildStar();
  buildRules();buildBooks(curRegion);buildTech();buildQuestions();buildEaco();buildRef();
  document.getElementById('langSel').value=l;
  document.title=D(META.title);
}
let curRegion='cn';
// ===== search =====
function doSearch(q){
  q=q.trim().toLowerCase();
  const all=document.querySelectorAll('main *');
  if(!q){document.querySelectorAll('.search-hit').forEach(e=>e.classList.remove('search-hit'));document.getElementById('searchHint').textContent='';return;}
  let hits=0;
  document.querySelectorAll('.search-hit').forEach(e=>e.classList.remove('search-hit'));
  const nodes=document.querySelectorAll('.card,.stage,.tech,.q,.def,.booktable tr,.poem,.stat');
  nodes.forEach(n=>{const txt=n.textContent.toLowerCase();if(txt.includes(q)){n.classList.add('search-hit');hits++; if(hits<=3) n.scrollIntoView({block:'center',behavior:'smooth'});}});
  document.getElementById('searchHint').textContent=hits+' '+TXT('ui.searchHits');
}
// ===== active nav highlight =====
function setupNavSpy(){
  const links=document.querySelectorAll('#sideNav a,#navLinks a');
  const map={}; links.forEach(a=>map[a.getAttribute('href').slice(1)]=a);
  const secs=document.querySelectorAll('main section[id]');
  const io=new IntersectionObserver((es)=>{
    es.forEach(e=>{if(e.isIntersecting){const a=map[e.target.id];if(a){links.forEach(x=>x.classList.remove('active'));a.classList.add('active');}}});
  },{rootMargin:'-30% 0px -60% 0px'});
  secs.forEach(s=>io.observe(s));
}
// ===== events =====
document.getElementById('langSel').innerHTML=LANGS.map(l=>`<option value="${l.k}">${l.n}</option>`).join('');
document.getElementById('langSel').onchange=e=>setLang(e.target.value);
document.getElementById('themeBtn').onclick=()=>{
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);localStorage.setItem('eh_theme',t);
};
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('searchInput').addEventListener('input',e=>doSearch(e.target.value));
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');curRegion=b.getAttribute('data-region');buildBooks(curRegion);
});
window.addEventListener('scroll',()=>{document.getElementById('toTop').style.display=window.scrollY>400?'block':'none';});
// ===== init =====
(function(){
  const t=localStorage.getItem('eh_theme');if(t)document.documentElement.setAttribute('data-theme',t);
  const l=localStorage.getItem('eh_lang')||'zh';currentLang=l;
  buildAll();applyStaticText();document.getElementById('langSel').value=l;document.title=D(META.title);
  setupNavSpy();
})();
</script>
</body>
</html>
