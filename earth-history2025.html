<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Earth History · Chronicle of Civilization & Interstellar Lessons | eaco</title>
<meta name="description" content="From the Big Bang 13.8 billion years ago to the interstellar dawn of 2026: 11 stages, 110 highest-impact events, 24 lessons and warnings, 30 strategy classics, 100 interstellar technologies." />
<style>
:root{
  color-scheme:dark;
  --bg:#06090f; --bg2:#0b1020;
  --panel:rgba(255,255,255,.055);
  --panel-strong:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.14);
  --txt:#f2f5fc; --muted:#bcc6d9; --faint:#8b96ad;
  --accent:#5aa9ff; --accent2:#a87bff; --warn:#ff8a6a; --good:#46d6a8; --gold:#ffd479;
  --shadow:0 12px 44px rgba(0,0,0,.5);
  --maxw:1180px; --radius:16px; --star:rgba(255,255,255,.6);
  --sidebar-w:236px; --header-h:60px;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f7fc; --bg2:#e9eef7;
  --panel:rgba(15,25,55,.05); --panel-strong:rgba(15,25,55,.085);
  --border:rgba(15,25,55,.14);
  --txt:#16203a; --muted:#46546f; --faint:#76819a;
  --accent:#1f6fe0; --accent2:#7a3ff0; --warn:#d8441f; --good:#0c9c74; --gold:#a9780a;
  --shadow:0 12px 34px rgba(20,30,60,.16);
  --star:rgba(20,30,60,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.75; color:var(--txt); min-height:100vh;
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(168,123,255,.16), transparent 60%),
    radial-gradient(900px 560px at 8% 8%, rgba(90,169,255,.14), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.12;
  background-image:
    radial-gradient(1.4px 1.4px at 20% 30%, var(--star), transparent 60%),
    radial-gradient(1.4px 1.4px at 75% 60%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 50% 80%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 35% 15%, var(--star), transparent 60%),
    radial-gradient(1.4px 1.4px at 88% 22%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 12% 70%, var(--star), transparent 60%);
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ===== header ===== */
header.top{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:rgba(6,9,15,.82); border-bottom:1px solid var(--border);
}
[data-theme="light"] header.top{background:rgba(244,247,252,.9)}
.top .row{display:flex;align-items:center;gap:14px;height:var(--header-h)}
.brand{font-weight:800;letter-spacing:.3px;white-space:nowrap;font-size:15px}
.brand .dot{color:var(--accent2)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.tools select,.tools button{
  background:var(--panel);border:1px solid var(--border);color:var(--txt);
  border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer;font-family:inherit;line-height:1;
}
.tools button:hover,.tools select:hover{border-color:var(--accent)}
nav.links{display:none}

/* ===== layout: sidebar + main ===== */
.layout{display:flex;align-items:flex-start;gap:30px;max-width:var(--maxw);margin:0 auto;padding:0 22px}
.sidebar{position:sticky;top:var(--header-h);align-self:flex-start;flex:0 0 var(--sidebar-w);width:var(--sidebar-w);padding:22px 0}
.sidebar .stitle{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--faint);text-transform:uppercase;padding:0 12px 8px}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:600}
.sidebar nav a:hover{color:var(--txt);background:var(--panel);text-decoration:none}
.sidebar nav a.active{color:var(--txt);background:var(--panel-strong);box-shadow:inset 3px 0 0 var(--accent)}
.maincol{flex:1;min-width:0;padding-bottom:40px}

/* ===== search ===== */
.searchbar{display:flex;gap:10px;align-items:center;max-width:var(--maxw);margin:16px auto;padding:0 22px}
.searchbar input{
  flex:1;background:var(--panel);border:1px solid var(--border);color:var(--txt);
  border-radius:12px;padding:13px 16px;font-size:15px;font-family:inherit;line-height:1.4;
}
.searchbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,169,255,.18)}
.searchbar .hint{font-size:12.5px;color:var(--faint);white-space:nowrap}

/* ===== hero ===== */
.hero{padding:46px 0 30px;text-align:center}
.hero h1{font-size:clamp(28px,4.6vw,48px);margin:0 0 14px;line-height:1.18;font-weight:800;letter-spacing:.2px}
.hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .accentbar{width:64px;height:4px;border-radius:4px;margin:0 auto 18px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hero p.tag{font-size:clamp(15px,2vw,19px);color:var(--muted);max-width:780px;margin:0 auto 18px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:28px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center}
.stat .num{font-size:clamp(20px,2.8vw,28px);font-weight:800;color:var(--gold);line-height:1.1}
.stat .lab{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3}
.poem{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 24px;max-width:780px;margin:10px auto 0;color:var(--muted);font-size:15px;line-height:1.8}
.poem span{display:block}
.poem .src{margin-top:12px;font-size:12px;color:var(--faint)}

/* ===== sections ===== */
section{padding:38px 0;scroll-margin-top:calc(var(--header-h) + 14px)}
.sec-head{margin-bottom:20px}
.sec-head h2{font-size:clamp(21px,3vw,30px);margin:0 0 8px;display:flex;align-items:center;gap:12px;font-weight:800}
.sec-head h2::before{content:"";width:8px;height:28px;border-radius:6px;background:linear-gradient(var(--accent),var(--accent2));flex:0 0 auto}
.sec-head p{color:var(--muted);margin:0;font-size:14.5px;max-width:880px;line-height:1.75}

/* ===== timeline / stages ===== */
.stage{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:16px 0;overflow:hidden;box-shadow:var(--shadow)}
.stage>.head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;cursor:pointer;background:linear-gradient(180deg,var(--panel-strong),transparent);transition:background .2s}
.stage>.head:hover{background:var(--panel-strong)}
.stage .code{flex:0 0 auto;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.stage .head .meta{flex:1;min-width:0}
.stage .head .era{font-size:12.5px;color:var(--accent2);font-weight:700;letter-spacing:.4px}
.stage .head h3{margin:3px 0 6px;font-size:clamp(18px,2.4vw,22px);line-height:1.3}
.stage .head .intro{color:var(--muted);font-size:14.5px;line-height:1.7}
.stage .toggle{flex:0 0 auto;color:var(--muted);font-size:22px;transition:transform .25s;align-self:center}
.stage.open .toggle{transform:rotate(45deg)}
.stage .body{display:none;padding:8px 20px 22px}
.stage.open .body{display:block}
.events{list-style:none;margin:10px 0 0;padding:0;border-left:2px solid var(--border);margin-left:8px}
.events li{position:relative;padding:12px 0 12px 24px;border-bottom:1px dashed var(--border)}
.events li:last-child{border-bottom:none}
.events li::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(90,169,255,.18)}
.events .yr{font-size:12.5px;color:var(--gold);font-weight:700}
.events .et{font-size:16px;font-weight:600;margin:2px 0;line-height:1.45}
.events .ed{font-size:14.5px;color:var(--muted);line-height:1.7}
.lw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lw .box{background:var(--panel-strong);border:1px solid var(--border);border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.7}
.lw .box b{display:block;margin-bottom:5px;font-size:12px;letter-spacing:.3px}
.lw .lesson b{color:var(--good)} .lw .warn b{color:var(--warn)}

/* ===== generic card grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h4{margin:0 0 10px;font-size:17px;display:flex;gap:8px;align-items:baseline;line-height:1.35}
.card .idx{color:var(--accent2);font-weight:800;font-size:14px;flex:0 0 auto}
.card p{margin:6px 0 0;font-size:14.5px;color:var(--muted);line-height:1.7}
.card .what{color:var(--txt)}
.tagchip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.tag-flown{background:rgba(70,214,168,.16);color:var(--good);border:1px solid rgba(70,214,168,.4)}
.tag-dev{background:rgba(90,169,255,.16);color:var(--accent);border:1px solid rgba(90,169,255,.4)}
.tag-theory{background:rgba(255,138,106,.16);color:var(--warn);border:1px solid rgba(255,138,106,.4)}

/* ===== books ===== */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.booktable{width:100%;border-collapse:collapse;font-size:14px}
.booktable th,.booktable td{border-bottom:1px solid var(--border);padding:12px 14px;text-align:left;vertical-align:top;line-height:1.6}
.booktable th{color:var(--muted);font-weight:600;font-size:12.5px;position:sticky;top:var(--header-h);background:var(--bg);z-index:1}
.booktable tr:hover td{background:var(--panel)}
.booktable .bname{font-weight:700;color:var(--txt)}
.booktable .bstar{color:var(--accent2);font-style:italic}

/* ===== tech domains ===== */
.domain{margin:24px 0}
.domain>.dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.domain .dh .dn{font-size:18px;font-weight:800}
.domain .dh .dc{font-size:12.5px;color:var(--faint)}
.techrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tech{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;transition:border-color .2s}
.tech:hover{border-color:var(--accent)}
.tech .tn{font-weight:600;font-size:14.5px;line-height:1.4}
.tech .td{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.65}

/* ===== questions ===== */
.q{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.q h4{margin:0 0 10px;font-size:16.5px;line-height:1.4}
.q .row{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14px;margin-top:8px;line-height:1.65}
.q .row .k{color:var(--faint);font-weight:700}

/* ===== eaco ===== */
.eaco{background:linear-gradient(135deg,var(--panel-strong),var(--panel));border:1px solid var(--border);border-radius:18px;padding:28px 26px;box-shadow:var(--shadow)}
.eaco .group{font-weight:800;font-size:19px;margin-bottom:6px}
.eaco .slogan{font-style:italic;color:var(--muted);margin-bottom:18px;line-height:1.7}
.defgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.def{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.def .t{font-weight:700;color:var(--accent)}
.def .e{font-size:11.5px;color:var(--faint);margin-top:2px}
.def .d{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.65}
.ca{margin-top:20px;background:rgba(0,0,0,.28);border:1px dashed var(--border);border-radius:12px;padding:16px 18px}
[data-theme="light"] .ca{background:rgba(15,25,55,.05)}
.ca .lab{font-size:12.5px;color:var(--muted);font-weight:700}
.ca .val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;margin:8px 0;color:var(--gold)}
.ca .note{font-size:11.5px;color:var(--faint);line-height:1.6}
button.copybtn{background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
button.copybtn:hover{border-color:var(--accent)}

/* ===== footer ===== */
footer{border-top:1px solid var(--border);padding:34px 0 64px;color:var(--faint);font-size:13.5px;line-height:1.7}
footer .ref{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px}
footer .ref a{font-weight:600}
footer .disc{line-height:1.8}
.lang-note{font-size:12.5px;color:var(--muted);margin:12px 0 0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;line-height:1.65}
#toTop{position:fixed;right:18px;bottom:18px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--panel-strong);color:var(--txt);cursor:pointer;font-size:18px;display:none;backdrop-filter:blur(8px)}
#toTop:hover{border-color:var(--accent)}
.search-hit{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.dim{display:none!important}

/* ===== responsive ===== */
@media (max-width:960px){
  .layout{display:block;padding:0 22px}
  .sidebar{display:none}
  nav.links{display:flex;order:3;width:100%;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
  nav.links::-webkit-scrollbar{display:none}
  nav.links a{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;white-space:nowrap}
  nav.links a:hover{color:var(--txt);background:var(--panel);text-decoration:none}
  .top .row{flex-wrap:wrap;height:auto;padding:10px 0}
}
@media (max-width:760px){
  body{font-size:15px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .lw,.techrow{grid-template-columns:1fr}
  .sec-head h2::before{width:6px;height:22px}
  .grid{grid-template-columns:1fr}
  .wrap{padding:0 16px}
  .layout{padding:0 16px}
  .searchbar{padding:0 16px}
}
[dir="rtl"] .events{border-left:none;border-right:2px solid var(--border);margin-left:0;margin-right:8px}
[dir="rtl"] .events li{padding:10px 24px 10px 0}
[dir="rtl"] .events li::before{left:auto;right:-7px}
[dir="rtl"] nav.links{direction:rtl}
[dir="rtl"] .tagchip{margin-left:0;margin-right:auto}
</style>
</head>
<body>
<header class="top">
  <div class="wrap row">
    <div class="brand"><span data-i18n="ui.brand"></span><span class="dot"> ●</span></div>
    <nav class="links" id="navLinks"></nav>
    <div class="tools">
      <select id="langSel" aria-label="language"></select>
      <button id="themeBtn" title="theme">◐</button>
      <button id="printBtn" data-i18n-title="ui.printLabel">⤓</button>
    </div>
  </div>
</header>

<div class="searchbar">
  <input id="searchInput" type="search" data-i18n-ph="ui.searchPlaceholder" />
  <span class="hint" id="searchHint"></span>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="stitle" data-i18n="ui.contents">目录</div>
    <nav id="sideNav"></nav>
  </aside>
  <main class="maincol">
    <section class="hero">
      <h1><span class="grad" data-i18n="meta.title"></span></h1>
      <div class="accentbar"></div>
      <p class="tag" data-i18n="meta.tagline"></p>
      <div class="stats" id="stats"></div>
      <div class="poem" id="poem"></div>
    </section>

    <section id="timeline">
      <div class="sec-head">
        <h2 data-i18n="ui.navTimeline"></h2>
        <p data-i18n="ui.sectionTimelineIntro"></p>
      </div>
      <div id="stages"></div>
    </section>

    <section id="lessons">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionLessonsTitle"></h2>
        <p data-i18n="ui.sectionLessonsIntro"></p>
      </div>
      <div class="grid" id="lessonsGrid"></div>
    </section>

    <section id="warnings">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionWarnTitle"></h2>
        <p data-i18n="ui.sectionWarnIntro"></p>
      </div>
      <div class="grid" id="warningsGrid"></div>
    </section>

    <section id="starflight">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionStarTitle"></h2>
        <p data-i18n="ui.sectionStarIntro"></p>
      </div>
      <div class="grid" id="starGrid"></div>
    </section>

    <section id="rules">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionRulesTitle"></h2>
        <p data-i18n="ui.sectionRulesIntro"></p>
      </div>
      <div class="grid" id="rulesGrid"></div>
      <p class="lang-note" data-i18n="ui.rulesNote"></p>
    </section>

    <section id="books">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionBooksTitle"></h2>
        <p data-i18n="ui.sectionBooksIntro"></p>
      </div>
      <div class="tabs">
        <button data-region="cn" class="active">华夏兵学 15</button>
        <button data-region="world">全球战略 15</button>
      </div>
      <div id="bookWrap"></div>
    </section>

    <section id="tech">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionTechTitle"></h2>
        <p data-i18n="ui.sectionTechIntro"></p>
      </div>
      <div id="techWrap"></div>
    </section>

    <section id="questions">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionQTitle"></h2>
        <p data-i18n="ui.sectionQIntro"></p>
      </div>
      <div class="grid" id="qGrid"></div>
    </section>

    <section id="eaco">
      <div class="sec-head">
        <h2 data-i18n="ui.sectionEacoTitle"></h2>
      </div>
      <div class="eaco" id="eacoBox"></div>
    </section>
  </main>
</div>

<footer class="wrap">
  <div class="ref">
    <strong data-i18n="ui.refTitle"></strong>
    <div id="refBody"></div>
  </div>
  <div class="disc" data-i18n="ui.disclaimer"></div>
  <div class="lang-note" data-i18n="ui.langNote"></div>
  <div class="disc" id="builtWith" style="margin-top:12px"></div>
  <div class="disc" style="margin-top:8px" data-i18n="meta.edition"></div>
</footer>

<button id="toTop" title="top">↑</button>

<script>
