    "en": "Origin of Life and the Precambrian"
  },
  "stages.1.intro": {
    "zh": "30多亿年的\"慢速工程\"：化学变成代谢，单细胞学会合作，大气被生物改写。",
    "en": "Over three billion years of slow engineering: chemistry became metabolism, single cells learned cooperation, and biology rewrote the atmosphere."
  },
  "stages.1.events.0.t": {
    "zh": "生命起源与LUCA",
    "en": "Origin of life and LUCA"
  },
  "stages.1.events.0.d": {
    "zh": "自我复制分子出现，所有现存生物共同祖先诞生，信息开始跨代传递。",
    "en": "Self-replicating molecules appeared and the last universal common ancestor arose: information began crossing generations."
  },
  "stages.1.events.1.t": {
    "zh": "热液喷口化学渗透代谢",
    "en": "Chemiosmotic metabolism at hydrothermal vents"
  },
  "stages.1.events.1.d": {
    "zh": "生命学会用质子梯度储能，这一机制40亿年未被替换，至今驱动每个细胞。",
    "en": "Life learned to store energy in proton gradients — a mechanism unchanged for four billion years and still running every cell."
  },
  "stages.1.events.2.t": {
    "zh": "光合作用出现",
    "en": "Photosynthesis emerges"
  },
  "stages.1.events.2.d": {
    "zh": "蓝细菌直接接入恒星能源，生物圈第一次拥有近乎无限的能量输入。",
    "en": "Cyanobacteria plugged directly into stellar power, giving the biosphere a near-limitless energy input."
  },
  "stages.1.events.3.t": {
    "zh": "大氧化事件",
    "en": "The Great Oxidation Event"
  },
  "stages.1.events.3.d": {
    "zh": "氧气从毒气变燃料，也造成史上第一次由生命自身引发的全球性灭绝。",
    "en": "Oxygen went from poison to fuel — and triggered the first global extinction caused by life itself."
  },
  "stages.1.events.4.t": {
    "zh": "休伦冰期（雪球地球）",
    "en": "Huronian glaciation (snowball Earth)"
  },
  "stages.1.events.4.d": {
    "zh": "甲烷温室崩塌导致全球冰封，证明气候有临界点而非线性变化。",
    "en": "Collapse of the methane greenhouse froze the planet, proving climate has tipping points rather than linear response."
  },
  "stages.1.events.5.t": {
    "zh": "真核细胞与内共生",
    "en": "Eukaryotes and endosymbiosis"
  },
  "stages.1.events.5.d": {
    "zh": "一个细胞把另一个细胞变成\"发电站\"（线粒体）：吞并转为共生，复杂性由此起飞。",
    "en": "One cell turned another into a power plant (the mitochondrion): conquest became symbiosis, and complexity took off."
  },
  "stages.1.events.6.t": {
    "zh": "有性生殖出现",
    "en": "Sexual reproduction appears"
  },
  "stages.1.events.6.d": {
    "zh": "基因重组把演化速度提升数量级，多样性成为默认策略。",
    "en": "Genetic recombination sped up evolution by orders of magnitude, making diversity the default strategy."
  },
  "stages.1.events.7.t": {
    "zh": "多细胞生命",
    "en": "Multicellularity"
  },
  "stages.1.events.7.d": {
    "zh": "细胞开始分工与自我牺牲，\"组织\"这一治理形式在生物界首次成立。",
    "en": "Cells adopted division of labour and self-sacrifice: organization as a governance form was born."
  },
  "stages.1.events.8.t": {
    "zh": "成冰纪雪球地球",
    "en": "Cryogenian snowball Earth"
  },
  "stages.1.events.8.d": {
    "zh": "极端冰封后火山CO₂解封，压力筛选出更强韧的生命体系。",
    "en": "Extreme glaciation followed by volcanic CO₂ release selected for far more resilient biological systems."
  },
  "stages.1.events.9.t": {
    "zh": "埃迪卡拉生物群",
    "en": "The Ediacaran biota"
  },
  "stages.1.events.9.d": {
    "zh": "第一批大型软体生物出现，生态系统开始有\"结构\"而不只是\"浓度\"。",
    "en": "The first large soft-bodied organisms appeared; ecosystems gained structure, not merely concentration."
  },
  "stages.1.lesson": {
    "zh": "合作胜过吞并：内共生是地球史上回报最高的一次\"并购\"。星际文明的最优解也更可能是共生而非征服。",
    "en": "Cooperation beats conquest: endosymbiosis was the highest-return merger in Earth's history. Symbiosis, not conquest, is likely the optimal interstellar strategy too."
  },
  "stages.1.warn": {
    "zh": "生命可以毒死自己。大氧化事件说明：一个物种的成功代谢产物，可能是整个生物圈的毒气。",
    "en": "Life can poison itself. The Great Oxidation Event shows that one species' successful metabolic waste can be toxic to the whole biosphere."
  },
  "stages.2.era": {
    "zh": "5.41亿 – 6600万年前",
    "en": "541 – 66 Mya"
  },
  "stages.2.title": {
    "zh": "显生宙：生命大爆发与五次大灭绝",
    "en": "The Phanerozoic: explosion of life and five mass extinctions"
  },
  "stages.2.intro": {
    "zh": "生命填满海陆空，也五次濒临清零。这是关于\"多样性即保险\"最昂贵的实证课程。",
    "en": "Life filled sea, land and air — and came close to zero five times. The most expensive empirical lesson in \"diversity is insurance\"."
  },
  "stages.2.events.0.t": {
    "zh": "寒武纪生命大爆发",
    "en": "The Cambrian explosion"
  },
  "stages.2.events.0.d": {
    "zh": "两千万年内几乎所有现代动物门类出现，创新可以在短窗口内集中爆发。",
    "en": "Nearly all modern animal phyla appeared within ~20 million years: innovation can burst in a short window."
  },
  "stages.2.events.1.t": {
    "zh": "视觉与捕食军备竞赛",
    "en": "Vision and the predator arms race"
  },
  "stages.2.events.1.d": {
    "zh": "眼睛出现后，信息优势第一次成为生存优势，演化进入\"侦察-反侦察\"循环。",
    "en": "With eyes, information advantage became survival advantage, and evolution entered a detect/counter-detect loop."
  },
  "stages.2.events.2.t": {
    "zh": "植物登陆与土壤、臭氧层",
    "en": "Plants colonize land; soils and ozone"
  },
  "stages.2.events.2.d": {
    "zh": "陆地被生物改造成可居住区，紫外屏障与土壤是\"行星地球化改造\"的原型。",
    "en": "Biology terraformed the land; UV shielding and soils became the prototype of planetary terraforming."
  },
  "stages.2.events.3.t": {
    "zh": "奥陶纪末大灭绝",
    "en": "End-Ordovician extinction"
  },
  "stages.2.events.3.d": {
    "zh": "约85%物种消失，气候骤变可在地质瞬间抹去生态霸主。",
    "en": "About 85% of species vanished: abrupt climate change can erase ecological incumbents in a geological instant."
  },
  "stages.2.events.4.t": {
    "zh": "脊椎动物登陆",
    "en": "Vertebrates come ashore"
  },
  "stages.2.events.4.d": {
    "zh": "鱼鳍变四肢，跨介质迁移成功，验证了\"换环境需要换身体\"。",
    "en": "Fins became limbs — a successful cross-medium migration proving that a new environment demands a new body."
  },
  "stages.2.events.5.t": {
    "zh": "泥盆纪晚期灭绝",
    "en": "Late Devonian extinction"
  },
  "stages.2.events.5.d": {
    "zh": "海洋缺氧事件反复发生，说明系统崩溃常是连续打击而非单次事故。",
    "en": "Repeated ocean anoxia showed that systemic collapse usually comes as serial blows, not a single accident."
  },
  "stages.2.events.6.t": {
    "zh": "石炭纪森林与煤的封存",
    "en": "Carboniferous forests bury carbon"
  },
  "stages.2.events.6.d": {
    "zh": "数亿年封存的碳，成为3亿年后工业革命的燃料与气候危机的源头。",
    "en": "Carbon locked away for hundreds of millions of years became both the fuel of the Industrial Revolution and the source of the climate crisis."
  },
  "stages.2.events.7.t": {
    "zh": "二叠纪末\"大死亡\"",
    "en": "End-Permian \"Great Dying\""
  },
  "stages.2.events.7.d": {
    "zh": "约96%海洋物种灭绝，火山释放的温室气体证明碳循环失控的极限后果。",
    "en": "Some 96% of marine species died; volcanic greenhouse gases demonstrated the ultimate consequence of a runaway carbon cycle."
  },
  "stages.2.events.8.t": {
    "zh": "恐龙时代与盘古大陆解体",
    "en": "Age of dinosaurs; Pangaea breaks up"
  },
  "stages.2.events.8.d": {
    "zh": "大陆漂移重塑气候与生态隔离，地理格局决定演化格局。",
    "en": "Continental drift reshaped climate and created ecological isolation: geography dictates evolutionary structure."
  },
  "stages.2.events.9.t": {
    "zh": "希克苏鲁伯撞击",
    "en": "The Chicxulub impact"
  },
  "stages.2.events.9.d": {
    "zh": "一颗10公里小行星终结恐龙统治：不做行星防御，等于把文明押在概率上。",
    "en": "A 10-km asteroid ended dinosaur dominance: without planetary defence, a civilization bets its existence on probability."
  },
  "stages.2.lesson": {
    "zh": "冗余与多样性是唯一可靠的保险。每次大灭绝后，正是\"边缘物种\"接管了世界——保护边缘，就是保护未来。",
    "en": "Redundancy and diversity are the only reliable insurance. After every mass extinction, marginal species took over the world — protecting the margins protects the future."
  },
  "stages.2.warn": {
    "zh": "碳循环、氧含量、撞击风险三条曲线都曾把生物圈推到毁灭边缘，而它们今天全部处于人类可影响的范围内。",
    "en": "The carbon cycle, oxygen levels and impact risk each pushed the biosphere to the brink — and all three now lie within human influence."
  },
  "stages.3.era": {
    "zh": "6600万 – 1万年前",
    "en": "66 Mya – 10 kya"
  },
  "stages.3.title": {
    "zh": "哺乳类崛起与人类起源",
    "en": "Rise of mammals and the origin of humans"
  },
  "stages.3.intro": {
    "zh": "一次撞击腾出的生态位，最终产生了会问\"我们从哪里来\"的物种。",
    "en": "The niche cleared by an impact eventually produced a species that asks where it came from."
  },
  "stages.3.events.0.t": {
    "zh": "哺乳动物辐射演化",
    "en": "Mammalian radiation"
  },
  "stages.3.events.0.d": {
    "zh": "恒温、育幼、大脑投资成为新赛道，灾难后的空位是创新的最大补贴。",
    "en": "Warm blood, parental care and brain investment became the new track: post-catastrophe vacancy is innovation's biggest subsidy."
  },
  "stages.3.events.1.t": {
    "zh": "灵长类与三色视觉",
    "en": "Primates and trichromatic vision"
  },
  "stages.3.events.1.d": {
    "zh": "手、立体视觉与彩色感知组合出现，为工具与符号能力铺底。",
    "en": "Hands, stereo vision and colour perception combined, laying the base for tools and symbols."
  },
  "stages.3.events.2.t": {
    "zh": "人猿分化",
    "en": "Hominin–chimpanzee split"
  },
  "stages.3.events.2.d": {
    "zh": "人类支系独立演化开始，微小基因差异带来巨大行为差异。",
    "en": "The human lineage began its own path: tiny genetic differences produced enormous behavioural ones."
  },
  "stages.3.events.3.t": {
    "zh": "双足行走（南方古猿）",
    "en": "Bipedalism (Australopithecus)"
  },
  "stages.3.events.3.d": {
    "zh": "双手被解放，远距离迁移成本下降，身体成为可编程的工具平台。",
    "en": "Hands were freed and long-range migration got cheaper: the body became a programmable tool platform."
  },
  "stages.3.events.4.t": {
    "zh": "石器技术",
    "en": "Stone tool technology"
  },
  "stages.3.events.4.d": {
    "zh": "外部工具第一次替代器官功能，技术开始按代际累积而非基因累积。",
    "en": "External tools first substituted for organs; technology began accumulating across generations rather than genomes."
  },
  "stages.3.events.5.t": {
    "zh": "用火与熟食",
    "en": "Fire and cooked food"
  },
  "stages.3.events.5.d": {
    "zh": "外部能源接入人体：消化成本下降，大脑得以扩容，这是第一次\"能源革命\"。",
    "en": "External energy entered the body: cheaper digestion funded a bigger brain — the first energy revolution."
  },
  "stages.3.events.6.t": {
    "zh": "智人出现",
    "en": "Homo sapiens appears"
  },
  "stages.3.events.6.d": {
    "zh": "非洲诞生解剖学意义上的现代人，全人类共享一个不到30万年的家族树。",
    "en": "Anatomically modern humans arose in Africa; all humanity shares a family tree younger than 300,000 years."
  },
  "stages.3.events.7.t": {
    "zh": "认知革命与复杂语言",
    "en": "Cognitive revolution and complex language"
  },
  "stages.3.events.7.d": {
    "zh": "虚构与共识出现，大规模陌生人协作成为可能——这是所有制度的起点。",
    "en": "Fiction and shared belief made large-scale cooperation among strangers possible — the origin of all institutions."
  },
  "stages.3.events.8.t": {
    "zh": "走出非洲与全球扩散",
    "en": "Out of Africa and global dispersal"
  },
  "stages.3.events.8.d": {
    "zh": "人类在数万年内占据除南极外所有大陆，扩散本能写进了物种性格。",
    "en": "Within tens of millennia humans occupied every continent but Antarctica: dispersal is written into the species' character."
  },
  "stages.3.events.9.t": {
    "zh": "洞穴艺术与巨型动物灭绝",
    "en": "Cave art and megafauna extinction"
  },
  "stages.3.events.9.d": {
    "zh": "人类同时展现最高的创造力与最早的生态破坏力，两者同源。",
    "en": "Humanity displayed its highest creativity and its earliest ecological destructiveness at the same time, from the same source."
  },
  "stages.3.lesson": {
    "zh": "智力的核心不是个体聪明，而是可累积的外部记忆与协作。技术、语言、文化都是\"文明的外挂器官\"。",
    "en": "Intelligence is not individual cleverness but cumulative external memory and cooperation. Technology, language and culture are civilization's prosthetic organs."
  },
  "stages.3.warn": {
    "zh": "人类抵达每一片新大陆，几乎都伴随大型动物灭绝。星际殖民若不改变这一行为模式，将把同一悲剧复制到别的星球。",
    "en": "Human arrival on nearly every new continent coincided with megafauna extinction. Unless that pattern changes, interstellar settlement will copy the same tragedy to other worlds."
  },
  "stages.4.era": {
    "zh": "公元前10000 – 前500年",
    "en": "10,000 BCE – 500 BCE"
  },
  "stages.4.title": {
    "zh": "农业革命与早期文明",
    "en": "The Agricultural Revolution and early civilizations"
  },
  "stages.4.intro": {
    "zh": "人类从追逐能量变成生产能量，随之诞生城市、文字、法律与不平等。",
    "en": "Humans went from chasing energy to producing it — and with that came cities, writing, law and inequality."
  },
  "stages.4.events.0.t": {
    "zh": "农业起源（新月沃地等多中心）",
    "en": "Agriculture begins (Fertile Crescent and other centres)"
  },
  "stages.4.events.0.d": {
    "zh": "定居与余粮出现，人口与复杂社会同时起飞，也带来疾病与劳役。",
    "en": "Settlement and surplus made population and social complexity soar — along with disease and forced labour."
  },
  "stages.4.events.1.t": {
    "zh": "动物驯化",
    "en": "Animal domestication"
  },
  "stages.4.events.1.d": {
    "zh": "狗、羊、牛、马把肌肉、运输与蛋白纳入系统，成为最早的\"生物机械\"。",
    "en": "Dogs, sheep, cattle and horses brought muscle, transport and protein into the system: the earliest biomachines."
  },
  "stages.4.events.2.t": {
    "zh": "城市出现（恰塔霍裕克、乌鲁克）",
    "en": "First cities (Çatalhöyük, Uruk)"
  },
  "stages.4.events.2.d": {
    "zh": "人口密度带来分工、市场与官僚，也带来瘟疫与阶层固化。",
    "en": "Density produced specialization, markets and bureaucracy — and also epidemics and entrenched hierarchy."
  },
  "stages.4.events.3.t": {
    "zh": "车轮与轮式运输",
    "en": "The wheel and wheeled transport"
  },
  "stages.4.events.3.d": {
    "zh": "陆地物流成本骤降，第一次让\"帝国尺度\"在物理上可行。",
    "en": "Land logistics costs collapsed, making imperial scale physically feasible for the first time."
  },
  "stages.4.events.4.t": {
    "zh": "青铜与冶金术",
    "en": "Bronze and metallurgy"
  },
  "stages.4.events.4.d": {
    "zh": "合金思维出现：混合两种弱材料得到强材料，材料科学成为国力。",
    "en": "Alloy thinking arrived: mix two weak materials to get a strong one. Materials science became national power."
  },
  "stages.4.events.5.t": {
    "zh": "文字发明（楔形文字、圣书体）",
    "en": "Writing invented (cuneiform, hieroglyphs)"
  },
  "stages.4.events.5.d": {
    "zh": "记忆首次外置且可跨代无损传递，人类获得\"版本控制\"。",
    "en": "Memory became external and losslessly transferable across generations: humanity gained version control."
  },
  "stages.4.events.6.t": {
    "zh": "多中心文明并起",
    "en": "Parallel civilizations arise"
  },
  "stages.4.events.6.d": {
    "zh": "苏美尔、埃及、印度河、华夏、中美洲独立走出相似路径，说明存在普遍规律。",
    "en": "Sumer, Egypt, the Indus, China and Mesoamerica took similar paths independently, implying universal regularities."
  },
  "stages.4.events.7.t": {
    "zh": "《汉穆拉比法典》",
    "en": "Code of Hammurabi"
  },
  "stages.4.events.7.d": {
    "zh": "规则被公开刻在石头上：可预期的成文法是文明规模化的前提。",
    "en": "Rules carved in public stone: predictable written law is a precondition for scaling a civilization."
  },
  "stages.4.events.8.t": {
    "zh": "青铜时代崩溃与铁器革命",
    "en": "Bronze Age collapse and the Iron Age"
  },
  "stages.4.events.8.d": {
    "zh": "贸易网络断裂使多国同时倒塌，随后廉价铁器使技术民主化。",
    "en": "A severed trade network toppled several states at once; cheap iron then democratized technology."
  },
  "stages.4.events.9.t": {
    "zh": "字母表与铸币",
    "en": "The alphabet and coinage"
  },
  "stages.4.events.9.d": {
    "zh": "书写门槛与交易成本同时下降，信息与价值第一次可低成本流通。",
    "en": "Literacy barriers and transaction costs fell together: information and value could circulate cheaply for the first time."
  },
  "stages.4.lesson": {
    "zh": "降低两个成本，文明就会跃升：信息传递成本（文字、字母、印刷、网络）与价值交换成本（度量、铸币、账本）。",
    "en": "Lower two costs and civilization jumps: the cost of transmitting information (writing, alphabets, printing, networks) and the cost of exchanging value (measures, coinage, ledgers)."
  },
  "stages.4.warn": {
    "zh": "青铜时代崩溃提醒：高度互联的系统一旦缺少备份路径，一个节点的断裂会同时拖垮所有节点。",
    "en": "The Bronze Age collapse warns that in a tightly coupled system without backup routes, one broken node can bring down all of them."
  },
  "stages.5.era": {
    "zh": "公元前500 – 公元500年",
    "en": "500 BCE – 500 CE"
  },
  "stages.5.title": {
    "zh": "轴心时代与古典帝国",
    "en": "The Axial Age and the classical empires"
  },
  "stages.5.intro": {
    "zh": "人类在几百年内同时发明了哲学、伦理与战略理论，也第一次尝试\"治理上千万人\"。",
    "en": "Within a few centuries humanity invented philosophy, ethics and strategic theory — and first tried governing tens of millions."
  },
  "stages.5.events.0.t": {
    "zh": "轴心时代思想爆发",
    "en": "The Axial Age"
  },
  "stages.5.events.0.d": {
    "zh": "孔子、老子、释迦、苏格拉底、希伯来先知几乎同期出现，伦理成为独立命题。",
    "en": "Confucius, Laozi, the Buddha, Socrates and the Hebrew prophets appeared almost simultaneously; ethics became an autonomous question."
  },
  "stages.5.events.1.t": {
    "zh": "《孙子兵法》成书",
    "en": "Sun Tzu's Art of War"
  },
  "stages.5.events.1.d": {
    "zh": "\"不战而屈人之兵\"确立最高效率的冲突观，两千五百年未被超越。",
    "en": "\"Subduing the enemy without fighting\" set the most efficient view of conflict — unsurpassed for 2,500 years."
  },
  "stages.5.events.2.t": {
    "zh": "希腊理性、数学与民主实验",
    "en": "Greek reason, mathematics and democratic experiment"
  },
  "stages.5.events.2.d": {
    "zh": "公理化证明与公民议政出现，真理与权力第一次被要求给出理由。",
    "en": "Axiomatic proof and citizen deliberation appeared: truth and power were first required to give reasons."
  },
  "stages.5.events.3.t": {
    "zh": "亚历山大东征与希腊化",
    "en": "Alexander and the Hellenistic world"
  },
  "stages.5.events.3.d": {
    "zh": "暴力扩张意外造成跨文明知识融合，希腊-波斯-印度学术开始互通。",
    "en": "Violent expansion accidentally fused knowledge across civilizations, linking Greek, Persian and Indian learning."
  },
  "stages.5.events.4.t": {
    "zh": "秦统一中国与标准化",
    "en": "Qin unifies China and standardizes"
  },
  "stages.5.events.4.d": {
    "zh": "文字、度量、车轨、法律统一，证明\"标准即基础设施\"。",
    "en": "Script, measures, axle widths and law were unified, proving that standards are infrastructure."
  },
  "stages.5.events.5.t": {
    "zh": "汉与罗马双帝国并立",
    "en": "Han and Rome, twin empires"
  },
  "stages.5.events.5.d": {
    "zh": "欧亚两端同时出现亿级治理体系，官僚制与法制成为长期稳定的技术。",
    "en": "Both ends of Eurasia produced systems governing ~50 million people; bureaucracy and law became stabilizing technologies."
  },
  "stages.5.events.6.t": {
    "zh": "丝绸之路贯通",
    "en": "The Silk Road opens"
  },
  "stages.5.events.6.d": {
    "zh": "商品、技术、宗教与病菌同时流动，全球化的收益与风险同时启动。",
    "en": "Goods, technologies, religions and germs flowed together: globalization's benefits and risks began at once."
  },
  "stages.5.events.7.t": {
    "zh": "造纸术改进（蔡伦）",
    "en": "Papermaking refined (Cai Lun)"
  },
  "stages.5.events.7.d": {
    "zh": "知识存储成本骤降，为后来的印刷与大规模教育做好物质准备。",
    "en": "The cost of storing knowledge collapsed, materially preparing the way for printing and mass education."
  },
  "stages.5.events.8.t": {
    "zh": "世界宗教跨洲传播",
    "en": "World religions spread across continents"
  },
  "stages.5.events.8.d": {
    "zh": "佛教东传、基督教扩张，超越血缘的大规模身份认同第一次成立。",
    "en": "Buddhism moved east and Christianity expanded: large-scale identity beyond kinship became possible."
  },
  "stages.5.events.9.t": {
    "zh": "亚历山大图书馆之毁与西罗马崩溃",
    "en": "Loss of the Library of Alexandria; fall of Western Rome"
  },
  "stages.5.events.9.d": {
    "zh": "知识与秩序都可能被逆转，文明进步并非单向棘轮。",
    "en": "Both knowledge and order can be reversed: civilizational progress is not a one-way ratchet."
  },
  "stages.5.lesson": {
    "zh": "制度是技术的放大器。统一标准、成文法与公开辩论，能让同样的技术产出十倍的文明效能。",
    "en": "Institutions amplify technology. Common standards, written law and open debate can make identical technology deliver ten times the civilizational output."
  },
  "stages.5.warn": {
    "zh": "知识不是永久资产。没有分布式副本的图书馆会被一场火终结；星际文明必须把文明档案多点冗余存放。",
    "en": "Knowledge is not a permanent asset. A library without distributed copies ends in one fire; an interstellar civilization must store its archive redundantly across many sites."
  },
  "stages.6.era": {
    "zh": "公元500 – 1500年",
    "en": "500 – 1500 CE"
  },
  "stages.6.title": {
    "zh": "中古时代与全球连接的形成",
    "en": "The medieval world and the making of global connection"
  },
  "stages.6.intro": {
    "zh": "伊斯兰黄金时代、唐宋革命、蒙古整合与印刷术，把分散的文明缝成一张网。",
    "en": "The Islamic Golden Age, the Tang–Song revolution, Mongol integration and printing stitched scattered civilizations into one network."
  },
  "stages.6.events.0.t": {
    "zh": "伊斯兰黄金时代",
    "en": "The Islamic Golden Age"
  },
  "stages.6.events.0.d": {
    "zh": "代数、光学、医学与翻译运动兴起，巴格达成为跨文明知识中枢。",
    "en": "Algebra, optics, medicine and a translation movement flourished; Baghdad became a cross-civilizational knowledge hub."
  },
  "stages.6.events.1.t": {
    "zh": "零与印度-阿拉伯数字传播",
    "en": "Zero and Hindu–Arabic numerals spread"
  },
  "stages.6.events.1.d": {
    "zh": "\"零\"让位值制与运算自动化成为可能，是计算机的远祖概念。",
    "en": "Zero enabled place value and mechanized calculation — a conceptual ancestor of the computer."
  },
  "stages.6.events.2.t": {
    "zh": "唐宋科技与经济革命",
    "en": "Tang–Song technological and economic revolution"
  },
  "stages.6.events.2.d": {
    "zh": "雕版与活字印刷、火药、指南针、交子纸币集中出现，宋代城市化率空前。",
    "en": "Woodblock and movable-type printing, gunpowder, the compass and paper money converged; Song urbanization was unprecedented."
  },
  "stages.6.events.3.t": {
    "zh": "大学制度诞生（博洛尼亚）",
    "en": "The university is founded (Bologna)"
  },
  "stages.6.events.3.d": {
    "zh": "知识生产被制度化为可自我延续的组织，超越个人师徒寿命。",
    "en": "Knowledge production became an institution that outlives individual teachers."
  },
  "stages.6.events.4.t": {
    "zh": "蒙古帝国与欧亚整合",
    "en": "The Mongol Empire integrates Eurasia"
  },
  "stages.6.events.4.d": {
    "zh": "暴力建立的驿站网络加速技术东西传播，也把黑死病送上路。",
    "en": "A violently built relay network accelerated technology transfer both ways — and put the Black Death on the road."
  },
  "stages.6.events.5.t": {
    "zh": "黑死病",
    "en": "The Black Death"
  },
  "stages.6.events.5.d": {
    "zh": "欧洲人口锐减三分之一，全球化第一次显示其生物学代价。",
    "en": "Europe lost about a third of its population: globalization revealed its biological price."
  },
  "stages.6.events.6.t": {
    "zh": "郑和七下西洋",
    "en": "Zheng He's seven voyages"
  },
  "stages.6.events.6.d": {
    "zh": "最强舰队主动收缩，说明技术领先未必转化为持续探索——战略选择决定命运。",
    "en": "The strongest fleet chose retreat, showing that technical lead does not guarantee sustained exploration: strategy decides destiny."
  },
  "stages.6.events.7.t": {
    "zh": "古腾堡活字印刷机",
    "en": "Gutenberg's printing press"
  },
  "stages.6.events.7.d": {
    "zh": "复制成本趋零，宗教改革、科学革命与大众教育由此连锁引爆。",
    "en": "Copying cost approached zero, chain-triggering the Reformation, the Scientific Revolution and mass education."
  },
  "stages.6.events.8.t": {
    "zh": "航海技术组合成熟",
    "en": "The navigation technology stack matures"
  },
  "stages.6.events.8.d": {
    "zh": "罗盘、星盘、卡拉维尔帆船与洋流知识组合，远洋航行从冒险变成工程。",
    "en": "Compass, astrolabe, caravel and current knowledge combined: ocean crossing shifted from adventure to engineering."
  },
  "stages.6.events.9.t": {
    "zh": "哥伦布交换开启",
    "en": "The Columbian Exchange begins"
  },
  "stages.6.events.9.d": {
    "zh": "作物与物种全球重组养活了更多人口，同时带来疫病、奴隶制与文明毁灭。",
    "en": "A global reshuffling of crops fed more people while bringing epidemics, slavery and civilizational destruction."
  },
  "stages.6.lesson": {
    "zh": "连接创造繁荣：知识在跨文明流动时增值最快。开放的翻译、教育与标准，是最便宜的国力投资。",
    "en": "Connection creates prosperity: knowledge appreciates fastest when it crosses civilizations. Open translation, education and standards are the cheapest investment in capability."
  },
  "stages.6.warn": {
    "zh": "接触的方式决定后果。哥伦布交换的悲剧不是\"相遇\"，而是掠夺式相遇——这正是星际首次接触必须提前立法的原因。",
    "en": "The manner of contact determines the outcome. The tragedy of the Columbian Exchange was not encounter but predatory encounter — precisely why first contact rules must be written before, not after."
  },
  "stages.7.era": {
    "zh": "公元1500 – 1900年",
    "en": "1500 – 1900"
  },
  "stages.7.title": {
    "zh": "科学革命与工业革命",
    "en": "The Scientific and Industrial Revolutions"
  },
  "stages.7.intro": {
    "zh": "人类学会用实验向自然提问，并第一次把地下的碳变成大规模动力。",
    "en": "Humanity learned to interrogate nature by experiment, and for the first time turned buried carbon into mass power."
  },
  "stages.7.events.0.t": {
    "zh": "哥白尼日心说",
    "en": "Copernican heliocentrism"
  },
  "stages.7.events.0.d": {
    "zh": "地球不再是中心：人类首次主动接受\"我们并不特殊\"，认知革命由此开始。",
    "en": "Earth was no longer the centre: humanity accepted for the first time that it is not special."
  },
  "stages.7.events.1.t": {
    "zh": "麦哲伦-埃尔卡诺环球航行",
    "en": "The Magellan–Elcano circumnavigation"
  },
  "stages.7.events.1.d": {
    "zh": "地球被证明是一个有限闭环系统，\"全球\"从概念变成可测量事实。",
    "en": "Earth was proven a finite closed system; \"global\" went from concept to measurable fact."
  },
  "stages.7.events.2.t": {
    "zh": "科学方法与牛顿《原理》",
    "en": "Scientific method and Newton's Principia"
  },
  "stages.7.events.2.d": {
    "zh": "可重复实验加数学定律，让预测未来成为工程能力而非神启。",
    "en": "Repeatable experiment plus mathematical law made prediction an engineering capability rather than revelation."
  },
  "stages.7.events.3.t": {
    "zh": "启蒙运动与宪政、人权",
    "en": "Enlightenment, constitutions and human rights"
  },
  "stages.7.events.3.d": {
    "zh": "权力必须被规则约束的观念制度化，出现可纠错的政治体。",
    "en": "The idea that power must be bound by rules was institutionalized, producing self-correcting polities."
  },
  "stages.7.events.4.t": {
    "zh": "蒸汽机与工业革命",
    "en": "The steam engine and industrialization"
  },
  "stages.7.events.4.d": {
    "zh": "人均可支配功率首次突破生物极限，增长从线性转为指数。",
    "en": "Per-capita power broke the biological limit; growth turned from linear to exponential."
  },
  "stages.7.events.5.t": {
    "zh": "疫苗与细菌理论",
    "en": "Vaccination and germ theory"
  },
  "stages.7.events.5.d": {
    "zh": "詹纳、巴斯德、科赫让人类第一次系统战胜传染病，寿命曲线上扬。",
    "en": "Jenner, Pasteur and Koch let humanity systematically defeat infection; life expectancy bent upward."
  },
  "stages.7.events.6.t": {
    "zh": "电磁学（法拉第、麦克斯韦）",
    "en": "Electromagnetism (Faraday, Maxwell)"
  },
  "stages.7.events.6.d": {
    "zh": "一组方程同时给出电力、无线通信与光的本质，是现代文明的底层协议。",
    "en": "One set of equations delivered electric power, wireless communication and the nature of light — the base protocol of modern civilization."
  },
  "stages.7.events.7.t": {
    "zh": "热力学与熵",
    "en": "Thermodynamics and entropy"
  },
  "stages.7.events.7.d": {
    "zh": "能量守恒与熵增给一切文明设定了硬边界，也定义了星际能源的终极问题。",
    "en": "Conservation and entropy set a hard boundary for every civilization and define the ultimate interstellar energy problem."
  },
  "stages.7.events.8.t": {
    "zh": "达尔文《物种起源》",
    "en": "Darwin's On the Origin of Species"
  },
  "stages.7.events.8.d": {
    "zh": "生命有了统一解释框架，人类被放回自然史内部而非之上。",
    "en": "Life gained a unified explanatory framework, placing humanity inside natural history rather than above it."
  },
  "stages.7.events.9.t": {
    "zh": "废奴运动与工业化的代价",
    "en": "Abolition and the price of industrialization"
  },
  "stages.7.events.9.d": {
    "zh": "道德进步可被推动，但殖民、童工与1850年后的碳排放曲线同时被记入账。",
    "en": "Moral progress can be driven — yet colonialism, child labour and the post-1850 emissions curve went onto the same ledger."
  },
  "stages.7.lesson": {
    "zh": "科学方法是人类唯一自带纠错机制的知识系统。任何星际文明都必须保留\"可被证伪\"的制度空间。",
    "en": "The scientific method is the only knowledge system with built-in error correction. Any interstellar civilization must preserve institutional room for falsifiability."
  },
  "stages.7.warn": {
    "zh": "指数增长与化石能源的组合带来了两百年繁荣，也埋下气候与不平等两枚长期引信。技术红利常提前兑现，代价延后支付。",
    "en": "Exponential growth plus fossil energy bought two centuries of prosperity while planting two long fuses: climate and inequality. Technological dividends are paid early; the costs come due later."
  },
  "stages.8.era": {
    "zh": "公元1900 – 2000年",
    "en": "1900 – 2000"
  },
  "stages.8.title": {
    "zh": "电气、核能与信息时代",
    "en": "The age of electricity, nuclear power and information"
  },
  "stages.8.intro": {
    "zh": "人类在一个世纪内获得了自毁能力、离开地球的能力，以及看清整个宇宙的能力。",
    "en": "In one century humanity acquired the power to destroy itself, to leave Earth, and to see the entire universe."
  },
  "stages.8.events.0.t": {
    "zh": "相对论与量子力学",
    "en": "Relativity and quantum mechanics"
  },
  "stages.8.events.0.d": {
    "zh": "时空可弯曲、能量量子化：星际航行与信息技术的理论前提同时到位。",
    "en": "Spacetime bends and energy is quantized: the theoretical basis for both starflight and information technology arrived together."
  },
  "stages.8.events.1.t": {
    "zh": "宇宙膨胀与大爆炸模型确立",
    "en": "Cosmic expansion and the Big Bang model"
  },
  "stages.8.events.1.d": {
    "zh": "哈勃-勒梅特定律与微波背景发现，让宇宙有了可计算的年龄与历史。",
    "en": "The Hubble–Lemaître law and the CMB gave the universe a computable age and history."
  },
  "stages.8.events.2.t": {
    "zh": "两次世界大战与全球治理雏形",
    "en": "Two world wars and the first global institutions"
  },
  "stages.8.events.2.d": {
    "zh": "一亿量级死亡换来联合国、国际法与人权宣言：制度常在灾后才被写下。",
    "en": "Deaths on the scale of a hundred million bought the UN, international law and the Universal Declaration: institutions are usually written after catastrophe."
  },
  "stages.8.events.3.t": {
    "zh": "抗生素与绿色革命",
    "en": "Antibiotics and the Green Revolution"
  },
  "stages.8.events.3.d": {
    "zh": "青霉素与高产作物使人口从20亿升至60亿，也带来抗药性与土壤透支。",
    "en": "Penicillin and high-yield crops took population from 2 to 6 billion, while breeding resistance and soil depletion."
  },
  "stages.8.events.4.t": {
    "zh": "核裂变与广岛长崎",
    "en": "Nuclear fission; Hiroshima and Nagasaki"
  },
  "stages.8.events.4.d": {
    "zh": "文明第一次掌握可在数小时内毁灭自身的技术，\"大过滤器\"从理论变现实。",
    "en": "Civilization first held technology able to destroy it within hours: the Great Filter became real."
  },
  "stages.8.events.5.t": {
    "zh": "可计算性、计算机与晶体管",
    "en": "Computability, the computer and the transistor"
  },
  "stages.8.events.5.d": {
    "zh": "图灵机、冯·诺依曼架构与晶体管出现，思维过程首次可被外包给机器。",
    "en": "The Turing machine, von Neumann architecture and the transistor let thought itself be outsourced to machines."
  },
  "stages.8.events.6.t": {
    "zh": "斯普特尼克与加加林",
    "en": "Sputnik and Gagarin"
  },
  "stages.8.events.6.d": {
    "zh": "人类突破引力井，\"地球是唯一家园\"的默认设定第一次被打破。",
    "en": "Humanity climbed out of the gravity well, breaking the default assumption that Earth is the only home."
  },
  "stages.8.events.7.t": {
    "zh": "阿波罗登月与\"地球升起\"",
    "en": "Apollo landings and Earthrise"
  },
  "stages.8.events.7.d": {
    "zh": "登月与那张地球照片同时给出技术自信与生态谦卑，环保运动因此诞生。",
    "en": "The Moon landings and the Earthrise photograph delivered technical confidence and ecological humility at once, birthing environmentalism."
  },
  "stages.8.events.8.t": {
    "zh": "ARPANET、TCP/IP 与万维网",
    "en": "ARPANET, TCP/IP and the World Wide Web"
  },
  "stages.8.events.8.d": {
    "zh": "分布式、无中心、抗毁伤的通信协议诞生——星际网络将直接继承这一架构。",
    "en": "Distributed, decentralized, damage-tolerant protocols were born; an interstellar network will inherit this architecture directly."
  },
  "stages.8.events.9.t": {
    "zh": "DNA双螺旋、基因工程与蒙特利尔议定书",
    "en": "DNA, genetic engineering and the Montreal Protocol"
  },
  "stages.8.events.9.d": {
    "zh": "生命可被读写；同时臭氧洞被全球协作成功修复，证明人类能够集体自救。",
    "en": "Life became readable and writable; meanwhile global cooperation actually repaired the ozone layer, proving collective self-rescue is possible."
  },
  "stages.8.lesson": {
    "zh": "蒙特利尔议定书是最重要的正面样本：当科学证据、公众认知与制度工具对齐时，人类能在十年内逆转一场全球灾难。",
    "en": "The Montreal Protocol is the most important positive precedent: when scientific evidence, public awareness and institutional tools align, humanity can reverse a global disaster within a decade."
  },
  "stages.8.warn": {
    "zh": "核武、生物技术与算法权力构成\"自毁三件套\"。技术能力增长速度远超治理能力，这正是费米悖论最可能的答案之一。",
    "en": "Nuclear weapons, biotechnology and algorithmic power form a self-destruction triad. Capability grows far faster than governance — quite possibly the answer to the Fermi paradox."
  },
  "stages.9.era": {
    "zh": "公元2000 – 2026年",
    "en": "2000 – 2026"
  },
  "stages.9.title": {
    "zh": "数字、太空与人工智能时代",
    "en": "The digital, space and artificial-intelligence era"
  },
  "stages.9.intro": {
    "zh": "地球文明在这26年里完成了三件事：读写生命、降低入轨成本、造出会推理的机器。",
    "en": "In 26 years Earth's civilization did three things: learned to read and write life, cut the cost of reaching orbit, and built machines that reason."
  },
  "stages.9.events.0.t": {
    "zh": "人类基因组计划完成",
    "en": "Human Genome Project completed"
  },
  "stages.9.events.0.d": {
    "zh": "30亿碱基对被读出，人类第一次拿到自己的源代码。",
    "en": "Three billion base pairs were read: humanity obtained its own source code."
  },
  "stages.9.events.1.t": {
    "zh": "智能手机与移动互联网",
    "en": "Smartphones and mobile internet"
  },
  "stages.9.events.1.d": {
    "zh": "数十亿人随身接入全球信息网，认知与协作能力普遍化。",
    "en": "Billions carried access to the global information network, universalizing cognition and coordination."
  },
  "stages.9.events.2.t": {
    "zh": "比特币与区块链",
    "en": "Bitcoin and the blockchain"
  },
  "stages.9.events.2.d": {
    "zh": "无需信任第三方即可达成账本共识，为星际尺度（高延迟）协作提供原型。",
    "en": "Ledger consensus without trusted third parties — a prototype for cooperation at interstellar (high-latency) scale."
  },
  "stages.9.events.3.t": {
    "zh": "CRISPR 基因编辑",
    "en": "CRISPR genome editing"
  },
  "stages.9.events.3.d": {
    "zh": "生命从\"可读\"变为\"可编辑\"，人体编程长寿路线的技术起点。",
    "en": "Life went from readable to editable — the technical starting point for programmable human longevity."
  },
  "stages.9.events.4.t": {
    "zh": "深度学习与大模型",
    "en": "Deep learning and large models"
  },
  "stages.9.events.4.d": {
    "zh": "机器获得跨领域推理与生成能力，成为文明的\"第二类智能体\"。",
    "en": "Machines gained cross-domain reasoning and generation, becoming civilization's second class of intelligent agent."
  },
  "stages.9.events.5.t": {
    "zh": "可复用火箭首次回收",
    "en": "First reusable orbital-class booster landing"
  },
  "stages.9.events.5.d": {
    "zh": "入轨成本量级下降，太空从国家项目变为可持续工业活动。",
    "en": "Launch cost fell by an order of magnitude, turning space from a state project into a sustainable industry."
  },
  "stages.9.events.6.t": {
    "zh": "引力波探测与黑洞成像",
    "en": "Gravitational waves and the first black-hole image"
  },
  "stages.9.events.6.d": {
    "zh": "人类获得除电磁波之外的第二种宇宙感官，时空本身可被\"听见\"。",
    "en": "Humanity gained a second cosmic sense beyond light: spacetime itself can now be heard."
  },
  "stages.9.events.7.t": {
    "zh": "系外行星大发现与韦布望远镜",
    "en": "Exoplanet boom and JWST"
  },
  "stages.9.events.7.d": {
    "zh": "已确认数千颗系外行星并开始分析大气，\"目的地清单\"正式建立。",
    "en": "Thousands of exoplanets confirmed and their atmospheres now analysed: the destination list officially exists."
  },
  "stages.9.events.8.t": {
    "zh": "气候临界与能源转型",
    "en": "Climate tipping points and the energy transition"
  },
  "stages.9.events.8.d": {
    "zh": "巴黎协定与光伏/储能成本崩塌同时发生，文明进入\"竞速阶段\"。",
    "en": "The Paris Agreement coincided with collapsing solar and storage costs: civilization entered a race against itself."
  },
  "stages.9.events.9.t": {
    "zh": "加密资产规则草案与制度基础设施",
    "en": "Crypto-asset rule proposal as institutional infrastructure"
  },
  "stages.9.events.9.d": {
    "zh": "美国SEC《加密资产监管规则》提案给出分类、豁免与安全港，价值层开始有明确规则。",
    "en": "The U.S. SEC's Regulation Crypto Assets proposal set out taxonomy, exemptions and a safe harbor: the value layer began to acquire explicit rules."
  },
  "stages.9.lesson": {
    "zh": "三条曲线同时向上：入轨成本下降、智能成本下降、协作成本下降。三者叠加，是星际文明真正的启动条件。",
    "en": "Three curves are bending at once: the cost of reaching orbit, the cost of intelligence and the cost of coordination. Their overlap is the real ignition condition for interstellar civilization."
  },
  "stages.9.warn": {
    "zh": "能力扩张与规则滞后同时达到历史峰值：AI对齐、生物安全、气候临界、太空垃圾与轨道拥堵，每一项都缺乏有牙齿的全球机制。",
    "en": "Capability expansion and rule lag both peak simultaneously: AI alignment, biosecurity, climate tipping points, orbital debris and congestion — none has a global mechanism with teeth."
  },
  "stages.10.era": {
    "zh": "公元2026年 – 星际纪元",
    "en": "2026 – the interstellar era"
  },
  "stages.10.title": {
    "zh": "返乡之旅：星际文明路线图",
    "en": "The journey home: an interstellar roadmap"
  },
  "stages.10.intro": {
    "zh": "未来不是预言，而是待完成的工程清单。以下10项是eaco小组认定的关键里程碑。",
    "en": "The future is not prophecy but an engineering backlog. These ten milestones are what the eaco group considers decisive."
  },
  "stages.10.events.0.t": {
    "zh": "无限能源与零点模块技术",
    "en": "Limitless energy and zero-point modules"
  },
  "stages.10.events.0.d": {
    "zh": "先做到可控聚变与太空核电，再谈真空能；能量密度是一切星际能力的母参数。",
    "en": "Achieve controlled fusion and space nuclear power first, then vacuum energy; energy density is the parent parameter of all starflight capability."
  },
  "stages.10.events.1.t": {
    "zh": "力场凝胶球与凭空造物",
    "en": "Force-field \"gel spheres\" and matter on demand"
  },
  "stages.10.events.1.d": {
    "zh": "路径是可编程物质+原位资源利用+分子级3D打印，逐步逼近\"凭空造物\"。",
    "en": "The path runs through programmable matter, in-situ resource use and molecular 3D printing, gradually approaching fabrication from raw feedstock."
  },
  "stages.10.events.2.t": {
    "zh": "人体编程与长寿",
    "en": "Human programming and longevity"
  },
  "stages.10.events.2.d": {
    "zh": "基因编辑、衰老干预、辐射耐受与休眠技术组合，使百年航程对生命体可行。",
    "en": "Gene editing, ageing intervention, radiation tolerance and hibernation together make century-long voyages survivable."
  },
  "stages.10.events.3.t": {
    "zh": "星际之门与虫洞跳跃",
    "en": "Star gates and wormhole transit"
  },
  "stages.10.events.3.d": {
    "zh": "需要负能量密度与时空工程验证，目前仅有理论解，属于最高风险项。",
    "en": "Requires negative energy density and verified spacetime engineering; only theoretical solutions exist, making it the highest-risk item."
  },
  "stages.10.events.4.t": {
    "zh": "曲速引擎",
    "en": "Warp drive"
  },
  "stages.10.events.4.d": {
    "zh": "阿尔库比耶雷度规给出数学可能性，能量条件尚未解决，公开研究仍在早期。",
    "en": "The Alcubierre metric shows mathematical possibility, but the energy conditions remain unsolved and open research is early."
  },
  "stages.10.events.5.t": {
    "zh": "地月轨道经济与太空电梯",
    "en": "Cislunar economy and space elevators"
  },
  "stages.10.events.5.d": {
    "zh": "把发射成本从\"火箭\"转移到\"基础设施\"，是规模化星际活动的前置条件。",
    "en": "Shifting launch cost from rockets to infrastructure is the precondition for scaled interstellar activity."
  },
  "stages.10.events.6.t": {
    "zh": "行星防御与文明备份",
    "en": "Planetary defence and civilizational backup"
  },
  "stages.10.events.6.d": {
    "zh": "DART已验证动能撞击；下一步是多行星档案库与生物种子冗余存储。",
    "en": "DART validated kinetic impact; next come multi-planet archives and redundant biological seed storage."
  },
  "stages.10.events.7.t": {
    "zh": "星际共识账本（eaco层）",
    "en": "The interstellar consensus ledger (the eaco layer)"
  },
  "stages.10.events.7.d": {
    "zh": "高延迟环境下的价值与身份记录：分类清晰、规则前置、可离线验证。",
    "en": "Value and identity records under high latency: clear taxonomy, rules written in advance, offline-verifiable."
  },
  "stages.10.events.8.t": {
    "zh": "全物种伦理宪章与首次接触规程",
    "en": "A pan-species ethics charter and first-contact protocol"
  },
  "stages.10.events.8.d": {
    "zh": "在遇见之前先立法：不掠夺、不污染、不单方面代表地球发言。",
    "en": "Legislate before meeting: no plunder, no contamination, no unilateral speaking for Earth."
  },
  "stages.10.events.9.t": {
    "zh": "返乡：从蓝点走向星海",
    "en": "Homecoming: from the blue dot to the sea of stars"
  },
  "stages.10.events.9.d": {
    "zh": "当文明既能离开又愿意保护母星时，返乡之旅才算真正开始。",
    "en": "The journey home truly begins only when a civilization can both leave and choose to protect its cradle."
  },
  "stages.10.lesson": {
    "zh": "星际能力是四条曲线的乘积：能量、材料、生命维持、协作制度。任何一项为零，乘积就是零。",
    "en": "Interstellar capability is the product of four curves: energy, materials, life support and coordinating institutions. If any one is zero, the product is zero."
  },
  "stages.10.warn": {
    "zh": "技术先行、伦理滞后是最危险的组合。若在没有伦理宪章的情况下先掌握曲速与造物能力，人类将把地球最坏的历史输出到银河系。",
    "en": "Technology first, ethics later is the most dangerous ordering. Acquiring warp and fabrication before an ethics charter would export Earth's worst history to the galaxy."
  },
  "lessons.0.t": {
    "zh": "共生优于征服",
    "en": "Symbiosis beats conquest"
  },
  "lessons.0.d": {
    "zh": "线粒体不是被消灭的对手而是被接纳的伙伴，由此产生全部复杂生命。星际相遇的最优策略同理：优先寻找可交换的互补性，而非可掠夺的资源。",
    "en": "The mitochondrion was not an eliminated rival but an accepted partner — and all complex life followed. The same holds for interstellar encounters: look first for exchangeable complementarity, not extractable resources."
  },
  "lessons.1.t": {
    "zh": "信息载体决定文明高度",
    "en": "The information medium sets the ceiling"
  },
  "lessons.1.d": {
    "zh": "文字、纸张、印刷、互联网、可验证账本，每一次复制成本下降都带来一次文明跃迁。星际文明的核心工程之一是跨光年的低损耗信息传承。",
    "en": "Writing, paper, printing, the internet, verifiable ledgers: every drop in copying cost produced a civilizational jump. A core interstellar project is low-loss transmission of knowledge across light-years."
  },
  "lessons.2.t": {
    "zh": "能量阶梯决定活动半径",
    "en": "The energy ladder sets the radius of action"
  },
  "lessons.2.d": {
    "zh": "火→农业→煤→石油→核→聚变→真空能，每上一级，人类活动半径扩大一个数量级。能源不是成本项，而是文明的定义项。",
    "en": "Fire → agriculture → coal → oil → fission → fusion → vacuum energy: each rung expands the radius of action by an order of magnitude. Energy is not a cost line, it is a defining parameter."
  },
  "lessons.3.t": {
    "zh": "多样性就是保险",
    "en": "Diversity is insurance"
  },
  "lessons.3.d": {
    "zh": "五次大灭绝后接管世界的都是\"边缘物种\"。语言、文化、物种、技术路线、能源结构的多样性，是应对未知冲击的唯一通用策略。",
    "en": "After each of five mass extinctions, marginal species took over. Diversity in language, culture, species, technology paths and energy mix is the only general-purpose defence against unknown shocks."
  },
  "lessons.4.t": {
    "zh": "开放交流带来跃迁",
    "en": "Open exchange triggers leaps"
  },
  "lessons.4.d": {
    "zh": "丝绸之路、伊斯兰翻译运动、大学制度、开源社区都证明：知识在流动中增值，封闭系统的创新速度必然衰减。",
    "en": "The Silk Road, the Islamic translation movement, universities and open-source communities all show that knowledge appreciates in motion; closed systems inevitably decelerate."
  },
  "lessons.5.t": {
    "zh": "制度是技术的放大器",
    "en": "Institutions amplify technology"
  },
  "lessons.5.d": {
    "zh": "秦的标准化、罗马法、专利制度、有限责任公司、清晰的资产分类：同样的技术在好制度里能产出十倍效能。",
    "en": "Qin standardization, Roman law, patents, limited liability, clear asset taxonomies: identical technology yields ten times more under good institutions."
  },
  "lessons.6.t": {
    "zh": "长期主义可以工程化",
    "en": "Long-termism can be engineered"
  },
  "lessons.6.d": {
    "zh": "大教堂、京杭大运河、世代种子库、旅行者号金唱片证明：人类能为看不见成果的未来施工。世代飞船正是这一能力的极限形态。",
    "en": "Cathedrals, the Grand Canal, seed vaults and the Voyager golden record prove humans can build for outcomes they will never see. The generation ship is the extreme form of that capacity."
  },
  "lessons.7.t": {
    "zh": "灾后重构能力比避免灾难更现实",
    "en": "Recovery capacity is more realistic than perfect prevention"
  },
  "lessons.7.d": {
    "zh": "每次大灭绝后生物圈都在千万年内重建更复杂的结构。对文明而言，等价物是备份、冗余、可重启的知识与制度。",
    "en": "After every mass extinction the biosphere rebuilt greater complexity within millions of years. The civilizational equivalent is backups, redundancy and restartable knowledge and institutions."
  },
  "lessons.8.t": {
    "zh": "视角革命带来伦理升级",
    "en": "A shift in perspective upgrades ethics"
  },
  "lessons.8.d": {
    "zh": "日心说、进化论、\"地球升起\"、暗淡蓝点，每一次把人类从中心移开，都扩大了道德关怀的半径。星际视角将继续这一进程。",
    "en": "Heliocentrism, evolution, Earthrise, the Pale Blue Dot: each displacement from the centre widened the radius of moral concern. The interstellar perspective continues that trajectory."
  },
  "lessons.9.t": {
    "zh": "冗余与备份是文明的最低保险",
    "en": "Redundancy is a civilization's minimum policy"
  },
  "lessons.9.d": {
    "zh": "单行星文明等于单点故障。多行星居住、分布式档案、离线可验证记录，是把\"文明存档\"从一份变成多份。",
    "en": "A single-planet civilization is a single point of failure. Multi-planet habitation, distributed archives and offline-verifiable records turn one save file into many."
  },
  "lessons.10.t": {
    "zh": "科学方法自带纠错机制",
    "en": "The scientific method self-corrects"
  },
  "lessons.10.d": {
    "zh": "可证伪、可重复、可公开质疑，是人类唯一能系统性剔除错误的知识制度。星际文明必须保留这一空间，包括对自身教条的质疑权。",
    "en": "Falsifiable, repeatable, publicly contestable: the only knowledge system that systematically removes error. An interstellar civilization must preserve that space, including the right to question its own dogma."
  },
  "lessons.11.t": {
    "zh": "慎战与不战而胜",
    "en": "Prudence in war; victory without battle"
  },
  "lessons.11.d": {
    "zh": "《孙子兵法》的最高标准是\"不战而屈人之兵\"。在星际尺度上，任何战争的能量成本都远高于合作收益——和平不是道德选择，而是算术结论。",
    "en": "Sun Tzu's highest standard is subduing the enemy without fighting. At interstellar scale the energy cost of any war vastly exceeds the gains of cooperation: peace is not merely moral, it is arithmetic."
  },
  "warnings.0.t": {
    "zh": "自毁技术与大过滤器",
    "en": "Self-destruction technology and the Great Filter"
  },
  "warnings.0.d": {
    "zh": "核武、工程病原体、失控自动化在数小时内即可造成不可逆损失。费米悖论最经济的解释是：多数文明在获得星际能力前先获得了自杀能力。",
    "en": "Nuclear weapons, engineered pathogens and runaway automation can cause irreversible loss within hours. The cheapest explanation of the Fermi paradox is that most civilizations gain the power to end themselves before the power to leave home."
  },
  "warnings.1.t": {
    "zh": "单点依赖",
    "en": "Single-point dependence"
  },
  "warnings.1.d": {
    "zh": "单一行星、单一能源、单一粮种、单一支付网络、单一算力供应链，任何一个\"唯一\"都是灾难的放大器。",
    "en": "One planet, one energy source, one staple crop, one payment network, one compute supply chain: every \"only\" is a disaster amplifier."
  },
  "warnings.2.t": {
    "zh": "增长越过生态阈值",
    "en": "Growth past ecological thresholds"
  },
  "warnings.2.d": {
    "zh": "大氧化事件与二叠纪末灭绝都由生物或地质活动的排放触发。气候、氮循环、生物多样性均存在临界点，越过后不可线性回退。",
    "en": "Both the Great Oxidation Event and the end-Permian extinction were emission-driven. Climate, the nitrogen cycle and biodiversity all have tipping points from which return is not linear."
  },
  "warnings.3.t": {
    "zh": "知识可以被逆转",
    "en": "Knowledge can be lost"
  },
  "warnings.3.d": {
    "zh": "亚历山大图书馆、玛雅文字、罗马混凝土工艺都曾失传。数字时代新增了格式过时、平台消亡与算法遗忘三种新失传方式。",
    "en": "The Library of Alexandria, Maya script and Roman concrete were all lost. The digital era adds three new loss modes: format obsolescence, platform death and algorithmic forgetting."
  },
  "warnings.4.t": {
    "zh": "连接同时传播病原体",
    "en": "Connection also spreads pathogens"
  },
  "warnings.4.d": {
    "zh": "丝绸之路带来技术也带来鼠疫；哥伦布交换带来作物也带来天花。星际检疫与行星保护规程必须先于首次着陆。",
    "en": "The Silk Road carried technology and plague; the Columbian Exchange carried crops and smallpox. Interstellar quarantine and planetary-protection protocols must precede the first landing."
  },
  "warnings.5.t": {
    "zh": "认知封闭与信息污染",
    "en": "Cognitive closure and information pollution"
  },
  "warnings.5.d": {
    "zh": "焚书、审查、算法极化、深度伪造都在破坏同一件事：共享事实基础。没有共享事实，任何规模的协作都会解体。",
    "en": "Book burning, censorship, algorithmic polarization and deepfakes all attack the same thing: a shared factual basis. Without shared facts, cooperation at any scale disintegrates."
  },
  "warnings.6.t": {
    "zh": "制度滞后于技术",
    "en": "Institutions lagging behind technology"
  },
  "warnings.6.d": {
    "zh": "每次技术跃迁后的规则空窗期，都伴随欺诈、泡沫与集中化伤害。缩短空窗期，是最被低估的文明安全工程。",
    "en": "Every rule vacuum after a technological leap brings fraud, bubbles and concentrated harm. Shortening that vacuum is the most underrated civilizational safety project."
  },
  "warnings.7.t": {
    "zh": "掠夺式接触",
    "en": "Predatory contact"
  },
  "warnings.7.d": {
    "zh": "殖民史证明：技术差距+资源饥渴+道德豁免=文明灭绝。星际首次接触若沿用这一模式，人类将成为自己历史上的加害者。",
    "en": "Colonial history shows that a technology gap plus resource hunger plus moral exemption equals civilizational annihilation. Repeating that pattern at first contact would make humanity the aggressor of its own history."
  },
  "warnings.8.t": {
    "zh": "短期主义与公地悲剧",
    "en": "Short-termism and the tragedy of the commons"
  },
  "warnings.8.d": {
    "zh": "渔场、地下水、大气、近地轨道都是无人负责的公地。星际尺度的公地（轨道、频谱、天体资源）必须提前确权。",
    "en": "Fisheries, aquifers, the atmosphere and low Earth orbit are commons nobody owns. Interstellar commons — orbits, spectrum, celestial resources — must have rights assigned in advance."
  },
  "warnings.9.t": {
    "zh": "权力集中与不可逆错误",
    "en": "Concentrated power and irreversible error"
  },
  "warnings.9.d": {
    "zh": "越集中的决策结构，越容易做出无法撤销的决定。星际任务周期长、纠错窗口小，必须以分权与多重否决替代英明领袖假设。",
    "en": "The more concentrated the decision structure, the easier it is to make an undoable decision. Long missions with narrow correction windows require checks and multiple vetoes rather than faith in a wise leader."
  },
  "warnings.10.t": {
    "zh": "复杂系统的级联脆弱",
    "en": "Cascading fragility of complex systems"
  },
  "warnings.10.d": {
    "zh": "青铜时代崩溃、罗马衰亡、现代供应链中断遵循同一机制：效率优化削减了冗余，冲击沿耦合路径级联放大。",
    "en": "The Bronze Age collapse, Rome's decline and modern supply-chain breakdowns share a mechanism: efficiency optimization removes redundancy, and shocks cascade along tight couplings."
  },
  "warnings.11.t": {
    "zh": "黑暗森林假设的双向风险",
    "en": "The two-sided risk of the dark-forest hypothesis"
  },
  "warnings.11.d": {
    "zh": "既不能天真广播，也不能因恐惧永久沉默。理性路径是先建立可验证的善意信号协议与逐步互信机制，而不是二选一的赌博。",
    "en": "Neither naive broadcasting nor fear-driven permanent silence is rational. The reasonable path is a verifiable benign-signal protocol with incremental trust-building, rather than an all-or-nothing gamble."
  },
  "starflight.0.t": {
    "zh": "1. 无限能源 · 零点模块技术",
    "en": "1. Limitless energy · zero-point modules"
  },
  "starflight.0.d": {
    "zh": "现实路径：可控核聚变（托卡马克/仿星器/惯性约束）→ 空间核反应堆 → 反物质储存 → 真空能研究。零点能目前只有卡西米尔效应等间接证据，属于长期研究方向而非工程选项。",
    "en": "Realistic path: controlled fusion (tokamak, stellarator, inertial) → space fission reactors → antimatter storage → vacuum-energy research. Zero-point energy has only indirect evidence such as the Casimir effect: a long-range research direction, not yet an engineering option."
  },
  "starflight.1.t": {
    "zh": "2. 力凝成胶球 · 凭空造物技术",
    "en": "2. Force-condensed gel spheres · matter on demand"
  },
  "starflight.1.d": {
    "zh": "现实路径：可编程物质与超材料 → 声/光/磁悬浮成形 → 分子级增材制造 → 原位资源利用（月壤、火壤、小行星）。\"凭空\"实际是\"就地取材+能量塑形\"。",
    "en": "Realistic path: programmable matter and metamaterials → acoustic/optical/magnetic levitation forming → molecular additive manufacturing → in-situ resource utilization (lunar/Martian regolith, asteroids). \"From nothing\" really means local feedstock plus energy shaping."
  },
  "starflight.2.t": {
    "zh": "3. 人体编程 · 长寿技术",
    "en": "3. Human programming · longevity"
  },
  "starflight.2.d": {
    "zh": "现实路径：基因编辑抗辐射与抗衰 → 端粒/表观遗传干预 → 器官打印与再生 → 代谢降速与低温休眠 → 微重力骨肌保护。目标是让百年航程内的生命体保持功能。",
    "en": "Realistic path: gene editing for radiation and ageing resistance → telomere/epigenetic intervention → organ printing and regeneration → metabolic slowdown and cryo-hibernation → protection of bone and muscle in microgravity. The goal is functional life across a century-long voyage."
  },
  "starflight.3.t": {
    "zh": "4. 星际之门 · 虫洞跳跃技术",
    "en": "4. Star gates · wormhole transit"
  },
  "starflight.3.d": {
    "zh": "理论基础：爱因斯坦-罗森桥、莫里斯-索恩可穿越虫洞。硬约束是需要负能量密度维持喉部稳定，且无任何观测证据。列为最高风险、最高回报项。",
    "en": "Theory: the Einstein–Rosen bridge and Morris–Thorne traversable wormholes. The hard constraint is negative energy density to keep the throat open, with no observational evidence. Highest risk, highest reward."
  },
  "starflight.4.t": {
    "zh": "5. 曲速引擎（尚未公开成熟方案）",
    "en": "5. Warp drive (no mature public design yet)"
  },
  "starflight.4.d": {
    "zh": "理论基础：阿尔库比耶雷度规——压缩前方、膨胀后方空间。难点是所需负能量规模、视界与辐射问题。公开研究处于早期，任何\"已实现\"说法均需独立验证。",
    "en": "Theory: the Alcubierre metric — contract space ahead, expand it behind. Difficulties include the scale of negative energy required, horizons and radiation. Public research is early; any claim of a working drive requires independent verification."
  },
  "starflight.5.t": {
    "zh": "补充 6. 星际通信与导航",
    "en": "Enabler 6. Interstellar communication and navigation"
  },
  "starflight.5.d": {
    "zh": "深空激光通信、量子密钥分发、脉冲星自主导航（XNAV）、延迟容忍网络（DTN）、超高稳定原子钟。没有可靠通信，任何远征都会变成单向失联。",
    "en": "Deep-space laser links, quantum key distribution, pulsar-based autonomous navigation (XNAV), delay-tolerant networking and ultra-stable clocks. Without reliable communication any expedition becomes a one-way disappearance."
  },
  "starflight.6.t": {
    "zh": "补充 7. 闭环生态与自治制造",
    "en": "Enabler 7. Closed-loop ecology and autonomous manufacturing"
  },
  "starflight.6.d": {
    "zh": "水氧再生、太空农业、废物全循环、可自我修复与自我复制的制造链。星际飞船本质上是一颗\"能走路的微型地球\"。",
    "en": "Water and oxygen recycling, space agriculture, total waste circularity, self-repairing and self-replicating manufacturing chains. A starship is essentially a miniature Earth that walks."
  },
  "starflight.7.t": {
    "zh": "补充 8. 文明治理与伦理宪章",
    "en": "Enabler 8. Governance and an ethics charter"
  },
  "starflight.7.d": {
    "zh": "航程决策权分配、代际契约、AI与人类共治、首次接触规程、资源确权与争端解决。技术让你抵达，制度决定你抵达后是否还配称文明。",
    "en": "Allocation of decision rights on board, intergenerational contracts, human–AI co-governance, first-contact protocol, resource rights and dispute resolution. Technology gets you there; institutions decide whether you still deserve the name civilization when you arrive."
  },
  "rules.0.t": {
    "zh": "分类学先行",
    "en": "Taxonomy first"
  },
  "rules.0.d": {
    "zh": "2026年3月的解释性文件先把加密资产分为数字商品、数字收藏品、数字工具、稳定币、数字证券五类，再谈规则。星际启示：先定义\"物、权、责\"的分类，再设计治理，否则每个争端都要从头吵。",
    "en": "The March 2026 interpretation first sorted crypto assets into five categories — digital commodities, collectibles, tools, stablecoins and digital securities — before writing rules. Interstellar takeaway: define the taxonomy of things, rights and duties before designing governance, or every dispute restarts from zero."
  },
  "rules.1.t": {
    "zh": "与风险成比例的分级许可",
    "en": "Permission proportional to risk"
  },
  "rules.1.d": {
    "zh": "初创档四年内500万美元、融资档12个月内2000万/7500万美元两级，披露义务随规模递增。星际启示：小型探索任务用轻规则快速试错，大型殖民项目才承担完整审查。",
    "en": "A startup tier of $5M over four years, a fundraising tier of $20M/$75M per 12 months, with disclosure scaling up. Interstellar takeaway: let small exploration missions iterate under light rules, and reserve full review for large colonization programmes."
  },
  "rules.2.t": {
    "zh": "原则性叙事披露",
    "en": "Principles-based narrative disclosure"
  },
  "rules.2.d": {
    "zh": "要求用普通语言说明项目、资产、网络、承诺与风险，而非填表游戏。星际启示：任务计划书应以可理解的语言公开目标、风险与失败条件，让全人类而非少数专家能审阅。",
    "en": "Issuers must explain the project, asset, network, promises and risks in plain language rather than tick boxes. Interstellar takeaway: mission plans should disclose goals, risks and failure conditions in language all humanity, not only specialists, can review."
  },
  "rules.3.t": {
    "zh": "毕业机制与安全港",
    "en": "A graduation mechanism and safe harbor"
  },
  "rules.3.d": {
    "zh": "当发行人完成或永久终止承诺的关键管理努力并提交表格后，资产可脱离\"投资合约\"。星际启示：为殖民地设计明确的\"自治毕业条件\"，避免母星永久托管与永久依赖。",
    "en": "Once an issuer completes or permanently ceases the promised essential managerial efforts and files, the asset can detach from the investment contract. Interstellar takeaway: define explicit graduation conditions for colonies, avoiding perpetual guardianship and perpetual dependence."
  },
  "rules.4.t": {
    "zh": "统一标准优先于碎片化",
    "en": "One standard beats fifty"
  },
  "rules.4.d": {
    "zh": "通过\"合格购买者\"定义优先于各州注册要求，避免50套并行规则。星际启示：跨殖民地采用统一互操作标准，否则每个天体一套法律将使协作成本趋于无穷。",
    "en": "A \"qualified purchaser\" definition preempts state registration, avoiding fifty parallel regimes. Interstellar takeaway: adopt common interoperability standards across settlements, or a separate legal system per body will drive coordination costs to infinity."
  },
  "rules.5.t": {
    "zh": "公开征求意见与可修订性",
    "en": "Public comment and revisability"
  },
  "rules.5.d": {
    "zh": "提案发布后有60天公众意见期，规则可能因反馈而修改。星际启示：任何星际宪章都必须自带修订程序与意见通道，规则不可\"发射后即冻结\"。",
    "en": "The proposal carries a 60-day comment period and may change in response. Interstellar takeaway: any interstellar charter needs a built-in amendment procedure and comment channel; rules must not freeze at launch."
  },
  "rules.6.t": {
    "zh": "放宽创新但零容忍欺诈",
    "en": "Loosen innovation, never tolerate fraud"
  },
  "rules.6.d": {
    "zh": "即使豁免注册，各州仍保留反欺诈执法权。星际启示：探索自由可以最大化，但对伪造数据、隐瞒风险、危害同伴的行为必须保留最强追责。",
    "en": "Even under exemptions, states keep anti-fraud enforcement. Interstellar takeaway: maximize freedom to explore, but preserve the strongest accountability for falsified data, concealed risk and endangering crewmates."
  },
  "rules.7.t": {
    "zh": "持续报告义务",
    "en": "Ongoing reporting duty"
  },
  "rules.7.d": {
    "zh": "较大规模发行需提交财务报表并持续披露。星际启示：多代际任务必须建立强制性周期报告与可审计档案，让百年后的人能复原今天的决策依据。",
    "en": "Larger offerings must file financial statements and report continuously. Interstellar takeaway: multi-generational missions need mandatory periodic reports and auditable archives, so people a century later can reconstruct today's reasoning."
  },
  "rules.8.t": {
    "zh": "反离岸套利：不把风险推向真空",
    "en": "No offshore arbitrage: never push risk into a vacuum"
  },
  "rules.8.d": {
    "zh": "规则目标之一是减少发行人迁往监管薄弱地区的动机。星际启示：禁止把高风险实验（生物、AI、武器）转移到法律真空的轨道或天体上进行。",
    "en": "One aim is to reduce incentives to move offshore into weak jurisdictions. Interstellar takeaway: prohibit relocating high-risk experiments — biological, AI, weapons — into legal vacuums in orbit or on other bodies."
  },
  "rules.9.t": {
    "zh": "事前规则优于事后执法",
    "en": "Rules in advance beat enforcement after the fact"
  },
  "rules.9.d": {
    "zh": "从\"个案执法\"转向\"公开成文规则\"，让参与者可预期。星际启示：首次接触、资源开采、行星保护都应在事件发生前完成立法，而不是在冲突中即兴裁决。",
    "en": "A shift from case-by-case enforcement to published rules gives participants predictability. Interstellar takeaway: first contact, resource extraction and planetary protection should be legislated before events occur, not improvised amid conflict."
  },
  "rules.10.t": {
    "zh": "保护条款不可交易",
    "en": "Protection clauses are not tradable"
  },
  "rules.10.d": {
    "zh": "所有豁免都以投资者保护为不可让渡底线。星际启示：船员、移民、原生生态与AI体的基本权利，不得因任务效率或商业压力被交易掉。",
    "en": "Every exemption keeps investor protection as a non-negotiable floor. Interstellar takeaway: the basic rights of crew, settlers, native ecosystems and AI entities must not be traded away for mission efficiency or commercial pressure."
  },
  "rules.11.t": {
    "zh": "权力分立与司法审查",
    "en": "Separation of powers and judicial review"
  },
  "rules.11.d": {
    "zh": "行政机关制规、立法机关另行立法、法院独立审查，三方相互约束。星际启示：星际治理需要执行、规则、裁判三权分离，避免船长即法律。",
    "en": "An agency proposes rules, the legislature legislates separately and courts review independently. Interstellar takeaway: interstellar governance needs separated execution, rule-making and adjudication, so the captain is never the law."
  },
  "rules_note": {
    "zh": "提示：该提案处于\"拟议规则\"阶段，尚未生效，不构成法律或投资建议；此处仅提炼其制度设计思路中的正能量部分用于星际治理类比。",
    "en": "Note: the proposal is at the proposed-rule stage and is not in force. Nothing here is legal or investment advice; only the constructive institutional-design ideas are abstracted for an interstellar analogy."
  },
  "questions.0.q": {
    "zh": "如何在不牺牲创新的前提下缩短\"制度滞后期\"？",
    "en": "How can the institutional lag be shortened without sacrificing innovation?"
  },
  "questions.0.b": {
    "zh": "技术以指数速度扩散，立法以线性速度推进，中间的空窗期产生欺诈与不可逆伤害。",
    "en": "Technology diffuses exponentially while legislation advances linearly; the gap breeds fraud and irreversible harm."
  },
  "questions.0.p": {
    "zh": "沙盒+分级豁免+日落条款+强制信息披露，把\"先禁止\"改为\"可控试错\"，并预设自动复审时点。",
    "en": "Sandboxes, tiered exemptions, sunset clauses and mandatory disclosure — replacing prohibition with controlled trial and pre-scheduled review."
  },
  "questions.0.c": {
    "zh": "标准组织、监管机构、开源社区与保险机制共同承担风险定价。",
    "en": "Standards bodies, regulators, open-source communities and insurance mechanisms jointly pricing the risk."
  },
  "questions.1.q": {
    "zh": "百年航程中如何维持社会与心理稳定？",
    "en": "How can social and psychological stability last a century-long voyage?"
  },
  "questions.1.b": {
    "zh": "封闭小群体在长期隔离下会出现权力集中、派系化与代际断裂。",
    "en": "Small closed groups under long isolation trend toward concentrated power, factionalism and generational rupture."
  },
  "questions.1.p": {
    "zh": "轮换治理+多重否决+透明记录+文化与仪式设计+定期与母星低带宽对话。",
    "en": "Rotating governance, multiple vetoes, transparent records, deliberate culture and ritual design, plus periodic low-bandwidth contact with home."
  },
  "questions.1.c": {
    "zh": "社会科学家、伦理学家与工程团队从设计阶段共同参与，而非任务后期补救。",
    "en": "Social scientists and ethicists embedded from the design phase, not brought in as late remediation."
  },
  "questions.2.q": {
    "zh": "负能量密度能否被工程化，从而使曲速与虫洞可行？",
    "en": "Can negative energy density be engineered to make warp and wormholes feasible?"
  },
  "questions.2.b": {
    "zh": "已知量子效应（如卡西米尔效应）产生的负能量规模比需求小几十个数量级。",
    "en": "Known quantum effects such as Casimir produce negative energy dozens of orders of magnitude below requirements."
  },
  "questions.2.p": {
    "zh": "先做精密测量与理论边界研究（量子能量不等式），明确\"不可能\"与\"未证明\"的界线，再谈工程。",
    "en": "Start with precision measurement and theoretical bounds (quantum energy inequalities) to separate the impossible from the merely unproven, then discuss engineering."
  },
  "questions.2.c": {
    "zh": "基础物理与计量学长期资助，允许长期无产出，禁止夸大宣传。",
    "en": "Long-horizon funding for fundamental physics and metrology, tolerant of no output for long periods and intolerant of hype."
  },
  "questions.3.q": {
    "zh": "如何在高延迟环境下达成价值与身份共识？",
    "en": "How can value and identity consensus work under extreme latency?"
  },
  "questions.3.b": {
    "zh": "光速限制使跨行星账本无法实时同步，传统共识算法失效。",
    "en": "Light-speed limits prevent real-time synchronization, breaking conventional consensus algorithms."
  },
  "questions.3.p": {
    "zh": "分区自治+最终一致性+离线可验证凭证+跨区结算窗口，参考延迟容忍网络与门限签名。",
    "en": "Partitioned autonomy, eventual consistency, offline-verifiable credentials and scheduled settlement windows, drawing on delay-tolerant networking and threshold signatures."
  },
  "questions.3.c": {
    "zh": "密码学界、航天机构与治理组织共同制定星际结算标准（eaco层的核心任务）。",
    "en": "Cryptographers, space agencies and governance bodies co-authoring an interstellar settlement standard — the core task of the eaco layer."
  },
  "questions.4.q": {
    "zh": "首次接触应遵循什么规程？",
    "en": "What protocol should govern first contact?"
  },
  "questions.4.b": {
    "zh": "目前没有任何有约束力的国际规则规定谁可以代表地球回应信号。",
    "en": "No binding international rule says who may answer a signal on behalf of Earth."
  },
  "questions.4.p": {
    "zh": "三阶段制：只接收不回复→全球公开审议→授权代表按既定文本回应；同时立法禁止单方面广播。",
    "en": "A three-stage regime: receive only, then global public deliberation, then a mandated representative replying from an agreed text — with unilateral broadcasting legally barred."
  },
  "questions.4.c": {
    "zh": "联合国层级的条约+科学界公开验证流程+多语言全民知情。",
    "en": "A UN-level treaty, an open scientific verification process and multilingual public awareness."
  },
  "questions.5.q": {
    "zh": "如何避免把地球的生态错误复制到其他天体？",
    "en": "How do we avoid copying Earth's ecological mistakes to other worlds?"
  },
  "questions.5.b": {
    "zh": "人类每到一片新大陆都伴随物种灭绝，行星保护规则目前缺乏执行力。",
    "en": "Human arrival on new continents brought extinctions, and planetary-protection rules currently lack enforcement."
  },
  "questions.5.p": {
    "zh": "强制灭菌与检疫标准、原生生态优先原则、可撤销的最小干预设计、生态影响保证金。",
    "en": "Mandatory sterilization and quarantine standards, native-ecosystem priority, reversible minimum-intervention design and ecological performance bonds."
  },
  "questions.5.c": {
    "zh": "太空机构、生物学界与保险/金融机制联动，让破坏具有真实成本。",
    "en": "Space agencies, biologists and insurance or financial mechanisms linked so that damage carries a real price."
  },
  "questions.6.q": {
    "zh": "AI 与人类如何共同治理长周期任务？",
    "en": "How should AI and humans co-govern long-duration missions?"
  },
  "questions.6.b": {
    "zh": "通信延迟迫使高度自治，但完全自治的系统难以被追责与纠正。",
    "en": "Latency forces high autonomy, yet fully autonomous systems are hard to hold accountable or correct."
  },
  "questions.6.p": {
    "zh": "分层授权+不可逆操作双人/双系统确认+完整决策日志+可回滚设计+定期对齐审计。",
    "en": "Layered authority, two-person or two-system confirmation for irreversible actions, complete decision logs, rollback-capable design and periodic alignment audits."
  },
  "questions.6.c": {
    "zh": "AI安全研究、航天工程与法律共同定义\"机器可做的最后一步\"边界。",
    "en": "AI-safety research, aerospace engineering and law jointly defining the boundary of the last step a machine may take."
  },
  "questions.7.q": {
    "zh": "如何为文明建立可存活万年的备份？",
    "en": "How do we build a civilizational backup that survives ten thousand years?"
  },
  "questions.7.b": {
    "zh": "数字介质寿命短、格式易过时、平台会消亡，纸质与石刻容量有限。",
    "en": "Digital media are short-lived, formats obsolete and platforms die, while paper and stone have limited capacity."
  },
  "questions.7.p": {
    "zh": "多介质多地点冗余（石英玻璃、金属蚀刻、DNA存储）+自解释编码+分布式副本+定期迁移仪式。",
    "en": "Multi-medium, multi-site redundancy (quartz glass, etched metal, DNA storage), self-describing encodings, distributed copies and a scheduled migration ritual."
  },
  "questions.7.c": {
    "zh": "图书馆、档案馆、航天机构与开源社区共同维护，纳入长期公共预算。",
    "en": "Libraries, archives, space agencies and open-source communities maintaining it under long-term public budget."
  },
  "books.0.n": {
    "zh": "孙子兵法",
    "en": "The Art of War"
  },
  "books.0.a": {
    "zh": "孙武 · 春秋（约前512年）",
    "en": "Sun Tzu · Spring and Autumn (c. 512 BCE)"
  },
  "books.0.c": {
    "zh": "慎战、全胜、知彼知己、以最小代价达成目标；\"不战而屈人之兵\"为最高标准。",
    "en": "Prudence in war, total victory, know the enemy and yourself, minimum cost to the objective; subduing the enemy without fighting is the highest standard."
  },
  "books.0.s": {
    "zh": "星际战争的能量成本远超任何收益，因此\"不战而胜\"从道德理想变成硬性算术结论。",
    "en": "At interstellar scale the energy cost of war exceeds any possible gain, turning victory without battle from a moral ideal into hard arithmetic."
  },
  "books.1.n": {
    "zh": "三十六计",
    "en": "The Thirty-Six Stratagems"
  },
  "books.1.a": {
    "zh": "佚名 · 明末清初",
    "en": "Anonymous · late Ming–early Qing"
  },
  "books.1.c": {
    "zh": "六套三十六计，专攻矛盾、示形与弱点，是战术层面的操作手册。",
    "en": "Six sets of thirty-six stratagems targeting contradictions, deception and weak points — a tactical field manual."
  },
  "books.1.s": {
    "zh": "资源受限的小型探索队最需要非对称思维：用信息与时机替代吨位与推力。",
    "en": "Resource-limited scout crews need asymmetric thinking most: substitute information and timing for tonnage and thrust."
  },
  "books.2.n": {
    "zh": "六韬",
    "en": "Six Secret Teachings"
  },
  "books.2.a": {
    "zh": "托名姜子牙 · 战国成书",
    "en": "Attributed to Jiang Ziya · Warring States"
  },
  "books.2.c": {
    "zh": "文伐、武伐并重，强调民心、后勤、组织与将领选拔。",
    "en": "Civil and military instruments in balance, stressing popular support, logistics, organization and selection of commanders."
  },
  "books.2.s": {
    "zh": "远征成败取决于补给链与人事制度，而非单次战术胜利。",
    "en": "Expeditions are decided by supply chains and personnel systems, not by any single tactical win."
  },
  "books.3.n": {
    "zh": "黄石公三略",
    "en": "Three Strategies of Huang Shigong"
  },
  "books.3.a": {
    "zh": "托名黄石公 · 秦汉",
    "en": "Attributed to Huang Shigong · Qin–Han"
  },
  "books.3.c": {
    "zh": "上略论道、中略论权、下略论术，把治国与治军统一为一套层级逻辑。",
    "en": "Upper strategy on principle, middle on authority, lower on technique — unifying statecraft and command in one hierarchy."
  },
  "books.3.s": {
    "zh": "星际组织需要\"道-权-术\"三层清晰分工：宪章、授权与操作规程不可混为一谈。",
    "en": "An interstellar organization needs the same three tiers kept distinct: charter, delegated authority and operating procedure."
  },
  "books.4.n": {
    "zh": "吴子",
    "en": "Wuzi"
  },
  "books.4.a": {
    "zh": "吴起 · 战国",
    "en": "Wu Qi · Warring States"
  },
  "books.4.c": {
    "zh": "强调选练精兵、赏罚分明、因敌制胜，重视军队日常管理。",
    "en": "Selecting and drilling elite troops, clear rewards and punishments, adapting to the enemy; emphasis on daily military management."
  },
  "books.4.s": {
    "zh": "长期任务中，日常纪律与训练水平比危机时的英雄主义更能决定生死。",
    "en": "On long missions, everyday discipline and training determine survival more than heroism in a crisis."
  },
  "books.5.n": {
    "zh": "司马法",
    "en": "Methods of the Sima"
  },
  "books.5.a": {
    "zh": "战国编成 · 传司马穰苴",
    "en": "Warring States · attributed to Sima Rangju"
  },
  "books.5.c": {
    "zh": "\"以战止战\"，主张战争必须受礼义与限度约束，最早的战争伦理文本之一。",
    "en": "\"Use war to stop war\": warfare bounded by ritual propriety and limits — one of the earliest texts on the ethics of war."
  },
  "books.5.s": {
    "zh": "星际武力若无伦理边界，将直接演化为文明级灭绝行为，必须先立限度。",
    "en": "Interstellar force without ethical limits escalates directly into civilization-scale annihilation; limits must come first."
  },
  "books.6.n": {
    "zh": "尉缭子",
    "en": "Weiliaozi"
  },
  "books.6.a": {
    "zh": "尉缭 · 战国",
    "en": "Wei Liao · Warring States"
  },
  "books.6.c": {
    "zh": "重法制、重经济基础与动员体系，认为军力源于国力与制度。",
    "en": "Emphasis on law, economic base and mobilization: military power flows from national capacity and institutions."
  },
  "books.6.s": {
    "zh": "星际能力等于工业基础×制度效率，任何\"技术奇迹叙事\"都不能绕过这条乘法。",
    "en": "Interstellar capability equals industrial base times institutional efficiency; no miracle-technology narrative escapes that product."
  },
  "books.7.n": {
    "zh": "李卫公问对",
    "en": "Questions and Replies of Duke Li"
  },
  "books.7.a": {
    "zh": "李靖（唐）",
    "en": "Li Jing · Tang dynasty"
  },
  "books.7.c": {
    "zh": "以问答形式辨析奇正、虚实与阵法，是实战经验的理论化。",
    "en": "A dialogue analysing the orthodox and unorthodox, void and substance, and formations — combat experience turned into theory."
  },
  "books.7.s": {
    "zh": "经验必须被写成可教学的问答与检查表，才能跨代传承而不失真。",
    "en": "Experience must become teachable dialogue and checklists to survive across generations without distortion."
  },
  "books.8.n": {
    "zh": "孙膑兵法",
    "en": "Sun Bin's Art of War"
  },
  "books.8.a": {
    "zh": "孙膑 · 战国（银雀山汉简）",
    "en": "Sun Bin · Warring States (Yinqueshan bamboo texts)"
  },
  "books.8.c": {
    "zh": "强调\"必攻不守\"与地形、阵型的量化运用，善用有限兵力制造局部优势。",
    "en": "Stressing decisive attack and the quantified use of terrain and formation to create local superiority with limited force."
  },
  "books.8.s": {
    "zh": "小规模星际编队应放弃全面对抗，专注在关键节点形成压倒性局部优势。",
    "en": "Small interstellar formations should abandon total confrontation and concentrate overwhelming local advantage at key nodes."
  },
  "books.9.n": {
    "zh": "武经总要",
    "en": "Complete Essentials for the Military Classics"
  },
  "books.9.a": {
    "zh": "曾公亮等 · 北宋1044年",
    "en": "Zeng Gongliang et al. · Song, 1044"
  },
  "books.9.c": {
    "zh": "中国第一部官修军事技术百科，收录火药配方、器械、城防与地图。",
    "en": "China's first official military-technology encyclopedia, recording gunpowder formulas, machinery, fortification and maps."
  },
  "books.9.s": {
    "zh": "文明必须维护\"可复现的技术总目\"，否则罗马混凝土式的技术失传会重演。",
    "en": "A civilization must maintain a reproducible technical catalogue, or losses like Roman concrete will recur."
  },
  "books.10.n": {
    "zh": "纪效新书",
    "en": "New Treatise on Military Efficiency"
  },
  "books.10.a": {
    "zh": "戚继光 · 明1560年",
    "en": "Qi Jiguang · Ming, 1560"
  },
  "books.10.c": {
    "zh": "从实战反推训练标准，强调编制、协同小队与可量化考核。",
    "en": "Deriving training standards from real combat: organization, coordinated squads and measurable assessment."
  },
  "books.10.s": {
    "zh": "任务演练必须以真实失效模式为蓝本，指标可量化，而非以理想工况验收。",
    "en": "Mission rehearsal must be built on real failure modes with measurable criteria, not idealized conditions."
  },
  "books.11.n": {
    "zh": "练兵实纪",
    "en": "Records of Military Training"
  },
  "books.11.a": {
    "zh": "戚继光 · 明1571年",
    "en": "Qi Jiguang · Ming, 1571"
  },
  "books.11.c": {
    "zh": "把练兵拆解为日常制度：纪律、后勤、器械保养与士气管理。",
    "en": "Breaking training into daily institutions: discipline, logistics, equipment maintenance and morale."
  },
  "books.11.s": {
    "zh": "飞船是一套维护制度，而不是一件产品；维护文化决定任务寿命。",
    "en": "A starship is a maintenance regime rather than a product; maintenance culture determines mission life."
  },
  "books.12.n": {
    "zh": "百战奇略",
    "en": "Extraordinary Strategies of a Hundred Battles"
  },
  "books.12.a": {
    "zh": "托名刘基 · 明",
    "en": "Attributed to Liu Ji · Ming"
  },
  "books.12.c": {
    "zh": "以百个战例归纳情境-对策映射，是最早的\"案例库式\"战略教材。",
    "en": "A hundred cases mapping situation to response — the earliest case-library approach to strategy education."
  },
  "books.12.s": {
    "zh": "星际决策应建立案例库与预案库，把临场发明降到最低。",
    "en": "Interstellar decision-making needs case and contingency libraries so improvisation is minimized."
  },
  "books.13.n": {
    "zh": "鬼谷子",
    "en": "Guiguzi"
  },
  "books.13.a": {
    "zh": "鬼谷子 · 战国",
    "en": "Guiguzi · Warring States"
  },
  "books.13.c": {
    "zh": "论捭阖、揣摩、游说与谈判，是东方最早的系统性沟通与博弈术。",
    "en": "On opening and closing, reading intent, persuasion and negotiation: the earliest systematic Eastern theory of communication and bargaining."
  },
  "books.13.s": {
    "zh": "首次接触的核心能力不是武力而是沟通设计：如何在不暴露弱点的前提下建立互信。",
    "en": "The core skill at first contact is not force but communication design: building trust without exposing weakness."
  },
  "books.14.n": {
    "zh": "曾胡治兵语录",
    "en": "Sayings on Command by Zeng and Hu"
  },
  "books.14.a": {
    "zh": "蔡锷辑 · 1911年",
    "en": "Compiled by Cai E · 1911"
  },
  "books.14.c": {
    "zh": "汇集曾国藩、胡林翼治军心法，强调\"结硬寨、打呆仗\"与人格修养。",
    "en": "Zeng Guofan and Hu Linyi on command: build solid camps, fight patient battles, cultivate character."
  },
  "books.14.s": {
    "zh": "星际工程崇尚\"稳妥冗余\"而非炫技冒进：慢一点的方案往往是唯一能抵达的方案。",
    "en": "Interstellar engineering favours redundancy over flair: the slower design is often the only one that arrives."
  },
  "books.15.n": {
    "zh": "战争论",
    "en": "On War"
  },
  "books.15.a": {
    "zh": "克劳塞维茨 · 1832年",
    "en": "Carl von Clausewitz · 1832"
  },
  "books.15.c": {
    "zh": "战争是政治的延续，摩擦、迷雾与重心概念构成现代战略学基础。",
    "en": "War as a continuation of politics; friction, fog and centre of gravity as the foundations of modern strategy."
  },
  "books.15.s": {
    "zh": "任何星际行动都是文明政治目标的延伸，脱离目标的技术冒险必然失控。",
    "en": "Every interstellar action extends a civilization's political aims; technical adventures detached from aims run out of control."
  },
  "books.16.n": {
    "zh": "战争艺术概论",
    "en": "Summary of the Art of War"
  },
  "books.16.a": {
    "zh": "约米尼 · 1838年",
    "en": "Antoine-Henri Jomini · 1838"
  },
  "books.16.c": {
    "zh": "强调内线、交通线与决定点的几何分析，把战略部分数学化。",
    "en": "Interior lines, lines of communication and decisive points: partially mathematizing strategy."
  },
  "books.16.s": {
    "zh": "深空任务的\"交通线\"就是补给与通信窗口，几何与时序决定可行性。",
    "en": "In deep space the lines of communication are resupply and comms windows; geometry and timing decide feasibility."
  },
  "books.17.n": {
    "zh": "战略论：间接路线",
    "en": "Strategy: The Indirect Approach"
  },
  "books.17.a": {
    "zh": "李德·哈特 · 1954年",
    "en": "B. H. Liddell Hart · 1954"
  },
  "books.17.c": {
    "zh": "大战略应以最小消耗瓦解对手意志，正面消耗是最差选项。",
    "en": "Grand strategy should dislocate the opponent's will at minimum cost; frontal attrition is the worst option."
  },
  "books.17.s": {
    "zh": "面对宇宙尺度的物理限制，绕过而非硬碰，是工程与战略的共同智慧。",
    "en": "Against cosmic physical limits, going around rather than through is the shared wisdom of engineering and strategy."
  },
  "books.18.n": {
    "zh": "五轮书",
    "en": "The Book of Five Rings"
  },
  "books.18.a": {
    "zh": "宫本武藏 · 1645年",
    "en": "Miyamoto Musashi · 1645"
  },
  "books.18.c": {
    "zh": "地水火风空五卷，讲节奏、距离与心态，个人技艺升华为普遍方法论。",
    "en": "Earth, water, fire, wind and void: rhythm, distance and mindset — personal craft raised to general method."
  },
  "books.18.s": {
    "zh": "个体在极端环境下的专注、节奏与冷静，是舱内决策质量的最后一道防线。",
    "en": "Focus, rhythm and calm under extreme conditions are the last line of defence for decision quality on board."
  },
  "books.19.n": {
    "zh": "政事论（利论）",
    "en": "Arthashastra"
  },
  "books.19.a": {
    "zh": "考底利耶 · 约前300年 · 印度",
    "en": "Kautilya · c. 300 BCE · India"
  },
  "books.19.c": {
    "zh": "国家治理、情报、经济与外交的综合手册，把战略置于治国框架内。",
    "en": "A综合 manual of statecraft, intelligence, economy and diplomacy, situating strategy inside governance."
  },
  "books.19.s": {
    "zh": "星际存在需要情报、经济与外交三位一体，而不是只有推进器。",
    "en": "Interstellar presence needs intelligence, economy and diplomacy together, not merely propulsion."
  },
  "books.20.n": {
    "zh": "罗马军制论",
    "en": "De Re Militari"
  },
  "books.20.a": {
    "zh": "韦格蒂乌斯 · 约390年",
    "en": "Vegetius · c. 390 CE"
  },
  "books.20.c": {
    "zh": "\"欲和平，先备战\"；系统论述训练、工程与纪律对军队质量的决定作用。",
    "en": "\"Let him who desires peace prepare for war\": training, engineering and discipline determine quality."
  },
  "books.20.s": {
    "zh": "和平需要可信的防御能力支撑，行星防御与太空态势感知即现代版\"备战\"。",
    "en": "Peace needs credible defence; planetary defence and space situational awareness are its modern form."
  },
  "books.21.n": {
    "zh": "海权对历史的影响",
    "en": "The Influence of Sea Power upon History"
  },
  "books.21.a": {
    "zh": "马汉 · 1890年",
    "en": "Alfred T. Mahan · 1890"
  },
  "books.21.c": {
    "zh": "控制海上交通线与关键节点决定国家兴衰，基地网络比舰队规模更根本。",
    "en": "Control of sea lines and key nodes decides national fortunes; the base network matters more than fleet size."
  },
  "books.21.s": {
    "zh": "轨道与拉格朗日点就是新的海峡与港口，先占者定义未来物流规则。",
    "en": "Orbits and Lagrange points are the new straits and harbours; whoever occupies them first defines future logistics."
  },
  "books.22.n": {
    "zh": "制空权",
    "en": "The Command of the Air"
  },
  "books.22.a": {
    "zh": "杜黑 · 1921年",
    "en": "Giulio Douhet · 1921"
  },
  "books.22.c": {
    "zh": "新维度的控制权可以绕过既有防线，重塑整个冲突结构。",
    "en": "Command of a new dimension bypasses existing defences and restructures conflict itself."
  },
  "books.22.s": {
    "zh": "每当人类进入新维度（空、天、轨道、信息），旧规则立即过时，规则必须同步升级。",
    "en": "Each time humanity enters a new dimension — air, space, orbit, information — old rules expire and must be upgraded in step."
  },
  "books.23.n": {
    "zh": "注意！装甲车",
    "en": "Achtung – Panzer!"
  },
  "books.23.a": {
    "zh": "古德里安 · 1937年",
    "en": "Heinz Guderian · 1937"
  },
  "books.23.c": {
    "zh": "机动、通信与集中使用新装备产生质变，而非把新技术塞进旧编制。",
    "en": "Mobility, communications and concentrated use of new equipment create a qualitative change — not new tech inside old structures."
  },
  "books.23.s": {
    "zh": "把AI与自动化塞进旧流程只会低效；组织必须围绕新能力重构。",
    "en": "Bolting AI and automation onto old processes wastes them; organizations must be rebuilt around new capability."
  },
  "books.24.n": {
    "zh": "君主论",
    "en": "The Prince"
  },
  "books.24.a": {
    "zh": "马基雅维利 · 1532年",
    "en": "Niccolò Machiavelli · 1532"
  },
  "books.24.c": {
    "zh": "直面权力运行的真实逻辑，讨论德性、命运与必要之恶的边界。",
    "en": "Confronting how power actually works: virtue, fortune and the boundary of necessary evil."
  },
  "books.24.s": {
    "zh": "星际治理必须假设权力会被滥用，并以制度而非善意来约束它。",
    "en": "Interstellar governance must assume power will be abused and constrain it by institutions, not goodwill."
  },
  "books.25.n": {
    "zh": "冲突战略",
    "en": "The Strategy of Conflict"
  },
  "books.25.a": {
    "zh": "托马斯·谢林 · 1960年",
    "en": "Thomas Schelling · 1960"
  },
  "books.25.c": {
    "zh": "博弈论化的威慑、承诺、可信威胁与沟通，解释了核时代为何未爆发全面战争。",
    "en": "Game-theoretic deterrence, commitment, credible threats and communication — why the nuclear age avoided total war."
  },
  "books.25.s": {
    "zh": "与未知文明打交道最关键的是可信承诺机制与降级沟通渠道的设计。",
    "en": "Dealing with an unknown civilization hinges on credible commitment mechanisms and de-escalation channels."
  },
  "books.26.n": {
    "zh": "论持久战",
    "en": "On Protracted War"
  },
  "books.26.a": {
    "zh": "毛泽东 · 1938年",
    "en": "Mao Zedong · 1938"
  },
  "books.26.c": {
    "zh": "弱势方通过时间、空间与阶段转换积累优势，把劣势结构性反转。",
    "en": "The weaker side accumulates advantage through time, space and phase transitions, structurally reversing inferiority."
  },
  "books.26.s": {
    "zh": "星际项目本质是持久战：接受长期弱势，靠阶段目标与耐力取胜。",
    "en": "Interstellar projects are protracted by nature: accept long-term weakness and win through staged objectives and endurance."
  },
  "books.27.n": {
    "zh": "游击战",
    "en": "Guerrilla Warfare"
  },
  "books.27.a": {
    "zh": "切·格瓦拉 · 1961年",
    "en": "Che Guevara · 1961"
  },
  "books.27.c": {
    "zh": "小规模、高机动、依托环境与民众支持的非对称作战原理。",
    "en": "Small-scale, highly mobile asymmetric operations relying on environment and popular support."
  },
  "books.27.s": {
    "zh": "前哨基地必须\"因地生存\"：最大化原位资源利用，最小化对母星补给的依赖。",
